  else if(G.coachStep === "play" && !G.selected.length) G.coachStep = "pick";
  renderHand(); renderControls(); renderPreview();
  /* renderHand rebuilds the row, so the pop goes on after the rebuild. */
  if(i < 0){
    const el = document.querySelector('#hand .card[data-id="' + id + '"]');
    if(el) el.classList.add("picked");
  }
  /* coachSet lives in render(), which this path deliberately skips — without
     this the coach never leaves step one and the Play prompt never appears. */
  coachSet(G.coachStep);
  /* A tutorial step that reads the line back has to follow the line. Drawn
     once when the step opened, it described the two words that were down at
     that moment and then sat there unchanged while the player laid a third or
     reordered them — under a caption telling them to do exactly that. */
  if(tutActive() && TUT[tutStep] && TUT[tutStep].live) renderTut();
}

/* ---------- the opening tutorial ----------
   Eight beats on the real board with the real deck. Two of them wait for the
   player to tap a card, because a tutorial you can finish without touching the
   game has taught nothing, and a tap costs nothing: tap again and the word
   comes back up.

   It used to want a PLAY as well, and that was a mistake with a long tail. A
   committed line and one of the round's plays is a lot to ask of somebody who
   has been playing for ninety seconds, and the step carried no Next, so the
   only way past it was Skip. The lesson's only exit was to quit it. PLAY and
   DISCARD are both off while the overlay is up now, and the lesson spends
   nothing at all.

   The copy is written for somebody who has never seen this before. Short
   sentences, one idea a step, and the game's own words introduced rather than
   assumed - a first-timer does not know what an overtone is, and telling them
   a word "rings of HEAT" teaches the vocabulary and not the game. */
const TUT = [
  { label: "Overtone",
    text: function(){
      const c = (G && G.hand && G.hand[0]) || null;
      const tags = c ? c.t.slice(0, 3).map(function(t){
        return "<b>" + TAGS[t][0] + "</b>"; }).join(", ") : "";
      return (c ? "Every word here comes with tags. <b>" + c.w + "</b> is tagged "
                  + tags + ". "
                : "Every word here comes with tags, printed on the card. ")
           + "Tags are the only thing the game looks at. It never reads the word "
           + "itself.<br><br>"
           + "The game calls them <b>overtones</b>, after the quieter notes that "
           + "ring under a plucked guitar string. There are nineteen."
           + '<span class="do">Six rounds. Each one wants more points than the '
           + 'last.</span>'; } },

  { sel: ".blind", pos: "right", label: "What the round wants",
    text: function(){
      return "This round is <b>" + G.demand.n + "</b>, and it wants "
           + G.demand.tags.map(function(t){ return "<b>" + TAGS[t][0] + "</b>"; }).join(" or ")
           + ". Play a word carrying either tag and it earns <b>+" + DEMAND_CHIPS
           + " points</b> and <b>+" + DEMAND_MULT + " multiplier</b> on top of "
           + "whatever else it does."
           + '<span class="do">You need ' + G.target.toLocaleString()
           + ' points to clear the round.</span>'; } },

  { sel: "#hand", pos: "top", label: "Lay a word",
    text: function(){
      return "Your words go down in a row, left to right. The row is your "
           + "<b>line</b>. The order you tap them is the order they are read, and "
           + "it changes what they score."
           + '<span class="do">Tap a word.</span>'; },
    done: function(){ return G.selected.length >= 1; } },

  /* The whole game, in one step. Everything before it is furniture and
     everything after it is detail. */
  { sel: "#hand", pos: "top", label: "The word beside it",
    text: function(){
      return "Now tap another. The game scores the <b>pair</b>, not the two words "
           + "on their own.<br><br>"
           + "Share a tag and they are <b>ALIKE</b>. Have opposite tags, like hot "
           + "and cold, and they are <b>OPPOSITE</b>, which pays a great deal "
           + "more. Share nothing and they are <b>NOTHING</b>: the line stops "
           + "there, and every word after it scores zero."
           + '<span class="do">Tap a second word. The board will label the rest of '
           + 'your hand with what each one would do next to it.</span>'; },
    done: function(){ return G.selected.length >= 2; } },

  /* Reads the board rather than guessing at it, so it can never tell a player
     their words are doing something they are not. `live` redraws it whenever
     the selection moves, because this is the step that asks them to move it. */
  { sel: "#stageHint", pos: "bottom", label: "What yours are doing", live: true,
    text: function(){
      const cards = G.selected.map(function(id){
        return G.hand.find(function(c){ return c.id === id; });
      }).filter(Boolean);
      const jr = joinsOf(cards);
      const said = jr.joins.map(function(j, i){
        const a = cards[i].w, b = cards[i + 1].w;
        if(j.kind === "paradox")
          return "<b>" + a + "</b> and <b>" + b + "</b> are alike and opposite at "
               + "the same time. That is the rare one, and the best paid.";
        if(j.kind === "tension")
          return "<b>" + a + "</b> and <b>" + b + "</b> have opposite tags.";
        return "<b>" + a + "</b> and <b>" + b + "</b> share a tag.";
      }).join(" ");
      const quiet = jr.scored < cards.length
        ? " After that the line goes quiet, and the rest of it scores nothing."
        : "";
      return (said || "These two share nothing, so the line stops before it starts.")
           + quiet
           + "<br><br>Watch <b>POINTS</b> and <b>MULTIPLIER</b> at the top. They "
           + "add your line up as you tap. What they cannot tell you is whether "
           + "some other five words would have paid more. That part is yours."
           + '<span class="do">Tap the words in a different order and watch the '
           + 'numbers move.</span>'; } },

  { sel: "#stageHint", pos: "bottom", label: "The hands",
    text: function(){
      return "Some patterns have names, the way a flush has a name in poker. Two "
           + "opposite words make <b>THE CLASH</b>. Two that are alike and "
           + "opposite at the same time make <b>THE TWIST</b>. A line that reads "
           + "the same backwards makes <b>THE MIRROR</b>.<br><br>"
           + "These are your <b>hands</b>. They raise the multiplier, and you are "
           + "paid for every one your line makes."
           + '<span class="do">Longer lines make more hands. They also have more '
           + 'places to break.</span>'; } },

  /* No longer asks for a PLAY, so it can say what both buttons do instead of
     spending its whole span on one of them. */
  { sel: "#playBtn", pos: "top", label: "The two buttons",
    text: function(){
      const WORDS = ["no", "one", "two", "three", "four", "five"];
      const shape = roundShape(G.round) || { plays: G.plays, discards: G.discards };
      return "<b>PLAY</b> scores your line and deals you fresh words. You get "
           + (WORDS[shape.plays] || shape.plays) + " plays a round.<br><br>"
           + "<b>DISCARD</b> swaps words out without scoring them, "
           + (WORDS[shape.discards] || shape.discards) + " times a round. A line is "
           + (WORDS[LINE_MIN] || LINE_MIN) + " to " + (WORDS[maxPlay()] || maxPlay())
           + " words long."
           + '<span class="do">Both buttons are off until this lesson ends, so '
           + 'nothing here can cost you a play.</span>'; } },

  { sel: ".lensbar", pos: "bottom", label: "Why you come back",
    text: function(){
      const WORDS = ["no", "one", "two", "three", "four", "five"];
      return "A tag you just scored goes <b>dull</b> for "
           + (WORDS[FATIGUE_SPAN] || FATIGUE_SPAN) + " plays and pays nothing "
           + "while it rests. So the best line this turn will not be the best "
           + "line next turn.<br><br>"
           + "Clear a round and the <b>Bookseller</b> offers to sell you back a "
           + "line you played. Buy it and it pays again every time you make that "
           + "hand."
           + '<span class="do">'
           + (G.roundScore >= G.target
                ? "You have cleared " + G.demand.n + ". The Bookseller is next."
                : "That is all of it. Go and clear " + G.demand.n + ".")
           + "</span>"; } }
];

/* The tutorial tells the player to lay two words and then names what happened
   between them. Dealt at random a third of pairs have nothing in common, so
   the step that teaches the mechanic would have taught, a third of the time,
   that the mechanic does nothing. Same seven words, same difficulty \u2014 laid
   out so the lesson is there to be found.

   It looks for two joins of DIFFERENT kinds, so a player who taps the first
   three cards sees a ring and a pull rather than two of the same thing. */
let tutHandOrder = null;
function arrangeForTutorial(){
  if(!G || !G.hand || G.hand.length < 3) return;
  const hand = G.hand.slice();
  tutHandOrder = hand;
  let best = null, bestValue = -1;
  for(let i = 0; i < hand.length; i++)
    for(let j = 0; j < hand.length; j++){
      if(j === i) continue;
      const one = joinOf(hand[i], hand[j], {});
      if(one.kind === "silence") continue;
      for(let k = 0; k < hand.length; k++){
        if(k === i || k === j) continue;
        const two = joinOf(hand[j], hand[k], {});
        if(two.kind === "silence") continue;
        /* two different kinds teach twice as much as two of the same */
        let v = one.s + one.t + two.s + two.t;
        if(one.kind !== two.kind) v += 10;
        if(one.kind === "paradox" || two.kind === "paradox") v += 4;
        if(v > bestValue){ bestValue = v; best = [hand[i], hand[j], hand[k]]; }
      }
    }
  if(!best) return;
  G.hand = best.concat(hand.filter(function(c){ return best.indexOf(c) < 0; }));
}

/* Put the deal back the way it was dealt. The arrangement is a teaching aid,
   not a handout: left in place it meant anyone who saw the tutorial had their
   first three cards pre-sorted into a figure for the rest of the round, which
   cleared round 1 in a single hand and quietly made the daily seed worth more
   to them than to somebody who skipped. Same seven words either way — only
   where they sit while the lesson is running. */
function restoreHandOrder(){
  if(!tutHandOrder || !G || !G.hand) { tutHandOrder = null; return; }
  const want = tutHandOrder.filter(function(c){ return G.hand.indexOf(c) >= 0; });
  if(want.length === G.hand.length) G.hand = want;
  tutHandOrder = null;
}

let tutStep = -1, tutWatch = null;

function tutActive(){ return tutStep >= 0; }

function tutorialSeen(){ return store.get("tutorial", false); }

function startTutorial(force){
  if(!force && tutorialSeen()) return;
  tutStep = 0;
  arrangeForTutorial();
  renderHand();
  /* render() has already drawn the coach by now; stand it down so the two
     guides never talk over each other. */
  coachSet(null);
  document.getElementById("tut").hidden = false;
  renderTut();
  clearInterval(tutWatch);
  tutWatch = setInterval(function(){
    const s = TUT[tutStep];
    if(s && s.done && s.done()){ tutAdvance(); return; }
    pointTut();
  }, 220);
}

function tutAdvance(){
  buzz(9);
  tutStep++;
  if(tutStep >= TUT.length){ endTutorial(true); return; }
  renderTut();
}

function endTutorial(completed){
  clearInterval(tutWatch); tutWatch = null;
  tutStep = -1;
  document.getElementById("tut").hidden = true;
  store.set("tutorial", true);
  restoreHandOrder();
  if(G){ renderHand(); renderControls(); }
  /* Finishing the tutorial makes the coach redundant. SKIPPING it does not —
     a player who dismisses a six-step overlay has not necessarily learned
     anything, and the coach is one unobtrusive line. Leave them the net. */
  if(completed) coachFinish();
  else if(G) coachSet(G.coachStep);
}

function renderTut(){
  const s = TUT[tutStep];
  if(!s) return endTutorial(true);
  document.getElementById("tutStep").textContent =
    s.label + " · " + (tutStep + 1) + " of " + TUT.length;
  document.getElementById("tutText").innerHTML = s.text();
  /* A step that waits on the player gets no Next — doing it is the button.
     Only the two taps wait now, and a second tap undoes either of them. */
  document.getElementById("tutNext").hidden = !!s.done;

  const dots = document.getElementById("tutDots");
  dots.innerHTML = "";
  for(let i = 0; i < TUT.length; i++){
    const d = document.createElement("i");
    d.className = i === tutStep ? "on" : (i < tutStep ? "done" : "");
    dots.appendChild(d);
  }

  tutAim = null;
  pointTut();
}

/* Where the spotlight is currently aimed, as a string, so a tick that changes
   nothing costs one rect read and nothing else. */
let tutAim = null;

/* The hole was positioned once, when the step was drawn, and the board does
   not hold still: a hand resolving folds the hand away and grows the stage,
   the shop closes, a phone scrolls, an orientation changes. On the last step
   the spotlight ended up 56px clear of the Lens bar it was pointing at.
   Aim on a tick instead, and let the CSS transition carry the correction. */
function pointTut(){
  const s = TUT[tutStep];
  if(!s) return;
  const hole = document.getElementById("tutHole");
  const box = document.getElementById("tutBox");
  const el = s.sel ? document.querySelector(s.sel) : null;
  const r = el ? el.getBoundingClientRect() : null;
  const aim = r
    ? [r.left, r.top, r.width, r.height].map(Math.round).join(",")
    : "none";
  if(aim === tutAim) return;
  tutAim = aim;

  /* Below this width the card is docked by CSS and only needs to be told
     which end of the screen to sit at. */
  const docked = window.innerWidth <= 700;
  if(docked){
    box.classList.remove("dock-top");
    if(el){
      /* Which end is further from the target is the wrong question — a tall
         card docked at the far end still reaches back across the screen. Ask
         which end actually clears it. THE SHAPE OF YOUR HAND spent a release
         sitting on top of the readout it was telling players to watch. */
      const t = el.getBoundingClientRect();
      const bh = box.offsetHeight;
      const topRoom = t.top - 16, bottomRoom = window.innerHeight - t.bottom - 16;
      const topCovers = 8 + bh > t.top - 8;
      const bottomCovers = window.innerHeight - 8 - bh < t.bottom + 8;
      const goTop = (bottomCovers && !topCovers)
        || (bottomCovers && topCovers && t.top + t.height / 2 > window.innerHeight * 0.5);
      if(goTop) box.classList.add("dock-top");
      /* Copy grows; the screen does not. Cap the card to the room on the side
         it docked to, so no future edit can quietly push it back over the
         board. It scrolls before it covers anything. */
      box.style.maxHeight = Math.max(120, goTop ? topRoom : bottomRoom) + "px";
    } else {
      box.style.maxHeight = "";
    }
  }
  if(!r){
    /* No target: a zero-size hole in the middle of the screen. It paints
       nothing itself, and its 9999px spread dims everything.

       Parking it off-screen at top:-9999px did not work and looked like it
       should: a 9999px spread from a box at y=-9999 reaches exactly y=0, so
       the shadow stopped at the top edge of the viewport and the welcome step
       floated over a fully lit board. */
    hole.style.display = "block";
    hole.style.left = "50%";
    hole.style.top = "50%";
    hole.style.width = "0px";
    hole.style.height = "0px";
    if(docked) return;
    box.style.left = "50%";
    box.style.top = "50%";
    box.style.transform = "translate(-50%, -50%)";
    return;
  }

  const pad = 8;
  hole.style.display = "block";
  hole.style.borderRadius = r.height > 120 ? "12px" : "10px";
  hole.style.left = (r.left - pad) + "px";
  hole.style.top = (r.top - pad) + "px";
  hole.style.width = (r.width + pad * 2) + "px";
  hole.style.height = (r.height + pad * 2) + "px";

  if(docked) return;   /* CSS owns the position from here */

  box.style.transform = "none";
  const bw = box.offsetWidth, bh = box.offsetHeight, gap = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const clamp = function(v, lo, hi){ return Math.max(lo, Math.min(v, hi < lo ? lo : hi)); };
  const spot = { left: r.left - pad, top: r.top - pad,
                 right: r.right + pad, bottom: r.bottom + pad };

  /* Four placements, tried in the order the step asked for, scored by how much
     of the spotlight each one covers. The old version picked a side, clamped it
     into the viewport, and never looked again — so a tall card pointing at
     something in the middle of the screen got clamped straight back on top of
     it. A card in an awkward corner is a smaller failure than a card covering
     the one thing the step is about. */
  const side = {
    below: { left: clamp(r.left, 12, vw - bw - 12), top: spot.bottom + gap },
    above: { left: clamp(r.left, 12, vw - bw - 12), top: spot.top - gap - bh },
    right: { left: spot.right + gap, top: clamp(r.top, 12, vh - bh - 12) },
    left:  { left: spot.left - gap - bw, top: clamp(r.top, 12, vh - bh - 12) }
  };
  /* Side placement needs room the phone layout does not have. */
  const narrow = vw < 960;
  const order = s.pos === "right" && !narrow ? ["right", "left", "below", "above"]
              : s.pos === "top" ? ["above", "below", "right", "left"]
              : ["below", "above", "right", "left"];
  const cover = function(c){
    const l = clamp(c.left, 12, vw - bw - 12), t = clamp(c.top, 12, vh - bh - 12);
    return Math.max(0, Math.min(l + bw, spot.right) - Math.max(l, spot.left))
         * Math.max(0, Math.min(t + bh, spot.bottom) - Math.max(t, spot.top));
  };
  let best = side[order[0]], bestCover = Infinity;
  order.forEach(function(k){
    const c = cover(side[k]);
    if(c < bestCover){ bestCover = c; best = side[k]; }
  });
  box.style.left = clamp(best.left, 12, vw - bw - 12) + "px";
  box.style.top = clamp(best.top, 12, vh - bh - 12) + "px";
}

/* ---------- first-run coaching ----------
   A modal explains the game to someone who hasn't seen it yet, which is the
   worst possible moment. This instead says one short thing at a time, on the
   board, while they're doing the thing. It runs once, during round 1.      */
/* "Three words beat one" is true of a bare deck and false of half the Lenses
   in the shop. Holding ASCETIC it is the exact opposite of the right play, and
   the board was still saying it — the game telling you to undo your own build.
   A Lens that wants a particular shape of hand says so instead. */
const HAND_SHAPE = {
  asc:     "ASCETIC pays ×5 for a single word, so one at a time beats three.",
  oracle:  "THE ORACLE only pays your first word, so a lone word loses nothing.",
  glut:    "GLUTTON wants exactly three.",
  entropy: "ENTROPY wants three, each meaning fewer things than the last."
};
/* The floor on a line's length. LINE_MIN for everybody, except that two
   Lenses exist to be played one word at a time - and the engine has always
   allowed it. */
const SOLO_LENSES = ["asc", "oracle"];
function minPlay(){
  if(G && G.lenses && G.lenses.some(function(l){ return SOLO_LENSES.indexOf(l.id) >= 0; })) return 1;
  return LINE_MIN;
}

function idleHint(){
  /* Read, never written down. This named three words through the whole of the
     JOIN rebuild, which moved the cap to five - and it only bothered to work
     the number out when a rule had pushed it BELOW three, so the one case it
     got wrong was the ordinary board. */
  const cap = maxPlay();
  const WORDS = ["", "one", "two", "three", "four", "five"];
  /* LINE_MIN is 2 and play() has never enforced it - ASCETIC and THE ORACLE
     are both bought to play a single word. So the board said "two to five"
     while the shop sold you a Lens for one. Say the real minimum. */
  const lo = minPlay();
  const lead = "Lay " + (WORDS[lo] || lo) + " to "
             + (WORDS[cap] || cap) + " words, then hit PLAY.";
  if(orderMatters()) return lead + " Your Lenses read left to right, so the order changes the score.";
  if(cap < MAX_PLAY) return lead + " " + capper() + " is holding you to " + cap + ".";
  for(let i = 0; i < G.lenses.length; i++){
    const s = HAND_SHAPE[G.lenses[i].id];
    if(s) return lead + " " + s;
  }
  /* Not "three beat one": under JOIN a longer line finds more hands AND has
     further to fall, which is the whole decision. */
  return lead + " A longer line pays more and risks more.";
}
const COACH = {
  get pick(){
    /* Named what it could see: with the overtones hidden there are no gold tags
       to point at, and a line telling a player to tap them was the game giving
       an instruction it had made impossible to follow. */
    return blindMode()
      ? "Lay two words side by side and see what they do to each other."
      : "Gold tags are what this round wants. Tap two or three words that have one.";
  },
  /* Written twice against a board that had changed under it: first promising
     a score preview that the JOIN rebuild had removed, then telling a player
     they would only find out on commit, which stopped being true the day the
     counters came back. It says what is on the screen now. */
  play:  "Happy with the two counters at the top? Hit PLAY.",
  score: "That is points × multiplier. Your hand and your tags make the points. Lenses multiply them."
};
function coachDone(){ return store.get("coached", false); }
function coachFinish(){ store.set("coached", true); if(G) G.coachStep = null; coachSet(null); }
function coachSet(step){
  const el = document.getElementById("coach");
  const btn = document.getElementById("playBtn");
  if(!el) return;
  if(btn) btn.classList.remove("hint-pulse");
  if(!step || coachDone() || tutActive() || !COACH[step]){ el.hidden = true; return; }
  el.textContent = COACH[step];
  el.hidden = false;
  if(step === "play" && btn) btn.classList.add("hint-pulse");
}

/* Named like a poker hand, so the player learns to aim for a shape rather
   than squint at tags. */
const RESO_NAMES = ["NO MATCHES","MATCH","DOUBLE MATCH","TRIPLE MATCH",
                    "QUADRUPLE MATCH","OVERTONE CASCADE"];
function resonanceName(n){ return RESO_NAMES[Math.min(n, RESO_NAMES.length - 1)]; }

function renderPreview(){
  const hint = document.getElementById("stageHint");
  const sc = document.getElementById("stageCards");

  if(G.selected.length === 0){
    sc.innerHTML = "";
    const call = document.createElement("div");
    call.className = "demand-call";
    const icons = document.createElement("div");
    icons.className = "dc-icons";
    G.demand.tags.forEach(function(t){
      const s = document.createElement("span");
      s.className = "ms";
      s.setAttribute("aria-hidden", "true");
      s.textContent = ICONS[t] || "blur_on";
      icons.appendChild(s);
    });
    const txt = document.createElement("div");
    txt.className = "dc-text";
    txt.innerHTML = 'Wants '
      + G.demand.tags.map(function(t){ return "<b>" + TAGS[t][0] + "</b>"; }).join(" or ")
      + '. Every matching tag you play is <b>+' + DEMAND_CHIPS + ' points</b>'
      + ' and <b>+' + DEMAND_MULT + ' multiplier</b>.'
      + '<span class="dc-fig">The shape of your hand pays too. '
      + '<button class="figlink" type="button">see the five hands</button>.</span>';
    call.appendChild(icons);
    call.appendChild(txt);
    sc.appendChild(call);
    const fl = txt.querySelector(".figlink");
    if(fl) fl.onclick = function(){ showFigures(); };
    setTally(0, 1);
    hint.textContent = idleHint();
    return;
  }

  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);
  sc.innerHTML = "";
  cards.forEach(function(c, i){
    const el = cardEl(c, true);
    const p = document.createElement("div");
    p.className = "pos";
    p.textContent = i + 1;
    el.appendChild(p);
    sc.appendChild(el);
  });
  /* The counters follow the selection.

     They were blanked for a while, on the spec line that says the board never
     shows the score of an uncommitted line - the idea being that if the board
     prices the hand for you, choosing words is arithmetic somebody else has
     already done. It reads as a broken counter. POINTS 0 and MULTIPLIER 1
     under a hand you have just built look exactly like a game that has
     stopped adding up, and that is the first thing a player says about it.

     The beads below carry the same lesson without lying about the state of
     the board: they name what each pair is DOING, which is the part a player
     has to learn, while the counters say what it is worth. */
  setTally(res.chips, res.mult);

  /* The engine pays for a matching overtone only if the overtone is not
     already spent this round, and only for words up to where the line stops.
     This counted every tag on every selected card, so from the second play of
     a round the board promised matches that were never coming. */
  const pvDull = dullTags();
  const jr = joinsOf(cards, pvDull);
  const hits = cards.slice(0, jr.scored).reduce(function(s, c){
    return s + c.t.filter(function(t){
      return G.demand.tags.indexOf(t) >= 0 && !pvDull[t];
    }).length;
  }, 0);
  /* Say the number, then say the one thing that would make it bigger. A
     player holding two words when a third is free should be told so. */
  const room = maxPlay() - cards.length;
  const spare = room > 0 && G.hand.some(function(c){
    return G.selected.indexOf(c.id) < 0
      && c.t.some(function(t){ return G.demand.tags.indexOf(t) >= 0; });
  });
  /* The figure is the headline. It is the one thing on the board that is still
     yours to change, and the thing a player reading only the tag strip would
     never find on their own. The match count drops a line — it is already
     spelled out in gold on every card. */
  const figs = figuresIn(cards);
  const fig = figs.length ? figs[0] : null;
  const better = figureByReorder(cards);
  const solo = cards.length < 2;
  const stops = jr.scored < cards.length;

  /* The board no longer prints the score of a line you have not committed.
     It printed the answer before the question, which is why picking cards was
     arithmetic somebody else had already done. What it shows instead is what
     it can see: what each pair of words is doing to the one beside it. The
     player does the adding, or does not, and finds out on PLAY. */
  const beads = jr.joins.map(function(j){
    return '<i class="jn ' + j.kind + '" title="These two words '
      + JOIN_SAID[j.kind] + '">' + JOIN_NAME[j.kind] + '</i>';
  }).join('<b class="jnx">&middot;</b>');

  /* What the rest of the hand would do to the last word laid.

     This was a badge stamped on every card, and a seven-card hand is then
     seven things to read before one decision. Said once, in the middle of the
     board, it is one thing to read - and it is already where the player is
     looking, next to the beads saying what the laid words are doing. Same
     information, a sixth of the noise, and the cards go back to being words.

     Best-first, so the rare thing is read before the common one. */
  const tip = cards[cards.length - 1];
  const nextBy = { paradox: [], tension: [], resonance: [], silence: [] };
  /* Blind mode hides what you have not played YET, and keeps what you have
     learned between runs. Gating the whole row on the mode threw the second
     half of that promise away: a player who had met every word in the hand
     still got nothing. It is per word now, the same test the cards use. */
  if(room > 0){
    G.hand.forEach(function(h){
      if(G.selected.indexOf(h.id) >= 0) return;
      if(!wordKnown(h.w) || !wordKnown(tip.w)) return;
      nextBy[joinOf(tip, h).kind].push(h.w);
    });
  }
  const nextRow = ["paradox", "tension", "resonance", "silence"]
    .filter(function(k){ return nextBy[k].length; })
    .map(function(k){
      return '<i class="jn ' + k + '">' + JOIN_NAME[k] + '</i> '
           + '<span class="nw">' + nextBy[k].join(", ") + '</span>';
    }).join('<b class="jnx">&middot;</b>');

  hint.innerHTML =
      '<span class="hand-name' + (solo || fig ? '' : ' none') + '">'
    +   (solo ? resonanceName(hits) : (fig ? fig.n : "NOTHING YET")) + '</span>'
    + (figs.length > 1
        ? '<span class="figlv" title="Every figure this line makes">and '
          + (figs.length - 1) + ' more</span>' : '')
    + '<br>'
    + (solo
        ? 'One word rings on its own. Lay another beside it.'
        : (beads || '<i class="jn silence">' + JOIN_NAME.silence + '</i>')
          + (stops
              ? '<span class="stops"> &middot; the line stops after '
                + jr.scored + (jr.scored === 1 ? ' word' : ' words') + '</span>'
              : (spare ? '<span class="room"> &middot; room for ' + room + ' more</span>' : '')))
    + (better
        ? '<br><span class="ord">The same words say more as <b>' + better.n + '</b> in another order.</span>'
        : '')
    + (nextRow
        ? '<div class="nxt"><span class="nxl">Lay next to ' + tip.w + '</span>'
          + nextRow + '</div>'
        : '');
  const nm = hint.querySelector(".hand-name");
  if(nm && !solo) nm.onclick = function(){ showFigures(); };
  /* It read out the raw ids - resonance, tension, paradox, silence - beside
     chips that say ALIKE, OPPOSITE, BOTH, NOTHING. Somebody listening was
     given the exact four words the rename existed to retire. And the row
     naming what the rest of the hand would do was not announced at all. */
  const saidNext = ["paradox", "tension", "resonance", "silence"]
    .filter(function(k){ return nextBy[k].length; })
    .map(function(k){ return JOIN_NAME[k] + ": " + nextBy[k].join(", "); })
    .join(". ");
  /* The counters price the selection, so the live region has to say the price
     too - a player listening rather than looking was told the shape of the
     line and never what it came to. */
  say((solo ? resonanceName(hits) : (fig ? fig.n : "Nothing yet"))
      + ". " + (solo ? "One word."
                     : jr.joins.map(function(j){ return JOIN_NAME[j.kind]; }).join(", "))
      + ". Worth " + res.chips + " times " + (Math.round(res.mult * 10) / 10) + "."
      + (stops ? ". The line stops after " + jr.scored + "." : "")
      + (better ? " In another order these make " + better.n + "." : "")
      + (saidNext ? " Lay next to " + tip.w + ". " + saidNext + "." : ""));
}

/* ---------- the figures, written down ----------
   Balatro shows you its hand rankings from the first second, and the game is
   better for it: the list is not a spoiler, it is the puzzle. Same here. */
function showFigures(back){
  /* What the shapes are worth TO THIS PLAYER, not what they are worth in
     the abstract. A reference panel quoting the unlevelled table would be
     the board advising a play it then declines to pay for.

     Only while a run is actually live, though. G outlives the run that
     made it — endRun sets G.over and nothing clears it — so opening this
     from the title after finishing a run was quoting the dead run's
     levels at somebody whose next run starts at zero. */
  const rows = FIGURES.map(function(f){
    return '<tr><th>' + f.n + '<span>' + f.d + '</span></th>'
      + '<td>+' + FIG_PAY[f.id].chips + '</td>'
      + '<td>' + (FIG_PAY[f.id].mult ? '+' + FIG_PAY[f.id].mult + ' mult' : '&mdash;') + '</td></tr>';
  }).join("");
  /* The panel a player opens when they have stopped following, reached from
     the board, the menu and the help card. The plain-words pass renamed the
     joins and the hands everywhere else and missed this one, so the four words
     a playtester named as the thing they could not follow - resonance, pull,
     silence, figure - all survived in the one place somebody goes to look them
     up. */
  showPanel(''
    + '<h2>The five hands</h2>'
    + '<div class="sub">What your words do to each other</div>'
    + '<p>Lay two words side by side and they are one of three things. Two that '
    + 'mean something of the same thing are <b>' + JOIN_NAME.resonance + '</b>. '
    + 'Two that mean opposite things are <b class="gold">' + JOIN_NAME.tension
    + '</b>, worth far more. Two with <b>' + JOIN_NAME.silence + '</b> in common '
    + 'stop the line dead: a line is read left to right, and the words before '
    + 'the stop pay while the words after it are wasted.</p>'
    + '<p class="gold"><b>These are hands, the way a flush is a hand.</b> Not one '
    + 'of them reads a letter or a length. They read what the words mean, which '
    + 'is the only thing this game has ever claimed to be about.</p>'
    + '<table class="figtab">'
    +   '<thead><tr><th>Hand</th><th>Points</th><th>Multiplier</th></tr></thead>'
    +   '<tbody>' + rows + '</tbody></table>'
    + '<p>Every hand your line makes pays, not only the best one. And a line you '
    + 'keep at the end of a round pays again, every time that hand comes back.</p>'
    + '<div class="rowend' + (back === "title" ? ' end' : '') + '">'
    + (back ? '<button class="btn' + (back === "title" ? ' primary' : '')
              + '" id="figsBack" type="button">Back to '
              + (back === "title" ? 'the menu' : 'how it works') + '</button>'
            : '<span></span>')
    + (back === "title" ? ''
        : '<button class="btn primary" id="closeFigs" type="button">Play</button>') + '</div>');
  const cf = document.getElementById("closeFigs");
  if(cf) cf.onclick = hidePanel;
  /* Opened from somewhere, this used to be a door that only went one way: the
     sole button said Play, so reading the table cost you your place. */
  const b = document.getElementById("figsBack");
  /* Bound, not handed over: assigning these straight to onclick passes the
     CLICK EVENT as the first argument, and every one of them reads its first
     argument as "where did you come from". */
  if(b) b.onclick = back === "title" ? function(){ showTitle(); } : function(){ showHelp(); };
}

function renderDemand(){
  document.getElementById("roundLabel").textContent = "Round " + (G.round+1) + " of " + ROUNDS;
  document.getElementById("demandName").textContent = G.demand.n;
  const w = document.getElementById("demandWants");
  w.innerHTML = "";
  const lead = document.createElement("span");
  lead.style.cssText = "font-size:11px;letter-spacing:.08em;color:var(--text-faint);align-self:center;margin-right:1px";
  lead.textContent = "WANTS";
  w.appendChild(lead);
  G.demand.tags.forEach(function(t){
    const s = document.createElement("span");
    s.className = "w"; s.textContent = TAGS[t][0];
    w.appendChild(s);
  });
  const ord = document.getElementById("ordeal");
  const rules = roundRules();
  if(rules.length){
    ord.hidden = false;
    ord.innerHTML = rules.map(function(o, i){
      /* The drafted one says why it is here — it arrived because of the deck
         the player built, and a rule that appears unexplained is a punishment
         rather than an answer. */
      return '<div class="on">' + escapeHtml(o.n)
        + (o === G.levy ? '<span class="why">THE RECKONING</span>' : '')
        + '</div><div class="od">' + escapeHtml(o.d) + '</div>';
    }).join("");
  } else {
    ord.hidden = true;
  }
  document.getElementById("roundScore").textContent = G.roundScore.toLocaleString();
  document.getElementById("roundTarget").textContent = G.target.toLocaleString();
  const pct = Math.min(100, (G.roundScore / G.target) * 100);
  const pr = document.getElementById("progress");
  pr.querySelector("i").style.width = pct + "%";
  pr.classList.toggle("met", G.roundScore >= G.target);
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  document.getElementById("lensCount").textContent = G.lenses.length + "/" + LENS_SLOTS;
  if(G.lenses.length === 0){
    const e = document.createElement("div");
    e.className = "rail-empty";
    e.textContent = "NO LENSES YET. Clear this round and you can buy one. Lenses are what multiply your score.";
    rail.appendChild(e);
    return;
  }
  G.lenses.forEach(function(l){
    const d = document.createElement("button");
    d.type = "button";
    d.className = "lens" + (l.flaw ? " flaw" : "") + (G.openLens === l.id ? " open" : "");
    d.title = l.d;
    d.setAttribute("aria-expanded", G.openLens === l.id ? "true" : "false");
    const lv = (G.lensState && G.lensState[l.id]) || 0;
    d.innerHTML = '<div class="n">' + escapeHtml(l.n)
      + (G.memoryLens === l.id ? '<span class="mem">MEMORY</span>' : '') + '</div>'
      + '<div class="d">' + escapeHtml(l.d) + '</div>'
      /* A Lens that grows is the reason to keep playing one. Show the number. */
      + (lv ? '<div class="lv">+' + Math.round(lv).toLocaleString() + ' so far</div>' : '');
    /* Tap to read the whole rule. One open at a time, so the rail never turns
       into a wall of text. */
    d.onclick = function(){
      G.openLens = G.openLens === l.id ? null : l.id;
      SFX.button();
      renderRail();
    };
    rail.appendChild(d);
  });
  rail.classList.toggle("has-open", !!G.openLens);
  /* bring the one they opened into view, in case it was mid-scroll */
  const open = rail.querySelector(".lens.open");
  if(open && open.scrollIntoView){
    try{ open.scrollIntoView({ block: "nearest", inline: "start", behavior: "smooth" }); }catch(e){}
  }
}

function renderHand(){
  const h = document.getElementById("hand");
  h.innerHTML = "";
  /* Fan the hand: cards tilt away from centre and dip at the edges, so the
     hand reads as held cards rather than a row of buttons. */
  const n = G.hand.length, mid = (n - 1) / 2;
  /* A fan needs width. On a phone the hand wraps to two rows, where tilted
     cards just collide — so lay them flat there. */
  const fan = window.innerWidth > 620;
  let dealt = 0;
  G.hand.forEach(function(c, i){
    const el = cardEl(c, false);
    const off = i - mid;
    el.style.setProperty("--rot", fan ? (off * 2.2).toFixed(2) + "deg" : "0deg");
    el.style.setProperty("--dy", fan ? (Math.pow(Math.abs(off), 1.7) * 2.6).toFixed(1) + "px" : "0px");
    el.style.setProperty("--i", i);
    /* Only newly drawn cards deal in. renderHand runs on every click, and
       re-dealing the whole hand each time would be unbearable. */
    if(!SEEN[c.id]){
      SEEN[c.id] = 1;
      el.classList.add("deal");
      el.style.setProperty("--i", dealt++);
    }
    h.appendChild(el);
  });
}

function renderControls(){
  document.getElementById("playsLeft").textContent = G.plays;
  document.getElementById("discardsLeft").textContent = G.discards;
  const pips = document.getElementById("playPips");
  pips.innerHTML = "";
  /* Hardcoded 4, from the era when a round had four plays - so every player
     saw the round's real plays lit and the rest grey, and read it as plays
     they still had. Read off the round instead, which also shows the whole
     cost of THE WAGER and THE CLOCK. */
  const budget = Math.max(G.plays, (roundShape(G.round) || { plays: G.plays }).plays);
  for(let i = 0; i < budget; i++){
    const s = document.createElement("span");
    s.className = "pip" + (i < G.plays ? "" : " off");
    pips.appendChild(s);
  }
  const owed = G.mustForfeit && !G.forfeited;
  const tooShort = G.selected.length > 0 && G.selected.length < minPlay();
  /* Both are off for the length of the lesson, so it cannot cost the round a
     play or a discard whatever the player presses. */
  const lesson = tutActive();
  document.getElementById("playBtn").disabled =
    G.animating || G.selected.length===0 || tooShort || G.plays<=0 || owed || lesson;
  /* Say which of the three it is, rather than greying out without a reason. */
  document.getElementById("playBtn").title = lesson
    ? "Finish or skip the lesson first"
    : owed ? "THE FORFEIT: give a word up first"
    : tooShort ? "A line is " + minPlay() + " words or more" : "";
  document.getElementById("discardBtn").disabled =
    G.animating || G.selected.length===0 || G.discards<=0 || lesson;
  document.getElementById("discardBtn").title = lesson ? "Finish or skip the lesson first" : "";
  document.getElementById("interpBtn").disabled = G.animating || G.interpreterUsed;
  document.getElementById("interpBtn").textContent = G.interpreterUsed ? "\u2713 Word added" : "+ Add word";
  document.getElementById("bankLabel").textContent = "$" + G.bank;
  const rd = runDifficulty();
  document.getElementById("seedLabel").textContent =
    (G.isDaily ? "DAILY " : "SEED ") + G.seed.toUpperCase()
    + (rd.rank === 0 ? "" : " \u00b7 " + rd.n);
}

function render(){
  renderDemand(); renderRail(); renderHand(); renderControls(); renderPreview();
  coachSet(G.coachStep);
  /* Anything that redraws the board can move what the tutorial is pointing at,
     and a fifth of a second of a spotlight sitting off its target is visible.
     Costs one rect read when the aim has not changed. */
  if(tutActive()) pointTut();
}

/* ---------- panels ---------- */
/* `moment` marks the two panels a player stops at rather than passes through:
   a round ending and a run ending. They take the board away properly. */
function showPanel(html, moment){
  /* The round-clear stamp outlives its animation by design; if a panel opens
     underneath it (a skipped celebration, a fast reader) it has to go. */
  document.getElementById("stamp").hidden = true;
  document.getElementById("panel").innerHTML = html;
  const veil = document.getElementById("veil");
  veil.classList.toggle("moment", !!moment);
  veil.hidden = false;
}
function hidePanel(){ document.getElementById("veil").hidden = true; }

/* Everything a sighted player reads off the board as it changes: what the hand
   is worth, what it made, whether the round is won. Without this the only
   thing the page ever announced was the tutorial. */
let sayLast = "";
function say(msg){
  const el = document.getElementById("say");
  if(!el || msg === sayLast) return;
  sayLast = msg;
  el.textContent = msg;
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 1900);
}

function syncSoundBtn(){
  /* Whether the game is making any noise has to read off the board without
     opening anything, so the sound button says OFF when nothing is on. */
  const dot = document.getElementById("muteDot");
  if(!dot) return;
  const on = !!(prefs.music || prefs.sfx);
  dot.hidden = on;
  const btn = document.getElementById("menuBtn");
  if(btn) btn.setAttribute("aria-label", on ? "Sound and feel" : "Sound and feel, currently off");
}

/* ---------- the title screen ----------
   What a player lands on, and what they come back to. A stack of entries with
   a caret on the one you are on, walked with the arrow keys or the mouse. The
   first version of this was a settings page with a PLAY button at the top of
   it: every entry carried a sentence explaining itself, which is what a form
   looks like, not a menu. If an entry needs explaining, it is the wrong
   entry — the only prose left on it is the one line about how hard you want
   the game, because that is a choice rather than a door. */
let titleOpen = false, titleSel = 0;
/* Whether the board behind the menu is a run somebody walked out of. Reaching
   the menu mid-run must not cost you the run, and PLAY must not quietly mean
   "throw that away". */
let titleFromGame = false;

function showTitle(){
  titleOpen = true;
  hidePanel();
  behindTitle(true);
  const el = document.getElementById("title");
  const runs = store.get("runs", 0);
  const now = difficulty(), first = runs === 0;
  const live = titleFromGame && G && !G.over;
  const inRun = G ? runDifficulty() : now;
  const mem = store.get("memory", null);
  const memLens = mem && LENSES.find(function(l){ return l.id === mem; });

  /* Every stop the arrow keys walk carries .tnav, so the order they are
     walked in is the order they are read in and nothing can drift apart. */
  function door(id, label, acc, alt){
    return '<button class="go tnav' + (alt ? ' alt' : '') + '" type="button" id="' + id + '">'
      + label + (acc ? '<span class="d">' + acc + '</span>' : '') + '</button>';
  }
  function shelf(id, label){
    return '<button class="tnav" type="button" id="' + id + '">' + label + '</button>';
  }

  const pills = DIFFICULTIES.map(function(d){
    /* Never lock the one they are standing on, whatever storage says. */
    const locked = !modeOpen(d) && d.id !== now.id;
    return '<button class="diffopt" type="button" data-diff="' + d.id + '"'
      + (locked ? ' disabled aria-disabled="true"' : '')
      + ' aria-pressed="' + (d.id === now.id ? "true" : "false") + '">' + d.n
      + (locked ? '<span class="tip lock">Locked</span>' : '')
      + '</button>';
  }).join("");

  /* The door: PLAY, and folded inside the same slab the two things pressing
     PLAY will actually do. What either one MEANS goes underneath it, where it
     is consequence rather than furniture — a front door does not need two
     paragraphs of body copy on it. */
  document.getElementById("titleBody").innerHTML = ''
    + '<div class="door">'
    +   (live ? door("titleResume", "Resume run", "Round " + (G.round + 1)) : '')
    +   door("titlePlay", live ? "New run" : (first ? "Play" : "Play the daily"),
             todayKey(), live)
    +   '<div class="setup">'
    +     '<div class="set">'
    +       '<span class="k" id="titleDiffLabel">How hard</span>'
    +       '<div class="segs tnav" role="group" aria-labelledby="titleDiffLabel">' + pills + '</div>'
    +     '</div>'
    +     (!live && memLens
          ? '<div class="set carry' + (prefs.carryMemory ? '' : ' off') + '">'
            + '<span class="k">' + (prefs.carryMemory ? 'Carrying in' : 'Starting clean') + '</span>'
            + '<span class="v' + (prefs.carryMemory ? '' : ' off') + '">'
            + escapeHtml(memLens.n) + '</span>'
            + '<button class="swap tnav" id="titleCarry" type="button">'
            + (prefs.carryMemory ? 'Start clean' : 'Carry it in') + '</button></div>'
          : '')
    +   '</div>'
    + '</div>'
    + '<p class="setnote" id="titleNote"></p>'
    + '<div class="shelf">'
    +   shelf("titleHelp", "How to play") + '<i aria-hidden="true">\u00b7</i>'
    +   shelf("titleFigs", "The five hands") + '<i aria-hidden="true">\u00b7</i>'
    +   shelf("titleTut", "Tutorial") + '<i aria-hidden="true">\u00b7</i>'
    +   shelf("titleSound", "Sound &amp; feel")
    + '</div>';

  /* A roguelite that keeps your record in localStorage and never shows it to
     you is keeping a secret for no reason. One line — and only the numbers
     that exist, because BEST · SCHOLAR none is an empty stat taking up
     room on the one screen with nothing to spare. The difficulty is named
     only when there are two of them to tell apart. */
  const bests = DIFFICULTIES.map(function(d){
    return { n: d.n.toLowerCase(), v: store.get(d.bestKey, 0) };
  }).filter(function(b){ return b.v > 0; });
  document.getElementById("titleStats").innerHTML = runs
    ? '<b>' + runs.toLocaleString() + '</b> run' + (runs === 1 ? '' : 's')
      + bests.map(function(b){
          return ' \u00b7 ' + (bests.length > 1 ? b.n + ' best' : 'best')
            + ' <b>' + b.v.toLocaleString() + '</b>';
        }).join('')
    : '';

  titleDeal();
  el.hidden = false;

  const resume = document.getElementById("titleResume");
  if(resume) resume.onclick = function(){ titleFromGame = false; hideTitle(); };
  document.getElementById("titlePlay").onclick = function(){
    if(live && runTouched()) confirmNewRun();
    else startFromTitle();
  };
  document.getElementById("titleHelp").onclick = function(){ showHelp("title"); };
  document.getElementById("titleFigs").onclick = function(){ showFigures("title"); };
  document.getElementById("titleSound").onclick = function(){ showMenu("title"); };
  const carry = document.getElementById("titleCarry");
  if(carry) carry.onclick = function(){
    setPref("carryMemory", !prefs.carryMemory);
    SFX.button();
    showTitle();
  };
  document.getElementById("titleTut").onclick = function(){
    titleFromGame = false;
    hideTitle();
    if(!live) newRun(null);
    startTutorial(true);
  };
  Array.prototype.forEach.call(el.querySelectorAll(".diffopt"), function(btn){
    btn.onclick = function(){
      if(btn.disabled || btn.getAttribute("aria-pressed") === "true") return;
      setPref("difficulty", btn.dataset.diff);
      SFX.buy();
      paintDiff();
    };
  });
  paintDiff();

  /* Hover moves the mark without stealing the keyboard's place in the list. */
  titleItems().forEach(function(n, i){
    const stop = titleStop(n);
    if(stop) stop.onmouseenter = function(){ titleMark(i); };
    n.addEventListener("focus", function(){ titleMark(i); });
  });
  titleMark(titleSel);
}

/* Three cards of the hand this run starts with, fanned, beside the door.

   They are free: start() calls newRun(null) before it shows the menu, so the
   deal already exists and was being thrown away unseen. What it buys is a
   front door only Overtone could have, and a player who has read a card
   before the tutorial hands them seven.

   It is shown only when it is TRUE. A finished run's hand is not today's
   opening hand, and captioning it as one would be the game lying on its own
   menu — so the column closes instead. */
function titleDeal(){
  const wrap = document.getElementById("titleDeal");
  const card = document.getElementById("titleCard");
  if(!wrap || !card) return;
  const live = titleFromGame && G && !G.over;
  const ok = G && G.hand && G.hand.length >= 3 && !G.over;
  wrap.hidden = !ok;
  card.classList.toggle("solo", !ok);
  wrap.innerHTML = "";
  if(!ok) return;

  const fan = document.createElement("div");
  fan.className = "fan";
  G.hand.slice(0, 3).forEach(function(c, i){
    const el = cardEl(c, true);
    /* The pivot sits below the cards, so the tilt reads as one held fan
       rather than three cards that happen to be crooked. */
    el.style.setProperty("--rot", ((i - 1) * 4) + "deg");
    el.style.setProperty("--dy", (i === 1 ? 0 : 6) + "px");
    fan.appendChild(el);
  });
  wrap.appendChild(fan);

  const cap = document.createElement("div");
  cap.className = "cap";
  cap.textContent = live ? "The hand on the table" : "Today\u2019s opening hand";
  wrap.appendChild(cap);
}

/* Which pill is lit, which is shut, and the one line under them. Done in place
   rather than by rebuilding the menu, so the button a player just pressed is
   still the button under their finger and the keyboard keeps its place. */
function paintDiff(){
  const el = document.getElementById("title");
  const note = document.getElementById("titleNote");
  if(!el || !note) return;
  const now = difficulty();
  const live = titleFromGame && G && !G.over;
  const inRun = G ? runDifficulty() : now;

  Array.prototype.forEach.call(el.querySelectorAll(".diffopt"), function(btn){
    const on = btn.dataset.diff === now.id;
    const d = DIFF_BY_ID[btn.dataset.diff];
    /* never lock the one they are standing on, whatever storage says */
    const locked = !!d && !modeOpen(d) && !on;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.disabled = locked;
    if(locked) btn.setAttribute("aria-disabled", "true");
    else btn.removeAttribute("aria-disabled");
    const tag = btn.querySelector(".tip");
    if(locked && !tag){
      const t = document.createElement("span");
      t.className = "tip lock";
      t.textContent = "Locked";
      btn.appendChild(t);
    } else if(!locked && tag) tag.remove();
  });

  const shut = DIFFICULTIES.filter(function(d){ return !modeOpen(d) && d.id !== now.id; });
  /* Reads the gate rather than restating it: "once you finish a run" was
     written when one mode was locked behind exactly one run. */
  const gate = shut.map(function(d){
    const n = d.lockedUntilRun || 0;
    return '<b>' + escapeHtml(d.n) + '</b> '
         + (n === 1 ? 'opens once you finish a run'
                    : 'opens after ' + n + ' runs');
  }).join('. ');
  note.innerHTML = live && inRun.id !== now.id
    ? 'The run on the table is still <b>' + escapeHtml(inRun.n) + '</b>. A new run picks this up.'
    : escapeHtml(now.d) + (gate ? ' ' + gate + '.' : '');
}

/* The stops, in the order they are read in. The difficulty switch is one stop,
   and the pill you are on is the one that is currently chosen. */
function titleItems(){
  const el = document.getElementById("title");
  if(!el || el.hidden) return [];
  return Array.prototype.map.call(el.querySelectorAll(".tnav"), function(n){
    return n.classList.contains("segs")
      ? (n.querySelector('.diffopt[aria-pressed="true"]') || n.querySelector(".diffopt"))
      : n;
  }).filter(Boolean);
}

/* What lights up for a stop: the whole row for anything living inside one,
   and the button itself for everything else. */
function titleStop(n){
  return n.closest(".set") || n.closest(".tnav") || n;
}

function titleMark(i){
  const items = titleItems();
  if(!items.length) return;
  titleSel = (i + items.length) % items.length;
  items.forEach(function(n, k){
    const stop = titleStop(n);
    if(stop) stop.classList.toggle("sel", k === titleSel);
  });
}

function titleMove(i, quiet){
  titleMark(i);
  const n = titleItems()[titleSel];
  if(!n) return;
  try{ n.focus({ preventScroll: true }); }catch(e){ n.focus(); }
  if(!quiet) SFX.button();
}

/* Arrows only. Enter and Space belong to the focused button, and handling them
   here as well would fire every entry twice. */
function titleKey(e){
  const k = e.key;
  if(k !== "ArrowDown" && k !== "ArrowUp" && k !== "ArrowLeft" && k !== "ArrowRight") return;
  const items = titleItems();
  if(!items.length) return;
  e.preventDefault();

  const here = document.activeElement && document.activeElement.closest
    && document.activeElement.closest("#title");
  if(!here && (k === "ArrowDown" || k === "ArrowUp")){
    titleMove(k === "ArrowUp" ? items.length - 1 : 0);
    return;
  }
  if(k === "ArrowDown" || k === "ArrowUp"){
    titleMove(titleSel + (k === "ArrowDown" ? 1 : -1));
    return;
  }
  /* left and right change the setting you are standing on, the way they do on
     every console options screen */
  const cur = items[titleSel];
  if(!cur || !cur.classList.contains("diffopt")) return;
  const all = Array.prototype.slice.call(document.querySelectorAll("#title .diffopt"));
  const at = all.indexOf(cur);
  const next = all[(at + (k === "ArrowRight" ? 1 : all.length - 1)) % all.length];
  if(next && next !== cur){ next.click(); titleMove(titleSel, true); }
}

function hideTitle(){
  titleOpen = false;
  document.getElementById("title").hidden = true;
  behindTitle(false);
}

/* Everything the menu is standing in front of. One attribute takes it out of
   the tab order and out of the accessibility tree at the same time;
   aria-hidden is the fallback for a browser that has not got inert yet. */
function behindTitle(shut){
  const app = document.getElementById("app");
  if(!app) return;
  if(shut){ app.setAttribute("inert", ""); app.setAttribute("aria-hidden", "true"); }
  else { app.removeAttribute("inert"); app.removeAttribute("aria-hidden"); }
}

/* What a run is about to start holding, said in one line for the paths that
   do not go past the menu. */
function carriedNote(){
  const m = prefs.carryMemory && store.get("memory", null);
  const l = m && LENSES.find(function(x){ return x.id === m; });
  return l ? "Fresh run, carrying " + l.n + "." : "Fresh run. No Lenses.";
}

/* Has anything happened on this board that a player would miss? */
function runTouched(){
  if(!G) return false;
  const d = runDifficulty();
  /* The literal 4 outlived the four-play round: against two, and now against
     three, `G.plays < 4` is true on the opening deal, so a board nobody had
     touched still asked whether you were sure you wanted to leave it. */
  return G.round > 0 || G.total > 0
      || G.plays < PLAYS_PER_ROUND
      || G.discards < DISCARDS_PER_ROUND + d.discards;
}

/* Asked in the game's own voice, with the thing being thrown away named. */
function confirmNewRun(after){
  hideTitle();
  showPanel('<h2>Leave this run?</h2>'
    + '<div class="sub">Round ' + (G.round + 1) + ' of ' + ROUNDS
      + ' &middot; ' + G.total.toLocaleString() + ' points so far</div>'
    + '<p>Starting again deals a new board. This one does not come back.</p>'
    + (function(){
        const m = store.get("memory", null);
        const l = m && LENSES.find(function(x){ return x.id === m; });
        if(!l) return '';
        return '<div class="setrow"><div><div class="sl">'
          + (prefs.carryMemory ? 'Carrying in ' + escapeHtml(l.n)
                               : 'Starting clean')
          + '</div><div class="sd">'
          + (prefs.carryMemory
              ? 'Your Memory Lens comes with you into the new run.'
              : escapeHtml(l.n) + ' stays where it is.')
          + '</div></div>'
          + '<button class="switch" type="button" id="confirmCarry" aria-pressed="'
          + (prefs.carryMemory ? 'true' : 'false') + '">'
          + (prefs.carryMemory ? 'ON' : 'OFF') + '</button></div>';
      })()
    + '<div class="rowend">'
    +   '<button class="btn danger" id="dropRun" type="button">Start a new run</button>'
    +   '<button class="btn primary" id="keepRun" type="button">Keep playing</button>'
    + '</div>');
  const cc = document.getElementById("confirmCarry");
  if(cc) cc.onclick = function(){
    setPref("carryMemory", !prefs.carryMemory);
    SFX.button();
    confirmNewRun(after);          /* redraw so the row and the switch agree */
  };
  document.getElementById("keepRun").onclick = function(){
    hidePanel();
    if(after === "board"){ titleFromGame = false; }
    else showTitle();
  };
  document.getElementById("dropRun").onclick = function(){
    hidePanel();
    if(after === "board"){
      titleFromGame = false;
      newRun("free-" + Math.random().toString(36).slice(2,8), true);
      toast(carriedNote());
    } else startFromTitle();
  };
}

/* PLAY. A first-timer gets the tutorial on the board they are about to play. */
function startFromTitle(){
  titleFromGame = false;
  hideTitle();
  /* The click that got here IS the gesture, and the window-level hook has
     already seen it — calling firstGesture() again starts a second theme over
     the first. */
  newRun(null);
  if(!tutorialSeen()) startTutorial(false);
}

/* ---------- sound and feel ----------
   The only thing you reach for without leaving the table. Difficulty, the
   rules and your record are on the title screen, which is where somebody
   looks for them — a second copy of all of it behind a button on the board
   was two menus disagreeing about which one was the menu. */
function showMenu(back){
  /* The switch mutes, the slider sets the level, and they share a row -
     because a second row that also says "music" is a second row. */
  function row(key, label, desc, vol){
    return '<div class="setrow"><div class="sinfo"><div class="sl">' + label + '</div>'
      + '<div class="sd">' + desc + '</div>'
      + (vol ? slider(key, vol, label) : '')
      + '</div>'
      + '<button class="switch" type="button" data-pref="' + key + '" aria-pressed="'
      + (prefs[key] ? "true" : "false") + '">' + (prefs[key] ? "ON" : "OFF") + '</button></div>';
  }
  function slider(key, vol, label){
    const pc = Math.round(prefs[vol] * 100);
    return '<div class="vol' + (prefs[key] ? '' : ' off') + '">'
      + '<input type="range" min="0" max="100" step="5" value="' + pc + '"'
      +   ' data-vol="' + vol + '" aria-label="' + label + ' volume"'
      +   (prefs[key] ? '' : ' disabled') + '>'
      + '<span class="volv">' + pc + '</span></div>';
  }

  showPanel('<h2>Sound &amp; feel</h2>'
    + '<div class="sub">Saved on this device</div>'
    + row("music", "Music", "The track that loops under the game.", "musicVol")
    + row("sfx", "Sound effects", "Clicks, scoring, and the racket a big hand makes.",
        "sfxVol")
    + row("haptics", "Vibration", "A short buzz as the score lands. Android only, sorry. "
        + "Browsers on iPhone do not allow it.")
    /* Off until it is chosen. It was tied to a difficulty, which meant anybody who
       had played before met it without being told. */
    + row("blind", "Play it blind", "Hide what each word means until you have played it "
        + "once, and keep what you learn between runs. The game stops telling you which "
        + "words answer the round and starts asking whether you know.")
    + '<div class="rowend end">'
    + '<button class="btn primary" id="closeSettings" type="button">'
    +   (back === "title" ? 'Back to the menu' : 'Back to the game') + '</button></div>');

  document.getElementById("closeSettings").onclick = back === "title"
    ? function(){ showTitle(); } : hidePanel;
  Array.prototype.forEach.call(document.querySelectorAll(".switch"), function(b){
    b.onclick = function(){
      const k = b.dataset.pref, v = !prefs[k];
      setPref(k, v);
      b.setAttribute("aria-pressed", v ? "true" : "false");
      b.textContent = v ? "ON" : "OFF";
      if(k === "music"){ v ? musicStart() : musicStop(); }
      if(k === "sfx" && v) SFX.buy();
      if(k === "haptics" && v) buzz(18);
      /* the cards have to be redrawn the moment this one moves */
      if(k === "blind" && typeof G !== "undefined" && G) render();
      /* A level you cannot reach is a level that should not look reachable. */
      const vr = b.parentNode.querySelector(".vol");
      if(vr){
        vr.classList.toggle("off", !v);
        const sl = vr.querySelector("input");
        if(sl) sl.disabled = !v;
      }
      syncSoundBtn();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".vol input"), function(sl){
    const out = sl.parentNode.querySelector(".volv");
    sl.oninput = function(){
      const n = parseInt(sl.value, 10) || 0;
      out.textContent = n;
      setPref(sl.dataset.vol, n / 100);
      applyVol();
    };
    /* One sound at the level they landed on, not sixty on the way there. */
    sl.onchange = function(){
      if(sl.dataset.vol === "sfxVol" && prefs.sfx) SFX.score(0, false);
    };
  });
}
/* The old name, because the sound button used to be the only way in. */
function showSettings(){ showMenu(); }

function showHelp(back){
  /* A worked example beats a rule list, and under JOIN the example has to be
     two words: one word does nothing. EMBER and GLACIER share NATURE and
     oppose twice over - heat against cold, and wet against heat - which is the
     rare join the game pays most for, so it is the one worth drawing. */
  const pick = function(w){
    return LEXICON.find(function(e){ return e.w === w; }) || LEXICON[0];
  };
  const exA = makeCard(pick("EMBER"), false), exB = makeCard(pick("GLACIER"), false);
  const exJoin = joinOf(exA, exB, {});
  const exFig = figuresFromJoins([exJoin])[0];
  const exChips = JOIN_RESONANCE * exJoin.s + (exFig ? exFig.chips : 0)
                + exA.base + exB.base;
  const exMult = 1 + JOIN_TENSION * exJoin.t + (exFig ? exFig.mult : 0);
  const cardHTML = function(c){
    const col = TAG_COLOR[c.t[0]] || TAG_COLOR.ABS;
    return '<div class="card static"><div class="card-inner">'
      + '<div class="art' + (isLightHex(col) ? " light" : "") + '" style="background:' + col + '">'
      + '<div class="base">' + c.base + '</div>'
      + '<div class="icons">' + c.t.slice(0,3).map(function(t){
          return '<span class="ms" aria-hidden="true">' + (ICONS[t] || "blur_on") + '</span>';
        }).join("") + '</div></div>'
      + '<div class="w">' + c.w + '</div>'
      + '<div class="tags">' + c.t.map(function(t){
          return '<span class="tg">' + TAGS[t][0] + '</span>'; }).join("")
      + '</div></div></div>';
  };
  const legend = TAG_KEYS.map(function(t){
    return '<span class="leg">' + iconSpan(t) + TAGS[t][0] + '</span>';
  }).join("");

  showPanel(''
    + '<h2>How to play</h2>'
    + '<div class="sub">Five rules</div>'
    + '<div class="why">'
    +   '<p>Every word in this game comes with tags. <b>FURNACE</b> is tagged '
    +   '<b class="gold">HEAT</b>, <b class="gold">TOOL</b>, '
    +   '<b class="gold">DANGER</b>.</p>'
    +   '<p>Tags are the only thing the game looks at. It never reads the word '
    +   'itself. What you score is what the tags on one word do to the tags on '
    +   'the word beside it.</p>'
    +   '<p>The game calls them <b>overtones</b>, after the quieter notes that '
    +   'ring under a plucked guitar string. There are nineteen, and they are '
    +   'listed at the bottom of this card.</p>'
    + '</div>'
    + '<div class="teach">'
    +   '<div class="teach-row"><div class="teach-n">1</div>'
    +     '<p>Play two to five words in a row. The row is your <b>line</b>. The '
    +     'game scores each neighbouring <b>pair</b> in turn, so where you put a '
    +     'word matters as much as which word you pick.</p></div>'
    +   '<div class="teach-row"><div class="teach-n">2</div>'
    +     '<p>Two words that share a tag are <b>ALIKE</b>: <b>+' + JOIN_RESONANCE
    +     '</b> points for every tag they share. Two with opposite tags are '
    +     '<b class="gold">OPPOSITE</b>: <b>+' + JOIN_TENSION + ' to the '
    +     'multiplier</b>, which is worth a great deal more. Two with nothing in '
    +     'common are <b>NOTHING</b>, and they stop the line: every word after '
    +     'them scores zero.</p>'
    +     '<p>Once you have laid a word down, the board labels every other card '
    +     'in your hand with what it would do next to it, so you never have to '
    +     'work it out yourself.</p></div>'
    +   '<div class="teach-row"><div class="teach-n">3</div><div>'
    +     '<p>Some patterns have names, the way a flush has a name in poker: '
    +     'THE CLASH, THE TWIST, THE CHORUS, THE BUILD, THE MIRROR. Those are '
    +     '<b>hands</b>, and you are paid for every one your line makes. '
    +     '<button class="figlink" id="helpFigs" type="button">All five hands</button></p>'
    +     '</div></div>'
    +   '<div class="teach-row"><div class="teach-n">4</div>'
    /* These used to quote TARGETS raw, which is the steepest curve's numbers
       read out to a player standing on a gentler one. Scale them the same way
       the round itself does. */
    /* runDifficulty(), not difficulty(): the setting is what the NEXT run
       uses, and a player who changed it mid-run was being quoted the other
       curve's numbers for the round on their own table. */
    +     '<p>Your score is <b>points &times; multiplier</b>. Round 1 wants '
    +     Math.round(TARGETS[0] * runDifficulty().curve[0]).toLocaleString()
    +     ' points. Round ' + ROUNDS + ' wants '
    +     Math.round(TARGETS[ROUNDS-1] * runDifficulty().curve[ROUNDS-1]).toLocaleString()
    +     '. The two counters at the top of the board add your line up as you '
    +     'build it. What they cannot tell you is whether some other five words '
    +     'would have paid more, and that is the game.</p></div>'
    +   '<div class="teach-row"><div class="teach-n">5</div>'
    +     '<p>A tag you just scored goes <b>dull</b> for ' + FATIGUE_SPAN + ' plays '
    +     'and pays nothing until it recovers. Clear a round and the Bookseller '
    +     'offers you back a line you played, for nothing: keep it and it pays '
    +     '<b>+' + KEPT_CHIPS + ' points</b> and <b>+' + KEPT_MULT + ' multiplier</b> '
    +     'every time you make that hand again. The hand, not those exact words. '
    +     'You can hold ' + KEEP_SLOTS + ' kept lines and ' + LENS_SLOTS + ' Lenses, '
    +     'on separate shelves.</p></div>'
    + '</div>'

    + '<p>' + (function(){
        /* Count them rather than spell them out. This paragraph has said "round
           8" and "rounds 4, 6 and 8" through two different round counts, and
           both times it was the copy that went stale rather than the rule. */
        const at = ordealRoundsFor(runDifficulty().id);
        const WORDS = ["no", "One", "Two", "Three", "Four", "Five", "Six"];
        return at.length === 1
          ? '<b>The last round is an Ordeal.</b> Round ' + ROUNDS + ' changes a rule '
            + 'instead of raising the number.'
          : '<b>' + (WORDS[at.length] || at.length) + ' rounds are Ordeals.</b> Rounds '
            + at.map(function(r){ return r + 1; }).join(", ").replace(/, ([^,]*)$/, " and $1")
            + ' change a rule instead of raising the number.';
      })()
    + ' The Bookseller tells you which one is coming before you spend.</p>'

    + '<div class="worked join">'
    +   cardHTML(exA) + cardHTML(exB)
    +   '<div class="worked-sum">'
    +     '<b>' + exA.w + '</b> and <b>' + exB.w + '</b> both carry <b>NATURE</b>, '
    +     'and they clash twice over: hot against cold, and wet against hot. '
    +     'Alike and opposite at the same time is <b class="gold">'
    +     (exFig ? exFig.n : "a hand") + '</b>, the rarest thing two words can do.'
    +     '<span class="worked-tot">' + exChips.toLocaleString() + ' \u00d7 '
    +     exMult + ' = ' + (exChips * exMult).toLocaleString() + ' points</span>'
    +   '</div>'
    + '</div>'

    + '<div class="sub" style="margin:0 0 7px">The nineteen overtones</div>'
    + '<div class="legend">' + legend + '</div>'
    + '<p style="font-size:13px"><span class="kbd">1</span> to <span class="kbd">7</span> pick &middot; '
    + '<span class="kbd">Enter</span> play &middot; <span class="kbd">D</span> discard &middot; '
    + '<span class="kbd">Space</span> hurry the scoring &middot; <span class="kbd">Esc</span> close</p>'
    + '<div class="rowend' + (back === "title" ? ' end' : '') + '">'
    + (back === "title"
        ? '<button class="btn primary" id="helpBack" type="button">Back to the menu</button>'
        : '<button class="btn" id="replayTut" type="button">Run the tutorial</button>'
          + '<button class="btn primary" id="closeHelp" type="button">Play</button>')
    + '</div>');
  const ch = document.getElementById("closeHelp");
  if(ch) ch.onclick = hidePanel;
  document.getElementById("helpFigs").onclick = function(){ showFigures("help"); };
  const rt = document.getElementById("replayTut");
  if(rt) rt.onclick = function(){ hidePanel(); startTutorial(true); };
  const hb = document.getElementById("helpBack");
  if(hb) hb.onclick = function(){ showTitle(); };
}

/* ---------- input ---------- */
document.getElementById("playBtn").onclick = play;
document.getElementById("discardBtn").onclick = discardSel;
document.getElementById("interpBtn").onclick = openInterpreter;
document.getElementById("helpBtn").onclick = function(){ showHelp(); };
document.getElementById("menuBtn").onclick = function(){ showMenu(); };
document.getElementById("homeBtn").onclick = function(){
  /* the spotlight has no board to point at once the menu is over it, and the
     hand it rearranged has to go back the way it was */
  if(tutActive()) endTutorial(false);
  titleFromGame = true;
  titleSel = 0;
  showTitle();
};
document.getElementById("newRunBtn").onclick = function(){
  hidePanel();
  if(runTouched()){ confirmNewRun("board"); return; }
  newRun("free-" + Math.random().toString(36).slice(2,8), true);
  toast(carriedNote());
};
document.getElementById("tutNext").onclick = tutAdvance;
document.getElementById("tutSkip").onclick = function(){ endTutorial(false); };
document.getElementById("stage").onclick = function(){ if(G && G.animating) skipAnim = true; };

/* Re-lay the hand when the screen changes shape (rotation, resize). */
let resizeT = null;
window.addEventListener("resize", function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){
    if(G && !G.animating) renderHand();
    if(tutActive()) renderTut();
  }, 160);
});

/* A quarter of a second of lag is a whole gesture on a phone, so scrolling
   moves the spotlight now rather than on the next tick. */
window.addEventListener("scroll", function(){
  if(tutActive()) pointTut();
}, { passive: true });

document.addEventListener("keydown", function(e){
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(e.key === "Escape"){ if(tutActive()) endTutorial(false); hidePanel(); return; }
  if(!document.getElementById("veil").hidden) return;
  if(titleOpen){ titleKey(e); return; }
  if(e.key === " "){ if(G && G.animating){ e.preventDefault(); skipAnim = true; } return; }
  if(G && G.animating) return;
  if(e.key >= "1" && e.key <= "7"){
    const c = G.hand[parseInt(e.key,10) - 1];
    if(c) toggleSel(c.id);
  } else if(e.key === "Enter"){ play(); }
  else if(e.key === "d" || e.key === "D"){ discardSel(); }
});

/* ---------- boot ---------- */
function start(restored){
  initIcons();
  syncSoundBtn();
  /* The board is dealt behind the menu so PLAY is instant and the title has a
     real run to show the daily for, but nothing is shown until they press it. */
  newRun(null);
  titleSel = 0;
  showTitle();
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(start) : start({});
  } else { start({}); }
}catch(e){ start({}); }
</script>
