<title>Overtone</title>
<meta name="description" content="A word roguelite where meaning is the physics. Play words into an escalating scoring engine and warp the rules with Lenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Azeret+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,900&display=swap">
<style>
/* ============================================================
   OVERTONE — a lexicographer's desk at night.
   Single committed theme; every colour painted explicitly so the
   page holds on any host ground.
   ============================================================ */
:root{
  color-scheme: dark;

  --table:      #151A21;   /* deep blue-biased slate, never pure black */
  --table-deep: #0F131A;
  --raised:     #1E252F;
  --raised-2:   #262F3B;
  --hairline:   #333E4C;

  --paper:      #EDE3CC;   /* card face: warm ivory, reads as paper */
  --paper-edge: #C9BC9E;
  --paper-ink:  #23201A;
  --paper-dim:  #6C6555;

  --text:       #E6E9EE;
  --text-dim:   #98A3B2;
  --text-faint: #66717F;

  --accent:     #E9A33C;   /* sodium lamp */
  --accent-deep:#B97A20;
  --mult:       #CF4B3E;   /* multiplier red */
  --chips:      #58A6C4;   /* chip blue */
  --good:       #7FB069;
  --bad:        #C2544A;

  /* semantic tag families — information design, not accent */
  --t-life:     #7FB069;
  --t-body:     #C98A9B;
  --t-made:     #9A8FC4;
  --t-force:    #D9793F;
  --t-cold:     #6FAFC9;
  --t-abstract: #A9A2B8;

  --r-card: 9px;
  --shadow-card: 0 2px 0 var(--paper-edge), 0 6px 14px rgba(0,0,0,.45);

  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--table);
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(233,163,60,.10), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(0,0,0,.5), transparent 70%);
  color: var(--text);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button{ font-family: inherit; color: inherit; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
#app{
  max-width: 1080px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead{
  display:flex; align-items:baseline; justify-content:space-between;
  gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--hairline);
  padding-bottom: 8px;
}
.wordmark{
  font-family: var(--f-display);
  font-weight: 900;
  font-size: 26px;
  letter-spacing: .12em;
  margin: 0;
  color: var(--paper);
}
.wordmark span{ color: var(--accent); }
.masthead-meta{
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--text-faint);
  display:flex; gap:14px; flex-wrap: wrap; align-items:center;
}
.linkbtn{
  background:none; border:none; padding:0; cursor:pointer;
  font-family: var(--f-mono); font-size:11px; letter-spacing:.08em;
  color: var(--text-dim); text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn:hover{ color: var(--accent); }

/* ---------- demand banner ---------- */
.demand{
  display:grid;
  grid-template-columns: 1fr auto;
  gap: 10px 18px;
  align-items:center;
  background: linear-gradient(180deg, var(--raised) 0%, var(--table-deep) 100%);
  border: 1px solid var(--hairline);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 12px 16px;
}
.demand-label{
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .18em;
  color: var(--accent-deep); text-transform: uppercase;
}
.demand-name{
  font-family: var(--f-display); font-weight: 900; font-size: 22px;
  letter-spacing: .03em; margin: 2px 0 6px; color: var(--paper);
  text-wrap: balance;
}
.demand-wants{ display:flex; gap:6px; flex-wrap: wrap; align-items:center; }
.demand-wants .w{
  font-family: var(--f-mono); font-size: 10px; letter-spacing:.12em;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(233,163,60,.14);
  border: 1px solid rgba(233,163,60,.45);
  color: var(--accent);
}
.target{ text-align: right; }
.target .k{
  font-family: var(--f-mono); font-size: 10px; letter-spacing:.14em;
  color: var(--text-faint); text-transform: uppercase;
}
.target .v{
  font-family: var(--f-mono); font-weight: 700; font-size: 22px;
  font-variant-numeric: tabular-nums; color: var(--paper);
}
.progress{
  grid-column: 1 / -1;
  height: 5px; border-radius: 3px;
  background: var(--table-deep);
  border: 1px solid var(--hairline);
  overflow: hidden;
}
.progress > i{
  display:block; height:100%; width:0%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent));
  transition: width .45s cubic-bezier(.2,.8,.3,1);
}
.progress.met > i{ background: linear-gradient(90deg, #5c8f4a, var(--good)); }

/* ---------- lens rail ---------- */
.rail{
  display:flex; gap:8px; align-items:stretch; flex-wrap: wrap; min-height: 56px;
}
.lens{
  position: relative;
  background: var(--raised);
  border: 1px solid var(--hairline);
  border-top: 2px solid var(--t-made);
  border-radius: 4px;
  padding: 6px 10px;
  min-width: 104px; max-width: 160px;
  cursor: help;
}
.lens .n{
  font-family: var(--f-mono); font-weight:700; font-size: 10px;
  letter-spacing: .08em; color: var(--paper);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lens .d{ font-size: 10.5px; line-height:1.3; color: var(--text-dim); margin-top:3px; }
.lens.fired{ animation: lensFire .45s ease-out; border-top-color: var(--accent); }
@keyframes lensFire{
  0%{ transform: translateY(0) scale(1); box-shadow: 0 0 0 0 rgba(233,163,60,.6); }
  35%{ transform: translateY(-5px) scale(1.05); box-shadow: 0 0 0 5px rgba(233,163,60,0); }
  100%{ transform: translateY(0) scale(1); }
}
.rail-empty{
  font-family: var(--f-mono); font-size: 11px; color: var(--text-faint);
  letter-spacing:.06em; align-self:center; padding: 4px 2px;
}

/* ---------- stage ---------- */
.stage{
  flex: 1;
  position: relative;
  min-height: 210px;
  border: 1px dashed var(--hairline);
  border-radius: 6px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    var(--table-deep);
  display:flex; flex-direction: column; align-items:center; justify-content:center;
  gap: 14px; padding: 14px;
  overflow: hidden;
}
.stage-cards{ display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap: wrap; }
.tally{
  display:flex; align-items:center; gap: 10px;
  font-family: var(--f-mono); font-weight:700;
  font-variant-numeric: tabular-nums;
}
.tally .chips, .tally .multv{
  padding: 6px 16px; border-radius: 4px; font-size: 26px; min-width: 92px; text-align:center;
}
.tally .chips{ background: rgba(88,166,196,.15); border:1px solid rgba(88,166,196,.5); color:#9AD3E8; }
.tally .multv{ background: rgba(207,75,62,.15); border:1px solid rgba(207,75,62,.5); color:#F0857A; }
.tally .x{ color: var(--text-faint); font-size: 18px; }
.tally.pulse .chips{ animation: pop .22s ease-out; }
.tally.pulsem .multv{ animation: pop .22s ease-out; }
@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
.stage-hint{
  font-family: var(--f-mono); font-size: 11px; letter-spacing:.1em;
  color: var(--text-faint); text-align:center; max-width: 46ch;
}
.stage-total{
  font-family: var(--f-display); font-weight:900; font-size: 44px;
  color: var(--accent); font-variant-numeric: tabular-nums;
  animation: slam .34s cubic-bezier(.2,1.4,.4,1);
}
@keyframes slam{ 0%{transform:scale(2.2); opacity:0} 60%{transform:scale(.94); opacity:1} 100%{transform:scale(1)} }
.shake{ animation: shake .3s ease-in-out; }
@keyframes shake{
  0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,2px)}
  40%{transform:translate(5px,-2px)} 60%{transform:translate(-3px,-1px)} 80%{transform:translate(3px,1px)}
}

/* ---------- cards ---------- */
.card{
  position: relative;
  width: 104px; min-height: 132px;
  background: linear-gradient(175deg, var(--paper) 0%, #E2D6BB 100%);
  color: var(--paper-ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
  padding: 8px 8px 7px;
  display:flex; flex-direction: column; justify-content: space-between;
  cursor: pointer;
  user-select: none;
  transition: transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s ease;
  border: 1px solid rgba(0,0,0,.18);
}
.card:hover{ transform: translateY(-7px); }
.card.sel{
  transform: translateY(-16px);
  box-shadow: 0 2px 0 var(--paper-edge), 0 0 0 2px var(--accent), 0 12px 22px rgba(0,0,0,.55);
}
.card.static{ cursor: default; }
.card.static:hover{ transform: none; }
.card .w{
  font-family: var(--f-ui); font-weight: 800; font-size: 15px;
  letter-spacing: -.01em; line-height: 1.06; text-transform: uppercase;
  word-break: break-word; hyphens: auto;
}
.card .base{
  position:absolute; top:6px; right:8px;
  font-family: var(--f-mono); font-weight:700; font-size: 10px;
  color: var(--paper-dim); font-variant-numeric: tabular-nums;
}
.card .tags{ display:flex; flex-wrap: wrap; gap: 3px; }
.card .tg{
  font-family: var(--f-mono); font-size: 8.5px; font-weight:500;
  letter-spacing: .04em; padding: 1.5px 4px; border-radius: 3px;
  background: rgba(0,0,0,.07); color: var(--paper-dim);
  border: 1px solid rgba(0,0,0,.1);
}
.card .tg.match{
  background: var(--accent); color: #241905; border-color: rgba(0,0,0,.3); font-weight:700;
}
.card.interpreted{ border: 1px solid var(--accent-deep); }
.card.interpreted::after{
  content: "◆"; position:absolute; top:5px; left:7px;
  font-size: 8px; color: var(--accent-deep);
}
.card.scoring{ animation: scorePop .32s ease-out; }
@keyframes scorePop{ 0%{transform:translateY(0)} 40%{transform:translateY(-18px) rotate(-1.5deg)} 100%{transform:translateY(0)} }
.card.spent{ opacity:.42; filter: saturate(.5); }

.float{
  position:absolute; left:50%; top:-6px; transform: translateX(-50%);
  font-family: var(--f-mono); font-weight:700; font-size: 13px;
  white-space: nowrap; pointer-events: none;
  padding: 2px 7px; border-radius: 4px;
  animation: floatUp .85s ease-out forwards;
  z-index: 6;
}
.float.c{ background:#1B3D4A; color:#9AD3E8; border:1px solid rgba(88,166,196,.6); }
.float.m{ background:#4A1F1B; color:#F0857A; border:1px solid rgba(207,75,62,.6); }
.float.r{ background:#4A3510; color:var(--accent); border:1px solid rgba(233,163,60,.6); }
@keyframes floatUp{
  0%{ opacity:0; transform: translate(-50%, 4px) scale(.8); }
  18%{ opacity:1; transform: translate(-50%, -14px) scale(1.06); }
  75%{ opacity:1; transform: translate(-50%, -30px) scale(1); }
  100%{ opacity:0; transform: translate(-50%, -46px) scale(.95); }
}

/* ---------- hand + controls ---------- */
.handwrap{ display:flex; flex-direction: column; gap: 10px; }
.hand{ display:flex; gap: 9px; justify-content:center; flex-wrap: wrap; min-height: 148px; align-items:flex-end; }
.controls{
  display:flex; gap: 10px; align-items:center; justify-content:center; flex-wrap: wrap;
}
.btn{
  font-family: var(--f-mono); font-weight:700; font-size: 12px;
  letter-spacing: .12em; text-transform: uppercase;
  padding: 11px 20px; border-radius: 4px; cursor: pointer;
  background: var(--raised-2); color: var(--text);
  border: 1px solid var(--hairline);
  transition: transform .1s ease, background .15s ease, border-color .15s ease;
}
.btn:hover:not(:disabled){ background: #2F3A48; transform: translateY(-1px); }
.btn:active:not(:disabled){ transform: translateY(1px); }
.btn:disabled{ opacity:.34; cursor: not-allowed; }
.btn.primary{
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
  color:#241905; border-color: #7E5313;
}
.btn.primary:hover:not(:disabled){ background: linear-gradient(180deg, #F4B455 0%, #C98826 100%); }
.btn.ghost{ background: transparent; }
.btn.interp{ border-color: var(--accent-deep); color: var(--accent); }

.counters{
  display:flex; gap: 8px; align-items:center;
  font-family: var(--f-mono); font-size: 11px; letter-spacing:.08em; color: var(--text-dim);
}
.counters b{ color: var(--paper); font-weight:700; }
.pip{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background: var(--accent); margin-right:3px;
}
.pip.off{ background: var(--hairline); }

/* ---------- overlays ---------- */
.veil{
  position: fixed; inset:0; z-index: 40;
  background: rgba(10,13,18,.86);
  backdrop-filter: blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding: 20px;
  overflow-y: auto;
}
.veil[hidden]{ display:none !important; }
.panel{
  background: var(--raised);
  border: 1px solid var(--hairline);
  border-top: 3px solid var(--accent);
  border-radius: 6px;
  padding: 22px;
  max-width: 620px; width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}
.panel h2{
  font-family: var(--f-display); font-weight:900; font-size: 26px;
  margin: 0 0 4px; letter-spacing:.02em; color: var(--paper); text-wrap: balance;
}
.panel .sub{
  font-family: var(--f-mono); font-size: 11px; letter-spacing:.1em;
  color: var(--text-faint); text-transform: uppercase; margin-bottom: 16px;
}
.panel p{ color: var(--text-dim); margin: 0 0 12px; max-width: 62ch; }
.panel p b, .panel li b{ color: var(--paper); font-weight: 600; }

.offers{ display:grid; grid-template-columns: repeat(auto-fit, minmax(168px,1fr)); gap: 10px; margin: 14px 0; }
.offer{
  background: var(--table-deep); border:1px solid var(--hairline);
  border-top: 2px solid var(--t-made);
  border-radius: 5px; padding: 12px; display:flex; flex-direction:column; gap:7px;
  text-align:left; cursor:pointer;
  transition: border-color .15s ease, transform .1s ease;
}
.offer:hover:not(:disabled){ border-color: var(--accent); transform: translateY(-2px); }
.offer:disabled{ opacity:.4; cursor:not-allowed; }
.offer .on{ font-family: var(--f-mono); font-weight:700; font-size: 11px; letter-spacing:.08em; color: var(--paper); }
.offer .od{ font-size: 11.5px; color: var(--text-dim); line-height:1.35; flex:1; }
.offer .oc{ font-family: var(--f-mono); font-weight:700; font-size: 11px; color: var(--accent); }

.rowend{ display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap: wrap; margin-top: 8px; }

.share{
  font-family: var(--f-mono); font-size: 11.5px; line-height: 1.6;
  background: var(--table-deep); border:1px solid var(--hairline);
  border-radius: 5px; padding: 12px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; margin: 12px 0;
}
.stat-row{ display:grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin: 14px 0; }
.stat{ background: var(--table-deep); border:1px solid var(--hairline); border-radius:5px; padding:10px 12px; }
.stat .k{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; }
.stat .v{ font-family:var(--f-mono); font-weight:700; font-size:19px; color:var(--paper); font-variant-numeric:tabular-nums; }

.unlock{
  border:1px solid var(--accent-deep); background: rgba(233,163,60,.09);
  border-radius:5px; padding: 12px 14px; margin: 14px 0;
}
.unlock .k{ font-family:var(--f-mono); font-size:10px; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; }
.unlock .v{ font-family:var(--f-mono); font-weight:700; font-size:14px; color:var(--paper); margin-top:4px; }
.unlock .d{ font-size:12px; color:var(--text-dim); margin-top:3px; }

#interpInput{
  width:100%; padding: 13px 14px; font-family: var(--f-ui); font-weight:800;
  font-size: 20px; letter-spacing:.02em; text-transform: uppercase;
  background: var(--paper); color: var(--paper-ink);
  border: 1px solid var(--paper-edge); border-radius: 5px;
}
#interpInput::placeholder{ color: var(--paper-dim); font-weight:600; text-transform:none; letter-spacing:0; }
.appraisal{ display:flex; gap:14px; align-items:center; margin: 14px 0; min-height: 140px; }
.appraisal .say{ font-size: 12.5px; color: var(--text-dim); line-height:1.5; }
.appraisal .say .src{
  display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.12em;
  color: var(--text-faint); text-transform: uppercase; margin-top:8px;
}
.helplist{ margin:0 0 14px; padding-left: 18px; color: var(--text-dim); }
.helplist li{ margin-bottom: 7px; }
.kbd{
  font-family: var(--f-mono); font-size: 10px; padding: 1px 5px;
  border:1px solid var(--hairline); border-bottom-width:2px; border-radius:3px;
  background: var(--table-deep); color: var(--text);
}
.toast{
  position: fixed; left:50%; bottom: 22px; transform: translateX(-50%);
  background: var(--raised-2); border:1px solid var(--accent-deep);
  color: var(--paper); font-family: var(--f-mono); font-size: 11.5px;
  letter-spacing:.06em; padding: 9px 16px; border-radius: 4px; z-index: 60;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.toast[hidden]{ display:none !important; }

@media (max-width: 640px){
  .card{ width: 84px; min-height: 112px; padding: 6px; }
  .card .w{ font-size: 12.5px; }
  .card .tg{ font-size: 7.5px; }
  .tally .chips, .tally .multv{ font-size: 20px; min-width: 72px; padding: 5px 10px; }
  .demand{ grid-template-columns: 1fr; }
  .target{ text-align: left; }
  .wordmark{ font-size: 21px; }
  .stage-total{ font-size: 34px; }
  .hand{ min-height: 120px; gap: 6px; }
  .lens{ min-width: 88px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<div id="app">

  <header class="masthead">
    <h1 class="wordmark">OVER<span>TONE</span></h1>
    <div class="masthead-meta">
      <span id="seedLabel">—</span>
      <span id="bankLabel">◇ 0</span>
      <button class="linkbtn" id="helpBtn" type="button">how to play</button>
      <button class="linkbtn" id="newRunBtn" type="button">new run</button>
    </div>
  </header>

  <section class="demand" id="demandBox">
    <div>
      <div class="demand-label" id="roundLabel">Round 1 of 8</div>
      <div class="demand-name" id="demandName">—</div>
      <div class="demand-wants" id="demandWants"></div>
    </div>
    <div class="target">
      <div class="k">Score / Target</div>
      <div class="v"><span id="roundScore">0</span> <span style="color:var(--text-faint)">/</span> <span id="roundTarget">0</span></div>
    </div>
    <div class="progress" id="progress"><i></i></div>
  </section>

  <div class="rail" id="rail"></div>

  <section class="stage" id="stage">
    <div class="stage-cards" id="stageCards"></div>
    <div class="tally" id="tally" hidden>
      <div class="chips" id="chipsV">0</div>
      <div class="x">×</div>
      <div class="multv" id="multV">1</div>
    </div>
    <div class="stage-hint" id="stageHint">Pick up to three words that resonate with the Demand.</div>
  </section>

  <div class="handwrap">
    <div class="hand" id="hand"></div>
    <div class="controls">
      <div class="counters">
        <span>Plays <b id="playsLeft">4</b></span>
        <span id="playPips"></span>
      </div>
      <button class="btn primary" id="playBtn" type="button" disabled>Play</button>
      <button class="btn" id="discardBtn" type="button" disabled>Discard</button>
      <button class="btn interp" id="interpBtn" type="button">◆ Interpret</button>
      <div class="counters">
        <span>Discards <b id="discardsLeft">3</b></span>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="veil" hidden>
  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   OVERTONE
   A word roguelite where meaning is the physics.

   The lexicon below is the game's physics engine: every word carries
   semantic tags, and every scoring rule reads those tags. The corpus and
   its ontology were authored with Claude at build time, which is why the
   game runs at 0ms with no network and still knows that an AVALANCHE is
   cold, moving, loud and dangerous all at once.
   ============================================================ */

/* Tuned against a simulation of a lens-less greedy player (see README).
   Rounds 1-2 are generous so the first session always lands some wins;
   round 3 is the first real decision; the late curve outruns any deck
   that isn't multiplying, which is what makes the Lens engine the game. */
const TARGETS = [200, 340, 520, 800, 1250, 2000, 3300, 5200];
const ROUNDS = TARGETS.length;
const HAND_SIZE = 7, MAX_PLAY = 3, LENS_SLOTS = 5;

/* ---------- deterministic RNG (mulberry32) ---------- */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = mulberry32(1);
function ri(n){ return Math.floor(rng()*n); }
function pick(arr){ return arr[ri(arr.length)]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=ri(i+1); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }

/* ---------- storage (may be blocked; never let it break the game) ---------- */
const store = {
  get:function(k,d){ try{ const v=localStorage.getItem("overtone:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("overtone:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- audio: synthesised, no asset files ---------- */
let actx = null;
function tone(freq, dur, type, gain){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.09, actx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.14));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur||0.14) + 0.02);
  }catch(e){}
}

/* ---------- game state ---------- */
let G = null;

function makeCard(entry, interpreted){
  return {
    id: Math.random().toString(36).slice(2,9),
    w: entry.w,
    t: entry.t.slice(),
    base: 5 + 3*entry.w.length,
    interpreted: !!interpreted
  };
}

function newRun(seedStr){
  const daily = todayKey();
  const seed = seedStr || daily;
  rng = mulberry32(hashStr(seed));

  const demandOrder = shuffle(DEMANDS.slice()).slice(0, ROUNDS);

  /* Build the deck knowing what this run will ask for. Some overtones are
     genuinely rare in the lexicon (FOOD sits on 21 of 249 words), so a purely
     random 26-card deck can hand you a Demand you cannot possibly meet. Seed
     a floor of 3 words per demanded overtone first, then fill at random. */
  const wanted = [];
  demandOrder.forEach(function(d){
    d.tags.forEach(function(t){ if(wanted.indexOf(t)===-1) wanted.push(t); });
  });
  const DECK_SIZE = 26, FLOOR = 3;
  const bag = shuffle(LEXICON.slice());
  const chosen = [], taken = {};
  function carrying(t){
    return chosen.filter(function(e){ return e.t.indexOf(t)>=0; }).length;
  }
  /* Words average 3.2 overtones, so one pick often satisfies several demands —
     recount each time instead of blindly adding FLOOR words per overtone. */
  shuffle(wanted).forEach(function(t){
    for(let i=0; i<bag.length && carrying(t)<FLOOR && chosen.length<DECK_SIZE; i++){
      if(taken[bag[i].w] || bag[i].t.indexOf(t)===-1) continue;
      taken[bag[i].w] = 1; chosen.push(bag[i]);
    }
  });
  for(let i=0; i<bag.length && chosen.length<DECK_SIZE; i++){
    if(taken[bag[i].w]) continue;
    taken[bag[i].w] = 1; chosen.push(bag[i]);
  }
  const deck = chosen.map(function(e){ return makeCard(e,false); });

  G = {
    seed: seed,
    isDaily: seed === daily,
    round: 0,
    deck: shuffle(deck),
    discard: [],
    hand: [],
    lenses: [],
    bank: 4,
    selected: [],
    plays: 4, discards: 3,
    roundScore: 0,
    total: 0,
    demandOrder: demandOrder,
    best: { word:"", mult:0, score:0 },
    interpreterUsed: false,
    interpretedWord: null,
    animating: false,
    over: false,
    offers: null,
    shopSeen: []
  };

  /* Memory: a lens carried in from a previous run. The visible reason run 2
     is not run 1. */
  const memory = store.get("memory", null);
  if(memory){
    const l = LENSES.find(function(x){ return x.id===memory; });
    if(l) G.lenses.push(l);
  }

  startRound();
}

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function startRound(){
  G.demand = { n: G.demandOrder[G.round].n, tags: G.demandOrder[G.round].tags.slice() };
  G.target = TARGETS[G.round];
  G.roundScore = 0;
  G.plays = 4; G.discards = 3;
  G.selected = [];
  G.discard = G.discard.concat(G.hand);
  G.hand = [];
  draw(HAND_SIZE);
  render();
}

function draw(n){
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      if(G.discard.length===0) break;
      G.deck = shuffle(G.discard); G.discard = [];
    }
    G.hand.push(G.deck.pop());
  }
}

/* ---------- scoring engine ---------- */
function resolve(cards){
  const events = [];
  let chips = 0, mult = 1;
  const ctx = { demand: G.demand, discards: G.discards, resoUsed: false };

  for(let i=0;i<cards.length;i++){
    const c = cards[i];
    chips += c.base;
    events.push({ k:"card", i:i, cls:"c", txt:"+"+c.base, chips:chips, mult:mult });

    const hits = c.t.filter(function(t){ return G.demand.tags.includes(t); });
    for(let h=0;h<hits.length;h++){
      chips += 25;
      events.push({ k:"card", i:i, cls:"r", txt:"RESONANCE +25", chips:chips, mult:mult });
    }

    for(let li=0; li<G.lenses.length; li++){
      const L = G.lenses[li];
      if(!L.onCard) continue;
      const r = L.onCard(c, i, cards, ctx);
      if(!r) continue;
      const parts = [];
      if(r.chips){ chips += r.chips; parts.push((r.chips>0?"+":"")+r.chips); }
      if(r.mult){ mult += r.mult; parts.push("+"+r.mult+" mult"); }
      if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
      events.push({ k:"lens", i:i, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                    txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
    }
  }

  for(let li=0; li<G.lenses.length; li++){
    const L = G.lenses[li];
    if(!L.onPlay) continue;
    const r = L.onPlay(cards, ctx);
    if(!r) continue;
    const parts = [];
    if(r.chips){ chips += r.chips; parts.push("+"+r.chips); }
    if(r.mult){ mult += r.mult; parts.push("+"+r.mult+" mult"); }
    if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
    events.push({ k:"lens", i:-1, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                  txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
  }

  chips = Math.max(0, Math.round(chips));
  mult = Math.max(0.1, mult);
  return { events: events, chips: chips, mult: mult, total: Math.round(chips*mult) };
}

/* ---------- play ---------- */
let skipAnim = false;
function sleep(ms){ return new Promise(function(r){ if(skipAnim) r(); else setTimeout(r, ms); }); }

async function play(){
  if(G.animating || G.selected.length===0 || G.plays<=0) return;
  G.animating = true; skipAnim = false;
  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);

  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.plays--;
  renderHand(); renderControls();

  const stageCards = document.getElementById("stageCards");
  stageCards.innerHTML = "";
  cards.forEach(function(c){ stageCards.appendChild(cardEl(c, true)); });
  document.getElementById("stageHint").textContent = "";
  const tally = document.getElementById("tally");
  tally.hidden = false;
  setTally(0, 1);

  const gap = res.events.length > 12 ? 130 : 210;
  for(let e=0; e<res.events.length; e++){
    const ev = res.events[e];
    const host = ev.i >= 0 ? stageCards.children[ev.i] : stageCards;
    if(ev.i >= 0 && host){
      host.classList.add("scoring");
      setTimeout(function(){ host.classList.remove("scoring"); }, 320);
    }
    floatLabel(host || stageCards, ev.txt, ev.cls);
    if(ev.k === "lens") flashLens(ev.lens);
    setTally(ev.chips, ev.mult);
    tone(300 + Math.min(e,18)*42, 0.1, ev.cls==="m" ? "sawtooth" : "triangle", 0.06);
    await sleep(gap);
  }

  await sleep(240);
  G.roundScore += res.total;
  G.total += res.total;
  if(res.mult > G.best.mult || (res.mult === G.best.mult && res.total > G.best.score)){
    G.best = { word: cards.map(function(c){return c.w;}).join(" · "), mult: Math.round(res.mult*10)/10, score: res.total };
  }

  const totalEl = document.createElement("div");
  totalEl.className = "stage-total";
  totalEl.textContent = "+" + res.total.toLocaleString();
  stageCards.parentNode.insertBefore(totalEl, document.getElementById("stageHint"));
  tone(660, .18, "triangle", .1); setTimeout(function(){ tone(880,.3,"triangle",.09); }, 90);
  if(res.total >= G.target * 0.5) document.getElementById("stage").classList.add("shake");
  setTimeout(function(){ document.getElementById("stage").classList.remove("shake"); }, 320);

  renderDemand();
  await sleep(760);
  try{ totalEl.remove(); }catch(err){}
  tally.hidden = true;

  G.discard = G.discard.concat(cards);
  G.animating = false;

  if(G.roundScore >= G.target){ winRound(); return; }
  if(G.plays <= 0){ endRun(false); return; }

  draw(HAND_SIZE - G.hand.length);
  document.getElementById("stageHint").textContent = "Pick up to three words that resonate with the Demand.";
  render();
}

function setTally(c, m){
  const ce = document.getElementById("chipsV"), me = document.getElementById("multV"), t = document.getElementById("tally");
  const mRounded = Math.round(m*10)/10;
  if(ce.textContent !== String(c)){ t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse"); }
  if(me.textContent !== String(mRounded)){ t.classList.remove("pulsem"); void t.offsetWidth; t.classList.add("pulsem"); }
  ce.textContent = c;
  me.textContent = mRounded;
}
function floatLabel(host, txt, cls){
  if(!host) return;
  const f = document.createElement("div");
  f.className = "float " + cls;
  f.textContent = txt;
  if(getComputedStyle(host).position === "static") host.style.position = "relative";
  host.appendChild(f);
  setTimeout(function(){ try{ f.remove(); }catch(e){} }, 900);
}
function flashLens(i){
  const el = document.getElementById("rail").children[i];
  if(!el) return;
  el.classList.remove("fired"); void el.offsetWidth; el.classList.add("fired");
}

function discardSel(){
  if(G.animating || G.selected.length===0 || G.discards<=0) return;
  const cards = G.hand.filter(function(c){ return G.selected.indexOf(c.id)>=0; });
  G.discard = G.discard.concat(cards);
  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.discards--;
  draw(HAND_SIZE - G.hand.length);
  tone(220, .09, "square", .05);
  render();
}

/* ---------- round win + shop ---------- */
function winRound(){
  const reward = 4 + G.plays + G.discards;
  G.bank += reward;
  G.round++;
  if(G.round >= ROUNDS){ endRun(true); return; }
  openShop(reward);
}

function rollOffers(){
  const owned = G.lenses.map(function(l){ return l.id; });
  const avail = LENSES.filter(function(l){ return owned.indexOf(l.id)===-1; });
  shuffle(avail);
  const offers = avail.slice(0,2).map(function(l){ return { kind:"lens", lens:l, cost:l.cost }; });
  offers.push({ kind:"words", cost:3 });
  return offers;
}

function openShop(reward){
  if(!G.offers) G.offers = rollOffers();
  const nextDemand = G.demandOrder[G.round];
  const html = ''
    + '<h2>The Bookseller</h2>'
    + '<div class="sub">Round ' + G.round + ' cleared · earned ◇' + reward + '</div>'
    + '<p>Next Demand is <b>' + nextDemand.n + '</b>, which wants '
    + nextDemand.tags.map(function(t){ return '<b>'+TAGS[t][0]+'</b>'; }).join(" and ")
    + '. Target <b>' + TARGETS[G.round].toLocaleString() + '</b>.</p>'
    + '<div class="offers" id="offers"></div>'
    + '<div class="rowend">'
    + '<button class="btn ghost" id="rerollBtn" type="button">Reroll ◇1</button>'
    + '<div style="font-family:var(--f-mono);font-size:12px;color:var(--accent)">Purse ◇' + G.bank + '</div>'
    + '<button class="btn primary" id="leaveShop" type="button">To the desk →</button>'
    + '</div>';
  showPanel(html);

  const box = document.getElementById("offers");
  G.offers.forEach(function(o, idx){
    const b = document.createElement("button");
    b.className = "offer"; b.type = "button";
    b.disabled = o.bought || G.bank < o.cost || (o.kind==="lens" && G.lenses.length>=LENS_SLOTS);
    if(o.kind === "lens"){
      b.innerHTML = '<div class="on">' + o.lens.n + '</div><div class="od">' + o.lens.d + '</div>'
                  + '<div class="oc">' + (o.bought ? "acquired" : "◇" + o.cost) + '</div>';
    } else {
      b.innerHTML = '<div class="on">TWO NEW WORDS</div><div class="od">Add two fresh words from the lexicon to your deck, permanently.</div>'
                  + '<div class="oc">' + (o.bought ? "acquired" : "◇" + o.cost) + '</div>';
    }
    b.onclick = function(){ buy(idx, reward); };
    box.appendChild(b);
  });

  document.getElementById("rerollBtn").disabled = G.bank < 1;
  document.getElementById("rerollBtn").onclick = function(){
    if(G.bank < 1) return;
    G.bank -= 1; G.offers = rollOffers(); tone(320,.08,"square",.05); openShop(reward);
  };
  document.getElementById("leaveShop").onclick = function(){
    G.offers = null; hidePanel(); startRound();
  };
}

function buy(idx, reward){
  const o = G.offers[idx];
  if(o.bought || G.bank < o.cost) return;
  if(o.kind === "lens"){
    if(G.lenses.length >= LENS_SLOTS) return;
    G.lenses.push(o.lens);
    G.shopSeen.push(o.lens.id);
  } else {
    const owned = G.deck.concat(G.discard, G.hand).map(function(c){ return c.w; });
    const fresh = LEXICON.filter(function(e){ return owned.indexOf(e.w)===-1; });
    shuffle(fresh);
    G.deck.push(makeCard(fresh[0] || pick(LEXICON), false));
    G.deck.push(makeCard(fresh[1] || pick(LEXICON), false));
    shuffle(G.deck);
  }
  G.bank -= o.cost;
  o.bought = true;
  tone(520,.1,"triangle",.07); setTimeout(function(){ tone(780,.16,"triangle",.06); }, 80);
  openShop(reward);
}

/* ---------- The Interpreter: type any word, get a real card ---------- */
let sampleFn = null;
claude_use("sample").then(function(fn){ sampleFn = fn; });
function claude_use(name){
  try{
    if(window.claude && typeof window.claude.use === "function") return window.claude.use(name);
  }catch(e){}
  return Promise.resolve(null);
}

/* The house appraiser: used when live appraisal is unavailable or declined.
   Deliberately simple and readable — morphology plus a small sense-map. */
const SENSE = [
  [/fire|burn|flame|blaze|scorch|ember|solar|lava|heat|boil|steam|volcan|thermo|forge/, "HEA"],
  [/ice|frost|snow|chill|cold|arctic|winter|glaci|freeze|cryo|polar/, "COL"],
  [/water|rain|sea|ocean|river|wave|flood|tide|liquid|wet|aqua|hydro|marine|lake|mist/, "WET"],
  [/run|fly|rush|jump|spin|flow|drift|race|swift|dash|surge|orbit|travel|migrat|velo|motor/, "MOT"],
  [/kill|death|die|poison|toxic|war|blade|knife|gun|bomb|danger|threat|venom|crash|wound|risk|fear/, "DAN"],
  [/loud|noise|scream|shout|thunder|roar|bang|siren|drum|song|music|echo|sonic|voice|bell/, "LOU"],
  [/light|bright|glow|shine|star|sun|lamp|flash|gleam|neon|dawn|gold|laser|beam/, "BRI"],
  [/dark|night|shadow|black|gloom|void|abyss|crypt|grave|murk|dusk/, "DAR"],
  [/dog|cat|bird|fish|wolf|bear|horse|beast|animal|creature|insect|snake|whale|lion|shark|worm|bug|hound|fox|owl|rat/, "ANI"],
  [/tree|flower|leaf|plant|grass|root|seed|forest|moss|vine|herb|bloom|fern|weed/, "PLA"],
  [/mountain|earth|stone|rock|storm|sky|wind|cloud|desert|valley|nature|soil|canyon|island|cave/, "NAT"],
  [/hand|eye|heart|bone|blood|skin|brain|body|lung|flesh|nerve|muscle|tooth|limb|finger/, "BOD"],
  [/eat|food|bread|meat|fruit|sweet|taste|cook|meal|soup|spice|drink|sugar|salt|feast/, "FOO"],
  [/tool|hammer|blade|wheel|lever|machine|device|key|rope|nail|saw|drill|engine/, "TOO"],
  [/comput|digital|data|robot|cyber|electr|circuit|code|network|silicon|pixel|server|algorith|neural|quantum/, "TEC"],
  [/money|gold|coin|cash|price|debt|bank|trade|wealth|cost|market|wage|tax|profit/, "MON"],
  [/think|mind|dream|memory|idea|thought|know|belief|feel|emotion|soul|logic|reason|fear|hope|doubt/, "MIN"],
  [/time|year|day|hour|old|ancient|future|past|clock|age|era|history|moment|decade|eternal/, "TIM"]
];
function houseAppraise(word){
  const w = word.toLowerCase();
  const tags = [];
  for(let i=0;i<SENSE.length;i++){
    if(SENSE[i][0].test(w) && tags.indexOf(SENSE[i][1])===-1) tags.push(SENSE[i][1]);
  }
  if(/(ness|ity|ism|tion|sion|ance|ence|ship|hood|ing|acy)$/.test(w)){
    if(tags.indexOf("ABS")===-1) tags.push("ABS");
    if(tags.indexOf("MIN")===-1 && tags.length<3) tags.push("MIN");
  }
  if(tags.length === 0){
    const r = mulberry32(hashStr(w));
    const pool = TAG_KEYS.filter(function(t){ return t!=="ABS"; });
    const n = 2 + Math.floor(r()*2);
    while(tags.length < n){
      const t = pool[Math.floor(r()*pool.length)];
      if(tags.indexOf(t)===-1) tags.push(t);
    }
  }
  return { tags: tags.slice(0,4), note: "No entry on file. Appraised from its shape and its company." };
}

function openInterpreter(){
  if(G.interpreterUsed){
    toast("The Interpreter answers once per run.");
    return;
  }
  showPanel(''
    + '<h2>The Interpreter</h2>'
    + '<div class="sub">One word, once per run</div>'
    + '<p>Type <b>any word at all</b> — your dog\'s name, your job title, the worst thing that happened to you this week. '
    + 'It gets appraised for its overtones and shuffled into your deck as a real card, scoring by the same rules as everything else.</p>'
    + '<input id="interpInput" maxlength="20" autocomplete="off" spellcheck="false" placeholder="type a word…">'
    + '<div class="appraisal" id="appraisal"></div>'
    + '<div class="rowend">'
    + '<button class="btn ghost" id="interpCancel" type="button">Not now</button>'
    + '<button class="btn primary" id="interpGo" type="button">Appraise</button>'
    + '</div>');

  const input = document.getElementById("interpInput");
  input.focus();
  document.getElementById("interpCancel").onclick = hidePanel;
  document.getElementById("interpGo").onclick = runAppraisal;
  input.onkeydown = function(e){ if(e.key === "Enter") runAppraisal(); };
}

async function runAppraisal(){
  const input = document.getElementById("interpInput");
  const go = document.getElementById("interpGo");
  const out = document.getElementById("appraisal");
  const raw = (input.value || "").trim().replace(/[^A-Za-z' -]/g, "");
  if(raw.length < 2){ out.innerHTML = '<div class="say">Two letters or more, please.</div>'; return; }
  const word = raw.toUpperCase().slice(0,20);

  go.disabled = true; input.disabled = true;
  out.innerHTML = '<div class="say">Consulting…</div>';

  let tags = null, note = "", src = "";
  if(sampleFn){
    try{
      const prompt =
        'You are the appraiser in a word game. Assign semantic overtones to a word.\n' +
        'Valid overtones: ' + TAG_KEYS.map(function(k){ return TAGS[k][0]; }).join(", ") + '.\n' +
        'ABSTRACT is only for words with no physical referent.\n' +
        'Choose 2 to 4 that genuinely fit. Also write one dry, appraiser-ish sentence about the word (max 18 words).\n' +
        'Reply with ONLY JSON: {"tags":["..."],"note":"..."}\n' +
        'Word: ' + word;
      const data = await sampleFn.json(prompt, { modelTier:"quick", cache:true });
      if(data && Array.isArray(data.tags)){
        const mapped = data.tags
          .map(function(t){ return TAG_BY_NAME[String(t).toUpperCase().trim()]; })
          .filter(function(t){ return !!t; });
        const uniq = [];
        mapped.forEach(function(t){ if(uniq.indexOf(t)===-1) uniq.push(t); });
        if(uniq.length){
          tags = uniq.slice(0,4);
          note = String(data.note || "").slice(0,140);
          src = "Appraised live by Claude";
        }
      }
    }catch(e){ /* not_granted, rate_limited, offline — fall through to the house */ }
  }
  if(!tags){
    const h = houseAppraise(word);
    tags = h.tags; note = note || h.note;
    src = "House appraisal · no live valuer available";
  }

  const card = makeCard({ w: word, t: tags }, true);
  G.interpreterUsed = true;
  G.interpretedWord = { w: word, t: tags };
  G.deck.push(card);
  shuffle(G.deck);

  out.innerHTML = '';
  out.appendChild(cardEl(card, true));
  const say = document.createElement("div");
  say.className = "say";
  say.innerHTML = escapeHtml(note) + '<span class="src">' + escapeHtml(src) + '</span>';
  out.appendChild(say);

  tone(440,.12,"triangle",.08);
  setTimeout(function(){ tone(660,.12,"triangle",.07); }, 100);
  setTimeout(function(){ tone(880,.26,"triangle",.07); }, 210);

  go.textContent = "Into the deck →";
  go.disabled = false;
  go.onclick = function(){ hidePanel(); render(); toast(word + " is in your deck."); };
}

/* ---------- run end ---------- */
function endRun(won){
  G.over = true;
  const runs = store.get("runs", 0) + 1;
  store.set("runs", runs);
  const bestEver = store.get("best", 0);
  const isRecord = G.total > bestEver;
  if(isRecord) store.set("best", G.total);

  /* Memory unlock: carry one lens you actually used into the next run. */
  let unlocked = null;
  const prev = store.get("memory", null);
  const candidates = G.lenses.map(function(l){ return l.id; });
  if(candidates.length){
    const choice = candidates[hashStr(G.seed+runs) % candidates.length];
    if(choice !== prev){
      store.set("memory", choice);
      unlocked = LENSES.find(function(l){ return l.id===choice; });
    }
  }

  const share = shareText(won);
  const html = ''
    + '<h2>' + (won ? "The desk is cleared." : "The run ends at " + G.demand.n + ".") + '</h2>'
    + '<div class="sub">' + (G.isDaily ? "Daily " + G.seed : "Seed " + G.seed) + ' · run #' + runs + '</div>'
    + '<div class="stat-row">'
    +   '<div class="stat"><div class="k">Total</div><div class="v">' + G.total.toLocaleString() + '</div></div>'
    +   '<div class="stat"><div class="k">Reached</div><div class="v">' + Math.min(G.round+1, ROUNDS) + ' / ' + ROUNDS + '</div></div>'
    +   '<div class="stat"><div class="k">Best mult</div><div class="v">×' + (G.best.mult||1) + '</div></div>'
    + '</div>'
    + (isRecord ? '<p style="color:var(--accent)"><b>A personal best.</b></p>' : '')
    + (unlocked ? '<div class="unlock"><div class="k">Memory — carried into your next run</div><div class="v">'
        + unlocked.n + '</div><div class="d">' + unlocked.d + '</div></div>' : '')
    + '<div class="share" id="shareBox">' + escapeHtml(share) + '</div>'
    + '<div class="rowend">'
    +   '<button class="btn" id="copyShare" type="button">Copy result</button>'
    +   '<button class="btn" id="againSeed" type="button">Same seed again</button>'
    +   '<button class="btn primary" id="againNew" type="button">New run →</button>'
    + '</div>';
  showPanel(html);

  document.getElementById("copyShare").onclick = function(){
    try{
      navigator.clipboard.writeText(share);
      toast("Copied.");
    }catch(e){ toast("Select the text above to copy."); }
  };
  document.getElementById("againSeed").onclick = function(){ hidePanel(); newRun(G.seed); };
  document.getElementById("againNew").onclick = function(){ hidePanel(); newRun("free-" + Math.random().toString(36).slice(2,8)); };

  tone(won?520:180, .3, won?"triangle":"sawtooth", .09);
  if(won) setTimeout(function(){ tone(784,.5,"triangle",.09); }, 180);
}

function shareText(won){
  const lines = [];
  lines.push("OVERTONE — " + (G.isDaily ? "Daily " + G.seed : "seed " + G.seed));
  lines.push((won ? "Cleared all " + ROUNDS + " Demands" : "Fell at " + G.demand.n + " (" + (G.round+1) + "/" + ROUNDS + ")")
             + "  ·  " + G.total.toLocaleString() + " pts");
  if(G.best.word) lines.push("Best play: " + G.best.word + "  ×" + G.best.mult + "  (" + G.best.score.toLocaleString() + ")");
  if(G.interpretedWord){
    lines.push("My word: " + G.interpretedWord.w + " — "
      + G.interpretedWord.t.map(function(t){ return TAGS[t][0]; }).join("·"));
  }
  return lines.join("\n");
}

/* ---------- rendering ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function cardEl(c, staticCard){
  const el = document.createElement("div");
  el.className = "card" + (staticCard ? " static" : "") + (c.interpreted ? " interpreted" : "");
  el.setAttribute("role", staticCard ? "img" : "button");
  el.setAttribute("aria-label", c.w + ", " + c.t.map(function(t){ return TAGS[t][0]; }).join(", "));
  if(!staticCard) el.tabIndex = 0;

  const base = document.createElement("div");
  base.className = "base"; base.textContent = c.base;

  const w = document.createElement("div");
  w.className = "w"; w.textContent = c.w;

  const tags = document.createElement("div");
  tags.className = "tags";
  c.t.forEach(function(t){
    const s = document.createElement("span");
    const match = G && G.demand && G.demand.tags.indexOf(t) >= 0;
    s.className = "tg" + (match ? " match" : "");
    s.textContent = TAGS[t][0];
    if(!match) s.style.color = "var(--t-" + TAGS[t][1] + ")";
    tags.appendChild(s);
  });

  el.appendChild(base); el.appendChild(w); el.appendChild(tags);

  if(!staticCard){
    if(G.selected.indexOf(c.id) >= 0) el.classList.add("sel");
    const toggle = function(){ toggleSel(c.id); };
    el.onclick = toggle;
    el.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
  }
  return el;
}

function toggleSel(id){
  if(G.animating) return;
  const i = G.selected.indexOf(id);
  if(i >= 0){ G.selected.splice(i,1); tone(240,.06,"sine",.04); }
  else{
    if(G.selected.length >= MAX_PLAY){ toast("Three words at a time."); return; }
    G.selected.push(id); tone(420 + G.selected.length*90, .07, "sine", .05);
  }
  renderHand(); renderControls(); renderPreview();
}

function renderPreview(){
  const hint = document.getElementById("stageHint");
  if(G.selected.length === 0){
    document.getElementById("stageCards").innerHTML = "";
    document.getElementById("tally").hidden = true;
    hint.textContent = "Pick up to three words that resonate with the Demand.";
    return;
  }
  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);
  const sc = document.getElementById("stageCards");
  sc.innerHTML = "";
  cards.forEach(function(c){ sc.appendChild(cardEl(c, true)); });
  document.getElementById("tally").hidden = false;
  setTally(res.chips, res.mult);
  hint.textContent = "Would score " + res.total.toLocaleString()
    + "  ·  they resolve left to right, so the order matters";
}

function renderDemand(){
  document.getElementById("roundLabel").textContent = "Round " + (G.round+1) + " of " + ROUNDS;
  document.getElementById("demandName").textContent = G.demand.n;
  const w = document.getElementById("demandWants");
  w.innerHTML = "";
  const lead = document.createElement("span");
  lead.style.cssText = "font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--text-faint);margin-right:2px";
  lead.textContent = "WANTS";
  w.appendChild(lead);
  G.demand.tags.forEach(function(t){
    const s = document.createElement("span");
    s.className = "w"; s.textContent = TAGS[t][0];
    w.appendChild(s);
  });
  document.getElementById("roundScore").textContent = G.roundScore.toLocaleString();
  document.getElementById("roundTarget").textContent = G.target.toLocaleString();
  const pct = Math.min(100, (G.roundScore / G.target) * 100);
  const pr = document.getElementById("progress");
  pr.querySelector("i").style.width = pct + "%";
  pr.classList.toggle("met", G.roundScore >= G.target);
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  if(G.lenses.length === 0){
    const e = document.createElement("div");
    e.className = "rail-empty";
    e.textContent = "NO LENSES — clear this Demand and the Bookseller will sell you one.";
    rail.appendChild(e);
    return;
  }
  G.lenses.forEach(function(l){
    const d = document.createElement("div");
    d.className = "lens";
    d.title = l.d;
    d.innerHTML = '<div class="n">' + escapeHtml(l.n) + '</div><div class="d">' + escapeHtml(l.d) + '</div>';
    rail.appendChild(d);
  });
}

function renderHand(){
  const h = document.getElementById("hand");
  h.innerHTML = "";
  G.hand.forEach(function(c){ h.appendChild(cardEl(c, false)); });
}

function renderControls(){
  document.getElementById("playsLeft").textContent = G.plays;
  document.getElementById("discardsLeft").textContent = G.discards;
  const pips = document.getElementById("playPips");
  pips.innerHTML = "";
  for(let i=0;i<4;i++){
    const s = document.createElement("span");
    s.className = "pip" + (i < G.plays ? "" : " off");
    pips.appendChild(s);
  }
  document.getElementById("playBtn").disabled = G.animating || G.selected.length===0 || G.plays<=0;
  document.getElementById("discardBtn").disabled = G.animating || G.selected.length===0 || G.discards<=0;
  document.getElementById("interpBtn").disabled = G.animating || G.interpreterUsed;
  document.getElementById("interpBtn").textContent = G.interpreterUsed ? "◆ Interpreted" : "◆ Interpret";
  document.getElementById("bankLabel").textContent = "◇ " + G.bank;
  document.getElementById("seedLabel").textContent = (G.isDaily ? "DAILY " : "SEED ") + G.seed.toUpperCase();
}

function render(){ renderDemand(); renderRail(); renderHand(); renderControls(); renderPreview(); }

/* ---------- panels ---------- */
function showPanel(html){
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").hidden = false;
}
function hidePanel(){ document.getElementById("veil").hidden = true; }

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 1900);
}

function showHelp(){
  showPanel(''
    + '<h2>How Overtone works</h2>'
    + '<div class="sub">Ninety seconds of reading, then never again</div>'
    + '<ul class="helplist">'
    + '<li>Every word carries <b>overtones</b> — the small tags along its bottom edge. AVALANCHE is COLD, MOTION, DANGER and LOUD all at once.</li>'
    + '<li>Each round sets a <b>Demand</b>. Every overtone on a played word that matches the Demand pays <b>+25 chips</b>.</li>'
    + '<li>You score <b>chips × mult</b>. Play up to three words; they resolve <b>left to right</b>, in the order you picked them, so ordering is part of the puzzle.</li>'
    + '<li><b>Lenses</b> bought from the Bookseller rewrite the rules — CARNIVORE lets an animal eat the word to its left; ANTONYM ENGINE pays out when heat follows cold.</li>'
    + '<li>Four plays and three discards per round. Miss the target and the run is over.</li>'
    + '<li>Once per run, <b>the Interpreter</b> will take any word you type and turn it into a real card.</li>'
    + '</ul>'
    + '<p style="font-size:12.5px"><span class="kbd">1</span>–<span class="kbd">7</span> pick a word · '
    + '<span class="kbd">Enter</span> play · <span class="kbd">D</span> discard · '
    + '<span class="kbd">Space</span> hurry the scoring · <span class="kbd">Esc</span> close</p>'
    + '<div class="rowend"><span></span><button class="btn primary" id="closeHelp" type="button">Play</button></div>');
  document.getElementById("closeHelp").onclick = hidePanel;
}

/* ---------- input ---------- */
document.getElementById("playBtn").onclick = play;
document.getElementById("discardBtn").onclick = discardSel;
document.getElementById("interpBtn").onclick = openInterpreter;
document.getElementById("helpBtn").onclick = showHelp;
document.getElementById("newRunBtn").onclick = function(){
  hidePanel(); newRun("free-" + Math.random().toString(36).slice(2,8));
};
document.getElementById("stage").onclick = function(){ if(G && G.animating) skipAnim = true; };

document.addEventListener("keydown", function(e){
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(e.key === "Escape"){ hidePanel(); return; }
  if(!document.getElementById("veil").hidden) return;
  if(e.key === " "){ if(G && G.animating){ e.preventDefault(); skipAnim = true; } return; }
  if(G && G.animating) return;
  if(e.key >= "1" && e.key <= "7"){
    const c = G.hand[parseInt(e.key,10) - 1];
    if(c) toggleSel(c.id);
  } else if(e.key === "Enter"){ play(); }
  else if(e.key === "d" || e.key === "D"){ discardSel(); }
});

/* ---------- boot ---------- */
function start(restored){
  newRun(null);
  if(!store.get("seenHelp", false)){
    store.set("seenHelp", true);
    showHelp();
  }
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(start) : start({});
  } else { start({}); }
}catch(e){ start({}); }
</script>
