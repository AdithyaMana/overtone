<title>Overtone</title>
<meta name="description" content="A word roguelite where meaning is the physics. Play words into an escalating scoring engine and warp the rules with Lenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Russo+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&display=swap">
<style>
/* ============================================================
   OVERTONE

   Four rules, held everywhere. Breaking them is what made the last
   pass read as generated:
     1. Flat fills. No gradients on any surface.
     2. Hard shadows only — 0 blur. Every panel sits on a solid lip.
     3. One typeface, one family of sizes.
     4. Colour is information: blue = chips, red = mult, gold = money.
        Nothing else gets to be loud.
   ============================================================ */
:root{
  color-scheme: dark;

  --bg:        #0E161C;   /* the room */
  --felt:      #1C2B35;   /* the table cards are played on */
  --felt-d:    #131E26;
  --panel:     #2C4150;
  --panel-2:   #3A5568;
  --inset:     #16222A;
  --edge:      #0A1116;   /* the lip under everything */

  /* the signature trio */
  --chips:     #0093FF;
  --chips-d:   #005FA8;
  --mult:      #FE5F55;
  --mult-d:    #B8352C;
  --gold:      #EFA31D;
  --gold-d:    #A76E08;
  --blind:     #C8443A;
  --blind-d:   #7E2620;

  --green:     #4BC292;
  --green-d:   #26795A;
  --lens:      #9B7BE0;
  --lens-d:    #5B3FA3;
  /* the same purple, lifted until it clears 4.5:1 on the board's own ground */
  --lens-lit:  #C3AEF2;

  --card:      #F6F1E4;
  --card-edge: #BFB49A;
  --card-ink:  #1B1915;
  --card-dim:  #7B7361;

  --text:      #FFFFFF;
  --text-dim:  #A9BCC9;
  --text-faint:#70889A;

  /* The text face. Every number and every piece of large type is set in the
     display face, so this one only has to do the small print — and its job is
     to be narrow and legible. Three pixel faces were tried here first: two
     rendered 5 and 8 alike, and the third was so wide that English wrapped
     mid-phrase. Oxanium is a game-UI face with real weights. */
  --f: "Oxanium", "Segoe UI", system-ui, sans-serif;
  /* The display face. "ArcadeLocal" only resolves once a real arcade TTF has
     been embedded by tools/embed-font.js; Russo One stands in until then, so
     the page never waits on a file it does not have. */
  --f-display: "ArcadeLocal", "Russo One", Impact, var(--f);
  --drop: 2px 2px 0 rgba(0,0,0,.55);
  --drop-sm: 1px 1px 0 rgba(0,0,0,.55);
}

/* --- arcade-font-start --- */
/* --- arcade-font-end --- */

*{ box-sizing: border-box; font-synthesis: none; }
/* the text face has real weights; the display face has one and ignores this */
b, strong{ font-weight: 700; color: #FFF; }
html,body{ margin:0; padding:0; }
/* sparks and floats leave the stage now; they must never widen the document */
body{ overflow-x: clip; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
button{ font-family: inherit; color: inherit; }
:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

.wordmark, .panel h2, .blind-badge, .blind-req .v, .roundscore .v,
.tally .chips, .tally .multv, .meter .v, .money, .stage-total, .card .w,
.card .base, .btn, .stage-hint .hand-name, .lensbar-head, .teach-n,
.offer .on, .offer .oc, .lens .n, .unlock .v, .purse, .worked-tot, .pos,
.blind-wants .w, .card .tg.match, .coach{
  font-family: var(--f-display);
}
/* Russo One runs wider than the text face, so the tightest strings get a
   little air taken back out of their tracking. */
.btn, .blind-badge, .stage-hint .hand-name{ letter-spacing: .02em; }

/* ---------- the opening tutorial ----------
   A spotlight over the real board rather than a modal read before the game
   has been seen. The overlay does not take pointer events — the player has to
   be able to tap the very cards it is pointing at. */
.tut{ position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.tut[hidden]{ display: none !important; }
.tut-hole{
  position: absolute; border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(6,12,16,.78);
  transition: left .26s cubic-bezier(.2,.9,.3,1), top .26s cubic-bezier(.2,.9,.3,1),
              width .26s cubic-bezier(.2,.9,.3,1), height .26s cubic-bezier(.2,.9,.3,1);
}
.tut-box{
  position: absolute; width: min(430px, calc(100vw - 20px));
  background: var(--panel); border-radius: 10px; padding: 16px 18px;
  box-shadow: 0 6px 0 var(--edge);
  pointer-events: auto;
}
.tut-step{
  font-size: 11px; letter-spacing: .12em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 7px;
  font-family: var(--f-display);
}
.tut-text{ font-size: 15px; line-height: 1.65; color: var(--text); }
.tut-text b{ color: var(--gold); }
.tut-text .do{
  display: block; margin-top: 10px; color: #FFF; font-weight: 700;
  background: var(--inset); border-radius: 6px; padding: 8px 11px;
  font-size: 14px;
}
.tut-dots{ display: flex; gap: 5px; flex: 1; justify-content: center; }
.tut-dots i{ width: 7px; height: 7px; border-radius: 50%; background: var(--inset); }
.tut-dots i.on{ background: var(--gold); }
.tut-dots i.done{ background: var(--gold-d); }
.tut-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; }

/* On a phone a floating card fights the thing it is pointing at for the same
   250 square pixels. Dock it instead — full width, top or bottom, whichever
   is further from the spotlight. */
@media (max-width: 700px){
  .tut-box{
    left: 8px !important; right: 8px !important; width: auto !important;
    top: auto !important;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
    transform: none !important;
    padding: 14px 15px;
  }
  .tut-box.dock-top{ top: 8px !important; bottom: auto !important; }
  .tut-box{ overflow-y: auto; }
  .tut-text{ font-size: 14px; line-height: 1.55; }
  .tut-text .do{ font-size: 13.5px; padding: 7px 10px; margin-top: 8px; }
  .tut-next{ padding: 11px 18px; }
  .tut-skip{ padding: 11px 4px; }
}
.tut-skip{
  background: none; border: none; cursor: pointer; padding: 6px 2px;
  font-family: inherit; font-size: 12px; color: var(--text-faint);
  text-decoration: underline; text-underline-offset: 3px;
}
.tut-skip:hover{ color: var(--text-dim); }
.tut-next{ padding: 9px 20px; font-size: 13px; }
.tut-next[hidden]{ display: none !important; }

/* every raised surface is the same object: flat fill, solid lip */
.slab{
  background: var(--panel);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--edge);
}

#app{
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 14px;
  padding-block: 12px 18px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.wordmark{
  margin:0; font-size: 30px; font-weight: 700; letter-spacing: .05em;
  color: var(--card);
  text-shadow: 3px 3px 0 var(--mult);
}
.wordmark span{ color: var(--gold); }
.mast-actions{ display:flex; gap:8px; align-items:center; }
.chip-btn{
  background: var(--panel); border:none; border-radius: 7px; cursor:pointer;
  box-shadow: 0 3px 0 var(--edge);
  padding: 7px 13px; font-size: 13px; font-weight:600; color: var(--text-dim);
  text-shadow: var(--drop-sm);
}
.chip-btn:active{ transform: translateY(3px); box-shadow:none; }
.chip-btn.icon{ min-width: 38px; font-size: 15px; line-height: 1; padding: 7px 10px; }
.chip-btn.off{ color: var(--text-faint); opacity: .65; text-decoration: line-through; }
.chip-btn .short{ display: none; }

/* ---------- table ---------- */
.table{ display:grid; grid-template-columns: 232px 1fr; gap: 12px; align-items:stretch; flex:1; }
.sidebar{ display:flex; flex-direction:column; gap: 10px; }

.blind{ padding: 11px; text-align:center; }
.blind-badge{
  background: var(--blind);
  border-radius: 7px; padding: 10px 8px;
  font-size: 17px; font-weight:700; letter-spacing:.02em; line-height:1.15;
  color:#FFF; text-shadow: var(--drop);
  box-shadow: 0 3px 0 var(--blind-d);
  text-wrap: balance;
  animation: plaqueSlam .34s cubic-bezier(.2,1.5,.4,1);
}
@keyframes plaqueSlam{
  0%{ transform: scale(1.35); opacity:0; }
  60%{ transform: scale(.97); opacity:1; }
  100%{ transform: none; }
}
.blind-wants{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:11px; }
.blind-wants .w{
  background: var(--gold); color:#12181C; border-radius: 4px;
  padding: 3px 8px; font-size: 11px; font-weight:700; letter-spacing:.03em;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* An Ordeal is the round changing a rule rather than a number, so it gets the
   warning colour and sits directly under what the round wants — the two things
   a player has to hold in their head at once. */
.ordeal{
  margin-top: 10px; text-align: left;
  background: var(--blind); border-radius: 7px; padding: 7px 9px;
  box-shadow: 0 3px 0 var(--blind-d);
  animation: plaqueSlam .34s cubic-bezier(.2,1.5,.4,1) .12s backwards;
}
.ordeal[hidden]{ display: none !important; }
.ordeal .on{
  font-family: var(--f-display); font-size: 11.5px; color: #FFF;
  text-shadow: var(--drop-sm); letter-spacing: .03em;
}
.ordeal .od{ font-size: 11.5px; line-height: 1.4; color: #FFE2DE; margin-top: 3px; }

.blind-req{ margin-top: 13px; }
.blind-req .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.blind-req .v{
  font-size: 30px; font-weight:700; color: var(--mult);
  text-shadow: var(--drop); font-variant-numeric: tabular-nums; line-height:1.1;
}
.progress{
  margin-top: 9px; height: 8px; border-radius: 4px;
  background: var(--inset); overflow: hidden;
}
.progress > i{
  display:block; height:100%; width:0%;
  background: var(--green);
  transition: width .35s cubic-bezier(.2,.9,.3,1);
}

.roundscore{ padding: 9px 12px; text-align:center; }
.roundscore .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.roundscore .v{
  font-size: 27px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop); line-height:1.15;
}

/* points x multiplier — the two numbers the whole game is about.
   They used to sit unlabelled, which asked a new player to infer from colour
   alone what the blue number and the red number were. */
.tally{
  display:grid; grid-template-columns: 1fr auto 1fr; align-items:end; gap:6px;
  background: var(--inset); border-radius: 8px; padding: 9px 8px;
  box-shadow: 0 4px 0 var(--edge);
}
.tally .chips, .tally .multv{
  border-radius: 6px; padding: 9px 4px; text-align:center;
  font-size: 25px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop);
  overflow: hidden; text-overflow: ellipsis;
}
.tally .chips{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.tally .multv{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.tally .x{ font-size: 15px; font-weight:700; color: var(--text-faint); text-align:center; padding-bottom: 11px; }
.tcell{ min-width: 0; }
.tk{
  font-size: 9.5px; letter-spacing: .11em; color: var(--text-faint);
  text-align:center; margin-bottom: 4px; line-height:1;
}
/* a counter that is settling takes a hit, so the eye goes to the one that moved */
.tally .chips.roll, .tally .multv.roll{ animation: rollHit .19s cubic-bezier(.2,1.8,.4,1); }
@keyframes rollHit{
  0%{ transform: scale(1); }
  40%{ transform: scale(1.16) translateY(-2px); }
  100%{ transform: scale(1); }
}

.meters{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter{ padding: 8px 6px; text-align:center; }
.meter .k{ font-size: 11.5px; color: var(--text-dim); }
.meter .v{ font-size: 24px; font-weight:700; text-shadow: var(--drop); line-height:1.15; }
.meter.plays .v{ color: var(--chips); }
.meter.disc .v{ color: var(--mult); }

.money{
  padding: 9px; text-align:center;
  font-size: 25px; font-weight:700; color: var(--gold);
  text-shadow: var(--drop);
}
.runinfo{
  display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
  font-size: 11px; color: var(--text-faint); padding: 0 3px;
}

/* ---------- board ---------- */
.board{ display:flex; flex-direction:column; gap: 12px; min-width: 0; }

.lensbar{ padding: 9px 10px; }
.lensbar-head{
  display:flex; justify-content:space-between; align-items:center;
  font-size: 12px; letter-spacing:.1em; color: var(--text-dim); margin-bottom: 7px;
}
.lensbar-head b{ color: var(--lens-lit); font-weight:700; font-size: 14px; }
.rail{ display:flex; gap:8px; flex-wrap:wrap; min-height: 54px; align-items:stretch; }

/* ---------- the figure ledger ----------
   Gold, because gold is already what every figure payout on this board is
   written in. Flat fills and a hard rule above it, same as everything else. */
/* Sits inside .lensbar-head between the label and the count, so it adds no
   height to the board at all - it lives in a row that was already there. */
.figbar{
  display: flex; flex-wrap: nowrap; gap: 0 13px; align-items: center;
  margin: 0 auto; min-width: 0; overflow: hidden;
}
.figp{ display: flex; align-items: center; gap: 5px; }
.figp b{
  font-size: 10px; letter-spacing: .09em; font-weight: 700;
  color: var(--text-faint);
}
.figp.lit b{ color: var(--gold); }
.figp i{ width: 6px; height: 6px; border-radius: 2px; background: var(--inset); }
.figp.lit i{ background: rgba(239,163,29,.28); }
.figp i.on{ background: var(--gold); }
/* Below this the header row cannot hold five names as well as LENSES and the
   count, so the names go and the pips stay. The pips are the part that has
   to survive: the exact figure is spelled out on the stage the moment cards
   are selected, but which shape is furthest along is only readable here. */
@media (max-width: 1080px){
  .figp b{ display: none; }
  .figbar{ gap: 0 9px; }
}
@media (max-width: 420px){
  .figbar{ gap: 0 6px; }
  .figp{ gap: 3px; }
  .figp i{ width: 5px; height: 5px; }
}

/* the level beside the named figure, at the moment of choosing */
.stage-hint .figlv{
  display: inline-block; margin-left: 7px; vertical-align: middle;
  font-family: var(--f-display); font-size: 11px; letter-spacing: .04em;
  background: var(--gold); color: #12181C; border-radius: 3px; padding: 2px 5px;
}
.stage-hint .figlv.new, .figtab th .lvtag.new{
  background: var(--chips); color: #06233D;
}
.figtab th .lvtag{
  font-style: normal; margin-left: 7px; font-size: 10px; letter-spacing: .05em;
  background: var(--gold); color: #12181C; border-radius: 3px; padding: 1px 5px;
}
.lens{
  position:relative; border-radius: 7px; padding: 7px 9px;
  min-width: 118px; max-width: 168px; cursor: pointer;
  background: var(--lens);
  box-shadow: 0 3px 0 var(--lens-d);
  border: none; font-family: inherit; text-align: left;
  transition: max-width .18s cubic-bezier(.2,.9,.3,1);
}
.lens:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--lens-d); }
/* A Lens you did not buy has to say so, or a fresh board holding one looks
   like the game forgot to clear itself. */
.lens .mem{
  display:inline-block; margin-left: 6px; vertical-align: 1px;
  font-family: var(--f); font-size: 8.5px; font-weight:700; letter-spacing:.08em;
  background: var(--lens-d); color:#FFF; border-radius: 3px; padding: 1px 4px;
  text-shadow: none;
}
.lens .n{
  font-size: 12px; font-weight:700; color:#FFF; text-shadow: var(--drop-sm);
  white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  padding-right: 13px;
}
.lens .d{ font-size: 11px; line-height:1.4; color:#2A1C46; margin-top:3px; }
.lens .lv{
  font-family: var(--f-display); font-size: 11px; margin-top: 5px;
  color: #2A1C46; background: var(--gold); border-radius: 4px;
  padding: 2px 6px; display: inline-block;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* a Lens that costs you something says so in its colour */
.lens.flaw{ background: var(--blind); box-shadow: 0 3px 0 var(--blind-d); }
.lens.flaw .d{ color: #FFE2DE; }
.lens.flaw .lv{ background: var(--card); box-shadow: 0 2px 0 var(--card-edge); }
/* a corner mark, so it reads as something you can open */
.lens::before{
  content: "+"; position: absolute; top: 5px; right: 7px;
  font-family: var(--f-display); font-size: 11px; line-height: 1;
  color: #FFF; opacity: .75;
}
.lens.open::before{ content: "\2212"; }   /* minus */
.lens.open{ max-width: none; }
.lens.open .d{
  -webkit-line-clamp: unset; display: block; overflow: visible;
}
.lens.fired{ animation: lensFire .5s cubic-bezier(.2,1.3,.3,1); }
.lens.fired::after{
  content:""; position:absolute; inset:0; border-radius:7px; z-index:1;
  background: var(--gold); animation: lensWash .5s steps(3) forwards;
  pointer-events:none;
}
@keyframes lensWash{ 0%{opacity:.75} 100%{opacity:0} }
@keyframes lensFire{
  0%{ transform: translateY(0) scale(1) rotate(0); }
  30%{ transform: translateY(-10px) scale(1.1) rotate(-3deg); }
  60%{ transform: translateY(0) scale(1.03) rotate(2deg); }
  100%{ transform: none; }
}
.rail-empty{ font-size: 12px; color: var(--text-faint); align-self:center; padding: 4px 2px; }

/* the green table */
.stage{
  flex:1; min-height: 212px; position:relative;
  background: var(--felt);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--felt-d), inset 0 0 0 3px rgba(0,0,0,.14);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 14px; padding: 16px;
  /* Floats rise above the cards they came from and the total is 52px tall;
     clipping them here is what cut the scoring popup in half. */
  overflow: visible;
}
.stage-cards{ display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.stage-hint{
  font-size: 15px; font-weight:600; letter-spacing:.03em; color: #C9D7E0;
  text-align:center; max-width: 56ch; text-shadow: var(--drop-sm);
}
.stage-hint b{ color: var(--gold); }
/* --lens is the Lens purple, and at 13px on the stage it measured 4.36:1 —
   under AA for body text, on the one line whose whole job is to be noticed. */
.stage-hint .ord{ display:inline-block; margin-top:5px; font-size:13px; color: var(--lens-lit); }
.stage-hint .fig-pay{
  display:inline-block; margin-left:9px; font-size:13.5px; font-weight:700;
  color: var(--gold); letter-spacing:.02em; vertical-align: middle;
}
/* a figure the round is not paying for in full says so, and says why */
.stage-hint .fig-pay.short{ color: #F0C27A; }
.stage-hint .fig-pay i{ font-style: normal; font-weight: 600; opacity: .8; font-size: 12px; }
/* A hand with no figure still gets named, because the absence is information:
   it is the one thing on the board you can still fix by picking differently. */
.stage-hint .hand-name.none{ color:#93A6B3; box-shadow: 0 3px 0 var(--edge); }
.stage-hint .hand-name{ cursor:pointer; }
/* The hand's options, under the line they would change. Quiet enough to skip
   once a player has stopped needing it, and legible enough to lean on before
   they have. */
.stage-hint .nxt{
  margin-top: 8px; padding-top: 7px; font-size: 12px; font-weight: 600;
  line-height: 2; color: var(--text-dim);
  border-top: 1px solid var(--edge);
}
.stage-hint .nxt .nxl{
  display: block; margin-bottom: 3px; font-size: 10px; font-weight: 700;
  letter-spacing: .11em; text-transform: uppercase; color: var(--text-faint);
  line-height: 1.4;
}
.stage-hint .nxt .jn{ font-size: 9.5px; padding: 1px 5px; letter-spacing: .08em; }
.stage-hint .nxt .nw{ color: #C9D7E0; letter-spacing: .02em; }
.stage-hint .nxt .jnx{ margin: 0 4px; }
@media (max-width: 620px){
  .stage-hint .nxt{ font-size: 11px; line-height: 1.6; margin-top: 5px; padding-top: 4px; }
  .stage-hint .nxt .jn{ font-size: 8.5px; padding: 1px 4px; }
  /* The label shared a line with nothing, and the rows were set at 1.85.
     Together that was 64px of a 727px screen - enough to push the hand's
     bottom row 5px under the pinned controls the moment a second card was
     picked, which is every turn. Inline label, tighter rows: 40px, and the
     row says exactly what it said before. */
  .stage-hint .nxt .nxl{ display: inline; margin: 0 6px 0 0; }
}
/* The portrait board is laid out to the pixel on a 667px screen - the same
   budget that already hides .dc-fig here. This row appears the moment a second
   card is picked, which is every turn, and up to four categories of it would
   push the hand's bottom row under the pinned controls. The board's beads
   still say what the laid words are doing. */
@media (max-height: 700px){ .stage-hint .nxt{ display: none; } }
.dc-fig{ display:block; margin-top: 4px; }
/* The portrait board is laid out to the pixel on a 667px screen — the hand's
   bottom row clears the controls by one. A second line on the idle board is
   worth more than it costs everywhere there is room for it, and costs more
   than it is worth here, where the figures are still one tap away on the hand
   name and in the help card. */
@media (max-height: 700px){ .dc-fig{ display:none; } }
.dc-text .figlink{
  background:none; border:0; font:inherit; color: var(--gold);
  font-weight:700; text-decoration: underline; text-underline-offset:3px; cursor:pointer;
  /* It was 78x14: a real link, but not a real target. WCAG 2.5.8 asks 24, and
     the negative margin that keeps the padding from growing the board also
     pushes the box under .stage-hint, which then eats the bottom of it. */
  display:inline-block; padding: 10px 6px; margin: -7px 0;
  position: relative; z-index: 2;
}
.figtab{ width:100%; border-collapse:collapse; margin: 0 0 14px; font-size:13px; }
.figtab th, .figtab td{ text-align:left; padding: 7px 8px; border-bottom:1px solid var(--edge); }
.figtab thead th{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color: var(--text-faint); font-weight:700;
}
.figtab tbody th{ font-weight:700; color:#FFF; width: 44%; }
.figtab tbody th span{
  display:block; font-weight:400; font-size:12px; color: var(--text-dim);
  letter-spacing:0; margin-top:2px; line-height:1.45;
}
.figtab td{ color: var(--gold); font-weight:700; white-space:nowrap;
  font-variant-numeric: tabular-nums; vertical-align: top; }
.figtab td.no{ color: var(--text-faint); font-weight:400; }
@media (max-width: 560px){
  .figtab th, .figtab td{ padding: 6px 5px; font-size:12px; }
  .figtab tbody th{ width: 40%; }
}
.stage-hint .hand-name{
  display:inline-block; font-size: 17px; font-weight:700;
  background: var(--inset); color:#FFF;
  border-radius: 6px; padding: 6px 16px;
  box-shadow: 0 3px 0 var(--edge);
  margin-bottom: 8px; animation: nameIn .26s cubic-bezier(.2,1.5,.4,1);
}
@keyframes nameIn{ 0%{transform:scale(.72);opacity:0} 100%{transform:none;opacity:1} }
.stage-total{
  font-size: 52px; font-weight:700; color: var(--gold);
  text-shadow: 4px 4px 0 var(--edge);
  /* tabular figures, or a rolling counter jitters its own width every frame */
  font-variant-numeric: tabular-nums;
  animation: slam .34s cubic-bezier(.2,1.5,.4,1);
}
.stage-total.landed-total{ animation: totalLock .26s cubic-bezier(.2,1.9,.35,1); }
@keyframes totalLock{
  0%{ transform: scale(1.22); }
  55%{ transform: scale(.97); }
  100%{ transform: scale(1); }
}
@keyframes slam{ 0%{transform:scale(2.2);opacity:0} 60%{transform:scale(.93);opacity:1} 100%{transform:none} }
.shake{ animation: shake .32s ease-in-out; --amp: 1; }
.shake.big{ --amp: 2; animation-duration: .42s; }
.shake.huge{ --amp: 3.1; animation-duration: .54s; }
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(calc(-7px * var(--amp)), calc(3px * var(--amp)))}
  35%{transform:translate(calc(7px * var(--amp)), calc(-3px * var(--amp)))}
  55%{transform:translate(calc(-5px * var(--amp)), calc(-2px * var(--amp)))}
  75%{transform:translate(calc(5px * var(--amp)), calc(2px * var(--amp)))}
  90%{transform:translate(calc(-2px * var(--amp)), calc(1px * var(--amp)))}
}
/* flat flash when the Demand falls, not a glow */
.stage.clear::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  border-radius: 8px;   /* the stage no longer clips, so the wash clips itself */
  background: var(--green); animation: wash .55s steps(4) forwards;
}
@keyframes wash{ 0%{opacity:0} 30%{opacity:.55} 100%{opacity:0} }

/* pixel sparks: square, no glow */
.spark{
  position:absolute; left:50%; top:50%; width:7px; height:7px;
  background: var(--gold); pointer-events:none; z-index: 7;
}
.confetto{
  position: fixed; bottom: -18px; width: 9px; height: 14px;
  z-index: 56; pointer-events: none;
}

/* A square ring thrown out from the total. Flat, hard-edged, no blur — the
   same rule the rest of the sheet keeps. */
.shock{
  position:absolute; left:50%; top:50%; width:26px; height:26px;
  border: 5px solid var(--gold); transform: translate(-50%,-50%);
  pointer-events:none; z-index: 6;
}

/* Points that leave the card they came from and land on the counter. This is
   the one piece of motion that explains the arithmetic: a number does not
   simply appear in the tally, it arrives from the word that earned it. */
.flyer{
  position: fixed; width: 16px; height: 16px; z-index: 55;
  pointer-events: none; background: var(--chips);
  box-shadow: 0 0 0 2px var(--edge), 0 3px 0 var(--chips-d);
}
.flyer.m{ background: var(--mult); box-shadow: 0 2px 0 var(--mult-d); }
.flyer.r{ background: var(--gold); box-shadow: 0 2px 0 var(--gold-d); }
.landed{ animation: landed .18s cubic-bezier(.2,1.8,.4,1); }
@keyframes landed{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }

/* the round-clear stamp: slams in, holds, goes */
.stamp{
  position: fixed; inset: 0; z-index: 58; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  /* ROUND CLEAR landed on a board still lit up and scoring, so the loudest
     sentence in the game competed with sixty cards for the eye. Take the board
     away for the second it is up. */
  background:
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(60,74,110,.34), transparent 72%),
    rgba(5,6,16,.72);
  backdrop-filter: blur(5px) saturate(.6);
  -webkit-backdrop-filter: blur(5px) saturate(.6);
  animation: stampVeil .22s ease-out;
}
@keyframes stampVeil{ 0%{ opacity:0 } 100%{ opacity:1 } }
.stamp[hidden]{ display: none !important; }
.stamp span{
  font-family: var(--f-display);
  font-size: clamp(30px, 9vw, 62px); letter-spacing: .04em; color: var(--card);
  background: var(--green); border-radius: 10px; padding: 14px 30px;
  box-shadow: 0 7px 0 var(--green-d);
  text-shadow: var(--drop); text-align: center;
  animation: stampIn .62s cubic-bezier(.15,1.7,.35,1) forwards;
}
.stamp.bad span{ background: var(--blind); box-shadow: 0 7px 0 var(--blind-d); }
.stamp.going{ opacity: 0; transition: opacity .3s ease-in; }
@keyframes stampIn{
  0%{ transform: scale(3.2) rotate(-12deg); opacity: 0; }
  38%{ transform: scale(.92) rotate(-3deg); opacity: 1; }
  55%{ transform: scale(1.04) rotate(-3deg); }
  100%{ transform: scale(1) rotate(-3deg); opacity: 1; }
}

/* one flat frame of colour over everything — a hit, not a glow */
.flash{
  position: fixed; inset: 0; z-index: 57; pointer-events: none;
  background: var(--green); animation: flashOut .34s steps(3) forwards;
}
.flash.bad{ background: var(--blind); }
@keyframes flashOut{ 0%{opacity:.6} 100%{opacity:0} }

/* ---------- cards ---------- */
.card{
  touch-action: manipulation;
  /* One height for every card, measured against the worst case the lexicon can
     produce (SANDSTORM, four long overtones, 200px) rather than guessed. Left
     to size themselves cards came out ragged: a word takes one to three lines
     and its tags one row to five, so a hand was seven different rectangles. */
  /* --strip is the band along the bottom that belongs to the value alone.
     The card carries it in ADDITION to its three bands rather than taking it
     out of them: carved out of the tags instead, 91 cards in the lexicon would
     have dropped an overtone to make room for a number. */
  --strip: 17px;
  position:relative; width: 104px; height: 192px;
  background: var(--card); color: var(--card-ink);
  border-radius: 7px; padding: 7px;
  cursor:pointer; user-select:none;
  box-shadow: 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
  transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg));
  transition: transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .12s ease;
}
/* the idle breath sits on an inner layer so it never fights hover or select,
   both of which drive transform on the card itself */
/* Three bands, every one of them the same on every card: the plate, a word
   box two lines tall, and whatever is left for tags. It was a flex column,
   where .art's 56px was a starting size rather than a rule — so a word
   carrying five overtones overflowed the card and flexbox took the difference
   out of the plate, which is why one card in a hand had a 40px plate and its
   neighbour had 56px. Grid rows do not shrink. */
.card-inner{
  display: grid; grid-template-rows: auto auto 1fr;
  gap: 5px; height: 100%;
  padding-bottom: var(--strip);
}
.hand .card .card-inner{
  animation: breathe 3.4s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -0.21s);
}
@keyframes breathe{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-3px); }
}
@media (hover: hover) and (pointer: fine){
  .card:hover{
    transform: translateY(calc(var(--dy, 0px) - 14px)) rotate(0deg) scale(1.06);
    z-index: 5;
  }
  .card.sel:hover{ transform: translateY(calc(var(--dy, 0px) - 32px)) rotate(0deg) scale(1.08); }
  .card.static:hover{ transform: none; z-index: auto; }
  .btn:hover:not(:disabled){ filter: brightness(1.12); }
  .offer:hover:not(:disabled){ filter: brightness(1.12); }
  .chip-btn:hover{ background: var(--panel-2); color:#FFF; }
}
/* touch gets a press state instead — immediate, and it never sticks */
.card:active{ filter: brightness(.94); }
.card.sel{
  transform: translateY(calc(var(--dy, 0px) - 26px)) rotate(var(--rot, 0deg)) scale(1.04);
  box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--card-edge), 0 10px 18px rgba(0,0,0,.5);
  z-index: 4;
}
.card.static{ cursor:default; transform:none; z-index:auto; }
.card.deal{ animation: dealIn .32s cubic-bezier(.2,.95,.3,1) backwards; animation-delay: calc(var(--i,0) * 48ms); }
@keyframes dealIn{
  0%{ opacity:0; transform: translate(-70px, 44px) rotate(-15deg) scale(.84); }
  100%{ opacity:1; transform: translateY(var(--dy,0px)) rotate(var(--rot,0deg)); }
}
.card .art{
  position: relative;
  border-radius: 5px; height: 56px;
  /* One row, two siblings. The badge used to be absolutely positioned over this
     box while the icons were centred in it, so nothing in the layout prevented
     a third icon from running underneath the number — and on a 30px phone
     plate, it did, three separate times.

     .icons takes the slack, which pins the value to the right edge where a
     card's value belongs and centres the icons in what is left. Centring the
     whole row instead left the number floating mid-plate, reading as a fourth
     icon rather than as a value. */
  /* Icons only, centred. The value used to live here too — first beside them,
     then under them — and both cost the icons their centre. It sits on the
     card itself now. */
  display:flex; align-items:center; justify-content:center;
  padding: 0 4px;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
  /* A grid item's automatic minimum size is its MIN-CONTENT, so without this
     the plate refuses to be narrower than its icons and its value badge laid
     out in a row — about 103px — and a 98px card cannot hold it. It does not
     clip either: it paints straight out over the edges of the card, which is
     what "the scaling is coming outside" looked like. As a flex item in a
     column this never came up, because min-width:auto only binds on the main
     axis and the main axis there was vertical. */
  min-width: 0; overflow: hidden;
}
.card .art .icons{
  display:flex; align-items:center; justify-content:center;
  flex: 0 1 auto; min-width: 0; gap: 3px;
  /* Five overtones do not fit a phone plate at any readable icon size. They
     are clipped at the plate's edge rather than allowed outside it — every
     overtone is still written out in full on the tags below. */
  flex-wrap: nowrap; overflow: hidden;
}
.ms{
  font-family: "Material Symbols Rounded";
  font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap;
  word-wrap: normal; direction: ltr; display: inline-block;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  -webkit-font-smoothing: antialiased;
  font-size: 21px; color: #FFF; visibility: hidden;
  text-shadow: var(--drop-sm);
}
.ms-ok .ms{ visibility: visible; }
/* Sized to the room there is. A 104px card leaves the plate 88px, the value
   takes 21 of it, and three icons with their gaps have 55 left — which 21px
   glyphs have never fitted into. They used to paint out over the card instead
   of admitting it. */
.card .art .ms{ font-size: 16px; }
/* The gold disc behind an overtone this round is asking for. It is the one
   thing a player scans a hand for, so it is as big as the plate can carry
   rather than as small as it can be drawn. */
.card .art .ms.hit{
  color:#12181C; background: var(--gold); border-radius: 50%;
  padding: 4px; text-shadow: none;
}
/* dark ink on the bright plates, and invert the match ring so it still reads */
.card .art.light .ms{ color:#12181C; text-shadow: none; }
.card .art.light .ms.hit{ background:#1B1B3A; color: var(--gold); }
.legend{ display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 16px; }
.legend .leg{
  display:inline-flex; align-items:center; gap:5px;
  background: var(--inset); border-radius: 6px; padding: 4px 9px;
  font-size: 11px; font-weight:600; color: var(--text-dim);
}
.legend .ms{ font-size: 17px; color: var(--text-dim); text-shadow:none; }
.card .w{
  font-size: 15px; font-weight:700; line-height:1.05; letter-spacing:-.025em;
  text-transform: uppercase; word-break: break-word; hyphens:auto;
  /* Two lines of room whether the word needs them or not. INHERITANCE takes
     two and ANT takes one, and reserving the pair is what keeps the tags below
     starting on the same line across a hand instead of stepping up and down
     with the length of the word.

     flow-root rather than grid because the value floats in here: a float needs
     a block formatting context to sit in, and floating it is what lets a short
     word share its line while a long one simply wraps beneath it. Nothing is
     reserved and nothing collides.

     A fixed height rather than a minimum: where the number drops to the second
     line the band came out a fraction taller, and 30 cards in a hand of seven
     carried their tags one pixel below their neighbours' — small, but it is
     exactly the raggedness this band exists to remove. */
  display: flow-root; height: 2.1em; overflow: hidden;
  /* No flex:1. Stretching the word to fill the card's slack made its box the
     slack rather than the text, so a three-letter word measured as three lines
     — and the assertion that catches mid-word breaks measures exactly that.
     .tags carries margin-top:auto instead, which does the same job honestly. */
  min-width: 0;
}
/* On the card, beside the word it belongs to, rather than on the coloured
   plate. Floated so that it never takes width from the word: it shares the
   word's line when there is room and drops to the second line of the band —
   which is held open for every card anyway — when there is not. */
.card .wt{ display: inline; }
/* Bottom right, where a card keeps its value. It had been beside the word,
   which cost nothing but reads as part of the name; in the corner it reads as
   what the card is worth. The strip below the tags is what makes it safe —
   floated or absolute, a number in that corner sits on a tag on 7 of the 249
   words unless the row beneath them belongs to it. */
.card .base{
  /* Above the inner column: it animates a transform when the hand breathes,
     which makes it a stacking context of its own. */
  position: absolute; right: 7px; bottom: 5px; z-index: 3;
  font-size: 13px; font-weight:700; color: var(--card-ink);
  font-variant-numeric: tabular-nums; line-height: 1.1;
  opacity: .8;
}
/* Tags fill the band from the top and stop at its edge. Three rows fit
   exactly; the handful of words carrying a fifth overtone lose their last row
   rather than pushing the plate around, and the plate is still showing every
   one of them as an icon. */
.card .tags{
  display:flex; flex-wrap:wrap; gap:3px;
  align-content: flex-start; overflow: hidden;
}
.card .tg{
  font-size: 10px; font-weight:600; letter-spacing:.02em;
  padding: 2px 5px; border-radius: 3px;
  background: #DCD4E0; color: #453F54;
}
.card .tg.match{ background: var(--gold); color:#12181C; font-weight:700; }
.card.interpreted{
  box-shadow: 0 0 0 3px var(--lens), 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
}
.card.interpreted::after{
  content:"\2666"; position:absolute; top:5px; left:6px; font-size:10px; color: var(--lens-d);
}
.card.picked .card-inner{ animation: pickPop .26s cubic-bezier(.2,1.9,.35,1); }
@keyframes pickPop{
  0%{ transform: translateY(0) scale(1); }
  40%{ transform: translateY(-5px) scale(1.07); }
  100%{ transform: translateY(0) scale(1); }
}
.card.scoring{ animation: scorePop .4s cubic-bezier(.2,1.5,.35,1); z-index: 6; }
@keyframes scorePop{
  0%{ transform: translateY(0) scale(1); }
  35%{ transform: translateY(-26px) rotate(-4deg) scale(1.12); }
  65%{ transform: translateY(-6px) rotate(2deg) scale(1.03); }
  100%{ transform: translateY(0) rotate(0) scale(1); }
}

/* --stack is how many labels are already in the air in this host. They live
   900ms and land 130-210ms apart, so up to five share a card at once — and
   every one of them used the same spot, which is how a word with two matching
   overtones printed MATCH +25 exactly on top of MATCH +25. */
.float{
  position:absolute;
  /* Each label rises 60px over its 850ms life, so a vertical step alone still
     lets two born 210ms apart cross. They fan sideways as well. */
  left: calc(50% + (var(--stack, 0) - 1.5) * 34px);
  top: calc(-8px - var(--stack, 0) * 22px);
  transform:translateX(-50%);
  font-size: 14px; font-weight:700; white-space:nowrap; pointer-events:none;
  padding: 3px 9px; border-radius: 5px; z-index: 8;
  text-shadow: var(--drop-sm);
  animation: floatUp var(--flife, .85s) ease-out forwards;
}
.float.c{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.float.m{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.float.r{ background: var(--gold); color:#12181C; box-shadow: 0 3px 0 var(--gold-d); }
/* The figure belongs to the whole hand rather than to any one word, so it gets
   its own lane above the row instead of landing on the first card's labels. */
.float.fig{ top: calc(-40px - var(--stack, 0) * 20px); font-size: 13px; z-index: 9; }
@media (max-width: 620px){ .float.fig{ top: calc(-30px - var(--stack, 0) * 18px); font-size: 11.5px; } }
@keyframes floatUp{
  0%{ opacity:0; transform: translate(-50%,6px) scale(.78); }
  16%{ opacity:1; transform: translate(-50%,-18px) scale(1.1); }
  72%{ opacity:1; transform: translate(-50%,-36px) scale(1); }
  100%{ opacity:0; transform: translate(-50%,-54px) scale(.92); }
}

/* the round's rule, stated dead centre where the eye already is */
.demand-call{ display:flex; flex-direction:column; align-items:center; gap: 12px; }
.dc-icons{ display:flex; gap: 16px; }
.dc-icons .ms{ font-size: 50px; color: var(--gold); text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.dc-text{ font-size: 16px; color:#C9D7E0; text-align:center; max-width: 54ch; }
.dc-text b{ color: var(--gold); }

/* which card is first, second, third — the rule the game kept stating */
.pos{
  position:absolute; top:-9px; left:-7px; z-index:9;
  width:23px; height:23px; border-radius:50%;
  background: var(--gold); color:#12181C;
  font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* a card that can score at all, readable before anything is read */
.card.live::before{
  content:""; position:absolute; left:7px; right:7px; top:3px; height:3px;
  background: var(--gold); border-radius: 2px;
}

.stakes{ color: var(--text-dim); }
.stakes b{ color: var(--gold); }
.fit{
  align-self:flex-start; font-size:11px; font-weight:700;
  background: var(--gold); color:#12181C; border-radius:4px; padding:2px 7px;
}
.offer.flawed{ background: var(--blind); box-shadow: 0 4px 0 var(--blind-d); }
.offer.flawed .od{ color: #FFE2DE; }
/* the arithmetic a player should not have to do in their head */
.reality{
  background: var(--inset); border-radius: 8px; padding: 11px 13px; margin: 0 0 14px;
  box-shadow: 0 3px 0 var(--edge);
}
.reality.short{ background: var(--blind); box-shadow: 0 4px 0 var(--blind-d); }
/* short, but the shelf has the answer on it — a decision, not a death notice */
.reality.near{ background: var(--inset); box-shadow: 0 3px 0 var(--edge); }
.reality.near .rk{ color: var(--gold); }
.reality .rk{
  font-family: var(--f-display); font-size: 11px; letter-spacing:.06em;
  color: var(--green);
}
.reality.short .rk{ color: #FFF; text-shadow: var(--drop-sm); }
.reality .rv{ font-size: 13px; line-height:1.55; color: var(--text-dim); margin-top: 4px; }
.reality .rv b{ color: #FFF; }
.reality.short .rv{ color: #FFE2DE; }

.ordeal-warn.reckon{ background: var(--lens-d); }

.ordeal .why{
  display:inline-block; margin-left: 7px; vertical-align: 1px;
  font-family: var(--f); font-size: 8.5px; font-weight:700; letter-spacing:.08em;
  background: rgba(0,0,0,.34); border-radius: 3px; padding: 1px 5px;
}

.ordeal-warn{
  background: var(--blind); border-radius: 8px; padding: 11px 13px; margin: 0 0 14px;
  box-shadow: 0 4px 0 var(--blind-d);
}
.ordeal-warn .on{
  font-family: var(--f-display); font-size: 12px; color:#FFF; text-shadow: var(--drop-sm);
}
.ordeal-warn .od{ font-size: 13px; line-height:1.5; color:#FFE2DE; margin-top: 4px; }

.panel p.shape{ color: var(--text-dim); font-size: 13.5px; }
.panel p.shape b{ color: var(--gold); }

.sellbtn.arming{
  background: var(--blind); color:#FFF; box-shadow: 0 4px 0 var(--blind-d);
  animation: armPulse .9s ease-in-out infinite;
}
@keyframes armPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.22); } }

.cost-warn{
  align-self:flex-start; font-family: var(--f-display); font-size:10px;
  background: var(--card); color: var(--blind-d); border-radius:4px; padding:2px 7px;
}

/* while a hand is resolving, the board takes the room */
#app.resolving .hand{ opacity: .26; transform: scale(.97); pointer-events: none; }
.hand{
  transition: opacity .2s ease, transform .22s ease,
              max-height .24s ease, padding .24s ease;
}
#app.resolving .stage{ min-height: 280px; }
.stage{ transition: min-height .24s cubic-bezier(.2,.9,.3,1); }

/* ---------- hand + controls ---------- */
.handwrap{ display:flex; flex-direction:column; gap: 22px; }
.hand{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height: 182px;
  align-items:flex-end; padding-top: 30px; padding-bottom: 34px; }
.controls{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
.btn{
  touch-action: manipulation;
  border:none; border-radius: 8px; cursor:pointer;
  padding: 13px 26px; font-size: 15px; font-weight:700; letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--panel-2); color:#FFF;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop);
  transition: background .12s ease, transform .06s ease, box-shadow .12s ease;
}
.btn:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn.primary{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 4px 0 var(--chips-d); }
.btn.primary:active:not(:disabled){ box-shadow: none; }
.btn.danger{ background: var(--mult); box-shadow: 0 4px 0 var(--mult-d); }
.btn.danger:active:not(:disabled){ box-shadow: none; }
.btn.interp{ background: var(--lens); color:#FFF; text-shadow: var(--drop); box-shadow: 0 4px 0 var(--lens-d); }
.btn.interp:active:not(:disabled){ box-shadow: none; }

/* ---------- overlays ---------- */
.veil{
  position: fixed; inset:0; z-index: 80;
  background: rgba(11,11,28,.92);
  display:flex; align-items:center; justify-content:center;
  padding: 18px; overflow-y:auto;
}
.veil[hidden]{ display:none !important; }

/* ---------- the two moments that end something ----------
   A round clearing and a run ending are the only screens a player stops at.
   Everything else — the shop shelf, the Interpreter, the rules — is somewhere
   they are passing through. These two get the board taken away properly:
   darker, blurred back, and a light behind the panel so the eye lands on the
   number rather than wandering over the cards it can no longer use. */
.veil.moment{
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(70,84,120,.30), transparent 70%),
    rgba(5,6,16,.965);
  backdrop-filter: blur(7px) saturate(.55);
  -webkit-backdrop-filter: blur(7px) saturate(.55);
  animation: veilIn .3s ease-out;
}
@keyframes veilIn{ 0%{ opacity:0 } 100%{ opacity:1 } }
.veil.moment .panel{
  box-shadow: 0 5px 0 var(--edge), 0 26px 70px rgba(0,0,0,.55);
}
/* The headline is the sentence the run ended on; give it the room it earns. */
.veil.moment .panel h2{ font-size: 30px; animation: heroIn .42s cubic-bezier(.2,1.3,.4,1) both; }
.veil.moment .panel > .sub{ animation: heroIn .42s .06s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes heroIn{ 0%{ opacity:0; transform: translateY(9px) } 100%{ opacity:1; transform:none } }

/* The one number a player is actually here for. */
.veil.moment .stat.gold{
  background: linear-gradient(180deg, rgba(239,163,29,.16), rgba(239,163,29,.06));
  box-shadow: inset 0 0 0 1px rgba(239,163,29,.34);
  animation: heroIn .42s .12s cubic-bezier(.2,1.3,.4,1) both;
}
.veil.moment .stat.gold .v{ font-size: 30px; }
.veil.moment .unlock{ animation: heroIn .42s .18s cubic-bezier(.2,1.3,.4,1) both; }

@media (max-width: 620px){
  .veil.moment .panel h2{ font-size: 23px; }
  .veil.moment .stat.gold .v{ font-size: 25px; }
}
@media (max-height: 500px) and (orientation: landscape){
  .veil.moment .panel h2{ font-size: 20px; }
  .veil.moment .stat.gold .v{ font-size: 21px; }
}
.panel{
  background: var(--panel); border-radius: 9px; padding: 22px;
  max-width: 640px; width:100%;
  box-shadow: 0 5px 0 var(--edge);
  max-height: calc(100vh - 36px); overflow-y:auto;
  animation: panelIn .26s cubic-bezier(.2,1.4,.4,1);
}
@keyframes panelIn{ 0%{transform:scale(.93) translateY(12px); opacity:0} 100%{transform:none; opacity:1} }
.panel h2{
  margin:0 0 4px; font-size: 26px; font-weight:700;
  text-shadow: var(--drop); text-wrap: balance;
}
.panel .sub{ font-size: 13px; color: var(--text-faint); margin-bottom: 15px; letter-spacing:.05em; }
.panel p{ color: var(--text-dim); margin: 0 0 12px; max-width: 60ch; font-size: 14px; line-height:1.65; }
.panel p b, .panel li b{ color:#FFF; font-weight:700; }
.panel p.gold{ color: var(--gold); }

.offers{ display:grid; grid-template-columns: repeat(auto-fit, minmax(172px,1fr)); gap:10px; margin: 14px 0; }
.offer{
  background: var(--lens); border:none; border-radius: 8px; padding: 12px;
  display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  box-shadow: 0 4px 0 var(--lens-d);
  transition: transform .07s ease, filter .12s ease;
}
.offer:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.offer:disabled{ opacity:.4; cursor:not-allowed; }
.offer .on{ font-size: 13px; font-weight:700; color:#FFF; text-shadow: var(--drop-sm); }
.offer .od{ font-size: 12px; color:#2A1C46; line-height:1.45; flex:1; }
.offer .oc{ font-size: 14px; font-weight:700; color: var(--gold); text-shadow: var(--drop-sm); }

.owned{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.own{
  display:flex; align-items:center; gap:12px;
  background: var(--lens); border-radius:8px; padding:10px 12px;
  box-shadow: 0 3px 0 var(--lens-d);
}
.own.flaw{ background: var(--blind); box-shadow: 0 3px 0 var(--blind-d); }
.own .ow{ flex:1; min-width:0; }
.own .on{ font-family: var(--f-display); font-size:12px; color:#FFF; text-shadow: var(--drop-sm); }
.own .od{ font-size:12px; line-height:1.4; color:#2A1C46; margin-top:3px; }
.own.flaw .od{ color:#FFE2DE; }
.own .grown{
  font-family: var(--f-display); font-size:10.5px; margin-top:5px;
  display:inline-block; background: var(--gold); color:#12181C;
  border-radius:4px; padding:2px 7px; box-shadow: 0 2px 0 var(--gold-d);
}
.sellbtn{
  flex:none; padding:10px 14px; font-size:12px; min-height:42px;
  background: var(--panel-2); box-shadow: 0 4px 0 var(--edge);
}
@media (max-width: 620px){
  .own{ flex-wrap:wrap; gap:8px; padding:9px 10px; }
  .own .od{ font-size:11.5px; }
  .sellbtn, .sellbtn{ width:100%; }
  .own .sellbtn{ flex:1 1 100%; }
}

.rowend{ display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:10px; }
.rowend.end{ justify-content: flex-end; }
.purse{ font-size: 17px; font-weight:700; color: var(--gold); text-shadow: var(--drop); }

.share{
  font-size: 13px; line-height:1.7; background: var(--inset); border-radius: 8px;
  padding: 12px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word;
  margin: 12px 0;
}
.stat-row{ display:grid; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:14px 0; }
.stat{ background: var(--inset); border-radius:8px; padding:10px 12px; }
.stat .k{ font-size:11.5px; color:var(--text-faint); }
.stat .v{ font-size:22px; font-weight:700; text-shadow: var(--drop); font-variant-numeric:tabular-nums; line-height:1.2; }
.stat.gold .v{ color: var(--gold); }
/* The multiplier that hand ran at, beside what it scored. The record used to
   be the multiplier alone, which picked a thin line with a freak multiplier
   over the run's actual best hand. */
.stat .v .bh{ font-size: 13px; font-weight: 700; color: var(--mult); margin-left: 7px; }

.unlock{
  background: var(--lens); border-radius:8px; padding:12px 14px; margin:14px 0;
  box-shadow: 0 4px 0 var(--lens-d);
}
.unlock .k{ font-size:11.5px; color:#D8CCF5; letter-spacing:.06em; }
.unlock .v{ font-size:15px; font-weight:700; color:#FFF; margin-top:3px; text-shadow: var(--drop-sm); }
.unlock .d{ font-size:12.5px; color:#E3DAF8; margin-top:3px; }
/* the difficulty that just opened is not a Lens, and should not read as one */
.unlock.open{ background: var(--green); box-shadow: 0 4px 0 var(--green-d); }
.unlock.open .k{ color:#0A2E21; }
.unlock.open .v{ color:#08241A; text-shadow:none; }
.unlock.open .d{ color:#0D3728; }
.unlock.open .btn{ margin-top: 10px; background: var(--felt-d); box-shadow: 0 4px 0 var(--edge); }

#interpInput{
  width:100%; padding: 13px 14px; font-family: var(--f-display);
  font-size: 22px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  background: var(--card); color: var(--card-ink);
  border: none; border-radius: 8px;
}
#interpInput::placeholder{ color: var(--card-dim); font-weight:600; text-transform:none; font-size:18px; }
.appraisal{ display:flex; gap:14px; align-items:center; margin:14px 0; min-height: 150px; }
.appraisal .say{ font-size: 13px; color: var(--text-dim); line-height:1.55; }
.appraisal .say .src{ display:block; font-size:11px; color: var(--text-faint); margin-top:8px; letter-spacing:.04em; }
.appraisal:has(.interp-pick){ display:block; }
.interp-pick .sub{ margin: 10px 0 7px; }
.pickgrid{
  display:grid; gap:5px; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
}
.pickopt{
  display:flex; align-items:center; gap:6px; min-height:40px; padding:7px 9px;
  border:0; border-radius:6px; cursor:pointer; text-align:left;
  background: var(--inset); color: var(--text-dim);
  font-family: var(--f); font-size:11.5px; font-weight:600; letter-spacing:.03em;
  box-shadow: 0 2px 0 var(--edge);
}
.pickopt .lbl{ flex:1; }
.pickopt .ms{ font-size:15px; line-height:1; }
.pickopt:hover{ color:#FFF; }
.pickopt[aria-pressed="true"]{
  background: var(--gold); color:#12181C; box-shadow: 0 3px 0 var(--gold-d);
}
.pickopt:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }
.pickopt:active{ transform: translateY(2px); box-shadow:none; }
.helplist{ margin:0 0 14px; padding-left:18px; color: var(--text-dim); font-size:14px; line-height:1.65; }
.helplist li{ margin-bottom:7px; }

.why{
  background: var(--inset); border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0; padding: 13px 15px; margin: 12px 0 18px;
}
.why p{ margin: 0 0 9px; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
.why p:last-child{ margin-bottom: 0; }
.why b{ color: #FFF; }
.teach{ display:flex; flex-direction:column; gap:13px; margin: 4px 0 16px; }
.teach-row{ display:flex; gap:12px; align-items:flex-start; }
.teach-row > div:not(.teach-n){ flex:1; display:flex; flex-direction:column; gap:9px; }
.teach-n{
  flex:none; width:28px; height:28px; border-radius:6px;
  background: var(--chips); color:#06233D; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 3px 0 var(--chips-d); text-shadow: var(--drop-sm);
}
.teach-row p{ margin:0; font-size:14px; line-height:1.6; }
.gold{ color: var(--gold); }
.worked{
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  background: var(--inset); border-radius:8px; padding: 14px; margin-bottom: 14px;
}
.worked-sum{ font-size:13.5px; line-height:1.7; color: var(--text-dim); min-width: 210px; flex:1; }
.worked-sum b{ color:#FFF; }
.worked-tot{ display:block; margin-top:6px; font-size:18px; font-weight:700; color: var(--gold); }

.setrow{
  display:flex; align-items:center; justify-content:space-between; gap: 14px;
  background: var(--inset); border-radius: 8px; padding: 12px 14px; margin-bottom: 9px;
}
.setrow .sl{ font-size: 14px; font-weight: 600; }
.setrow .sd{ font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.switch{
  flex: none; border: none; cursor: pointer; border-radius: 7px;
  min-width: 74px; min-height: 40px; padding: 0 14px;
  font-family: var(--f-display); font-size: 13px; letter-spacing: .04em;
  background: var(--panel-2); color: var(--text-dim);
  box-shadow: 0 3px 0 var(--edge); text-shadow: var(--drop-sm);
}
.switch[aria-pressed="true"]{ background: var(--green); color:#08241A; text-shadow:none; box-shadow: 0 3px 0 var(--green-d); }
.switch:active{ transform: translateY(3px); box-shadow: none; }

/* ---------- how loud ----------
   Flat track, hard-lipped thumb, same two objects as every other control.
   The input is 30px tall and invisible; only the track inside it is drawn,
   so a finger gets a real target and the row still reads as a thin line. */
.setrow .sinfo{ flex: 1; min-width: 0; }
.vol{ display: flex; align-items: center; gap: 12px; margin-top: 7px; }
.vol input[type="range"]{
  -webkit-appearance: none; appearance: none;
  flex: 1; min-width: 0; height: 30px; margin: 0;
  background: transparent; cursor: pointer;
}
.vol input[type="range"]::-webkit-slider-runnable-track{
  height: 6px; border-radius: 3px; background: var(--edge);
}
.vol input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance: none; appearance: none; border: 0;
  width: 18px; height: 18px; margin-top: -6px; border-radius: 5px;
  background: var(--panel-2); box-shadow: 0 2px 0 var(--edge);
}
.vol input[type="range"]::-moz-range-track{
  height: 6px; border-radius: 3px; background: var(--edge);
}
.vol input[type="range"]::-moz-range-thumb{
  border: 0; width: 18px; height: 18px; border-radius: 5px;
  background: var(--panel-2); box-shadow: 0 2px 0 var(--edge);
}
.vol input[type="range"]:focus-visible{ outline: 3px solid var(--gold); outline-offset: 3px; }
.vol .volv{
  flex: none; width: 30px; text-align: right;
  font-family: var(--f-display); font-size: 12px; color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}
/* Muted, the level is still true and still there - it is just not the
   thing you are able to change until the sound is back on. */
.vol.off{ opacity: .34; }
.vol.off input[type="range"]{ cursor: not-allowed; }

.kbd{
  display:inline-block; font-size:11.5px; font-weight:700; padding:2px 7px;
  border-radius:4px; background: var(--inset); color:#FFF;
  box-shadow: 0 2px 0 var(--edge);
}
.coach{
  align-self:center; background: var(--gold); color:#12181C;
  border-radius: 8px; padding: 10px 18px; max-width: 52ch;
  text-align:center; font-size: 14px; font-weight:700; line-height:1.4;
  box-shadow: 0 4px 0 var(--gold-d);
  animation: coachIn .24s ease-out;
}
.coach[hidden]{ display:none !important; }
@keyframes coachIn{ 0%{opacity:0; transform:translateY(-7px)} 100%{opacity:1; transform:none} }
.hint-pulse{ animation: hintPulse 1.4s steps(2) infinite; }
@keyframes hintPulse{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.35); }
}
/* Announced, never drawn. */
.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0;
}
/* A line the player wrote, offered back to them. It is not for sale, so it
   does not wear a price. */
.keeps{ display:grid; grid-template-columns: repeat(auto-fit, minmax(172px,1fr)); gap:10px; margin: 4px 0 2px; }
.offer.keep{ box-shadow: 0 3px 0 var(--gold-d); background: rgba(239,163,29,.13); }
.offer.keep .on{ font-size: 13px; letter-spacing: .04em; }
.offer.keep .oc{ color: var(--gold); }
.own.kept .on{ color: var(--gold); }

/* A worked example that is two cards rather than one, because one word does
   nothing in this game. */
.worked.join{ flex-wrap: wrap; }
.worked.join .card.static{ margin-right: 8px; }

/* ---------- what two words are doing ---------- */
.jn{
  font-style: normal; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 700; padding: 2px 7px; border-radius: 4px;
  background: var(--inset); color: var(--text-dim);
}
.jn.resonance{ background: rgba(0,147,255,.22); color: #9ED2FF; }
.jn.tension{ background: rgba(239,163,29,.22); color: var(--gold); }
.jn.paradox{ background: rgba(155,123,224,.26); color: var(--lens-lit); }
.jn.silence{ background: rgba(254,95,85,.18); color: var(--mult); }
.jnx{ color: var(--text-faint); margin: 0 5px; font-weight: 400; }
.stage-hint .stops{ color: var(--mult); font-weight: 700; }
.stage-hint .room{ color: var(--text-faint); }

/* A word this profile has never played keeps its shape and loses its rings. */
.card .art.unknown{ box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.card .tg.unknown{
  background: transparent; color: var(--card-dim);
  box-shadow: inset 0 0 0 1px var(--card-edge);
  letter-spacing: .06em; font-size: 8.5px;
}

/* ---------- the title screen ----------
   Two objects and the identity, instead of five rows speaking five visual
   languages. THE DOOR is PLAY with the two things pressing PLAY will actually
   do folded inside it — how hard, and what it carries in — one line each and
   no prose. THE SHELF under it is the four ways off this screen, as text,
   because they are a footer and not four slabs competing with PLAY.

   And beside them, THE DEAL: three cards of the hand the run actually starts
   with. They cost nothing — newRun() has already dealt them before the menu
   is shown — and they are the one thing only this game could put on its front
   door. They also teach the card before the tutorial does.

   Written to the rules at the top of this file, which the old title screen
   broke on every line: flat fills, hard shadows, colour as information. Blue
   is the door, gold is where you are standing, and nothing else here spends a
   colour at all. */
.title{
  /* Under the veil on purpose: a panel opened FROM the menu has to sit on top
     of it, or reading the rules shows you a dimmed rectangle behind the menu
     you were just looking at. Above the tutorial, which must never run here. */
  position: fixed; inset: 0; z-index: 72;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 26px clamp(18px, 5vw, 64px);
  overflow-y: auto;
  background: var(--bg);
}
/* Centred only where centring cannot clip: a flex item with auto margins in a
   scroller loses its own top once the content outgrows the box. */
@media (min-height: 720px){ .title{ align-items: center; } }
.title[hidden]{ display:none !important; }
/* One ambient light so the screen has a middle, in place of the scanline and
   vignette stack that used to sit here. */
.title::before{
  content:""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(0,147,255,.08), transparent 66%);
}
.title-card{
  position: relative; z-index: 2;
  width: 100%; max-width: 900px; margin: auto 0;
  display: grid; grid-template-columns: minmax(0, 400px) auto;
  justify-content: center; align-items: center; gap: 0 52px;
  animation: titleIn .45s cubic-bezier(.2,1,.3,1) both;
}
/* No hand to show — a finished run's cards are not today's opening hand and
   saying so would be a lie. The column closes rather than standing empty. */
.title-card.solo{ grid-template-columns: minmax(0, 430px); }
@keyframes titleIn{ 0%{ opacity:0; transform: translateY(14px) } 100%{ opacity:1; transform:none } }

.title-head{ margin: 0 0 22px; }
.title .title-mark{
  font-size: clamp(34px, 6vw, 58px); margin: 0; letter-spacing: .04em;
  text-shadow: 4px 4px 0 var(--mult);
}
.tagline{
  margin: 8px 0 0; color: var(--text-faint);
  font-size: 12px; letter-spacing: .13em; text-transform: uppercase;
}

/* ---------- the door ---------- */
.door{
  background: var(--panel); border-radius: 9px; padding: 9px;
  box-shadow: 0 5px 0 var(--edge);
}
.go{
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; border: 0; cursor: pointer; text-align: left;
  padding: 17px 18px; border-radius: 7px;
  background: var(--chips); color: #06233D;
  box-shadow: 0 5px 0 var(--chips-d);
  font-family: var(--f-display); font-size: 21px; letter-spacing: .05em;
  transition: filter .12s ease, transform .06s ease, box-shadow .12s ease;
}
.go .d{
  font-family: var(--f); font-size: 11px; font-weight: 700; letter-spacing: .1em;
  opacity: .72; font-variant-numeric: tabular-nums;
}
.go:hover, .go.sel{ filter: brightness(1.1); }
.go:active{ transform: translateY(5px); box-shadow: none; }
.go:focus-visible{ outline: 3px solid var(--gold); outline-offset: 3px; }
/* The second door, for a run there is something to come back to. Same object,
   quieter, because a new run is not what somebody pressing HOME came for. */
.go.alt{
  margin-top: 7px; padding: 12px 18px; font-size: 15px;
  background: var(--panel-2); color: #FFF; text-shadow: var(--drop-sm);
  box-shadow: 0 4px 0 var(--edge);
}
.go.alt:active{ transform: translateY(4px); }

/* the two lines inside the door: what PLAY is about to do */
.setup{ margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
.set{
  display: flex; align-items: center; gap: 10px;
  background: var(--inset); border-radius: 6px; padding: 7px 7px 7px 12px;
  box-shadow: inset 0 2px 0 rgba(0,0,0,.35);
  transition: box-shadow .12s ease;
}
/* Where the arrow keys are standing. A bar rather than a ring, because the
   pill inside the row carries a gold focus ring of its own and two frames
   round the same thing is one too many. */
.set.sel{ box-shadow: inset 3px 0 0 var(--gold), inset 0 2px 0 rgba(0,0,0,.35); }
.set > .k{
  flex: none;
  font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--text-faint);
}
.segs{ display: flex; gap: 3px; margin-left: auto; }
.diffopt{
  display: flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 34px; padding: 8px 13px;
  border: 0; border-radius: 5px; cursor: pointer; background: transparent;
  font-family: var(--f-display); font-size: 11.5px; letter-spacing: .06em;
  color: var(--text-faint); text-shadow: var(--drop-sm);
  transition: background .12s ease, color .12s ease;
}
.diffopt:hover{ color: #FFF; }
.diffopt[aria-pressed="true"]{ background: var(--panel-2); color: #FFF; }
.diffopt:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }
/* what is not yours yet, marked on the thing it is not */
.diffopt .tip{
  font-size: 8.5px; letter-spacing: .1em; text-shadow: none;
  background: rgba(112,136,154,.45); color: var(--text-dim);
  border-radius: 3px; padding: 2px 5px;
}
.diffopt:disabled{ cursor: not-allowed; color: #4D6172; }
.diffopt:disabled:hover{ color: #4D6172; }

/* the Lens the last finished run handed forward, named before PLAY rather
   than discovered on the board */
.carry .v{
  font-family: var(--f-display); font-size: 12.5px; letter-spacing: .04em;
  color: var(--lens-lit); text-shadow: var(--drop-sm);
}
/* Left behind, it is still the word for what you are leaving behind, so it
   stays on the row and gets struck through rather than disappearing. */
.carry .v.off{ color: var(--text-faint); text-decoration: line-through; }
.swap{
  margin-left: auto; border: 0; cursor: pointer; border-radius: 5px;
  background: var(--panel); color: var(--text-dim);
  font-family: var(--f); font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 8px 12px; min-height: 34px;
}
.swap:hover{ background: var(--panel-2); color: #FFF; }
.swap:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }
.lens.static{ cursor: default; margin: 12px 0; }

/* the one line of consequence, under the door rather than inside it */
.setnote{ font-size: 12.5px; color: var(--text-faint); margin: 0 0 15px; }
.title .setnote{ margin: 11px 2px 0; font-size: 12px; line-height: 1.55; }

/* ---------- the shelf ---------- */
.shelf{ margin: 24px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; }
.shelf button{
  border: 0; background: none; cursor: pointer; padding: 7px 9px; border-radius: 5px;
  font-family: var(--f); font-size: 13px; font-weight: 600; color: var(--text-faint);
  transition: color .12s ease, background .12s ease;
}
.shelf button:hover, .shelf button.sel{ color: #FFF; background: rgba(255,255,255,.06); }
.shelf button:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }
.shelf i{ color: var(--panel); font-style: normal; }

/* ---------- what the game has been keeping ---------- */
/* A roguelite that keeps your record in localStorage and never shows it to you
   is keeping a secret for no reason. One line, and only the numbers that
   exist: an empty BEST on a front door is dead weight. */
.title .runstat{
  margin: 14px 0 0; font-size: 13px; color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.runstat b{
  font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--text-dim);
}

/* ---------- the deal ---------- */
.opening{
  display: flex; flex-direction: column; align-items: center; justify-self: center;
  gap: 20px;
}
.opening[hidden]{ display: none; }
.fan{ display: flex; justify-content: center; }
.opening .card{
  margin: 0 2px; cursor: default;
  /* .card.static turns the transform off, and a fan is nothing but transform */
  transform-origin: 50% 120%;
  transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg));
  box-shadow: 0 4px 0 var(--card-edge), 0 9px 18px rgba(0,0,0,.45);
}
.opening .cap{
  font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--text-faint); text-align: center;
}
/* The board shrinks its cards on a phone down to 74x98, because seven of them
   have to fit above the controls. Three do not, and the whole point of putting
   them here is that a new player reads one before the tutorial hands them
   seven — so the deal holds the card at the size it was drawn at, on every
   screen. Every one of these outranks the responsive rule it is undoing on
   specificity rather than on order. */
.opening .card{
  width: 104px; height: 192px; min-height: 0;
  padding: 7px; border-radius: 7px; --strip: 17px;
}
.opening .card-inner{ gap: 5px; }
.opening .card .art{ height: 56px; flex: none; border-radius: 5px; padding: 0 4px; }
.opening .card .art .icons{ gap: 3px; }
.opening .card .art .ms{ font-size: 16px; }
.opening .card .w{ font-size: 15px; }
.opening .card .base{ font-size: 13px; right: 7px; bottom: 5px; }
.opening .card .tags{ flex: initial; height: auto; gap: 3px; }
.opening .card .tg{ font-size: 10px; padding: 2px 5px; letter-spacing: .02em; line-height: normal; }

/* On a phone the deal goes on top, where it is the first thing seen, and the
   caption goes: three cards over the word OVERTONE need no label. */
@media (max-width: 880px){
  .title-card{ grid-template-columns: minmax(0, 1fr); max-width: 430px; gap: 0; }
  .opening{ order: -1; margin-bottom: 20px; }
  .opening .cap{ display: none; }
}
@media (max-width: 420px){
  .fan{ transform: scale(.88); transform-origin: top center; height: 176px; }
}
/* A title screen with PLAY below the fold is the one layout failure a menu
   cannot have. A short screen is a wide screen turned on its side: the deal
   comes out, and the name goes beside the door rather than above it. */
@media (max-width: 560px){
  .shelf{ gap: 2px 8px; }
  .shelf button{ font-size: 12.5px; padding: 7px 5px; }
  .shelf i{ display: none; }
}
/* Compact enough that centring cannot clip: the deal is out and the whole
   screen is two short columns. */
@media (max-height: 620px) and (min-height: 340px){ .title{ align-items: center; } }
@media (max-height: 620px){
  .title{ padding: 14px clamp(14px, 5vw, 60px); }
  .opening{ display: none; }
  .title-card, .title-card.solo{
    grid-template-columns: minmax(0, 1fr); max-width: 780px;
  }
  .title-side{
    display: grid; align-items: center; gap: 0 28px;
    grid-template-columns: minmax(0, 230px) minmax(0, 1fr);
  }
  .title-head{ margin: 0; }
  .title .title-mark{ font-size: clamp(24px, 4vw, 34px); text-shadow: 3px 3px 0 var(--mult); }
  .tagline{ font-size: 10.5px; }
  .title .runstat{ margin-top: 10px; font-size: 11px; }
  .runstat b{ font-size: 13px; }
  .door{ padding: 7px; }
  .go{ padding: 12px 14px; font-size: 16px; }
  .go.alt{ padding: 10px 14px; font-size: 13px; }
  .setup{ margin-top: 7px; }
  .shelf{ margin-top: 13px; }
  .title .setnote{ margin-top: 8px; font-size: 11px; }
}
@media (max-height: 620px) and (max-width: 660px){
  .title-side{ grid-template-columns: minmax(0, 1fr); }
  .title-head{ margin: 0 0 14px; }
}

#menuBtn, #homeBtn{ display:inline-flex; align-items:center; gap:7px; }
#menuBtn .ham{ font-size: 15px; line-height:1; }
/* Sound lived on its own button and took its mute state with it when it moved
   into the menu. The state still has to be visible from the board. */
#menuBtn .mute{
  font-size: 9px; line-height:1; letter-spacing:.09em; color: var(--mult);
  font-weight: 700; margin-left: -2px;
}
#menuBtn .mute[hidden]{ display:none; }

/* offered on the result screen to somebody the curve is beating, not to everyone */
.softer{
  background: var(--inset); border-radius:8px; padding: 12px 14px; margin: 14px 0;
  box-shadow: 0 3px 0 var(--edge);
}
.softer .k{ font-family: var(--f-display); font-size:11px; letter-spacing:.06em; color: var(--gold); }
.softer p{ margin: 5px 0 10px; font-size: 13.5px; }

.toast{
  position: fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background: var(--panel); color:#FFF; font-size:14px; font-weight:600;
  padding: 11px 20px; border-radius:8px; z-index:60;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop-sm);
}
.toast[hidden]{ display:none !important; }

/* ---------- desktop: use the room, and stop the felt eating it ----------
   #app is min-height:100vh with .table and .stage both flex:1, so on a tall
   monitor the stage absorbed every spare pixel — a 500px empty slab that
   pushed the hand away from the board and made all the type look small.
   Let the content be its natural height and centre the whole thing. */
@media (min-width: 1240px) and (min-height: 860px){
  #app{ max-width: 1320px; gap: 14px; justify-content: center; }
  .table{ flex: 0 0 auto; grid-template-columns: 268px 1fr; gap: 14px; }
  .stage{ flex: 0 0 auto; min-height: 240px; }

  /* bigger cards: the thing players actually read */
  /* 216 rather than 220: the tag band has to come out an exact multiple of a
     tag row, or a fourth row starts inside it and gets sliced through. */
  .card{ width: 122px; height: 216px; padding: 8px; --strip: 19px; }
  .card .art{ height: 68px; padding: 0 5px; }
  .card .art .icons{ gap: 4px; }
  .card .art .ms{ font-size: 20px; }
  .card .art .ms.hit{ padding: 5px; }
  .card .w{ font-size: 16px; }
  .card .tg{ font-size: 11px; }
  .card .base{ font-size: 14px; right: 8px; bottom: 6px; }
  /* 28/28 rather than 28/30: at exactly 1280x860 -- the shortest viewport this
     breakpoint admits -- the board came out 862px tall and PLAY hung two pixels
     under the fold. */
  .hand{ min-height: 0; gap: 10px; padding-top: 28px; padding-bottom: 28px; }
  .pos{ width: 26px; height: 26px; font-size: 14px; top: -10px; left: -8px; }

  /* the round's rule, at the size it deserves */
  .dc-icons .ms{ font-size: 54px; }
  .dc-icons{ gap: 22px; }
  .dc-text{ font-size: 18px; max-width: 56ch; }
  .demand-call{ gap: 13px; }
  .stage-hint{ font-size: 16px; }
  .stage-hint .hand-name{ font-size: 19px; padding: 6px 20px; }

  /* the sidebar has the width to be read at a glance */
  .blind-badge{ font-size: 19px; padding: 12px 9px; }
  .blind-wants .w{ font-size: 12px; padding: 3px 9px; }
  .blind-req .v{ font-size: 34px; }
  .blind-req .k, .roundscore .k, .meter .k{ font-size: 13px; }
  .roundscore .v{ font-size: 30px; }
  .tally .chips, .tally .multv{ font-size: 28px; padding: 10px 5px; }
  .meter .v{ font-size: 27px; }
  .money{ font-size: 28px; }

  .lens{ min-width: 134px; max-width: 186px; padding: 8px 10px; }
  .lens .n{ font-size: 13px; }
  .lens .d{ font-size: 12px; }
  .lensbar-head{ font-size: 13px; }

  .btn{ font-size: 16px; padding: 13px 28px; }
  .coach{ font-size: 15px; padding: 11px 22px; }
}

/* ---------- narrow: sidebar becomes a HUD strip ----------
   Above this the sidebar sits beside the board, which only works once the
   board is wide enough for all seven cards in one row (776px of hand plus
   the 232px sidebar and gaps). Below it, the HUD goes horizontal and the
   board gets the full width. */
@media (max-width: 1080px){
  .table{ grid-template-columns: 1fr; }
  .sidebar{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 9px; align-items:start; }
  .meters{ display: contents; }
  .blind{ grid-column: 1 / -1; order:1; }
  .tally{ grid-column: 1 / -1; order:2; }
  .roundscore{ order:3; }
  .meter.plays{ order:4; }
  .meter.disc{ order:5; }
  .money{ order:6; }
  .runinfo{ grid-column: 1 / -1; order:7; }
  .stage{ min-height: 196px; }
}

/* ---------- phone, portrait: one screen, thumb-sized targets ----------
   Written against 375x640 — smaller than any phone the game is likely to meet
   — and every band except the stage and the hand is given a fixed budget, so
   the two that carry the game are the two that get the slack.

     header 32 · round 58 · score 56 · meters 34 · lenses 44
     stage  flex, 118 floor · hand 2 rows · controls 56 pinned

   The controls are pinned rather than measured: phone heights vary far more
   than widths (a Pixel 5 is 117px shorter than an iPhone 14), and pinning is
   the only version that cannot put PLAY below the fold on a device I have
   not seen. */
@media (max-width: 620px){
  html{ -webkit-text-size-adjust: 100%; }
  body{ overscroll-behavior-y: contain; }
  #app{
    min-height: 100dvh; padding-inline: 9px; padding-block: 6px 0; gap: 6px;
  }
  .masthead{ gap: 8px; }
  .wordmark{ font-size: 19px; text-shadow: 2px 2px 0 var(--mult); }
  .chip-btn{ padding: 8px 11px; font-size: 12px; min-height: 34px; }
  .chip-btn .long{ display: none; }
  .chip-btn .short{ display: inline; font-size: 15px; line-height: 1; }
  .mast-actions{ gap: 6px; }

  .table{ gap: 6px; }
  .sidebar{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  /* run info first, as one quiet line of context */
  .runinfo{ grid-column: 1 / -1; order: 0; font-size: 10px; padding: 0 2px; }

  /* what the round wants, and what it costs */
  .blind{
    grid-column: 1 / -1; order: 1;
    padding: 7px 9px; text-align:left;
    display:grid; grid-template-columns: 1fr auto; gap: 4px 9px; align-items:center;
  }
  .blind-badge{ font-size: 13px; padding: 6px 8px; grid-column: 1; }
  .blind-wants{ justify-content:flex-start; margin-top: 0; grid-column: 1; gap: 4px; }
  .blind-wants .w{ font-size: 10px; padding: 2px 6px; }
  .blind-req{ margin-top: 0; text-align:right; grid-column: 2; grid-row: 1 / span 2; }
  .ordeal{ grid-column: 1 / -1; margin-top: 2px; padding: 5px 8px; }
  .ordeal .on{ font-size: 10px; }
  .ordeal .od{ font-size: 10.5px; line-height: 1.3; margin-top: 2px; }
  .blind-req .k{ font-size: 9.5px; line-height: 1.3; }
  .blind-req .v{ font-size: 21px; }
  .progress{ grid-column: 1 / -1; margin-top: 0; height: 6px; }

  .tally{ grid-column: 1 / -1; order: 2; padding: 5px 6px 6px; }
  .tally .chips, .tally .multv{ font-size: 20px; padding: 5px 3px; }
  .tk{ font-size: 8.5px; margin-bottom: 2px; }
  .tally .x{ padding-bottom: 7px; }

  /* score · plays · discards · purse, one thin strip */
  .roundscore{ order: 3; }
  .meter.plays{ order: 4; }
  .meter.disc{ order: 5; }
  .money{ order: 6; }
  .roundscore, .meter, .money{ padding: 4px 3px; text-align:center; }
  .roundscore .k, .meter .k{ font-size: 9px; letter-spacing: .03em; }
  .roundscore .v, .meter .v, .money{ font-size: 16px; line-height: 1.25; }
  .money{ padding-top: 13px; }

  .lensbar{ padding: 4px 8px 5px; }
  .lensbar-head{ font-size: 10px; margin-bottom: 3px; }
  .lensbar-head b{ font-size: 11px; }
  .rail{
    flex-wrap: nowrap; overflow-x: auto; min-height: 42px; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  /* An opened Lens stays on the one row the portrait budget allows for it.
     Letting the rail wrap instead grew it by 53px, which is enough to push the
     hand's second row back behind the pinned controls. It stops just short of
     full width so the next Lens peeks in and the rail still reads as one you
     can swipe. */
  .rail::-webkit-scrollbar{ display: none; }
  .lens{ flex: 0 0 auto; min-width: 122px; max-width: 150px; padding: 6px 8px; }
  .lens.open{ min-width: 86%; max-width: none; }
  .lens .n{ font-size: 11px; }
  .lens .d{
    font-size: 10px; line-height: 1.3;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .rail-empty{ white-space: normal; font-size: 11px; line-height: 1.35; }

  /* The picked words go up to the board here, the way they do on a desktop —
     but small. At full size they were 240px of portrait spent drawing the very
     same cards the hand was already showing selected, numbered and raised,
     which is what pushed the hand's second row under the pinned controls; not
     drawn at all, tapping a card sent it nowhere and the board looked broken.

     A stage that is picking holds one short line of text in a hundred pixels
     of felt, so these fit in the room already there: the plate, its overtones
     and the word, in the order they will score. During resolution the hand
     folds away and the cards come back full size. */
