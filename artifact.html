  #app:not(.resolving) #stageCards{ gap: 5px; align-items: flex-end; }
  #app:not(.resolving) #stageCards .card{
    width: 54px; height: 37px; padding: 3px; border-radius: 5px;
    box-shadow: 0 2px 0 var(--card-edge);
  }
  #app:not(.resolving) #stageCards .card .card-inner{ gap: 2px; padding-bottom: 0; }
  #app:not(.resolving) #stageCards .card .art{ height: 17px; padding: 0 2px; border-radius: 3px; }
  #app:not(.resolving) #stageCards .card .art .ms{ font-size: 9px; }
  #app:not(.resolving) #stageCards .card .art .ms.hit{ padding: 2px; }
  #app:not(.resolving) #stageCards .card .art .icons{ gap: 1px; }
  #app:not(.resolving) #stageCards .card .w{
    font-size: 7.5px; height: auto; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #app:not(.resolving) #stageCards .card .tags,
  #app:not(.resolving) #stageCards .card .base{ display: none; }
  #app:not(.resolving) #stageCards .card .pos{
    width: 14px; height: 14px; font-size: 9px; top: -5px; left: -4px;
  }

  /* the board: the one band allowed to grow */
  .stage{ min-height: 104px; padding: 9px; gap: 6px; }
  #app.resolving .stage{ min-height: 42vh; }
  #app.resolving .hand{
    max-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; opacity: 0;
  }
  .dc-icons .ms{ font-size: 32px; }
  .dc-icons{ gap: 12px; }
  .dc-text{ font-size: 12.5px; line-height: 1.45; }
  .demand-call{ gap: 7px; }
  .pos{ width:19px; height:19px; font-size:11px; top:-7px; left:-5px; }
  .stage-hint{ font-size: 12.5px; }
  .stage-hint .ord{ font-size: 11.5px; margin-top: 3px; }
  .stage-hint .fig-pay{ font-size: 11.5px; margin-left: 6px; }
  .stage-hint .hand-name{ font-size: 13px; padding: 4px 11px; margin-bottom: 6px; }
  .stage-total{ font-size: 42px; text-shadow: 3px 3px 0 var(--edge); }
  .coach{ font-size: 11.5px; padding: 7px 11px; line-height: 1.3; max-width: none; }

  /* the hand: all seven readable at once, in two rows, no scrolling */
  .handwrap{ gap: 5px; }
  .hand{
    gap: 5px; min-height: 0; padding: 2px 0 0;
    align-items: flex-start;
  }
  /* One fixed height for every card in the hand. Left to size themselves, a
     card was as tall as its own word (one line or two) plus its own tags (one
     row or four), so seven cards meant seven different rectangles. The word
     takes the slack, which puts every tag row on the same baseline. */
  .card{ width: 80px; height: 116px; min-height: 0; padding: 5px 4px; border-radius: 6px; --strip: 13px; }
  .card-inner{ gap: 3px; height: 100%; }
  .card .art{ height: 36px; flex: none; border-radius: 4px; padding: 0 4px; gap: 4px; }
  .card .art .icons{ gap: 2px; }
  .card .art .ms{ font-size: 12px; }
  .card .art .ms.hit{ padding: 3px; }
  .card .w{ font-size: 11.5px; }
  .card .base{ font-size: 10px; right: 5px; bottom: 4px; line-height: 1.1; }
  /* Two rows, always. Matching tags are sorted to the front in cardEl, so what
     a fourth long tag pushes out of sight is never one that scores — and the
     plate above still carries every overtone as an icon. */
  .card .tags{ flex: none; height: 26px; overflow: hidden; align-content: flex-start; gap: 2px; }
  .card .tg{ font-size: 7px; padding: 1px 3px; letter-spacing: 0; line-height: 1.45; }
  .card.sel{ transform: translateY(-9px) scale(1.03); }
  .hand .card .card-inner{ animation: none; }

  /* PLAY must never be below the fold, on any phone, ever */
  .controls{
    gap: 7px;
    position: sticky; bottom: 0; z-index: 30;
    margin-inline: -9px; padding: 8px 9px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    box-shadow: 0 -2px 0 var(--edge);
  }
  .btn{ flex: 1 1 0; min-height: 50px; padding: 12px 6px; font-size: 13px; letter-spacing: .02em; }

  .panel{ padding: 15px; max-height: calc(100dvh - 28px); }
  .veil{ padding: 14px; }
  .panel h2{ font-size: 20px; }
  .panel p, .helplist{ font-size: 13px; }
  .worked{ padding: 11px; gap: 11px; }
  .appraisal{ min-height: 0; flex-wrap: wrap; }
  #interpInput{ font-size: 18px; }
  .offers{ grid-template-columns: 1fr; gap: 8px; }
  .rowend{ gap: 8px; }
  .rowend .btn{ flex: 1 1 140px; }
}

/* ---------- short phones ----------
   Everything loses a few pixels rather than one band losing all of them.

   The cut was at 790px, which is the wrong place: the roomier layout above it
   needs about 850px of board, so an iPhone X, 11, 12, 13 or 14 (812 and 844)
   got the big cards and then had to scroll to see the back half of its own
   hand. The cut belongs where the big layout actually starts fitting. */
@media (max-width: 620px) and (max-height: 860px){
  #app{ gap: 3px; padding-block: 4px 0; }
  .table{ gap: 4px; }
  .sidebar{ gap: 4px; }
  .board{ gap: 4px; }
  .masthead{ gap: 6px; }
  .wordmark{ font-size: 15px; }
  .chip-btn{ min-height: 30px; padding: 5px 9px; font-size: 11px; }
  .chip-btn .short{ font-size: 13px; }
  .runinfo{ font-size: 9px; }

  .blind{ padding: 5px 8px; gap: 3px 8px; }
  .blind-badge{ font-size: 12px; padding: 5px 7px; }
  .blind-wants .w{ font-size: 9px; padding: 2px 5px; }
  .blind-req .k{ font-size: 9px; }
  .blind-req .v{ font-size: 19.5px; }
  .progress{ height: 5px; }

  .tally{ padding: 4px 5px 5px; }
  .tally .chips, .tally .multv{ font-size: 18px; padding: 4px 3px; }
  .tk{ font-size: 8px; margin-bottom: 1px; }
  .tally .x{ padding-bottom: 6px; font-size: 13px; }

  .roundscore, .meter, .money{ padding: 3px 3px; }
  .roundscore .k, .meter .k{ font-size: 8.5px; }
  .roundscore .v, .meter .v, .money{ font-size: 14px; }
  .money{ padding-top: 10px; }

  .lensbar{ padding: 4px 7px 5px; }
  .lensbar-head{ font-size: 9px; margin-bottom: 1px; }
  .rail{ min-height: 26px; }
  .lens{ min-width: 112px; padding: 5px 7px; }
  .lens.open{ min-width: 86%; }
  .lens .n{ font-size: 10px; }
  .lens .d{ font-size: 9px; -webkit-line-clamp: 2; }
  .rail-empty{ font-size: 10px; }

  /* The board's prose repeats the plaque above it, so here it is the short
     version of itself rather than a paragraph. */
  .stage{ min-height: 58px; padding: 4px 6px; gap: 3px; }
  .dc-icons .ms{ font-size: 21px; }
  .dc-icons{ gap: 8px; }
  .dc-text{ font-size: 11px; line-height: 1.25; }
  .demand-call{ gap: 4px; }
  .stage-hint{ font-size: 11px; line-height: 1.35; }
  .stage-hint .hand-name{ font-size: 11.5px; padding: 3px 9px; margin-bottom: 4px; }
  .stage-total{ font-size: 34px; }
  .coach{ font-size: 10.5px; padding: 5px 9px; line-height: 1.28; }

/* ---------- wide, but short ----------
   A 1366x768 laptop is the most common screen there is, and in a maximised
   browser it gives about 640px of viewport height. The phone layout has had a
   strict vertical budget since the day it was written; the desktop layout had
   none, and assumed a tall window. On that laptop the board came to 915px and
   PLAY sat 270px BELOW THE FOLD — you had to scroll down to play a card.

   So the same discipline, above 620px wide: every band gives up what it can
   spare, and the two that carry the game (the stage and the hand) give up the
   least. Purely additive, so tall windows keep the roomy layout.

   The second query covers 621-1080px at any height: below 1080 the readout
   stacks ABOVE the board rather than beside it, so that band is always tall
   and always needs the same trims. */
@media (min-width: 621px) and (max-height: 820px),
       (min-width: 621px) and (max-width: 1080px){
  #app{ padding-block: 6px 0; gap: 6px; }
  .masthead{ gap: 8px; }
  .wordmark{ font-size: 19px; }
  .table{ gap: 7px; }
  .board{ gap: 6px; }
  .sidebar{ gap: 6px; }

  .lensbar{ padding: 6px 9px; }
  .lensbar-head{ font-size: 10px; margin-bottom: 4px; }
  .rail{ min-height: 34px; gap: 6px; }

  .stage{ min-height: 162px; padding: 10px; gap: 7px; }
  #app.resolving .stage{ min-height: 196px; }
  /* The preview is a readout, not a target you click, so here it is the size
     of the phone's cards. Full-size preview cards grew the stage by 73px the
     moment you picked your first word, which shoved the hand and the PLAY
     button down the screen mid-decision. */
  .stage .card.static{ width: 80px; height: 146px; padding: 5px 4px; --strip: 11px; }
  .stage .card.static .art{ height: 36px; padding: 0 3px; }
  .stage .card.static .art .ms{ font-size: 12px; }
  .stage .card.static .art .ms.hit{ padding: 3px; }
  .stage .card.static .art .icons{ gap: 2px; }
  .stage .card.static .w{ font-size: 11.5px; }
  .stage .card.static .base{ font-size: 10px; right: 5px; bottom: 4px; }
  .stage .card.static .tg{ font-size: 7px; padding: 1px 3px; letter-spacing: 0; }
  .dc-icons .ms{ font-size: 30px; }
  .dc-icons{ gap: 13px; }
  .dc-text{ font-size: 13.5px; }
  .stage-hint{ font-size: 13px; }
  .stage-hint .hand-name{ font-size: 14px; padding: 4px 13px; margin-bottom: 5px; }
  .stage-total{ font-size: 40px; }
  .coach{ font-size: 12.5px; padding: 7px 14px; }

  /* the hand keeps its card size and gives up the air around it */
  .handwrap{ gap: 7px; }
  .hand{ padding-top: 10px; padding-bottom: 8px; gap: 7px; min-height: 0; }
  .card{ width: 104px; height: 185px; --strip: 17px; }
  .card .art{ height: 52px; }
  .card .w{ font-size: 14px; }
  .btn{ padding: 10px 22px; font-size: 14px; }

  /* the readout beside the board loses type size, never a number */
  .blind{ padding: 8px 10px; }
  .blind-badge{ font-size: 14px; padding: 8px; }
  .blind-req .v{ font-size: 23px; }
  .blind-req .k, .roundscore .k, .meter .k{ font-size: 10.5px; }
  .roundscore .v{ font-size: 21px; }
  .tally .chips, .tally .multv{ font-size: 21px; padding: 6px 4px; }
  .meter .v{ font-size: 19px; }
  .money{ font-size: 21px; }
}

/* ---------- landscape, or any viewport this short ----------
   Short and wide. The sidebar can go back beside the board, and everything
   vertical has to shrink or PLAY drops off the bottom.

   The width cap used to be 900px, which was the width of a phone when this was
   written and is not any more: a 932x430 handset matched none of this and got
   the portrait layout squeezed into 430px, with PLAY 487px below the fold. A
   viewport this short needs the compact treatment whatever its width, so the
   cap is gone and the height is the whole test.

   Seven cards also have to make ONE row. At 72px wide they needed 534px of a
   530px track, wrapped to two rows, and cost 150px nobody had. */
/* The shortest phones still in circulation. An iPhone SE is 375x667, which is
   184px shorter than the Pixel the phone layout was measured on - and on a
   two-row hand every pixel of card height costs two. At 98px tall the second
   row finished 14px inside the control bar and the document ran 18px past the
   viewport; at 86 it clears both with room to spare. Nothing above 700px tall
   sees this. */
@media (max-width: 620px) and (max-height: 700px){
  .card{ height: 86px; }
  .card .art{ height: 26px; }
  .hand{ gap: 3px; }
}

@media (max-height: 500px) and (orientation: landscape){
  #app{ padding-block: 4px 0; gap: 4px; min-height: 0; }
  .masthead{ display: none; }
  .table{ grid-template-columns: 168px 1fr; gap: 6px; }
  /* The sidebar was five slabs stacked in a column -- 421px of a 400px screen,
     which is what actually pushed PLAY off the bottom, not the board. Only the
     three that need the width get it; the small ones pair up. */
  .sidebar{ grid-template-columns: repeat(2, 1fr); gap: 5px; align-content: start; }
  .blind, .tally, .runinfo{ grid-column: 1 / -1; }
  .meters{ display: contents; }
  .roundscore{ grid-column: 1; }
  .money{ grid-column: 2; margin: 0; }
  .blind{ padding: 6px 8px; }
  .blind-badge{ font-size: 12px; padding: 6px 6px; border-radius: 5px; }
  .blind-wants{ gap: 3px; }
  .slab{ padding: 6px 8px; }
  .meter .k, .roundscore .k, .money .k{ font-size: 9px; }
  .roundscore .v{ font-size: 15px; }
  .runinfo{ font-size: 9px; }
  .blind-req{ margin-top: 5px; }
  .blind-req .v{ font-size: 21px; }
  .progress{ margin-top: 5px; height: 5px; }
  .stage{ min-height: 56px; padding: 4px; }
  #app.resolving .stage{ min-height: 120px; }
  .dc-icons .ms{ font-size: 20px; }
  .dc-icons{ gap: 8px; }
  .demand-call{ gap: 2px; }
  .dc-text{ font-size: 10.5px; line-height: 1.25; }
  .stage-hint{ font-size: 11.5px; }
  .stage-hint .hand-name{ font-size: 11.5px; padding: 3px 9px; margin-bottom: 3px; }
  .lensbar{ padding: 4px 7px; }
  .lensbar-head{ margin-bottom: 3px; font-size: 10px; }
  .rail{ min-height: 26px; }
  .hand{ min-height: 0; gap: 5px; padding-top: 8px; padding-bottom: 6px;
         flex-wrap: nowrap; }
  /* 62px could not hold INHERITANCE without breaking it in half; 72 can, and
     seven of them plus their gaps still come to 534px of a 550px track. */
  .card{ width: 72px; height: 108px; padding: 4px 3px; --strip: 10px; }
  .card .art{ height: 28px; padding: 0 2px; }
  .card .art .ms{ font-size: 10px; }
  .card .art .ms.hit{ padding: 2px; }
  .card .art .icons{ gap: 1px; }
  .card .base{ font-size: 9px; right: 3px; bottom: 2px; }
  /* CORMORANT is the longest word in the deck and it broke as CORMORA/NT at
     62px wide. The band is two lines high either way; the job is to make the
     break land between words and never inside one. */
  .card .w{ font-size: 10px; height: 2.15em; letter-spacing: -.04em; }
  .card .tg{ font-size: 7.5px; padding: 1px 2px; letter-spacing: 0; }
  .btn{ min-height: 40px; padding: 8px 6px; font-size: 13px; }
  .controls{ padding-block: 4px; gap: 7px; margin-top: 2px; position: relative; z-index: 3; }
  .coach{ display: none; }
}

/* On a touch screen the header controls came out 25-38px wide and 30 tall:
   a miss waiting to happen on the three buttons a player reaches for when
   they are already confused. This sits after the breakpoints that shrink
   them, and doubles the class so it wins wherever it lands. */
@media (pointer: coarse){
  .chip-btn{ position: relative; }
  /* Growing the buttons themselves cost 14px of a phone’s vertical budget and
     pushed the bottom row of the hand under the controls. WCAG 2.5.8 measures
     the TARGET, not the paint, so the chip stays the size the layout can
     afford and the hit area grows underneath it. */
  .chip-btn::after{
    content:""; position:absolute; left:50%; top:50%;
    width: max(100%, 44px); height: max(100%, 44px);
    transform: translate(-50%, -50%);
  }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important;
     transition-duration: .01ms !important; }
  /* the dimming stays — it is the point; the movement goes */
  .veil.moment .panel h2, .veil.moment .panel > .sub,
  .veil.moment .stat.gold, .veil.moment .unlock{ animation: none; }
  .stamp{ animation: none; }
}

/* ---------- Lenses: rules that warp meaning ----------
   Each returns {chips, mult, xmult, grow, label} or null. `grow` is banked by
   play() and read back on later hands through ctx.lv(id) — never inside the
   hand that earned it, so the board's preview is always the truth.

   Three findings from tools/balance.js rebuilt this table:

   1. FLAT CHIPS DIE. Targets climb 65x across a run; a Lens paying +45 a word
      is decisive in round 2 and irrelevant by round 6. PROSPECTOR won 41% of
      runs against a 64% baseline — it was a trap. Those Lenses GROW now. They
      start weaker than they used to and end far stronger, which turns a
      round-2 purchase into a round-8 engine and gives a player a number to
      watch climb.

   2. UNCONDITIONAL xMULT BREAKS EVERYTHING. ENTROPY won 100% of runs and
      carried to round 7.7 on its own, because "each word shorter than the
      last" is not a condition, it is a sorting instruction. Multiplicative
      Lenses now want something the player must actually build toward, and the
      free ones (GLUTTON paid x2.5 for playing three words, which everyone
      does anyway) cost something in exchange.

   3. THE SLOT CAP WAS NOT A COST. With five slots and no downside, the right
      play was always "buy the biggest number". The flawed Lenses at the bottom
      have the biggest numbers in the game and every one of them takes
      something back: a play, a discard, a card in hand, your income, or the
      target itself.                                                        */
const LENSES = [
  /* ---- chips that grow. The long game: weak now, an engine by round 7. ---- */
  { id:"doom", n:"DOOMSAYER", d:"Each DANGER word: +30 points, +40 more each round you keep it.", cost:5, grows:40,
    onCard:function(c,i,all,ctx){ return c.t.includes("DAN") ? {chips:30+ctx.lv("doom")} : null; } },
  { id:"chron", n:"CHRONICLER", d:"Each TIME word: +35 points, +80 more each round you keep it.", cost:5, grows:80,
    onCard:function(c,i,all,ctx){ return c.t.includes("TIM") ? {chips:35+ctx.lv("chron")} : null; } },
  { id:"pyro", n:"PYROMANIAC", d:"Each HEAT word: +25 points, +110 more each round you keep it.", cost:5, grows:110,
    onCard:function(c,i,all,ctx){ return c.t.includes("HEA") ? {chips:25+ctx.lv("pyro")} : null; } },
  { id:"meta", n:"METAPHYSICIAN", d:"Each ABSTRACT word: +40 points, +120 more each round you keep it.", cost:5, grows:120,
    onCard:function(c,i,all,ctx){ return c.t.includes("ABS") ? {chips:40+ctx.lv("meta")} : null; } },
  { id:"prosp", n:"PROSPECTOR", d:"Each MONEY word: +40 points, +190 more each round you keep it.", cost:5, grows:190,
    onCard:function(c,i,all,ctx){ return c.t.includes("MON") ? {chips:40+ctx.lv("prosp")} : null; } },
  /* Was "7 letters or more". Re-keyed onto the tag matrix: a word that means
     several things at once is the one this Lens is for. */
  { id:"sesq", n:"SESQUIPEDALIAN", d:"Words carrying 3 or more overtones: +60 points, +95 more each round you keep it.", cost:5, grows:95,
    onCard:function(c,i,all,ctx){ return c.t.length>=3 ? {chips:60+ctx.lv("sesq")} : null; } },

  /* ---- flat chips: cheap, immediate, and honest about not scaling ---- */
  { id:"poly", n:"POLYGLOT", d:"Words carrying 4 or more tags: +90 points, +75 more each round you keep it.", cost:4, grows:75,
    onCard:function(c,i,all,ctx){ return c.t.length>=4 ? {chips:90+ctx.lv("poly")} : null; } },
  { id:"lexi", n:"LEXICOGRAPHER", d:"+44 points for your LEFTMOST word, and +44 for each overtone it carries. +28 more each round you keep it.", cost:4, grows:14,
    /* Paid (22+lv) x LETTERS of the first word. Same shape, counted in
       overtones: the head of a line is chosen for what it means. */
    onCard:function(c,i,all,ctx){ return i===0 ? {chips:(22+ctx.lv("lexi"))*(2+2*c.t.length)} : null; } },
  { id:"alch", n:"ALCHEMIST", d:"If NATURE and TECH both appear: +250 points, +240 more each round you keep it.", cost:5, grows:240,
    onPlay:function(all,ctx){
      const n=all.some(function(c){return c.t.includes("NAT");}), t=all.some(function(c){return c.t.includes("TEC");});
      return (n&&t) ? {chips:250+ctx.lv("alch")} : null; } },
  { id:"echo", n:"ECHO", d:"+70 points for every tag that two of your played words share", cost:5,
    onPlay:function(all){
      let n=0;
      for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++)
        n += all[i].t.filter(function(t){ return all[j].t.includes(t); }).length;
      return n ? {chips:70*n, label:"×"+n+" shared"} : null; } },
  { id:"carn", n:"CARNIVORE", d:"An ANIMAL word eats the word to its LEFT and takes four times its points", cost:5,
    onCard:function(c,i,all){ if(!c.t.includes("ANI")||i===0) return null; return {chips: all[i-1].base*4, label:"devoured"}; } },
  { id:"miser", n:"MISER", d:"+140 points for every discard you have not used", cost:4,
    onPlay:function(all,ctx){ return ctx.discards ? {chips:140*ctx.discards, label:"×"+ctx.discards+" held"} : null; } },

  /* ---- multiplier, added. Steady, narrow, and it does not compound. ---- */
  { id:"zoo", n:"ZOOLOGIST", d:"Each ANIMAL word: +1 to the multiplier", cost:5,
    onCard:function(c){ return c.t.includes("ANI") ? {mult:1} : null; } },
  { id:"hydro", n:"HYDROLOGIST", d:"Each WET word: +1 to the multiplier", cost:5,
    onCard:function(c){ return c.t.includes("WET") ? {mult:1} : null; } },
  { id:"phren", n:"PHRENOLOGIST", d:"Each MIND word: +1 to the multiplier", cost:5,
    onCard:function(c){ return c.t.includes("MIN") ? {mult:1} : null; } },
  { id:"night", n:"NIGHTWATCH", d:"Each DARK word: +1 to the multiplier", cost:4,
    onCard:function(c){ return c.t.includes("DAR") ? {mult:1} : null; } },
  { id:"reso", n:"RESONATOR", d:"The first word that matches what the round wants: +2 to the multiplier", cost:5,
    onCard:function(c,i,all,ctx){
      if(ctx.resoUsed) return null;
      const hit = c.t.some(function(t){ return ctx.demand.tags.includes(t); });
      if(!hit) return null; ctx.resoUsed=true; return {mult:2}; } },
  { id:"literal", n:"LITERALIST", d:"Real, touchable words: +1 to the multiplier. ABSTRACT words score nothing and cost 2 multiplier.", cost:6,
    onCard:function(c){ return c.t.includes("ABS") ? {chips:-c.base, mult:-2, label:"voided"} : {mult:1}; } },

  /* ---- multiplier, multiplied. Expensive, and each wants a real deck. ---- */
  { id:"syn", n:"SYNESTHETE", d:"Words that are both LOUD and BRIGHT: multiplier ×3", cost:6,
    onCard:function(c){ return (c.t.includes("LOU")&&c.t.includes("BRI")) ? {xmult:3} : null; } },
  { id:"anton", n:"ANTONYM ENGINE", d:"A HEAT word straight after a COLD one (or the reverse): +180 points and multiplier ×2", cost:7,
    onCard:function(c,i,all){
      if(i===0) return null;
      const p=all[i-1];
      const a=c.t.includes("HEA")&&p.t.includes("COL"), b=c.t.includes("COL")&&p.t.includes("HEA");
      return (a||b) ? {chips:180, xmult:2} : null; } },
  /* Was "4 letters or fewer" - and on the blind curve, where the overtones
     are hidden, letter-counting was the one thing a player could still do
     with certainty. The mode built to make you read the words was paying you
     not to. A word that means one thing is the blunt instrument now. */
  { id:"brut", n:"BRUTALIST", d:"Words carrying a single overtone: multiplier ×1.6 each", cost:7,
    onCard:function(c){ return c.t.length<=1 ? {xmult:1.6} : null; } },
  { id:"asc", n:"ASCETIC", d:"Play exactly 1 word: multiplier ×5", cost:6,
    onPlay:function(all){ return all.length===1 ? {xmult:5} : null; } },
  /* Two things wrong at once. It read spelling, and it was a strict downgrade
     that the shop did not mark: the best line achievable while holding it
     measured 0.658x the best line without it, on a $7 card with the same
     neutral face as ALCHEMIST. Re-keyed onto overtone count, and flagged, so
     the shop's promise - a card that can cost you is marked - holds. */
  { id:"entropy", n:"ENTROPY", d:"Play 3+ words, each carrying fewer overtones than the last: multiplier ×2.5. Any other hand: multiplier ×0.5.", cost:7, flaw:true,
    onPlay:function(all){
      if(all.length<3) return {xmult:0.5, label:"unbalanced"};
      for(let j=1;j<all.length;j++) if(all[j].t.length >= all[j-1].t.length) return {xmult:0.5, label:"unbalanced"};
      return {xmult:2.5}; } },
  { id:"glut", n:"GLUTTON", d:"Play exactly 3 words: multiplier ×3.2. You get one less discard each round.", cost:6,
    onPlay:function(all){ return all.length===3 ? {xmult:3.2} : null; },
    onRound:function(g){ g.discards -= 1; } },

  /* ---- flawed. The biggest numbers in the game, and every one takes
     something back. The slot cap was never a cost while everything in the
     shop was upside; these are the Lenses you have to think about.       ---- */
  { id:"wager", n:"THE WAGER", flaw:true, cost:6,
    d:"Every hand: multiplier ×3. You get one less play each round.",
    onPlay:function(){ return {xmult:3}; },
    onRound:function(g){ g.plays -= 1; } },
  /* -2 mult drove the multiplier onto its floor and made this a pure trap:
     it won 11.7% and its median multiplier was x0.1. Halving instead makes it
     a real trade that flips as a run goes on — worth it while your chips are
     big and your multiplier is small, a mistake once the multiplier is the
     thing carrying you. */
  { id:"tithe", n:"THE TITHE", flaw:true, cost:5,
    d:"Every hand: +1,000 points, but your multiplier is halved.",
    onPlay:function(){ return {chips:1000, xmult:0.5}; } },
  { id:"usurer", n:"THE USURER", flaw:true, cost:5,
    d:"Every hand: multiplier ×3. The Bookseller pays you half.",
    onPlay:function(){ return {xmult:3}; },
    onReward:function(r){ return r / 2; } },
  { id:"oracle", n:"THE ORACLE", flaw:true, cost:6,
    d:"Your FIRST word: multiplier ×4. Every word after it scores no points.",
    onCard:function(c,i){
      if(i===0) return {xmult:4};
      /* "Every word after it scores no points" - including the points and the
         multiplier the round's own overtones pay. */
      const h = demandHits(c);
      return { chips:-(c.base + DEMAND_CHIPS * h), mult:-(DEMAND_MULT * h),
               label:"paid nothing" }; } },
  { id:"famine", n:"THE FAMINE", flaw:true, cost:6, hand:-3,
    d:"Each word: +150 points. Your hand is three cards smaller and you get one less discard.",
    onCard:function(){ return {chips:150}; },
    onRound:function(g){ g.discards -= 1; } },
  /* x5 against a target only a third higher was the best deal in the shop by
     a mile — 58% against a 30% baseline. Doubling the target is the version
     where being behind is fatal, which is what a Lens this loud should feel
     like. */
  { id:"curse", n:"THE CURSE", flaw:true, cost:7,
    d:"Every hand: multiplier ×3.5. Every target you face is doubled.",
    onPlay:function(){ return {xmult:3.5}; },
    onRound:function(g){ g.target = g.target * 2; } }
];

/* ---------- Ordeals ----------
   Three rounds of every run change a rule rather than a number. Each one
   invalidates a different habit: THE VICE breaks "always take three", THE FOG
   breaks a deck built on long words, THE MIRROR breaks a deck built on breadth,
   THE HALF-LIGHT breaks an engine that leans on the multiplier.

   Hooks mirror the Lens ones: `round` reshapes plays/discards, `hand` shrinks
   the deal, `maxPlay` caps a selection, `card`/`play` fold into scoring.   */
const ORDEALS = [
  { id:"drought", n:"THE DROUGHT", d:"No discards. Play the hand you are dealt.",
    round:function(g){ g.discards = 0; } },
  /* Written when a round was four plays, where "three" was the rule taking
     one away - so it SET the number rather than subtracting, and when the
     round shrank it started handing plays out. It takes one, the way it
     always meant to, and never below one because a round you cannot play is
     not a round. */
  { id:"clock", n:"THE CLOCK", d:"One play fewer this round.",
    /* THE WAGER already takes plays to the floor of 1, so holding it this
       Ordeal was free. Same trade as THE LEAN YEAR: if the play cannot be
       taken, a discard goes instead. */
    round:function(g){
      const was = g.plays;
      g.plays = Math.max(1, g.plays - 1);
      if(g.plays === was) g.discards = Math.max(0, g.discards - 1);
    } },
  /* THE FAMINE already takes the hand to the floor of 4, so against that deck
     this Ordeal changed nothing while the board still posted it in the warning
     colour. It takes a discard instead when the hand cannot shrink further. */
  { id:"lean", n:"THE LEAN YEAR", d:"Your hand is four cards, not seven.", hand:-3,
    round:function(g){ if(handSize() <= 4) g.discards = Math.max(0, g.discards - 1); } },
  /* A discard you have to spend, on words you would rather have kept. It hands
     back a discard first so it can never meet THE DROUGHT and leave a player
     with a play they are not allowed to make and no way to earn it. */
  { id:"forfeit", n:"THE FORFEIT", d:"Give a word up before you play. Discard at least once, then the round is yours.",
    round:function(g){ g.discards = Math.max(1, g.discards); g.mustForfeit = true; } },
  /* At two words it collapsed chips AND multiplier at once: forced onto the
     schedule it measured 22.0% against a 73.0% no-Ordeal ceiling on the
     gentle curve, and 15.3% against 44.0% on the steep one - three times the
     bite of the next worst rule. Three words is a squeeze; two was a wall. */
  { id:"vice", n:"THE VICE", d:"Three words at a time, at most.", maxPlay:3 },
  { id:"fog", n:"THE FOG", d:"Words are worth nothing on their own. Only matching tags pay.",
    card:function(c){ return {chips:-c.base, label:"fogged"}; } },
  /* "costs 90 points" read as 90 off the score. It comes off the CHIPS, which
     are then multiplied - so at x12 a five-word line pays 5,400 for it, not
     450. Measured on identical cards: x4 cost 1,800, x12 cost 5,400. */
  { id:"toll", n:"THE TOLL", d:"Every word you play costs 90 points before the multiplier.",
    card:function(){ return {chips:-90, label:"toll"}; } },
  { id:"mirror", n:"THE MIRROR", d:"A word scores nothing unless two of its tags match the round.",
    card:function(c){
      /* Cancelled base + 25 a match, which was the Demand's rate before this
         pass raised it to DEMAND_CHIPS and gave it a multiplier too - so a
         one-match word under THE MIRROR still scored, on a rule whose whole
         text is that it does not. */
      const h = demandHits(c);
      return h >= 2 ? null
        : { chips: -(c.base + DEMAND_CHIPS * h), mult: -(DEMAND_MULT * h),
            label:"unreflected" }; } },
  { id:"halflight", n:"THE HALF-LIGHT", d:"Every hand begins at half a multiplier.",
    play:function(){ return {xmult:0.5}; } }
];
/* Which rounds carry an Ordeal, and which Ordeals a mode will deal, are both
   properties of the difficulty now rather than constants named after one of
   them. See DIFFICULTIES below and docs/specs/spec-two-curves/. */
function ordealRoundsFor(diffId){
  const d = DIFF_BY_ID[diffId];
  return (d && d.ordealRounds) || [];
}
function ordealPoolFor(diffId){
  const ban = (DIFF_BY_ID[diffId] && DIFF_BY_ID[diffId].ordealBan) || [];
  return ORDEALS.filter(function(o){ return ban.indexOf(o.id) < 0; });
}
/* (DISARMING is declared above the DIFFICULTIES table, which reads it.)
   An Ordeal that DISARMS - takes away discards, cards, or the worth of a word
   on its own - is a different rule early than it is late. Measured: wherever
   the steeper mode's first Ordeal was put, that round became the one runs ended
   on, at 32%, 30% and 26% for rounds 2, 3 and 4. Flattening its target moved
   the win rate and barely moved the wall, so the target was never the thing.
   A player two shops in has nothing to answer a disarming rule WITH.
   So the last scheduled Ordeal may be anything, and the ones before it squeeze
   rather than disarm - the same distinction the gentler mode's ordealBan
   already draws, applied to the slot instead of the mode. */
/* THE CLOCK went in here when a round was two plays, where "one play fewer"
   meant clearing the whole round in a single hand. A round is three now, so
   one fewer leaves two, and on its own that is a squeeze rather than a wall -
   which argued for taking it back out.

   Measuring said no. What this list governs is not THE CLOCK alone: it is
   what THE RECKONING may draft ON TOP of a round that already carries a
   scheduled Ordeal. A play taken off a round that is also capped at three
   words, or dealt four cards, is a third of the round's capacity gone on top
   of the rule it was already answering. Letting it into the early slots moved
   round 4 - SCHOLAR's first Ordeal round, and already the run's wall - from
   18.7% of runs to 21.0%, past the 20% the difficulty model allows any round
   before the last. It stays. */
const DISARMING = ["drought", "lean", "fog", "vice", "clock"];
function ordealPoolAt(diffId, slot, total){
  const pool = ordealPoolFor(diffId);
  if(slot >= total - 1) return pool;
  const kind = pool.filter(function(o){ return DISARMING.indexOf(o.id) < 0; });
  return kind.length ? kind : pool;
}

const DEMANDS = [

  { n:"THE MENAGERIE",          tags:["ANI","MOT"] },

  { n:"THE OPERATING THEATRE",  tags:["BOD","DAN"] },
  { n:"THE BANQUET",            tags:["FOO","LOU"] },

  { n:"THE OBSERVATORY",        tags:["BRI","MIN"] },
  { n:"THE MIDNIGHT SHIFT",     tags:["DAR","TIM"] },
  { n:"THE PARADE",             tags:["LOU","MOT"] },
  { n:"THE WORKSHOP",           tags:["TOO","MOT"] },
  { n:"THE FLOOD",              tags:["WET","MOT"] },
  { n:"THE ARCHIVE",            tags:["TIM","MIN"] },

/* Re-derived from tools/balance.js rather than adjusted by feel, after a
   playtester said the loop was stagnant. It was, and the simulator said so
   plainly. Four hundred runs on the old curve died like this:

     round    1     2     3     4      5      6     7      8
     lost   0.0%  0.0%  2.5%  12.3%  15.3%  20.8%  8.5%  18.5%

   Nobody had ever lost round 1 or round 2. Not once in four hundred runs.
   Round 3 ended one run in forty. So the opening three rounds - the first
   several minutes, the window where somebody decides whether to play a
   second run - carried no stakes at all. And the danger did not climb after
   that so much as wander: round 7 killed less than half what round 6 did,
   which is a round with no news in it sitting between two that have some.
   The targets said the same thing out loud, jumping six and a half times
   from 800 to 5,200 between two rounds nobody could lose.

   The win rate was never the problem - 22.3% is exactly where a roguelite
   wants to be - so this moves danger rather than adding it, and was scored
   end to end before it shipped, at the same four hundred runs. It lands at
   23.5% against 22.3%, which is the same game - with rounds 2, 3 and 7
   carrying a share of it they did not carry before.

   Rounds 1 and 2 are still set from what a player who has understood nothing
   can make, which tools/balance.js --floor puts at a 5th percentile of 358
   and a median of 629. Round 1 sits under that floor because nobody should
   lose their first round to a rule they have not been shown.

   It was briefly raised to 500 on the theory that a round nobody can lose is
   a round with nothing in it. That is true of round 2 and false of round 1,
   and the difference is the tutorial: 500 sits around the 30th percentile of
   that floor, so it did not add a decision, it just failed one beginner in
   three on the first screen they ever play. Round 2 is where the argument
   actually holds, and it is the one that moved - it was not too easy, it was
   over before it had asked anything, and 2,900 needs more than one hand.

   Rounds 4, 6 and 8 are the Ordeals, and their numbers climb least. That is
   deliberate and it is the one place the curve looks flat on purpose: an
   Ordeal takes a tool away rather than asking for more, so the round gets its
   difficulty from its rule. The Bookseller names it before you spend, which
   is why the number does not have to. */
/* Six rounds of three plays: eighteen decisions that matter instead of the
   old thirty-two that did not.

   The curve is one number and one ratio. 10,422 opens, and each round asks
   1.42 times the last. Both were found by sweeping tools/balance.js rather
   than reasoned out: at two plays the game sat on 7,720 climbing at 1.30, and
   a third play does not add half a round's scoring - it adds a play made with
   a tired hand, out of a deck that has already spent its best overtones. The
   ratio had to rise as well as the base, because the third play is worth most
   in the late rounds where a stacked Lens gets a third firing and worth least
   in round 1 where there is no engine to fire.

   Measured at these numbers, 500 runs, optimal play, value buying:
   APPRENTICE 51.2%, SCHOLAR 29.2%. Both inside the bands the difficulty model
   sets, and no round before the last ends more than a fifth of the runs that
   reach it. See docs/specs/spec-two-curves/difficulty-model.md. */
const TARGETS = [10422, 14799, 21015, 29841, 42374, 60172];

/* ---------- difficulty ----------
   A mode used to be a name and two numbers, and everything that actually made
   one mode different from the other was a hardcoded test of that name: twenty-
   four of them, across the ordeal schedule, the target curve, the reckoning,
   the unlock gate, the storage keys and the run-end offers. Which mode was the
   gentle one was an assumption baked into two dozen branches.

   So a mode declares itself. Every difference between the two is a property in
   this table, and nothing outside it knows an id. Changing which mode is gentle
   is a data edit; adding a third needs no new branches anywhere.

     rank            0 is the gentlest. "Offer the easier one" and "unlock the
                     harder one" read this, never a name.
     curve           per-round multiplier on TARGETS. ROUNDS entries, no
                     fallback - a short array is a bug, not a default.
     discards        added to the three a round starts with.
     ordealRounds    0-based round indices that carry an Ordeal.
     ordealBan       Ordeal ids this mode never deals.
     reckon          whether THE RECKONING may draft a second rule.
     bestKey         where this mode's record lives. One per curve: a total
                     from one curve is not a better run than a total from
                     the other.
     lockedUntilRun  finished runs needed before it can be chosen.

const DIFFICULTIES = [

const DIFF_BY_ID = {};
DIFFICULTIES.forEach(function(d){ DIFF_BY_ID[d.id] = d; });

   list rather than two names this code has to already know. */
const DIFF_BY_RANK = DIFFICULTIES.slice().sort(function(a, b){ return a.rank - b.rank; });
function easiestDiff(){ return DIFF_BY_RANK[0]; }
/* One step gentler / one step steeper than the one given, or null at the end. */
function diffBelow(d){ const i = DIFF_BY_RANK.indexOf(d); return i > 0 ? DIFF_BY_RANK[i - 1] : null; }

   stand in front of it. */

/* Flawed Lenses are the only thing in the shop that can make a run worse while
   looking like the best thing on the shelf: THE CURSE reads "multiplier x3.5"
   and doubles every target you have left. A player who has not yet worked out
   what a multiplier is worth cannot price that, so the gentler curve keeps
   them off the shelf until the player has actually met one.

   They meet one on the steeper curve, where the game is the game. From that
   moment the drawer is open everywhere, the gentler curve included: taking a
   mechanic back off
   somebody who has already learned it would be the worse of the two mistakes. */
/* Whether this player has been introduced to the Lenses that cost something.

function curveScale(round){
  const d = runDifficulty();

/* What the run in progress was started under. Switching mid-run would let a

const ROUNDS = TARGETS.length;
const HAND_SIZE = 7, LINE_MIN = 2, MAX_PLAY = 5, LENS_SLOTS = 5;

   free: at five they beat every purchase in the shop and the purse stopped
   meaning anything. */
const KEEP_SLOTS = 2;
/* What a round hands you before a mode, a Lens or an Ordeal has touched it.

/* Three, not two. Two was the rebuild's reading of "fewer and heavier than
   four", and heavier it was - but a two-play round has no middle. You find
   the best line, you find the second best line, the round is over: there is
   no turn where what you already spent changes what is left worth doing,
   which is the turn the dull rule was written for. Three gives the round an
   opening, a middle and a close, and it gives the three discards something to
   serve. Eighteen plays a run against the old thirty-two. */
const PLAYS_PER_ROUND = 3, DISCARDS_PER_ROUND = 3;
/* What a join is worth. Resonance is safe and small, tension is large and
   risky, and a kept line pays again every time its figure returns. */
const JOIN_RESONANCE = 40, JOIN_TENSION = 1;
/* What the round's own overtones are worth on a word that carries them. It
   was 25 points flat and nothing else: about a twentieth of a line, against a
   header, a shop preview and a death screen that all name the Demand as the
   thing the round is about. Points AND multiplier now, so a hand that answers
   the room beats a hand that merely joins up well. */
/* 0.5 rather than 0.4 deliberately: halves are exact in binary and 0.4 is
   not, so the multiplier drifted - a hand that should have read x2 resolved
   to 1.9999999999999998 and scored a point light. */
const DEMAND_CHIPS = 55, DEMAND_MULT = 0.5;
/* How many of the round's overtones a word actually pays for: carried, and
   not already spent this round. Read by the scoring loop, by lineWorth, and
   by every rule that cancels a word's worth. */
function demandHits(c){
  const want = (G && G.demand && G.demand.tags) || [];
  if(!want.length) return 0;
  const dull = dullTags();
  return c.t.filter(function(t){ return want.indexOf(t) >= 0 && !dull[t]; }).length;

const KEPT_CHIPS = 120, KEPT_MULT = 1;
/* Plays a scored overtone stays dull for. */
const FATIGUE_SPAN = 2;

/* ---------- when order matters BEYOND the figure ----------
   Order is always live now: a figure reads the words left to right, so THE
   CHAIN and THE STAIR are made or lost by the order you tap in, on the first
   hand of a run with nothing bought. The board says so itself, by naming the
   better figure the same words would make in some other order.

   What follows is the older, quieter order-dependence — the kind a Lens
   introduces, which no figure readout would ever think to mention.

     1. A Lens reads position — CARNIVORE eats the word to its left,
        LEXICOGRAPHER pays for the leftmost word, ANTONYM ENGINE wants HOT
        directly after COLD, ENTROPY wants each word shorter than the last.

     2. You hold both a +mult Lens and a xmult Lens. The multiplier is one
        running number, so (1+2)x3 = 9 and (1x3)+2 = 5 are different scores
        from the same three words. Additive first, multiplicative last.

   Say it when it is true and not before. */
const ORDER_LENSES = { carn:1, anton:1, entropy:1, lexi:1 };
const ADD_MULT = { zoo:1, literal:1, hydro:1, night:1, phren:1 };
const X_MULT = { anton:1, entropy:1, syn:1, brut:1, glut:1, asc:1, reso:1 };
function orderMatters(){
  if(!G || !G.lenses || !G.lenses.length) return false;
  let add = false, mul = false;
  for(let i=0;i<G.lenses.length;i++){
    const id = G.lenses[i].id;
    if(ORDER_LENSES[id]) return true;
    if(ADD_MULT[id]) add = true;
    if(X_MULT[id]) mul = true;
  }
  return add && mul;
}

/* ---------- Joins: what two words do when you stand them together ----------
   The old figures read spelling — same first letter, same length, lengths in a
   step — and they were the multiplier. So the quantity that decided whether a
   run lived was letter-counting, in a game whose tagline is that meaning is the
   physics. 26 of its 30 Lenses read meaning; all 5 of its figures read
   spelling. The poetic layer and the mechanical layer never touched.

   A join is what happens between two words laid side by side, read off the
   overtones they already carry. Measured across all 30,876 pairs in the
   lexicon:

     RESONANCE   they share an overtone        49.7%
     TENSION     they carry an opposed pair    17.0%
     PARADOX     both at once                  11.9%
     SILENCE     neither                       33.2%

   before it pay and the words after it do not, so the order is the decision
   and length is a risk rather than a free bonus. Over 400 real hands the best
   ordering of the same three words beats the worst by six times at the median.

const OPPOSED = [

  ["WET","HEA"], ["ABS","BOD"], ["ABS","FOO"], ["ABS","TOO"]

/* An overtone that has just scored is DULL and pays nothing until it recovers.

   resource being spent. */
function dullTags(){ return (G && G.dull) || {}; }
function sharedTags(a, b, dull){
  dull = dull || dullTags();
  return a.t.filter(function(t){ return b.t.indexOf(t) >= 0 && !dull[t]; });
}
function tensionPairs(a, b){
  return OPPOSED.filter(function(p){

}
/* What each join is CALLED, in words somebody can read once and keep.

   These were RESONANCE, TENSION, PARADOX and SILENCE - accurate, thematic, and
   four pieces of vocabulary to learn before the first decision. A playtester
   put it plainly: "what i found confusing is the resonance, pull and silent
   and this whole stuff". The mechanic was never the problem. The names were.

   The ids underneath are unchanged, so nothing about the engine moves. */
const JOIN_NAME = {
  resonance: "ALIKE",
  tension:   "OPPOSITE",
  paradox:   "BOTH",
  silence:   "NOTHING"
};
const JOIN_SAID = {
  resonance: "mean something of the same thing",
  tension:   "mean opposite things",
  paradox:   "are alike AND opposite at once",
  silence:   "have nothing in common"
};

  const s = sharedTags(a, b, dull).length, t = tensionPairs(a, b).length;

/* Every join in a line, and how far the line gets before it falls silent. */
function joinsOf(line, dull){
  const joins = [];
  for(let i = 0; i < line.length - 1; i++){
    const j = joinOf(line[i], line[i + 1], dull);
    if(j.kind === "silence") break;
    joins.push(j);
  }
  return { joins: joins, scored: Math.min(line.length, joins.length + 1) };

/* ---------- Figures, which are now turns of meaning ----------

   spelling patterns, which was a pun nobody had noticed. These read the join
   list and nothing else — no length, no letters. */
/* Named for what they look like, not for what rhetoric calls them. They were
   THE CHIASMUS, THE PARADOX, THE ESCALATION, THE SYNONYMY and THE ANTITHESIS,

   point of a hand's name is that you can say it to somebody. */
const FIGURES = [
  { id:"chiasmus",   n:"THE MIRROR", d:"Four words whose pairs read the same backwards as forwards" },
  { id:"paradox",    n:"THE TWIST",  d:"Two words that are alike and opposite at the same time" },
  { id:"escalation", n:"THE BUILD",  d:"Each pair with more in common than the pair before it" },
  { id:"synonymy",   n:"THE CHORUS", d:"Two words with three things or more in common" },
  { id:"antithesis", n:"THE CLASH",  d:"Two words that mean opposite things" }
];
/* Priced off how often each one can actually be made, the same way the old
   ladder was. Settled by tools/join-sim.js, not by instinct. */
const FIG_PAY = {
  chiasmus:   { chips: 250, mult: 2 },
  paradox:    { chips: 200, mult: 1 },
  escalation: { chips: 150, mult: 0 },
  synonymy:   { chips: 120, mult: 0 },
  antithesis: { chips:  80, mult: 0 }

const FIG_BY_ID = {};
FIGURES.forEach(function(f){ FIG_BY_ID[f.id] = f; });

/* Which figures a join list makes. Ordered best first, as FIGURES is. */
function figuresFromJoins(joins){
  const got = {};

    else if(j.kind === "tension") got.antithesis = 1;
    if(j.s >= 3) got.synonymy = 1;
  });

     used to fire if ANY adjacent pair happened to rise, which is nearly every
     line with three words in it: measured at 98% of optimal plays. A build is
     a line that climbs the whole way. */
  if(joins.length >= 2){
    let climbs = true;
    for(let i = 0; i + 1 < joins.length; i++)
      if(joins[i].s >= joins[i + 1].s) climbs = false;
    if(climbs) got.escalation = 1;

     built to be a mirror. Three joins minimum, because two the same is not a
     shape, and it has to hold end to end. */

     backwards is also four Rs, which is why a kind-only palindrome still

    return { id:f.id, n:f.n, d:f.d, chips:FIG_PAY[f.id].chips, mult:FIG_PAY[f.id].mult };

/* Kept the old names: every reader of these wants "what does this line make",

function figuresIn(line){

  return figuresFromJoins(joinsOf(line).joins);
}
function figureFor(line){ const f = figuresIn(line); return f.length ? f[0] : null; }

/* What a line is worth, roughly, without building an event list or firing a

   This exists because the verb changed. Scoring reads adjacent pairs, so the

   used to search exhaustively has to shortlist now or it stops being

function lineWorth(line){
  if(!line || line.length < 2) return line && line.length ? line[0].base : 0;

  const jr = joinsOf(line, dull);
  let chips = 0, mult = 1;
  jr.joins.forEach(function(j){
    chips += JOIN_RESONANCE * j.s;
    mult += JOIN_TENSION * j.t;

/* The best line a pool can make, found by beam search rather than by walking
   every ordering. A 16-card pool at five words is 571,456 orderings; resolving
   all of them took eleven seconds, which the shop did on open - so this was a
   frozen browser, not only a slow simulator. The beam keeps the best 24
   prefixes at each length and resolves only those. */
function bestLineFrom(avail, cap){
  let best = null;
  let beam = avail.map(function(c){ return [c]; });
  for(let len = 2; len <= cap; len++){
    const next = [];
    beam.forEach(function(pre){
      avail.forEach(function(c){
        if(pre.indexOf(c) >= 0) return;
        const line = pre.concat([c]);
        next.push({ line: line, w: lineWorth(line) });
      });
    });
    if(!next.length) break;
    next.sort(function(a, b){ return b.w - a.w; });
    beam = next.slice(0, 24).map(function(x){ return x.line; });
    beam.forEach(function(line){
      const r = resolve(line);
      if(!best || r.total > best.total) best = { total: r.total, cards: line.slice() };

/* Would these same words say more in another order? Under JOIN this matters
   far more than it did — a silence in the wrong place costs the tail of the
   line — so the board still says which, and still never reorders them for you. */
function figureByReorder(line){

     is not worth that, so it looks past four. */
  if(!line || line.length < 2 || line.length > 4) return null;
  const have = figValue(figureFor(line));
  let best = null;
  const perm = function(rest, acc){
    if(!rest.length){
      const f = figureFor(acc);
      if(f && figValue(f) > have && figValue(f) > figValue(best)) best = f;
      return;
    }
    for(let i = 0; i < rest.length; i++)
      perm(rest.slice(0, i).concat(rest.slice(i + 1)), acc.concat([rest[i]]));

/* ---------- deterministic RNG (mulberry32) ---------- */

function pick(arr){ return arr[ri(arr.length)]; }

/* ---------- storage (may be blocked; never let it break the game) ---------- */
const store = {
  get:function(k,d){ try{ const v=localStorage.getItem("overtone:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },

};

/* ---------- what the player can turn off ----------

/* Each curve keeps its own record now - best:gentle and best:steep - where

  blind:    store.get("blind", false),
  musicVol: store.get("musicVol", 1),
  sfxVol:   store.get("sfxVol", 1),
  carryMemory: store.get("carryMemory", true),
  difficulty: store.get("difficulty", easiestDiff().id)
};
/* One number, read by every beat in a hand, so no two parts of a hand can
   disagree about how fast the game is. This was a switch with a slow side
   on it. Nobody wants the slow side, and an option that changes the rhythm
   of every hand is an option that makes the game feel inconsistent rather
   than one that makes it feel yours. */
function animScale(){ return 0.55; }
function setPref(k, v){ prefs[k] = v; store.set(k, v); }

/* ---------- what this profile knows ----------
   The overtones used to be printed on the card, which meant the game handed
   the player its own answer and then asked them to choose. There was no
   judgement left in it and no way to be cleverer than the person beside you.

   Turned on, they are hidden until you have played the word once, and what
   you have learned is kept between runs. A human already knows FURNACE is hot
   and FROST is cold; that knowledge is the skill the game is finally testing,
   and the 249-word lexicon stops being a thin library and becomes the thing
   you are learning. It is off until it is chosen, so nobody meets this blind.

   Learned on being PLAYED rather than on scoring, because a word you risked
   and got nothing from is exactly the one you should be told about. */
const LEARNED = store.get("learned", {});
/* Hiding the overtones was tied to a difficulty, and that was wrong in a way
   no simulation could have caught. Anybody who had played before already had
   that mode selected and the tutorial marked seen, and the learned store did not
   exist until the day it shipped - so a returning player opened the game to
   seven blank cards, no tutorial, and a coach line telling them to tap the
   gold tags that had just been made invisible. The game asked them to do
   something it had made impossible.

   So it is a choice now, off until it is made, and it says what it does. */
function blindMode(){ return !!prefs.blind; }
function wordKnown(w){ return !blindMode() || !!LEARNED[w]; }
function learnWord(w){
  if(LEARNED[w]) return;
  LEARNED[w] = 1;
  store.set("learned", LEARNED);
}
function learnedCount(){ return Object.keys(LEARNED).length; }

/* ---------- haptics ----------
   Android honours this; iOS Safari does not implement navigator.vibrate at
   all, so on an iPhone every call here is a silent no-op. That is a real gap
   and not one a web build can close, so nothing in the game may depend on a
   buzz to be understood — it is confirmation, never information. */
function buzz(pattern){
  if(!prefs.haptics) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

/* ---------- sound ----------
   The first version played one oscillator per event, which is exactly why
   every sound in the game was a beep. A hit that reads as physical is three
   layers arriving on the same frame:

     1. a noise transient, 20-60ms, for the attack you feel;
     2. a pitched body that bends downward, which is what the ear hears as
        something landing rather than something sounding;
     3. a sub sine under it for weight.

   Chip hardware faked all three with two square channels and a noise channel,
   so that is the shape of this: squares, saws, a noise buffer, hard envelopes
   with no tail, and a soft clipper on the bus so stacked layers saturate like
   a console instead of crackling. */
let actx = null, bus = null, noiseBuf = null;

function audio(){
  if(actx){
    if(actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    bus = actx.createGain();
    bus.gain.value = 0.9 * prefs.sfxVol;

    /* tanh soft clip: four layers at once should thicken, not clip */
    const shaper = actx.createWaveShaper();
    const n = 1024, curve = new Float32Array(n);
    for(let i = 0; i < n; i++){ const x = i * 2 / n - 1; curve[i] = Math.tanh(x * 1.7); }
    shaper.curve = curve; shaper.oversample = "2x";
    bus.connect(shaper); shaper.connect(actx.destination);

    const len = Math.floor(actx.sampleRate * 0.5);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }catch(e){ actx = null; }
  return actx;
}

/* One pitched voice. f0 -> f1 over dur, hard attack, exponential decay. */
function voice(o){
  if(!prefs.sfx || !audio()) return;
  try{
    const t = actx.currentTime + (o.at || 0);
    const dur = o.dur || 0.1;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = o.type || "square";
    osc.frequency.setValueAtTime(o.f0, t);
    if(o.f1 && o.f1 !== o.f0){
      osc.frequency.exponentialRampToValueAtTime(Math.max(8, o.f1), t + dur);
    }
    if(o.detune) osc.detune.setValueAtTime(o.detune, t);

    const peak = o.gain === undefined ? 0.1 : o.gain;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    let node = osc;
    if(o.lp){
      const f = actx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.setValueAtTime(o.lp, t);
      node.connect(f); node = f;
    }
    node.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + dur + 0.04);
  }catch(e){}
}

/* The attack: filtered noise with a falling cutoff. */
function hit(o){
  if(!prefs.sfx || !audio()) return;
  try{
    const t = actx.currentTime + (o.at || 0);
    const dur = o.dur || 0.05;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = o.type || "bandpass";
    f.frequency.setValueAtTime(o.f0 || 2400, t);
    if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1), t + dur);
    f.Q.value = o.q === undefined ? 1 : o.q;
    const g = actx.createGain();
    g.gain.setValueAtTime(o.gain === undefined ? 0.12 : o.gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t); src.stop(t + dur + 0.03);
  }catch(e){}
}

/* Equal temperament from a root, so the scoring ladder stays musical however
   long the chain runs. */
function semi(root, n){ return root * Math.pow(2, n / 12); }

const SFX = {
  /* picking up a card: a short blip that climbs with each one you add */
  pick: function(n){
    const f = semi(523, (n || 1) * 4);
    voice({ f0: f, f1: f * 1.5, dur: 0.06, gain: 0.075 });
    hit({ f0: 5000, f1: 2200, dur: 0.025, gain: 0.045, q: 0.6 });
  },
  drop: function(){
    voice({ f0: 440, f1: 220, dur: 0.075, gain: 0.06 });
  },
  deny: function(){
    voice({ f0: 160, f1: 92, dur: 0.17, gain: 0.1 });
    hit({ f0: 900, f1: 180, dur: 0.1, gain: 0.07, q: 1.5 });
  },
  button: function(){
    voice({ f0: 700, f1: 950, dur: 0.035, gain: 0.05 });
    hit({ f0: 4200, f1: 2000, dur: 0.018, gain: 0.035, q: 0.8 });
  },

  /* The coin. Two square steps, the second held — the shape every arcade
     machine used, because it cuts through anything playing under it. Climbs a
     whole-tone ladder so a long chain builds instead of repeating. */
  score: function(i, isMult){
    const step = Math.min(i || 0, 16) * 2;
    const root = isMult ? 392 : 523;
    const f = semi(root, step);
    voice({ f0: f, dur: 0.042, gain: 0.085 });
    voice({ f0: f * 1.5, dur: 0.12, gain: 0.085, at: 0.042 });
    hit({ f0: 5400, f1: 2800, dur: 0.02, gain: 0.045, q: 0.6 });
    /* a multiplier event gets a growl under it so it is audibly not a chip */
    if(isMult){
      voice({ f0: f / 2, f1: f / 3.2, dur: 0.16, type: "sawtooth", gain: 0.07, lp: 1500 });
    }
  },

  /* a Lens firing: a saw stab that dives, with a sub under it */
  lens: function(){
    voice({ f0: 920, f1: 210, dur: 0.18, type: "sawtooth", gain: 0.1, lp: 2800 });
    voice({ f0: 115, f1: 58, dur: 0.22, type: "sine", gain: 0.2 });
    hit({ f0: 6500, f1: 900, dur: 0.07, gain: 0.08, q: 0.5 });
  },

  /* The total. A kick, a chord and a crash on the same frame, sized to the
     hit — level 3 gets the full stack. */
  total: function(level){
    const L = Math.max(1, level || 1);
    voice({ f0: 160, f1: 42, dur: 0.3, type: "sine", gain: 0.38 });
    [523, 659, 784, 1047].slice(0, 1 + L).forEach(function(f, i){
      voice({ f0: f, dur: 0.3 + i * 0.05, gain: 0.09, at: i * 0.014,
              detune: i % 2 ? 8 : -8 });
    });
    hit({ f0: 7000, f1: 1100, dur: 0.14 + L * 0.06, gain: 0.09, type: "highpass", q: 0.4 });
  },

  /* the round falling: an arpeggio that lands on a held chord */
  clear: function(){
    [523, 659, 784, 1047, 1319].forEach(function(f, i){
      voice({ f0: f, dur: 0.1, gain: 0.085, at: i * 0.065 });
    });
    const at = 0.33;
    [1047, 1319, 1568].forEach(function(f, i){
      voice({ f0: f, dur: 0.55, gain: 0.08, at: at, detune: i === 1 ? 9 : -9 });
    });
    voice({ f0: 131, f1: 62, dur: 0.45, type: "sine", gain: 0.32, at: at });
    hit({ f0: 9000, f1: 1600, dur: 0.35, gain: 0.085, type: "highpass", q: 0.4, at: at });
  },

  /* out of plays: four steps down, detuned, with the floor dropping out */
  fail: function(){
    [392, 330, 262, 196].forEach(function(f, i){
      voice({ f0: f, f1: f * 0.93, dur: 0.24, type: "sawtooth", gain: 0.1,
              at: i * 0.125, lp: 1300 });
    });
    voice({ f0: 95, f1: 36, dur: 0.8, type: "sine", gain: 0.3, at: 0.42 });
    hit({ f0: 1400, f1: 120, dur: 0.5, gain: 0.06, q: 0.8, at: 0.42 });
  },

  buy: function(){
    voice({ f0: 784, dur: 0.045, gain: 0.09 });
    voice({ f0: 1047, dur: 0.045, gain: 0.09, at: 0.05 });
    voice({ f0: 1568, dur: 0.18, gain: 0.09, at: 0.1, detune: 5 });
    voice({ f0: 196, f1: 130, dur: 0.14, type: "sine", gain: 0.2 });
    hit({ f0: 6500, f1: 3000, dur: 0.05, gain: 0.06, q: 0.6 });
  },
  reroll: function(){
    voice({ f0: 300, f1: 760, dur: 0.11, gain: 0.07 });
    hit({ f0: 3200, f1: 700, dur: 0.09, gain: 0.06, q: 1.2 });
  },
  discard: function(){
    hit({ f0: 2800, f1: 420, dur: 0.15, gain: 0.13, q: 0.7 });
    voice({ f0: 200, f1: 105, dur: 0.11, gain: 0.05 });
  },
  /* a word coming back from the Interpreter */
  reveal: function(){
    [440, 659, 880].forEach(function(f, i){
      voice({ f0: f, dur: i === 2 ? 0.3 : 0.09, gain: 0.08, at: i * 0.095 });
    });
    voice({ f0: 220, f1: 140, dur: 0.25, type: "sine", gain: 0.16, at: 0.19 });
    hit({ f0: 7000, f1: 2400, dur: 0.12, gain: 0.05, type: "highpass", q: 0.5, at: 0.19 });
  },
  runWon: function(){
    [523, 659, 784, 1047, 1319, 1568].forEach(function(f, i){
      voice({ f0: f, dur: 0.11, gain: 0.09, at: i * 0.075 });
    });
    voice({ f0: 1047, dur: 0.9, gain: 0.09, at: 0.46, detune: -10 });
    voice({ f0: 1568, dur: 0.9, gain: 0.09, at: 0.46, detune: 10 });
    voice({ f0: 131, f1: 65, dur: 0.8, type: "sine", gain: 0.34, at: 0.46 });
  }
};

/* The theme. 2MB has no business blocking the first frame, and no browser
   will play it before a gesture anyway — so it is fetched on the first tap
   and never before. */
const MUSIC_SRC = "audio/theme.mp3";
/* The theme is scenery, not the show. It sat at .32 and swallowed the effects
   it is supposed to sit under. */
const MUSIC_VOL = 0.15;
/* The mixed level, times what the player asked for. */
function themeVol(){ return MUSIC_VOL * prefs.musicVol; }
let music = null, musicFade = null;

function musicFadeTo(target, ms){
  if(!music) return;
  cancelAnimationFrame(musicFade);
  const from = music.volume, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / ms);
    try{ music.volume = Math.max(0, Math.min(1, from + (target - from) * k)); }catch(e){}
    if(k < 1) musicFade = requestAnimationFrame(step);
  })(t0);
}

function musicStart(){
  if(!prefs.music) return;
  if(!music){
    try{
      music = new Audio(MUSIC_SRC);
      music.loop = true; music.preload = "auto"; music.volume = 0;
    }catch(e){ music = null; return; }
  }
  try{
    const p = music.play();
    /* Autoplay policy, a missing file, a browser with no codec: all of them
       land here, and none of them is worth breaking a hand of cards over. */
    if(p && p.catch) p.catch(function(){});
    musicFadeTo(themeVol(), 1600);
  }catch(e){}
}
function musicStop(){
  if(!music) return;
  musicFadeTo(0, 320);
  setTimeout(function(){ try{ if(!prefs.music) music.pause(); }catch(e){} }, 360);
}
/* Drop the theme under a big moment so the moment is audible. */
function musicDuck(ms){
  if(!music || music.paused) return;
  musicFadeTo(themeVol() * 0.25, 70);
  setTimeout(function(){ if(prefs.music) musicFadeTo(themeVol(), 800); }, ms || 700);
}

/* A level has to land on the sound that is already playing, not on the next
   one - a slider you cannot hear while you drag it is a slider you cannot
   set. */
function applyVol(){
  if(bus) bus.gain.value = 0.9 * prefs.sfxVol;
  if(music && !music.paused) musicFadeTo(themeVol(), 120);
}

/* Browsers gate audio behind a real gesture, and they do not all agree on
   which events count — a pointerdown that never becomes a click is not always
   enough, and an iframed page can need the gesture to land inside the frame.
   So this does not fire once and hope: it tries on every interaction until the
   element is genuinely playing, and only then stops listening. */
const GESTURES = ["pointerdown", "pointerup", "touchend", "click", "keydown"];
function firstGesture(){
  /* An AudioContext created before a gesture starts suspended; this is the
     moment it is allowed to resume, and the effects need it as much as the
     theme does. */
  audio();
  if(!prefs.music) return;
  musicStart();
  if(music && !music.paused) dropGestureHooks();
}
function dropGestureHooks(){
  GESTURES.forEach(function(ev){ window.removeEventListener(ev, firstGesture, true); });
}
GESTURES.forEach(function(ev){
  /* capture, so a handler that stops propagation cannot swallow it */
  window.addEventListener(ev, firstGesture, { capture: true, passive: true });
});

/* ---------- game state ---------- */
let G = null;

function makeCard(entry, interpreted){
  return {
    id: Math.random().toString(36).slice(2,9),
    w: entry.w,
    t: entry.t.slice(),
    /* Was 5 + 3 x LETTERS - so spelling was not merely leaking through a few
       Lenses, it was the base currency of every card in the game, against a
       spec whose first constraint is that nothing in scoring reads spelling.
       Keyed to overtones instead, and scaled to land on the same range the
       lexicon used to produce (17-32) so the curves stay comparable. */
    base: 6 + 5*entry.t.length,
    interpreted: !!interpreted
  };
}

/* `fresh` picks a seed of its own instead of the daily. It used to decide the
   carried Lens as well, which meant three buttons all saying "New run" behaved
   three different ways. That is `prefs.carryMemory` now, set by the player on
   the menu, and it is the only thing that decides. */
function newRun(seedStr, fresh){
  const daily = todayKey();
  const seed = seedStr || daily;
  rng = mulberry32(hashStr(seed));

  const demandOrder = shuffle(DEMANDS.slice()).slice(0, ROUNDS);
  /* Seeded like everything else, so a daily deals every player the same three. */
  /* Read off the difficulty this run is being dealt under, not the one the
     menu happens to be showing, so a run keeps the shape it started with. */
  const dealtDiff = difficulty().id;
  /* Shuffle the WHOLE list and filter after, never the other way round. The
     shuffle draws once per element, so shuffling a shorter list consumes fewer
     numbers from the seeded stream and every draw after it — the deck
     included — comes out different. A mode is a different curve, not
     different words, and the daily is the same words for everybody. */
  const shuffled = shuffle(ORDEALS.slice());
  const ordealOrder = {};
  const rounds = ordealRoundsFor(dealtDiff);
  const used = [];
  rounds.forEach(function(r, i){
    /* Drawn from the pool this SLOT allows, in the shuffled order, skipping
       anything an earlier slot already took. */
    const pool = ordealPoolAt(dealtDiff, i, rounds.length)
      .filter(function(o){ return used.indexOf(o) < 0; });
    /* Widening to the mode's whole pool keeps the de-duplication: dropping it
       is how a schedule longer than the slot pool deals the same rule twice. */
    const from = pool.length ? pool
      : ordealPoolFor(dealtDiff).filter(function(o){ return used.indexOf(o) < 0; });
    const pickFrom = shuffled.filter(function(o){ return from.indexOf(o) >= 0; });
    const o = pickFrom[0] || from[0];
    if(!o) return;              /* more scheduled rounds than there are rules */
    used.push(o);
    ordealOrder[r] = o;
  });

  /* Build the deck knowing what this run will ask for. Some overtones are
     genuinely rare in the lexicon (FOOD sits on 21 of 249 words), so a purely
     random 26-card deck can hand you a Demand you cannot possibly meet. Seed
     a floor of 3 words per demanded overtone first, then fill at random. */
  /* Build the deck knowing what this run will ask for.

     The floor has to be per DEMAND, not per overtone. A Demand is answered by
     ANY of its tags, and words carry 3.2 overtones on average — so three PLANT
     words that all happened to be NATURE as well satisfied a per-overtone
     floor twice over while leaving THE GREENHOUSE with three playable cards.
     Guarantee answers to the Demand itself, scarcest Demand first, so the
     hardest one to supply gets first claim on the 26 slots. */
  const DECK_SIZE = 26, FLOOR = 5;
  const bag = shuffle(LEXICON.slice());
  const chosen = [], taken = {};

  function answers(entry, d){
    return entry.t.some(function(t){ return d.tags.indexOf(t) >= 0; });
  }
  function answering(d){
    return chosen.filter(function(e){ return answers(e, d); }).length;
  }

  const supply = {};
  demandOrder.forEach(function(d){
    supply[d.n] = LEXICON.filter(function(e){ return answers(e, d); }).length;
  });
  demandOrder.slice()
    .sort(function(a, b){ return supply[a.n] - supply[b.n]; })
    .forEach(function(d){
      for(let i = 0; i < bag.length && answering(d) < FLOOR && chosen.length < DECK_SIZE; i++){
        if(taken[bag[i].w] || !answers(bag[i], d)) continue;
        taken[bag[i].w] = 1; chosen.push(bag[i]);
      }
    });
  for(let i = 0; i < bag.length && chosen.length < DECK_SIZE; i++){
    if(taken[bag[i].w]) continue;
    taken[bag[i].w] = 1; chosen.push(bag[i]);
  }

  const deck = chosen.map(function(e){ return makeCard(e,false); });

  G = {
    seed: seed,
    isDaily: seed === daily,
    /* Pinned for the whole run. The setting is what the NEXT one uses. */
    diff: difficulty().id,
    round: 0,
    deck: shuffle(deck),
    discard: [],
    hand: [],
    lenses: [],
    bank: 4,
    selected: [],
    plays: PLAYS_PER_ROUND, discards: DISCARDS_PER_ROUND,
    roundScore: 0,
    total: 0,
    demandOrder: demandOrder,
    ordealOrder: ordealOrder,
    ordeal: null,
    best: { word:"", mult:0, score:0 },
    coachStep: null,
    /* what each Lens has grown to this run, keyed by Lens id */
    lensState: {},
    /* how many times each figure has SCORED this run. The run's record of
       what the player has learned to see. Dies with the run on purpose:
       that is what makes a run a story rather than a save file. */
    /* overtone -> plays until it wakes up */
    dull: {},
    /* lines the player kept. A Lens is bought; these are written, and they
       have a shelf of their own - KEEP_SLOTS, not the Lens slots. */
    kept: [],
    /* what was laid down this round, so the Bookseller can offer it back */
    roundLines: [],
    /* which Lens in the rail is opened out to its full rule */
    openLens: null,
    interpreterUsed: false,
    interpretedWord: null,
    animating: false,
    over: false,
    offers: null,
    shopSeen: []
  };

  /* Memory: a Lens carried in from a run you finished, unless the player has
     said on the menu that they would rather start clean. Never destroyed by
     the choice — finishing a run is what replaces it. */
  const memory = prefs.carryMemory ? store.get("memory", null) : null;
  if(memory){
    const l = LENSES.find(function(x){ return x.id===memory; });
    if(l){ G.lenses.push(l); G.memoryLens = l.id; }
  }

  for(const k in SEEN) delete SEEN[k];
  G.coachStep = coachDone() ? null : "pick";
  startRound();
}

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* How big a hand is, after the Lenses that shrink it. Never below four —
   a hand you cannot make a three-word play from is not a hand. */
function handSize(){
  let n = HAND_SIZE;
  if(G && G.lenses) G.lenses.forEach(function(l){ if(l.hand) n += l.hand; });
  roundRules().forEach(function(o){ if(o.hand) n += o.hand; });
  return Math.max(4, n);
}

/* Two shelves, counted apart. Kept lines used to compete for the five Lens
   slots, and because they are free that made "keep five, buy nothing" strictly
   better than anything on the shelf - so KEEP_SLOTS bounds them on their own.
   One answer for each, read everywhere: three call sites once counted Lenses
   only while the offers still cost a shared slot, so a rail holding two Lenses
   and three kept lines read as "two of five" and the offers stayed clickable
   while buy() silently refused them. */
function slotsUsed(){ return G ? G.lenses.length : 0; }
function slotsLeft(){ return LENS_SLOTS - slotsUsed(); }
function slotsFull(){ return slotsLeft() <= 0; }
function keepsUsed(){ return G && G.kept ? G.kept.length : 0; }
function keepsFull(){ return keepsUsed() >= KEEP_SLOTS; }

/* Every rule in force this round: the one the round was dealt, and the one
   THE RECKONING drafted onto it if your deck had outgrown the target. */
function roundRules(){
  if(!G) return [];
  return [G.ordeal, G.levy].filter(Boolean);
}

/* What a round will ACTUALLY ask for and hand you, once the Lenses you hold
   and the Ordeal you are about to meet have taken their cut. Runs the same
   hooks startRound does, against a throwaway object.

   The shop used to quote TARGETS[round] straight, which is a lie the moment
   you own THE CURSE: it said 11,500 and the round demanded 23,000. You cannot
   ask someone to shop wisely against a number that is not true. */
function shapeFor(round, rules){
  /* The guard belongs where the read is. deckCeiling had one and this did not,
     so TARGETS[ROUNDS] * curveScale(ROUNDS) came out NaN and survived every
     clamp below - the Bookseller rendered the string "NaN" as next round's
     target. */
  if(!(round >= 0) || round >= ROUNDS || TARGETS[round] === undefined) return null;
  const diff = runDifficulty();
  const probe = { target: Math.round(TARGETS[round] * curveScale(round)),
                  plays: PLAYS_PER_ROUND,
                  discards: DISCARDS_PER_ROUND + diff.discards, round: round };
  if(G && G.lenses) G.lenses.forEach(function(l){ if(l.onRound) l.onRound(probe); });
  /* The rules take their cut after the Lenses, so a Lens can never hand back
     what the round has taken. */
  rules.forEach(function(o){ if(o.round) o.round(probe); });
  let hand = HAND_SIZE;
  if(G && G.lenses) G.lenses.forEach(function(l){ if(l.hand) hand += l.hand; });
  rules.forEach(function(o){ if(o.hand) hand += o.hand; });
  let cap = MAX_PLAY;
  rules.forEach(function(o){ if(o.maxPlay) cap = Math.min(cap, o.maxPlay); });
  return {
    target: Math.max(1, Math.round(probe.target)),
    plays: Math.max(1, probe.plays),
    /* A round that demands a forfeit has to leave a discard to make it with,
       whatever else took them away and in whatever order. */
    discards: Math.max(probe.mustForfeit ? 1 : 0, probe.discards),
    hand: Math.max(4, hand),
    maxPlay: cap,
    mustForfeit: !!probe.mustForfeit,
    rules: rules
  };
}

/* The round as dealt, before it has looked at your deck. THE RECKONING is
   measured against this one, so measuring it can never depend on itself. */
function baseShape(round){
  const o = G && G.ordealOrder ? G.ordealOrder[round] : null;
  return shapeFor(round, o ? [o] : []);   /* null past the end of the run */
}

/* The round you will actually face, reckoning included. */
function roundShape(round){
  const o = G && G.ordealOrder ? G.ordealOrder[round] : null;
  const r = reckoning(round);
  return shapeFor(round, [o, r].filter(Boolean));
}

/* ---------- THE RECKONING ----------
   An engine that has outrun the curve stops playing the game: every hand
   clears, nothing is a decision, and the run finishes itself. Raising every
   target instead would only punish the decks that never got going.

   So the round answers the deck in front of it. Past twice what the round
   asks for, it drafts a second rule — one of the Ordeals, never the one it
   already has — and the Bookseller names it before you spend, so an engine
   that triggers it is a purchase you made knowing. Seeded on the run and the
   round, so a daily deals everyone the same reckoning. */
/* Both numbers measured, and both retuned after measuring what they cost.

   Across simulated runs the deck's ceiling over the round's target sits at a
   median of 4.1x on rounds 1 and 2 — those targets are meant to be walked
   over, and round 1 is where the tutorial runs — and then at 0.7x to 1.2x from
   round 3 on. So the rule starts at round 3, where being ahead means anything
   at all.

   MEASURED AGAIN, n=400 SCHOLAR runs, after the levy was made to obey the
   slot rule: it now fires on 39.2%, 43.1%, 57.1% and 47.8% of rounds 3 to 6.
   The paragraph below claimed "0-5% of rounds where a build has genuinely
   broken the round open", and that has not been true for a long time - the
   threshold is read against a curve that has moved twice since. It is left at
   three because the curves either side of it are measured WITH it firing at
   that rate, and because what made it dangerous was never the frequency: it
   was that the drafted rule ignored the slot guard. 280 of 495 drafted rules
   used to be disarming ones landing on rounds 3 and 4, where a two-shop deck
   has nothing to answer them with. That is 0 of 367 now.

   The bar is three times rather than twice. At twice, a deck that was merely*/
const RECKON_AT = 3, RECKON_FROM = 2;

/* Ordeals that cannot both be obeyed. THE FORFEIT makes you spend a discard;
   THE DROUGHT takes every discard away. Stacked, the round owes a debt it has
   no currency for. Listed both ways round so the check does not depend on
   which of the two the round was dealt. */
const ORDEAL_CLASH = { forfeit:["drought"], drought:["forfeit"] };
function clashes(a, b){
  return (ORDEAL_CLASH[a] || []).indexOf(b) >= 0;
}

function reckonFor(round){
  if(!G || !G.demandOrder || round < RECKON_FROM) return null;
  /* THE RECKONING answers a player who has broken the round open by stacking a
     second rule on the first. The gentler mode meets one rule at all, at the
     end; doubling it is the thing that mode exists not to do. */
  if(!runDifficulty().reckon) return null;
  const base = baseShape(round);
  /* shapeFor returns null past the end of the run now, rather than a NaN
     target that made `can < base.target * RECKON_AT` false and quietly drafted
     a rule onto a round that does not exist. */
  if(!base) return null;
  const can = deckCeiling(round, base);
  if(can < base.target * RECKON_AT) return null;
  const own = (G.ordealOrder && G.ordealOrder[round]) || null;
  /* The levy drafted out of the WHOLE table with no slot check, so the rule
     that keeps disarming Ordeals away from a player who cannot answer them
     was bypassed on every run that triggered it. Measured before this: 280 of
     495 drafted rules were disarming ones, THE VICE among them 41 times, on
     rounds 3 and 4. A drafted rule obeys the same slot rule as a dealt one. */
  const src = round >= ROUNDS - 1
    ? ORDEALS
    : ORDEALS.filter(function(o){ return DISARMING.indexOf(o.id) < 0; });
  const pool = src.filter(function(o){
    if(!own) return true;
    if(o.id === own.id) return false;
    return !clashes(own.id, o.id);
  });
  /* Every candidate can clash with the round's own rule. Without this the
     index arithmetic lands on undefined and the levy silently vanishes. */
  if(!pool.length) return null;
  const pick = mulberry32(hashStr(G.seed + ":reckon:" + round))();
  return pool[Math.floor(pick * pool.length) % pool.length];
}

/* Memoised per round and per build: the shop re-renders on every purchase and
   each check costs a ceiling, and a ceiling is 25ms. */
let reckonMemo = {};
function reckoning(round){
  if(!G || !G.lenses) return null;
  const key = round + "|" + G.seed + "|"
    + G.lenses.map(function(l){ return l.id + ":" + Math.round((G.lensState||{})[l.id] || 0); }).join(",")
    + "|" + (G.deck.length + G.discard.length + G.hand.length);
  if(reckonMemo.key === key) return reckonMemo.val;
  const val = reckonFor(round);
  reckonMemo = { key: key, val: val };
  return val;
}

/* The best a deck could possibly do in a given round: the whole deck available,
   drawn perfectly, ordered perfectly, every play spent. No real round beats
   this, so a target above it is a target that cannot be met.

   Scores against the round's OWN Demand and Ordeal, not the current one, since
