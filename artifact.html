   the point is to look forward from the shop. Restores everything it borrows. */
function deckCeiling(round, shape){
  if(!G) return 0;
  /* A round that does not exist has no demand to score against, and reading
     one used to throw out of the shop and take the board with it. The run
     length has changed once already; a guard costs nothing and means the next
     change cannot crash anything. */
  if(!(round >= 0) || round >= ROUNDS || !G.demandOrder || !G.demandOrder[round]) return 0;
  const keepDemand = G.demand, keepOrdeal = G.ordeal,
        keepLevy = G.levy, keepDiscards = G.discards;
  shape = shape || roundShape(round);
  const d = G.demandOrder[round];
  G.demand = { n: d.n, tags: d.tags.slice() };
  /* Score against the rules that round will really be played under — both of
     them, if THE RECKONING has drafted a second. */
  G.ordeal = shape.rules[0] || null;
  G.levy = shape.rules[1] || null;
  G.discards = shape.discards;

  /* Two things were wrong with this pool, and together they made the shop
     tell players a winnable round was impossible.

     It held 9 cards while four plays of three need twelve, so the last play
     always scored nothing; and it ranked by raw base value, which is the
     smaller half of what a card is worth — a matching tag pays DEMAND_CHIPS
     on a deck whose words average 22. A round the deck could actually make at
     6,115 was quoted at 5,040 against a target of 5,200, in red, with "no
     order of play gets there" under it. A ceiling that says a round cannot be
     won when it can is worse than no ceiling at all.

     Rank by what the round will actually pay for, and hold enough cards that
     every play has three to choose from. ~25ms. */
  const want = d.tags;
  const pool = G.deck.concat(G.discard, G.hand).slice()
    .sort(function(a, b){
      const fit = function(c){
        return c.base + DEMAND_CHIPS * c.t.filter(function(t){ return want.indexOf(t) >= 0; }).length;
      };
      return fit(b) - fit(a);
    })
    .slice(0, shape.plays * MAX_PLAY + 6);
  const used = [];
  let total = 0;
  for(let p = 0; p < shape.plays; p++){
    const avail = pool.filter(function(c){ return used.indexOf(c) < 0; });
    const best = bestLineFrom(avail, shape.maxPlay);
    if(!best) break;
    best.cards.forEach(function(c){ used.push(c); });
    total += best.total;
  }

  G.demand = keepDemand; G.ordeal = keepOrdeal;
  G.levy = keepLevy; G.discards = keepDiscards;
  return Math.round(total);
}

/* How many words this round will let you play at once. */
function maxPlay(){
  let n = MAX_PLAY;
  roundRules().forEach(function(o){ if(o.maxPlay) n = Math.min(n, o.maxPlay); });
  return n;
}

/* Which rule is holding the hand down — the round's own, or the one it drew.
   Either can be the one doing it, so neither may be assumed. */
function capper(){
  const cap = maxPlay();
  const r = roundRules().find(function(o){ return o.maxPlay === cap; });
  return r ? r.n : "This round";
}

function startRound(){
  G.demand = { n: G.demandOrder[G.round].n, tags: G.demandOrder[G.round].tags.slice() };
  G.ordeal = (G.ordealOrder && G.ordealOrder[G.round]) || null;
  /* Fixed here and left alone for the round: a Lens that grows mid-round must
     not be able to change the rules under the player who is using it. */
  G.levy = reckoning(G.round);
  /* shapeFor() predicts a round and startRound() deals it, and the two read
     the same starting numbers from here. They have to: the shop quotes the
     prediction and the player plays the deal, so a difference between them is
     the game lying about itself. tests/logic asserts they agree. */
  const diff = runDifficulty();
  G.target = Math.round(TARGETS[G.round] * curveScale(G.round));
  G.roundScore = 0;
  G.plays = PLAYS_PER_ROUND; G.discards = DISCARDS_PER_ROUND + diff.discards;
  G.roundLines = [];
  G.mustForfeit = false; G.forfeited = false;
  /* Lenses that cost you something take it here, before the round starts, so
     the meters on the board are true from the first frame. And the ones that
     grow, grow here — per round rather than per firing, because firing-based
     growth compounds a Lens's own weakness: the rare triggers that most needed
     the help were the ones that fired least and so grew slowest. */
  G.lenses.forEach(function(l){
    if(l.onRound) l.onRound(G);
    if(l.grows) G.lensState[l.id] = (G.lensState[l.id] || 0) + l.grows;
  });
  /* The rules take their cut after the Lenses, so a Lens can never hand back
     what the round has taken. */
  roundRules().forEach(function(o){ if(o.round) o.round(G); });
  G.plays = Math.max(1, G.plays);
  G.discards = Math.max(G.mustForfeit ? 1 : 0, G.discards);
  G.target = Math.max(1, Math.round(G.target));
  G.selected = [];
  G.discard = G.discard.concat(G.hand);
  G.hand = [];
  draw(handSize());
  render();
}

function draw(n){
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      if(G.discard.length===0) break;
      G.deck = shuffle(G.discard); G.discard = [];
    }
    G.hand.push(G.deck.pop());
  }
}

/* ---------- scoring engine ---------- */
function resolve(cards){
  const events = [];
  let chips = 0, mult = 1;
  /* `lv` is a Lens's accumulated growth, read ONCE for the whole hand. Growth
     is returned rather than applied, so resolve() stays pure: renderPreview
     calls it on every click and must never advance anything. play() commits.
     If a Lens grew mid-hand the board would show one number and pay another,
     and "the board shows what you would score before you commit" is the one
     promise this game cannot break. */
  const lensState = (G.lensState = G.lensState || {});
  const growth = {};
  const ctx = {
    demand: G.demand, discards: G.discards, plays: G.plays, resoUsed: false,
    lenses: G.lenses,
    lv: function(id){ return lensState[id] || 0; }
  };

  /* A line is read left to right. Each join pays for what the two words do to
     each other — shared overtones in points, opposition in multiplier — and the
     first silence stops the reading. Everything after it is a word the player
     wrote that the line could not carry. */
  const dull = dullTags();
  const jr = joinsOf(cards, dull);
  const scored = jr.scored;
  jr.joins.forEach(function(j, i){
    const pts = JOIN_RESONANCE * j.s;
    chips += pts;
    mult += JOIN_TENSION * j.t;
    const bits = [];
    if(j.s) bits.push("+" + pts);
    if(j.t) bits.push("+" + (JOIN_TENSION * j.t) + " mult");
    events.push({ k:"join", i:i, cls:j.t ? "m" : "c", kind:j.kind,
                  txt: JOIN_NAME[j.kind] + " " + bits.join(" "),
                  chips:chips, mult:mult });
  });
  if(scored < cards.length)
    events.push({ k:"join", i:jr.joins.length, cls:"r", kind:"silence",
                  txt:"NOTHING IN COMMON \u00b7 the line stops here", chips:chips, mult:mult });

  figuresFromJoins(jr.joins).forEach(function(fig){
    chips += fig.chips;
    mult += fig.mult;
    events.push({ k:"card", i:-1, cls:"m", fig:fig.id,
                  txt: fig.n + " +" + fig.chips + (fig.mult ? " and +" + fig.mult + " mult" : ""),
                  chips:chips, mult:mult });
    /* A line you kept in an earlier round pays again whenever the figure it
       made comes back. It is the only engine in the run; nothing is bought. */
    (G.kept || []).forEach(function(k){
      if(k.fig !== fig.id) return;
      chips += KEPT_CHIPS; mult += KEPT_MULT;
      events.push({ k:"card", i:-1, cls:"m",
                    txt: k.n + " +" + KEPT_CHIPS + " and +" + KEPT_MULT + " mult",
                    chips:chips, mult:mult });
    });
  });

  for(let i=0;i<scored;i++){
    const c = cards[i];
    chips += c.base;
    events.push({ k:"card", i:i, cls:"c", txt:"+"+c.base, chips:chips, mult:mult });

    /* One label per card, not one per tag. A word carrying both of the round’s
       overtones used to print MATCH +25 and then MATCH +25 again, 210ms apart,
       in the same spot — so the second was invisible and the player had no way
       to see that the card had paid twice. */
    const nhits = demandHits(c);
    if(nhits){
      const dc = DEMAND_CHIPS * nhits, dm = DEMAND_MULT * nhits;
      chips += dc;
      mult = Math.round((mult + dm) * 100) / 100;
      events.push({ k:"card", i:i, cls:"r",
                    txt: (nhits > 1 ? nhits + " MATCHES +" + dc : "MATCH +" + dc)
                         + " and +" + dm + " mult",
                    chips:chips, mult:mult });
    }

    /* The Ordeal lands between the word's own worth and the Lenses, so a Lens
       still fires on a word the round has just taken the value out of. */
    roundRules().forEach(function(rule){
      if(!rule.card) return;
      const o = rule.card(c, i, cards.slice(0, scored), ctx);
      if(o && (o.chips || o.mult)){
        /* mult as well as chips: a rule that says a word scores nothing has to
           be able to take back the multiplier the round's overtones just
           handed it, or "scores nothing" is not true. */
        if(o.chips) chips += o.chips;
        if(o.mult) mult = Math.round((mult + o.mult) * 100) / 100;
        const bits = [];
        if(o.chips) bits.push(String(Math.round(o.chips)));
        if(o.mult) bits.push((o.mult > 0 ? "+" : "") + o.mult + " mult");
        events.push({ k:"card", i:i, cls: o.mult ? "m" : "c",
                      txt: rule.n + " " + (o.label || "") + " " + bits.join(" "),
                      chips:chips, mult:mult });
      }
    });

    for(let li=0; li<G.lenses.length; li++){
      const L = G.lenses[li];
      if(!L.onCard) continue;
      const r = L.onCard(c, i, cards.slice(0, scored), ctx);
      if(!r) continue;
      const parts = [];
      if(r.chips){ chips += r.chips; parts.push((r.chips>0?"+":"")+Math.round(r.chips)); }
      if(r.mult){ mult += r.mult; parts.push((r.mult>0?"+":"")+r.mult+" mult"); }
      if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
      if(r.grow) growth[L.id] = (growth[L.id] || 0) + r.grow;
      events.push({ k:"lens", i:i, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                    txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
    }
  }

  roundRules().forEach(function(rule){
    if(!rule.play) return;
    const o = rule.play(cards, ctx);
    if(o){
      if(o.chips) chips += o.chips;
      if(o.mult) mult += o.mult;
      if(o.xmult) mult *= o.xmult;
      events.push({ k:"card", i:-1, cls:"m",
                    txt: rule.n + " " + (o.label || (o.xmult ? "×" + o.xmult + " mult" : "")),
                    chips:chips, mult:mult });
    }
  });

  for(let li=0; li<G.lenses.length; li++){
    const L = G.lenses[li];
    if(!L.onPlay) continue;
    const r = L.onPlay(cards, ctx);
    if(!r) continue;
    const parts = [];
    if(r.chips){ chips += r.chips; parts.push((r.chips>0?"+":"")+Math.round(r.chips)); }
    if(r.mult){ mult += r.mult; parts.push((r.mult>0?"+":"")+r.mult+" mult"); }
    if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
    if(r.grow) growth[L.id] = (growth[L.id] || 0) + r.grow;
    events.push({ k:"lens", i:-1, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                  txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
  }

  chips = Math.max(0, Math.round(chips));
  mult = Math.max(0.1, mult);
  return { events: events, chips: chips, mult: mult, total: Math.round(chips*mult),
           growth: growth, joins: jr.joins, scored: scored,
           figs: figuresFromJoins(jr.joins) };
}

/* ---------- play ---------- */
let skipAnim = false;
function sleep(ms){ return new Promise(function(r){ if(skipAnim) r(); else setTimeout(r, ms); }); }

async function play(){
  /* LINE_MIN existed in two copy strings and nowhere else: the tutorial said
     "a line is two to five words" and the engine took one. Enforced here, so
     the rule the board states is the rule - and so ASCETIC and THE ORACLE are
     selling something real when they say "play exactly 1 word", rather than
     describing a play everybody already had. */
  if(G.animating || G.selected.length < minPlay() || G.plays<=0) return;
  /* The lesson does not spend the round it is teaching in. It used to ask for
     a PLAY, which meant a first-timer who did as they were told arrived at
     round 1 a play down - so the play was handed back, and handing it back
     needed a gate against replaying the lesson from Help to farm free plays,
     and a held result so a taught hand that cleared the round did not drop the
     Bookseller on top of step 7. None of that is here any more, because the
     thing all of it was propping up is gone: the lesson costs nothing because
     it spends nothing. Guarded here rather than on the button alone, since
     Enter and D reach the same two functions. */
  if(tutActive()) return;
  if(G.mustForfeit && !G.forfeited){
    toast("THE FORFEIT: give a word up first. Pick one and DISCARD.");
    SFX.deny(); buzz([8,45,8]);
    return;
  }
  G.animating = true; skipAnim = false;
  buzz(18);
  /* While a hand resolves, the board takes the room and the hand steps back.
     On a phone this is the difference between the scoring readout fitting and
     being cut in half.

     A min-height in the CSS used to be enough. It stopped being enough when
     the JOIN readout arrived: the stage at rest now carries the beads, the
     stops note and the row naming what the rest of the hand would do, which
     is taller than the resolving floor - so emptying the hint for the scoring
     made the board JUMP SMALLER on the one press where it is supposed to
     grow. Measured at 905px wide: 311px at rest, 267px resolving. Pin it to
     what it already was and let the floor raise it further on a quiet board.*/
  const room = document.getElementById("stage");
  room.style.minHeight = Math.ceil(room.getBoundingClientRect().height) + "px";
  document.getElementById("app").classList.add("resolving");
  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);

  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.plays--;
  /* After resolve(), never before: the line is paid at the overtones it had
     when the player laid it, and they tire for the next one. An overtone that
     just scored is dull, and pays nothing until it recovers - so the strongest
     play this turn is never the strongest play next turn. */
  cards.forEach(function(c){ learnWord(c.w); });
  /* A line that made a figure is a line worth keeping, so the Bookseller can
     offer it back at the end of the round. Lines that made nothing are not
     offered: there would be nothing for them to pay out on. */
  /* roundLines only keeps lines that made a figure, and the hand a run dies
     on very often did not. The death screen needs THIS one. */
  G.lastLine = { ws: cards.slice(0, res.scored).map(function(c){ return c.w; }),
                 total: res.total };
  if(res.figs && res.figs.length){
    G.roundLines = G.roundLines || [];
    /* figs[0] is whichever figure sits first in the FIGURES table, not the one
       that earned the most - and chiasmus is first, so 74 of 80 optimal lines
       bound to it and every kept line in the game was the same card wearing
       different words. Bind to the figure that actually paid. */
    const lead = res.figs.slice().sort(function(x, y){
      const px = FIG_PAY[x.id], py = FIG_PAY[y.id];
      return (py.chips + 250 * py.mult) - (px.chips + 250 * px.mult);
    })[0];
    G.roundLines.push({
      ws: cards.slice(0, res.scored).map(function(c){ return c.w; }),
      fig: lead.id,
      figName: lead.n,
      total: res.total
    });
  }
  G.dull = G.dull || {};
  Object.keys(G.dull).forEach(function(t){
    if(--G.dull[t] <= 0) delete G.dull[t];
  });
  const tired = {};
  const paidLine = cards.slice(0, res.scored);
  for(let i = 0; i + 1 < paidLine.length; i++)
    sharedTags(paidLine[i], paidLine[i + 1], {}).forEach(function(t){ tired[t] = 1; });
  paidLine.forEach(function(c){
    c.t.forEach(function(t){ if(G.demand.tags.indexOf(t) >= 0) tired[t] = 1; });
  });
  /* FATIGUE_SPAN, not FATIGUE_SPAN + 1. The counter is decremented at the top
     of the NEXT play's bookkeeping, not this one's, so the + 1 bought a third
     play of dullness on a rule the help panel prints as two. Against a
     two-play round it was invisible - the round ended first. Against three it
     reaches over the Bookseller and into the next round's opening hand. */
  Object.keys(tired).forEach(function(t){ G.dull[t] = FATIGUE_SPAN; });
  /* the one place growth is banked */
  for(const gid in res.growth){
    G.lensState[gid] = (G.lensState[gid] || 0) + res.growth[gid];
  }
  renderHand(); renderControls();

  const stageCards = document.getElementById("stageCards");
  stageCards.innerHTML = "";
  cards.forEach(function(c){ stageCards.appendChild(cardEl(c, true)); });
  document.getElementById("stageHint").textContent = "";
  setTally(0, 1);

  /* A hand has one length, whatever is in it. The beat used to be fixed per
     event, so resolution time grew with the engine and the reward for
     building something was a longer wait to watch it work. Budget the whole
     hand and divide: a dense hand plays denser, not longer, and every hand
     lands on roughly the same beat. That is the difference between a rhythm
     and a queue.

     The floor is measured, not guessed. Every event makes a label, a flying
     chip and a counter roll, so the beat sets how much DOM work lands per
     second, and a beat fast enough to starve the main thread would deliver this
     same complaint back as dropped frames. Recording every frame interval
     through a hand says it does not: median 16.7ms and nothing at all over 50ms
     on both a bare deck and a five-Lens one. The floor exists because below it
     the labels stop being readable, which is a different limit and a lower one. */
  const sp = animScale();
  const gap = Math.max(70, Math.min(190, Math.round((820 * sp) / Math.max(1, res.events.length))));
  /* The figure is the opening beat and belongs to all three words at once.
     It held the hand still for 620ms against a 70ms beat, which is the
     hitch at the front of every hand - eight beats of nothing moving.

     Cutting it to two beats and letting the cards start underneath does
     not work, and the reason is geometry rather than timing. Labels pick
     a lane from how many are already in the air, so the figure takes lane
     zero and the first card takes lane one - ten pixels apart. They also
     rise at the same rate, so that ten pixels is all they ever get, and
     the figure is the widest label the game prints. Measured: a card's
     +20 came out 100% covered by THE MONOGRAM +320 and +5 mult.

     Raising the figure's lane does not fix it either, because the card
     lanes keep climbing with the stack and pass through wherever it is
     put. So the figure keeps an exclusive beat, and the beat buys only
     what it has to: 400ms rather than 620, with the label's life cut to
     match so it is fading as the first card prints rather than hanging
     over it. Still the longest beat in the hand, and no longer a stop. */
  const figStep = Math.max(400, gap * 4);
  /* Life is figHold + 240 in floatLabel, so this lands at figStep + 150:
     up for its own beat and a breath after it, never longer. */
  const figHold = figStep - 90;
  /* Both beats, so a label can be given a life that ends on the beat it was
     born on rather than on whichever one happens to be longer. */
  window.FLOAT_GAP = gap;
  window.FLOAT_FIG = figHold;
  for(let e=0; e<res.events.length; e++){
    const ev = res.events[e];
    const host = ev.i >= 0 ? stageCards.children[ev.i] : stageCards;
    if(ev.i >= 0 && host){
      host.classList.add("scoring");
      setTimeout(function(){ host.classList.remove("scoring"); }, Math.max(140, gap * 2));
    }
    floatLabel(host || stageCards, ev.txt, ev.cls + (ev.fig ? " fig" : ""));
    if(ev.k === "lens"){ flashLens(ev.lens); buzz(11); }
    /* the number leaves the word that earned it and lands on the counter */
    chipFly(host || stageCards, ev.cls === "m" ? "multV" : "chipsV", ev.cls, Math.max(120, gap * 2));
    /* THE FOG, THE TOLL, THE MIRROR and THE ORACLE all subtract chips, and a
       line can run below zero part-way through. The payout floors at zero, so
       the counter showed a number the game was never going to honour. */
    setTally(Math.max(0, ev.chips), ev.mult);
    if(ev.k === "lens") SFX.lens(); else SFX.score(e, ev.cls === "m");
    await sleep(ev.fig ? figStep : gap);
  }

  await sleep(Math.round(180 * sp));
  G.roundScore += res.total;
  G.total += res.total;
  /* Was keyed on the MULTIPLIER, so a thin line that happened to catch a big
     multiplier outranked the run's actual best hand - and that line is what
     the share text invites the player to show somebody. */
  if(res.total > G.best.score){
    G.best = { word: cards.map(function(c){return c.w;}).join(" · "), mult: Math.round(res.mult*10)/10, score: res.total };
  }

  const totalEl = document.createElement("div");
  totalEl.className = "stage-total";
  totalEl.textContent = "+0";
  stageCards.parentNode.insertBefore(totalEl, document.getElementById("stageHint"));
  rollTotal(totalEl, res.total);
  const stageEl = document.getElementById("stage");
  /* G.roundScore already includes res.total by this line, so the old
     "roundScore + total >= target" test counted this hand twice and washed the
     board green on hands that had not cleared anything. */
  const cleared = G.roundScore >= G.target;
  /* How hard the hand landed, measured against what the round asked for. */
  const weight = res.total / G.target;
  const level = (cleared || weight >= 1) ? 3 : weight >= 0.6 ? 2 : weight >= 0.28 ? 1 : 0;
  SFX.total(level);
  if(level){
    quake(level);
    shock(stageEl);
    burst(stageEl, 14 + level * 12);
    musicDuck(600 + level * 200);
    buzz(level >= 3 ? [22,40,34,30,70] : level >= 2 ? [18,36,26] : 16);
  }
  if(cleared){
    stageEl.classList.add("clear");
    setTimeout(function(){ stageEl.classList.remove("clear"); }, 760);
  }

  if(G.coachStep === "play") G.coachStep = "score";
  renderDemand();
  /* Long enough to read the number, and not one beat longer. The roll itself
     scales with the same setting, so this hold is measured against a finished
     total rather than racing one. */
  await sleep(Math.round(820 * sp));
  try{ totalEl.remove(); }catch(err){}
  setTally(0, 1);

  G.discard = G.discard.concat(cards);
  G.animating = false;
  document.getElementById("app").classList.remove("resolving");
  room.style.minHeight = "";

  if(G.roundScore >= G.target){ await celebrate(); winRound(); return; }
  if(G.plays <= 0){ await lament(); endRun(false); return; }

  draw(handSize() - G.hand.length);
  document.getElementById("stageHint").textContent = idleHint();
  render();
  if(tutActive()) renderTut();
}

/* The two beats that end a round. They are in play() rather than in
   winRound()/endRun() on purpose: those two are called directly by tests and
   by the shop, and neither should have to sit through a second of confetti. */
async function celebrate(){
  const sp = animScale();
  flash(false);
  stamp("ROUND CLEAR", false, Math.round(1150 * sp));
  confetti();
  musicDuck(1200);
  SFX.clear();
  buzz([18,60,24,40,70]);
  await sleep(Math.round(980 * sp));
}
async function lament(){
  const sp = animScale();
  flash(true);
  stamp("OUT OF PLAYS", true, Math.round(1150 * sp));
  quake(3);
  musicDuck(1400);
  SFX.fail();
  buzz([90,70,150]);
  /* Losing gets a touch more room than winning: it is the beat the player
     most wants to understand, and the only one they cannot replay. */
  await sleep(Math.round(980 * Math.max(0.7, sp)));
}

function setTally(c, m){
  /* The pulse classes used to live here, driven by a string comparison against
     the DOM. countTo knows whether the value actually moved, so the punch
     belongs there — and two animations fighting over the same element was
     never going to end well. */
  countTo(document.getElementById("chipsV"), c, "chips");
  countTo(document.getElementById("multV"), Math.round(m*10)/10, "mult");
}
function floatLabel(host, txt, cls){
  if(!host) return;
  const f = document.createElement("div");
  f.className = "float " + cls;
  f.textContent = txt;
  if(getComputedStyle(host).position === "static") host.style.position = "relative";
  /* Step each new label clear of every label still in the air, not just the
     ones in this host: a wide label on a narrow card overflows both its edges,
     so two cards side by side printed MATCH +25 across each other. */
  const stage = document.getElementById("stage");
  f.style.setProperty("--stack", (stage || host).querySelectorAll(".float").length);
  /* A label lives as long as the beat it was born on. Fixed at 850ms it was
     tuned against a 210ms gap and kept about four labels in the air; the beat
     is budgeted now and can run to a third of that, which stacked labels
     until the lanes ran out and one ended up behind another.

     The figure is measured against its own hold rather than the gap, and it
     outlives that hold on purpose: it has a lane and a z-index of its own, so
     it is free to still be up once the first card prints. Cutting it short to
     clear a lane it does not share only opened a window where the figure had
     gone and the cards had not started, and the stage was briefly empty. */
  const life = cls.indexOf("fig") >= 0
    ? (window.FLOAT_FIG || 630) + 240
    : Math.max(400, Math.min(850, (window.FLOAT_GAP || 210) * 5));
  f.style.setProperty("--flife", life + "ms");
  host.appendChild(f);
  setTimeout(function(){ try{ f.remove(); }catch(e){} }, life + 60);
}
function flashLens(i){
  const el = document.getElementById("rail").children[i];
  if(!el) return;
  el.classList.remove("fired"); void el.offsetWidth; el.classList.add("fired");
}

function discardSel(){
  if(G.animating || G.selected.length===0 || G.discards<=0) return;
  /* Same reason as play(): a discard spent during the lesson is a discard the
     round never gets back, and no step asks for one. */
  if(tutActive()) return;
  const cards = G.hand.filter(function(c){ return G.selected.indexOf(c.id)>=0; });
  G.discard = G.discard.concat(cards);
  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.discards--;
  G.forfeited = true;
  draw(handSize() - G.hand.length);
  SFX.discard();
  buzz([9,26,9]);
  render();
}

/* ---------- round win + shop ---------- */
function winRound(){
  say("Round cleared. " + G.roundScore.toLocaleString() + " against " + G.target.toLocaleString() + ".");
  /* Was 4 + whatever you had left, which measured 7 or 8 every round of every
     run: every shop was "buy the one thing you can afford", never save, never
     rich, never priced out. Beating the target is worth money now, so a round
     you broke open funds the Lens you could not reach before. */
  const over = G.target > 0 ? (G.roundScore / G.target) - 1 : 0;
  const bonus = Math.max(0, Math.min(6, Math.floor(over * 4)));
  let reward = 4 + G.plays + G.discards + bonus;
  G.lenses.forEach(function(l){ if(l.onReward) reward = l.onReward(reward); });
  reward = Math.max(0, Math.round(reward));
  G.bank += reward;
  G.round++;
  if(G.round >= ROUNDS){ endRun(true); return; }
  openShop(reward);
}

/* Which overtone a Lens keys off. Only the ones that trigger on a single
   overtone are listed — the rest have no honest "fits your deck" answer. */
const LENS_TAG = {
  pyro:"HEA", zoo:"ANI", doom:"DAN", meta:"ABS", carn:"ANI", hydro:"WET",
  chron:"TIM", night:"DAR", prosp:"MON", phren:"MIN", sesq:null, brut:null
};
function deckCount(tag){
  return G.deck.concat(G.discard, G.hand).filter(function(c){
    return c.t.indexOf(tag) >= 0;
  }).length;
}

/* Shown once, ever. It sets the flag as it opens rather than as it closes: a
   player who reloads mid-card has still seen it, and showing it twice teaches
   nothing the second time. */
function introduceFlaws(lens, reward){
  store.set("sawFlaw", true);
  showPanel('<h2>Something new on the shelf</h2>'
    + '<div class="sub">' + escapeHtml(lens.n) + ' is a flawed Lens</div>'
    + '<p>Flawed Lenses pay more than anything else in the game, and every one of '
    + 'them takes something back. A play, a discard, cards in your hand, your '
    + 'income, or the target itself.</p>'
    + '<div class="lens flaw static"><div class="n">' + escapeHtml(lens.n) + '</div>'
    + '<div class="d">' + escapeHtml(lens.d) + '</div></div>'
    + '<p>Whether that is a bargain or the end of your run depends on how many '
    + 'rounds you have left and what your deck can already do. Early, with rounds '
    + 'to pay it off in, they are the best thing in the shop. Late, they are how '
    + 'a good run ends.</p>'
    + '<p class="gold">You can leave it. There is always another shelf.</p>'
    + '<p style="font-size:13px;color:var(--text-faint)">You will not be shown this '
    + 'again. The full list is under <b>How to play</b>.</p>'
    + '<div class="rowend end">'
    + '<button class="btn primary" id="seenFlaw" type="button">Show me the shop</button></div>');
  document.getElementById("seenFlaw").onclick = function(){
    hidePanel();
    openShop(reward);
  };
}

function rollOffers(){
  const owned = G.lenses.map(function(l){ return l.id; });
  const avail = LENSES.filter(function(l){ return owned.indexOf(l.id)===-1; });
  shuffle(avail);
  const offers = avail.slice(0,2).map(function(l){ return { kind:"lens", lens:l, cost:l.cost }; });
  offers.push({ kind:"words", cost:3 });
  return offers;
}

function openShop(reward){
  if(!G.offers) G.offers = rollOffers();
  /* The first flawed Lens a player is ever offered is the one moment where the
     shop can talk them into losing a run. It gets a card of its own, once, on
     the shelf it is standing on. */
  if(!flawsSeen()){
    const first = G.offers.find(function(o){ return o.kind === "lens" && o.lens.flaw; });
    if(first){ introduceFlaws(first.lens, reward); return; }
  }
  const nextDemand = G.demandOrder[G.round];
  const nextOrdeal = (G.ordealOrder && G.ordealOrder[G.round]) || null;
  const next = roundShape(G.round);
  const html = ''
    + '<h2>The Bookseller</h2>'
    + '<div class="sub">Round ' + G.round + ' cleared \u00b7 +$' + reward + '</div>'
    + (coachDone() ? '' : '<p class="gold"><b>Buy a Lens.</b> Nothing else keeps up with the targets.</p>')
    + '<p class="nextup">Next: <b>' + nextDemand.n + '</b> wants '
    + nextDemand.tags.map(function(t){ return '<b>'+TAGS[t][0]+'</b>'; }).join(" or ")
    + ' \u00b7 <b>' + next.target.toLocaleString() + '</b> points'
    + (function(){
        /* What this round asks on this mode's own curve, before anything the
           player is holding has touched it. */
        const par = Math.round(TARGETS[G.round] * curveScale(G.round));
        if(next.target === par || !par) return '';
        return ' \u00b7 <b class="gold">' + (next.target / par).toFixed(1)
             + '\u00d7 the usual</b>, from what you hold';
      })()
    + '</p>'
    /* Against the MODE's untouched round, not baseShape - baseShape runs the
       Lenses too, so comparing to it hid this line exactly when a Lens had
       changed the shape, which is when it is worth reading. */
    + (next.plays !== PLAYS_PER_ROUND
       || next.discards !== DISCARDS_PER_ROUND + runDifficulty().discards
       || next.hand !== HAND_SIZE || next.maxPlay !== MAX_PLAY
        ? '<p class="shape"><b>' + next.plays + '</b> play'
          + (next.plays === 1 ? '' : 's') + ' \u00b7 <b>' + next.discards + '</b> discard'
          + (next.discards === 1 ? '' : 's') + ' \u00b7 hand of <b>' + next.hand + '</b>'
          + (next.maxPlay !== MAX_PLAY ? ' \u00b7 <b>' + next.maxPlay + '</b> words a play' : '')
          + '</p>'
        : '')
    + (nextOrdeal
        ? '<div class="ordeal-warn"><div class="on">NEXT ROUND IS AN ORDEAL: '
          + escapeHtml(nextOrdeal.n) + '</div><div class="od">'
          + escapeHtml(nextOrdeal.d) + '</div></div>'
        : '')
    + (function(){
        const r = reckoning(G.round);
        if(!r) return '';
        return '<div class="ordeal-warn reckon"><div class="on">THE RECKONING: '
          + escapeHtml(r.n) + '</div><div class="od">Your deck outgrew this round. ' + escapeHtml(r.d) + '</div></div>';
      })()
    /* On the last visit "this one" IS the final round, so this printed
       "Round 6 asks 22,071 - 1.0x this one." Nothing to compare it against. */
    + (G.round < ROUNDS - 1
        ? '<p class="stakes">Round ' + ROUNDS + ' asks <b>'
          + roundShape(ROUNDS-1).target.toLocaleString() + '</b> \u00b7 <b>'
          + (function(){ const r = roundShape(ROUNDS-1).target / next.target;
              return (r < 3 ? r.toFixed(1) : Math.round(r)); })()
          + '\u00d7</b> this one. Words add points, Lenses multiply them.</p>'
        : '<p class="stakes">This is the last round. Words add points, Lenses multiply them.</p>')
    + (function(){
        /* Perfect draws and perfect ordering, against what the round will
           really ask.

           Being short here is the NORMAL state of a shop — the whole design is
           that a deck alone never keeps up and the Lenses are what close the
           gap, so a red "no order of play gets there" on every visit was both
           alarming and useless. What a player actually needs to know is
           whether anything on this shelf closes it, so work that out and say
           so. Each candidate is priced, slotted and re-measured for real. */
        const can = deckCeiling(G.round);
        const gap = next.target - can;
        if(gap <= 0){
          return '<div class="reality"><div class="rk">YOU CAN MAKE THIS</div><div class="rv">'
            + 'Your deck makes about <b>' + can.toLocaleString() + '</b> played perfectly. '
            + 'It asks <b>' + next.target.toLocaleString() + '</b>.</div></div>';
        }

        /* Singles first, then pairs: by the middle of a run one Lens rarely
           closes a gap on its own and two often do, and "nothing here closes
           this" has to mean it. Up to seven measurements, each one a full
           pass over the deck: ~60ms at round 6 and ~330ms at round 4, on a
           panel that opens once a round. */
        const buyable = (G.offers || []).filter(function(o){
          return !o.bought && o.kind === "lens" && o.cost <= G.bank
            && !G.lenses.some(function(l){ return l.id === o.lens.id; });
        });
        const reaches = function(lenses){
          lenses.forEach(function(l){ G.lenses.push(l); });
          /* Re-read the SHAPE, not just the ceiling. A Lens can move the round
             as well as the score — THE CURSE doubles the target, THE WAGER
             takes a play — and measuring a cursed deck against the target the
             curse has not applied yet is how the shop ends up promising that a
             Lens covers a gap it is about to widen.

             shapeFor and not roundShape: re-deriving THE RECKONING here would
             run a second full deckCeiling per candidate, and the shop is
             already the most expensive screen in the game. The round's rules
             were settled above; what this needs from the candidate is what it
             does to the TARGET. */
          const shape = shapeFor(G.round, next.rules);
          const c = deckCeiling(G.round, shape);
          lenses.forEach(function(){ G.lenses.pop(); });
          return c >= shape.target;
        };
        let fix = null;
        const room = slotsLeft();
        for(let i = 0; room >= 1 && !fix && i < buyable.length; i++){
          if(reaches([buyable[i].lens])) fix = { n: buyable[i].lens.n, cost: buyable[i].cost };
        }
        for(let i = 0; room >= 2 && !fix && i < buyable.length; i++){
          for(let j = i + 1; !fix && j < buyable.length; j++){
            if(buyable[i].cost + buyable[j].cost > G.bank) continue;
            if(reaches([buyable[i].lens, buyable[j].lens])){
              fix = { n: buyable[i].lens.n + " and " + buyable[j].lens.n,
                      cost: buyable[i].cost + buyable[j].cost };
            }
          }
        }

        return '<div class="reality ' + (fix ? 'near' : 'short') + '">'
          + '<div class="rk">' + (fix ? 'YOUR DECK ALONE IS SHORT' : 'NOTHING HERE CLOSES THIS')
          + '</div><div class="rv">'
          + 'Your deck makes about <b>' + can.toLocaleString()
          + '</b> played perfectly, against <b>' + next.target.toLocaleString()
          + '</b>. <b>' + gap.toLocaleString() + '</b> short.'
          + (fix
              ? ' <b>' + escapeHtml(fix.n) + '</b> ($' + fix.cost + ') covers it.'
              /* Only suggest a move the player can actually make. At $0 with
                 nothing owned this used to say "Reroll, or sell a Lens" with
                 the reroll disabled and no sell box on the screen - two dead
                 ends offered to somebody already at one. */
              : (slotsFull()
                  ? ' Slots are full. Sell one and buy louder, or reroll.'
                  : G.bank >= 1 && G.lenses.length
                    ? ' Reroll, or sell a Lens costing you more than it pays.'
                    : G.bank >= 1 ? ' Reroll and see what else there is.'
                    : G.lenses.length ? ' Sell a Lens costing you more than it pays.'
                    : ' Nothing on this shelf can close it. Play the round out.'))
          + '</div></div>';
      })()
    + (function(){
        /* The one thing in this shop the player made rather than chose from a
           list. It costs nothing but a slot, and it pays every time the figure
           it made comes back - so what carries the run is a line they wrote. */
        const lines = (G.roundLines || []).filter(function(l){ return l.fig; });
        if(!lines.length || keepsFull()) return '';
        return '<div class="sub" style="margin:16px 0 7px">Keep a line \u00b7 free</div>'
          + '<div class="keeps" id="keeps"></div>';
      })()
    + '<div class="offers" id="offers"></div>'
    + ((G.kept || []).length
        ? '<div class="sub" style="margin:16px 0 7px">Lines you kept</div>'
          + '<div class="owned">'
          + G.kept.map(function(k){
              return '<div class="own kept"><div class="ow"><div class="on">'
                + escapeHtml(k.n) + '</div><div class="od">'
                + escapeHtml(k.figName) + ' &middot; +' + KEPT_CHIPS + ' and +' + KEPT_MULT
                + ' mult every time it comes back</div></div></div>';
            }).join("")
          + '</div>'
        : '')
    + (G.lenses.length
        ? '<div class="sub" style="margin:16px 0 7px">Your Lenses \u00b7 '
          + G.lenses.length + ' of ' + LENS_SLOTS
          + (slotsFull() ? ' slots full. Sell one to make room.' : ' slots used')
          + '</div><div class="owned" id="owned"></div>'
        : '')
    + '<div class="rowend">'
    + '<button class="btn ghost" id="rerollBtn" type="button">Reroll $1</button>'
    + '<div class="purse">Purse $' + G.bank + '</div>'
    + '<button class="btn ' + (G.lenses.length ? 'primary' : 'danger') + '" id="leaveShop" type="button">'
    + (G.lenses.length ? 'Back to the table →' : 'Leave with no Lens') + '</button>'
    + '</div>';
  /* the round just ended — this is a moment, not a menu */
  showPanel(html, true);

  const box = document.getElementById("offers");
  G.offers.forEach(function(o, idx){
    const b = document.createElement("button");
    b.className = "offer"; b.type = "button";
    b.disabled = o.bought || G.bank < o.cost || (o.kind === "lens" && slotsFull());
    if(!o.bought && o.kind === "lens" && slotsFull()) b.title = "No slots left. Sell one below.";
    else if(!o.bought && G.bank < o.cost) b.title = "You cannot afford this yet";
    if(o.kind === "lens"){
      /* An honest nudge: say when a Lens actually has words to fire on. */
      const lt = LENS_TAG[o.lens.id];
      const n = lt ? deckCount(lt) : 0;
      const fit = (lt && n >= 5)
        ? '<div class="fit">Good fit: you hold ' + n + ' ' + TAGS[lt][0] + ' words</div>'
        : '';
      if(o.lens.flaw) b.classList.add("flawed");
      b.innerHTML = '<div class="on">' + o.lens.n + '</div><div class="od">' + o.lens.d + '</div>'
                  + (o.lens.flaw ? '<div class="cost-warn">COSTS YOU SOMETHING</div>' : fit)
                  + '<div class="oc">' + (o.bought ? "acquired" : "$" + o.cost) + '</div>';
    } else {
      b.innerHTML = '<div class="on">TWO NEW WORDS</div><div class="od">Two fresh words, yours for the rest of the run.</div>'
                  + '<div class="oc">' + (o.bought ? "acquired" : "$" + o.cost) + '</div>';
    }
    b.onclick = function(){ buy(idx, reward); };
    box.appendChild(b);
  });

  const keepBox = document.getElementById("keeps");
  if(keepBox){
    (G.roundLines || []).filter(function(l){ return l.fig; }).forEach(function(l){
      const b = document.createElement("button");
      b.className = "offer keep"; b.type = "button";
      /* It used to render enabled with the rail full and do nothing on click -
         no toast, no sound, no reason given. The last thing a player does with
         a line they wrote is the worst place in the game for a dead click. */
      b.disabled = keepsFull();
      if(b.disabled) b.title = "You are already keeping " + KEEP_SLOTS + " lines.";
      b.innerHTML = '<div class="on">' + escapeHtml(l.ws.join(" \u00b7 ")) + '</div>'
        + '<div class="od">' + escapeHtml(l.figName) + ' &middot; it scored '
        + l.total.toLocaleString() + '</div>'
        + '<div class="oc">' + (b.disabled ? "no room" : "keep it") + '</div>';
      b.onclick = function(){
        G.kept = G.kept || [];
        if(keepsFull()) return;
        G.kept.push({ n: l.ws.join(" \u00b7 "), fig: l.fig, figName: l.figName });
        SFX.buy();
        toast("Kept " + l.ws.join(" \u00b7 "));
        openShop(reward);
      };
      keepBox.appendChild(b);
    });
  }

  const ownedBox = document.getElementById("owned");
  if(ownedBox){
    G.lenses.forEach(function(l, i){
      const lv = (G.lensState && G.lensState[l.id]) || 0;
      const row = document.createElement("div");
      row.className = "own" + (l.flaw ? " flaw" : "");
      row.innerHTML = '<div class="ow"><div class="on">' + escapeHtml(l.n) + '</div>'
        + '<div class="od">' + escapeHtml(l.d) + '</div>'
        + (lv ? '<div class="grown">grown to +' + Math.round(lv).toLocaleString()
                + ', and selling loses it</div>' : '')
        + '</div>';
      /* Selling asks twice. It is the only irreversible thing in the shop —
         it takes the Lens, every round of growth on it, and gives back half
         the price — and it sits one row under the offers in a panel that
         scrolls. Playtesting this, I destroyed my own run twice with stray
         clicks meant for an offer. A flawed Lens warns you before you buy it;
         this is louder and warns you after the fact, which is no warning. */
      const b = document.createElement("button");
      b.className = "btn sellbtn"; b.type = "button";
      const label = "Sell $" + sellValue(l);
      b.textContent = label;
      let armed = false, timer = null;
      b.onclick = function(){
        if(!armed){
          armed = true;
          b.classList.add("arming");
          b.textContent = "Sell it? Tap again";
          SFX.deny(); buzz([8, 40, 8]);
          timer = setTimeout(function(){
            armed = false; b.classList.remove("arming"); b.textContent = label;
          }, 3200);
          return;
        }
        clearTimeout(timer);
        sellLens(i, reward);
      };
      row.appendChild(b);
      ownedBox.appendChild(row);
    });
  }

  document.getElementById("rerollBtn").disabled = G.bank < 1;
  document.getElementById("rerollBtn").onclick = function(){
    if(G.bank < 1) return;
    G.bank -= 1; G.offers = rollOffers(); SFX.reroll(); openShop(reward);
  };
  document.getElementById("leaveShop").onclick = function(){
    G.offers = null; coachFinish(); hidePanel(); startRound();
  };
}

/* Half of what you paid, rounded up, never less than a dollar. Selling is
   always a loss — it has to be, or a player could churn the shop for money —
   so what you are really buying back is the slot. */
function sellValue(lens){ return Math.max(1, Math.ceil(lens.cost / 2)); }

function sellLens(idx, reward){
  const l = G.lenses[idx];
  if(!l) return;
  G.lenses.splice(idx, 1);
  /* Everything it had grown to goes with it. That is the real price of
     selling a Lens you have carried for five rounds, and the shop says so
     before you click. */
  if(G.lensState) delete G.lensState[l.id];
  if(G.openLens === l.id) G.openLens = null;
  G.bank += sellValue(l);
  SFX.reroll();
  buzz([12, 30, 12]);
  openShop(reward);
}

function buy(idx, reward){
  const o = G.offers[idx];
  if(o.bought || G.bank < o.cost) return;
  if(o.kind === "lens"){
    if(slotsFull()) return;
    G.lenses.push(o.lens);
    G.shopSeen.push(o.lens.id);
  } else {
    const owned = G.deck.concat(G.discard, G.hand).map(function(c){ return c.w; });
    const fresh = LEXICON.filter(function(e){ return owned.indexOf(e.w)===-1; });
    shuffle(fresh);
    G.deck.push(makeCard(fresh[0] || pick(LEXICON), false));
    G.deck.push(makeCard(fresh[1] || pick(LEXICON), false));
    shuffle(G.deck);
  }
  G.bank -= o.cost;
  o.bought = true;
  SFX.buy();
  buzz([10,30,18]);
  openShop(reward);
}

/* ---------- The Interpreter: type any word, get a real card ---------- */
let sampleFn = null;
claude_use("sample").then(function(fn){ sampleFn = fn; });
function claude_use(name){
  try{
    if(window.claude && typeof window.claude.use === "function") return window.claude.use(name);
  }catch(e){}
  return Promise.resolve(null);
}

/* The house appraiser: used when live appraisal is unavailable or declined.
   Deliberately simple and readable — morphology plus a small sense-map. */
const SENSE = [
  [/fire|burn|flame|blaze|scorch|ember|solar|lava|heat|boil|steam|volcan|thermo|forge/, "HEA"],
  [/\bice|frost|snow|chill|cold|arctic|winter|glaci|freeze|cryo|polar/, "COL"],
  [/water|rain|\bsea|ocean|river|wave|flood|tide|liquid|wet|aqua|hydro|marine|lake|mist/, "WET"],
  [/\brun|fly|rush|jump|spin|flow|drift|race|swift|dash|surge|orbit|travel|migrat|velo|motor/, "MOT"],
  [/kill|death|\bdie|poison|toxic|\bwar|blade|knife|gun|bomb|danger|threat|venom|crash|wound|risk|fear/, "DAN"],
  [/loud|noise|scream|shout|thunder|roar|bang|siren|drum|song|music|echo|sonic|voice|bell/, "LOU"],
  [/light|bright|glow|shine|star|sun|lamp|flash|gleam|neon|dawn|gold|laser|beam/, "BRI"],
  [/dark|night|shadow|black|gloom|void|abyss|crypt|grave|murk|dusk/, "DAR"],
  [/dog|cat|bird|fish|wolf|bear|horse|beast|animal|creature|insect|snake|whale|lion|shark|worm|\bbug|hound|fox|owl|rat/, "ANI"],
  [/tree|flower|leaf|plant|grass|root|seed|forest|moss|vine|herb|bloom|fern|weed/, "PLA"],
  [/mountain|earth|stone|rock|storm|sky|wind|cloud|desert|valley|nature|soil|canyon|island|cave/, "NAT"],
  [/hand|eye|heart|bone|blood|skin|brain|body|lung|flesh|nerve|muscle|tooth|limb|finger/, "BOD"],
  [/eat|food|bread|meat|fruit|sweet|taste|cook|meal|soup|spice|drink|sugar|salt|feast/, "FOO"],
  [/tool|hammer|blade|wheel|lever|machine|device|\bkey|rope|nail|\bsaw|drill|engine/, "TOO"],
  [/comput|digital|data|robot|cyber|electr|circuit|code|network|silicon|pixel|server|algorith|neural|quantum/, "TEC"],
  [/money|gold|coin|cash|price|debt|bank|trade|wealth|cost|market|wage|tax|profit/, "MON"],
  [/think|mind|dream|memory|idea|thought|know|belief|feel|emotion|soul|logic|reason|fear|hope|doubt/, "MIN"],
  [/time|year|\bday|hour|\bold|ancient|future|past|clock|\bage|\bera|history|moment|decade|eternal/, "TIM"]
];
function houseAppraise(word){
  const w = word.toLowerCase();
  const tags = [];
  for(let i=0;i<SENSE.length;i++){
    if(SENSE[i][0].test(w) && tags.indexOf(SENSE[i][1])===-1) tags.push(SENSE[i][1]);
  }
  if(/(ness|ity|ism|tion|sion|ance|ence|ship|hood|ing|acy)$/.test(w)){
    if(tags.indexOf("ABS")===-1) tags.push("ABS");
    if(tags.indexOf("MIN")===-1 && tags.length<3) tags.push("MIN");
  }
  return {
    tags: tags.slice(0,4),
    note: tags.length
      ? "Read from the shape of the word. Change anything that is wrong."
      : "No entry on file, and the house will not guess. The reading is yours."
  };
}

function openInterpreter(){
  if(G.interpreterUsed){
    toast("The Interpreter only answers once a run.");
    return;
  }
  showPanel(''
    + '<h2>The Interpreter</h2>'
    + '<div class="sub">One word, once per run</div>'
    + '<p>Type in <b>any word you like</b>. Your dog\'s name, your job title, the worst thing that happened to you this week.</p>'
    + '<p>Then you say what it <b>rings of</b>. Those are its overtones, and the card '
    + 'goes into your deck scoring by exactly the same rules as everything else.</p>'
    + '<input id="interpInput" maxlength="20" autocomplete="off" spellcheck="false" placeholder="type a word…">'
    + '<div class="appraisal" id="appraisal"></div>'
    + '<div class="rowend">'
    + '<button class="btn ghost" id="interpCancel" type="button">Not now</button>'
    + '<button class="btn primary" id="interpGo" type="button">Appraise</button>'
    + '</div>');

  const input = document.getElementById("interpInput");
  input.focus();
  document.getElementById("interpCancel").onclick = hidePanel;
  document.getElementById("interpGo").onclick = runAppraisal;
  input.onkeydown = function(e){ if(e.key === "Enter") runAppraisal(); };
}

async function runAppraisal(){
  const input = document.getElementById("interpInput");
  const go = document.getElementById("interpGo");
  const out = document.getElementById("appraisal");
  const raw = (input.value || "").trim().replace(/[^A-Za-z' -]/g, "");
  if(raw.length < 2){ out.innerHTML = '<div class="say">Two letters or more, please.</div>'; return; }
  const word = raw.toUpperCase().slice(0,20);

  go.disabled = true; input.disabled = true;
  out.innerHTML = '<div class="say">Consulting…</div>';

  let tags = null, note = "", src = "";
  if(sampleFn){
    try{
      const prompt =
        'You are the appraiser in a word game. Assign semantic overtones to a word.\n' +
        'Valid overtones: ' + TAG_KEYS.map(function(k){ return TAGS[k][0]; }).join(", ") + '.\n' +
        'ABSTRACT is only for words with no physical referent.\n' +
        'Choose 2 to 4 that genuinely fit. Also write one dry, appraiser-ish sentence about the word (max 18 words).\n' +
        'Reply with ONLY JSON: {"tags":["..."],"note":"..."}\n' +
        'Word: ' + word;
      const data = await sampleFn.json(prompt, { modelTier:"quick", cache:true });
      if(data && Array.isArray(data.tags)){
        const mapped = data.tags
          .map(function(t){ return TAG_BY_NAME[String(t).toUpperCase().trim()]; })
          .filter(function(t){ return !!t; });
        const uniq = [];
        mapped.forEach(function(t){ if(uniq.indexOf(t)===-1) uniq.push(t); });
        if(uniq.length){
          tags = uniq.slice(0,4);
          note = String(data.note || "").slice(0,140);
          src = "Appraised live by Claude";
        }
      }
    }catch(e){ /* not_granted, rate_limited, offline — fall through to the house */ }
  }
  if(!tags){
    const h = houseAppraise(word);
    tags = h.tags; note = note || h.note;
    src = "House appraisal · no live valuer available";
  }

  SFX.reveal();
  chooseOvertones(word, tags, note, src);
}

/* The last word in it is the player's. An appraisal is a suggestion — Claude's
   when there is one, the house's shape-reading when there is not, nothing at
   all when neither can point at anything — and the player accepts it, edits
   it, or writes their own reading over the top. Which is what interpreting a
   word means, and what the panel has been called all along. */
function chooseOvertones(word, suggested, note, src){
  const out = document.getElementById("appraisal");
  const go = document.getElementById("interpGo");
  const picked = suggested.slice(0, 4);

  out.innerHTML = ''
    + '<div class="interp-pick">'
    +   '<div class="say">' + escapeHtml(note)
    +     '<span class="src">' + escapeHtml(src) + '</span></div>'
    +   '<div class="sub" id="pickCount"></div>'
    +   '<div class="pickgrid">' + TAG_KEYS.map(function(t){
          return '<button class="pickopt" type="button" data-tag="' + t + '" aria-pressed="false">'
            + iconSpan(t) + '<span class="lbl">' + TAGS[t][0] + '</span></button>';
        }).join("") + '</div>'
    + '</div>';

  const countEl = document.getElementById("pickCount");
  function paint(){
    Array.prototype.forEach.call(out.querySelectorAll(".pickopt"), function(b){
      b.setAttribute("aria-pressed", picked.indexOf(b.dataset.tag) >= 0 ? "true" : "false");
    });
    const n = picked.length;
    countEl.textContent = n < 2
      ? "Pick at least two"
      : n + " of a possible four \u00b7 tap to change";
    go.disabled = n < 2;
    go.textContent = n < 2 ? "Pick two" : "Into the deck \u2192";
  }

  Array.prototype.forEach.call(out.querySelectorAll(".pickopt"), function(b){
    b.onclick = function(){
      const t = b.dataset.tag, at = picked.indexOf(t);
      if(at >= 0) picked.splice(at, 1);
      else if(picked.length < 4) picked.push(t);
      else { SFX.deny(); return; }
      SFX.pick(picked.length);
      paint();
    };
  });

  go.disabled = false;
  go.onclick = function(){
    if(picked.length < 2){ SFX.deny(); return; }
    const card = makeCard({ w: word, t: picked.slice() }, true);
    G.interpreterUsed = true;
    G.interpretedWord = { w: word, t: picked.slice() };
    G.deck.push(card);
    shuffle(G.deck);
    hidePanel();
    render();
    toast(word + " is in the deck.");
  };
  paint();
}

/* ---------- run end ---------- */
function endRun(won){
  G.over = true;
  const rd = runDifficulty();
  /* One key per curve, named for the curve rather than the mode, because a
     total from a lower curve is not a better run than a total from a higher
     one - and the names moved once already. */
  const bestKey = rd.bestKey;
  const runs = store.get("runs", 0) + 1;
  store.set("runs", runs);
  const bestEver = store.get(bestKey, 0);
  const isRecord = G.total > bestEver;
  if(isRecord) store.set(bestKey, G.total);

  /* Memory unlock: carry one Lens you actually used into the next run.

     Never a flawed one. Memory is a gift handed to a player who has not chosen
     anything yet — it arrives before the first shop, on a board they cannot
     answer it on. A Lens that doubles every target or takes a play away is a
     bargain when you accept it with a deck and a purse; the same Lens dealt to
     you on round 1 is a sentence. Taking one is a decision, and a decision has
     to be made, not inherited. */
  let unlocked = null;
  const prev = store.get("memory", null);
  const candidates = G.lenses
    .filter(function(l){ return !l.flaw; })
    .map(function(l){ return l.id; });
  if(candidates.length){
    const choice = candidates[hashStr(G.seed+runs) % candidates.length];
    if(choice !== prev){
      store.set("memory", choice);
      unlocked = LENSES.find(function(l){ return l.id===choice; });
    }
  }

  const share = shareText(won);
  const html = ''
    + '<h2>' + (won ? "The desk is cleared." : "The run ends at " + G.demand.n + ".") + '</h2>'
    + '<div class="sub">' + (G.isDaily ? "Daily " + G.seed : "Seed " + G.seed) + ' · run #' + runs + '</div>'
    + '<div class="stat-row">'
    +   '<div class="stat gold"><div class="k">Total</div><div class="v">' + G.total.toLocaleString() + '</div></div>'
    +   '<div class="stat"><div class="k">Reached</div><div class="v">' + Math.min(G.round+1, ROUNDS) + ' / ' + ROUNDS + '</div></div>'
    +   '<div class="stat"><div class="k">Best hand</div><div class="v">'
    +     (G.best.score || 0).toLocaleString()
    +     '<span class="bh">×' + (G.best.mult || 1) + '</span></div></div>'
    + '</div>'
    /* It named the Demand and then three stats, none of which was the number
       that ended the run. A player could not say which decision killed them,
       so there was nothing to do differently - and the only thing offered was
       an easier difficulty, which tells somebody who misplayed one ordering
       that the game was too hard for them. */
    + (!won
        ? '<div class="reality short"><div class="rk">WHAT ENDED IT</div>'
          + '<div class="rv">Round ' + (G.round + 1) + ' wanted <b>'
          + G.target.toLocaleString() + '</b>. You made <b>'
          + G.roundScore.toLocaleString() + '</b> \u2014 <b>'
          + Math.max(0, G.target - G.roundScore).toLocaleString() + '</b> short.'
          + (G.lastLine && G.lastLine.ws.length
              ? ' Your last hand was <b>' + escapeHtml(G.lastLine.ws.join(" \u00b7 "))
                + '</b> for ' + G.lastLine.total.toLocaleString() + '.'
              : '')
          + '</div></div>'
        : '')
    + (isRecord ? '<p style="color:var(--gold)"><b>That is a personal best.</b></p>' : '')
    /* Three runs in and still falling in the first third: that is the curve
       winning, not a lesson landing. Offered once it is true, never before,
       and never to somebody already playing the gentler one. */
    + (function(){
        const easier = diffBelow(rd);
        if(won || runs < 3 || G.round >= 3 || !easier) return '';
        /* It used to spell out "a fourth discard, and drops two of the three
           Ordeals" beside the mode's own description, which says one of two.
           Two statements on one screen disagreeing about the same mode. The
           mode already describes itself; let it. */
        return '<div class="softer"><div class="k">THIS IS A STEEP GAME</div>'
          + '<p>' + escapeHtml(easier.d) + '</p>'
          + '<button class="btn" id="goEasy" type="button">Try '
          + escapeHtml(easier.n) + ' \u2192</button></div>';
      })()
    + (unlocked ? '<div class="unlock"><div class="k">Yours next run</div><div class="v">'
        + unlocked.n + '</div><div class="d">' + unlocked.d + '</div></div>' : '')
    /* Their first finished run, whichever way it went, opens the real curve.
       Said here because it is the screen they are already reading, and not as
       a question — they carry on with whatever they were doing. */
    + (function(){
        /* The run that opens the steeper curve is whichever run its own
           lockedUntilRun names, not run 1 - the gate is a property now and this
           was still counting to one by hand. Said here because it is the screen
           they are already reading, and not as a question. */
        const harder = diffAbove(rd);
        if(!harder || runs !== (harder.lockedUntilRun || 0)) return '';
        return '<div class="unlock open"><div class="k">Unlocked</div><div class="v">'
          + escapeHtml(harder.n) + '</div><div class="d">' + escapeHtml(harder.d)
          + '</div><button class="btn" id="goHard" type="button">Play '
          + escapeHtml(harder.n) + ' \u2192</button></div>';
      })()
    + '<div class="share" id="shareBox">' + escapeHtml(share) + '</div>'
    + '<div class="rowend">'
    +   '<button class="btn" id="copyShare" type="button">Copy result</button>'
    +   '<button class="btn" id="againSeed" type="button">Same seed again</button>'
    +   '<button class="btn primary" id="againNew" type="button">New run →</button>'
    + '</div>';
  showPanel(html, true);

  function switchTo(d, line){
    setPref("difficulty", d.id);
    hidePanel();
    newRun("free-" + Math.random().toString(36).slice(2,8), true);
    toast(d.n + ". " + line);
  }
  const hard = document.getElementById("goHard");
  if(hard) hard.onclick = function(){
    switchTo(diffAbove(rd), "The curve it was tuned to.");
  };
  const easy = document.getElementById("goEasy");
  if(easy) easy.onclick = function(){
    switchTo(diffBelow(rd), "Lower targets, one more discard.");
  };

  document.getElementById("copyShare").onclick = function(){
    try{
      navigator.clipboard.writeText(share);
      toast("Copied.");
    }catch(e){ toast("Select the text above to copy."); }
  };
  document.getElementById("againSeed").onclick = function(){ hidePanel(); newRun(G.seed); };
  document.getElementById("againNew").onclick = function(){ hidePanel(); newRun("free-" + Math.random().toString(36).slice(2,8)); };

  if(won) SFX.runWon(); else SFX.fail();
}

function shareText(won){
  const lines = [];
  const rd = runDifficulty();
  lines.push("OVERTONE  ·  " + (G.isDaily ? "Daily " + G.seed : "seed " + G.seed)
             + (rd.rank === 0 ? "" : "  \u00b7  " + rd.n));
  lines.push((won ? "Cleared all " + ROUNDS + " Demands" : "Fell at " + G.demand.n + " (" + (G.round+1) + "/" + ROUNDS + ")")
             + "  ·  " + G.total.toLocaleString() + " pts");
  if(G.best.word) lines.push("Best play: " + G.best.word + "  ×" + G.best.mult + "  (" + G.best.score.toLocaleString() + ")");
  if(G.interpretedWord){
    lines.push("My word: " + G.interpretedWord.w + "  ·  "
      + G.interpretedWord.t.map(function(t){ return TAGS[t][0]; }).join("·"));
  }
  return lines.join("\n");
}

/* ---------- card faces: overtone icons ----------
   Each card shows the icons for its own overtones on a plate tinted by the
   first of them. Nineteen icons instead of 249 pictures: perfectly consistent,
   nothing to load per card, and it teaches the tag system rather than
   competing with it — a player learns the flame means HEAT in one round.
   Icons are Google Material Symbols (the one icon set the artifact CSP will
   serve, since it comes from fonts.googleapis.com).                         */

const ICONS = {
  ANI:"pets",       PLA:"psychiatry",  NAT:"landscape",  BOD:"ecg_heart",
  FOO:"restaurant", TOO:"handyman",    TEC:"memory",     MON:"paid",
  HEA:"local_fire_department",         COL:"ac_unit",    WET:"water_drop",
  MOT:"speed",      DAN:"warning",     LOU:"volume_up",  BRI:"light_mode",
  DAR:"dark_mode",  MIN:"psychology",  TIM:"schedule",   ABS:"blur_on"
};

/* One flat colour per overtone, drawn from the same arcade set. */
const TAG_COLOR = {
  ANI:"#AB5236", PLA:"#00E436", NAT:"#008751", BOD:"#C2506E",
  FOO:"#E07A3C", TOO:"#7C7469", TEC:"#29ADFF", MON:"#E8C020",
  HEA:"#FF004D", COL:"#6FD8F5", WET:"#1D6FB8", MOT:"#FFA300",
  DAN:"#7E2553", LOU:"#FF77A8", BRI:"#FFEC27", DAR:"#262B44",
  MIN:"#83769C", TIM:"#8B93A8", ABS:"#5F574F"
};

/* Half these plates are bright, and white icons vanish on them. */
function isLightHex(hex){
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150;
};

/* The icon font either arrives or it doesn't. Until it's confirmed the glyphs
   stay invisible rather than showing their ligature text, and the tinted plate
   carries the card on its own. */
function initIcons(){
  const root = document.documentElement;
  try{
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        if(document.fonts.check('20px "Material Symbols Rounded"')) root.classList.add("ms-ok");
      });
      /* Don't let a slow font hide the icons for ever. */
      setTimeout(function(){ root.classList.add("ms-ok"); }, 2500);
    } else {
      root.classList.add("ms-ok");
    }
  }catch(e){ root.classList.add("ms-ok"); }
}

/* Which overtone tints the plate. Ordered by how distinctive the colour is,
   not by the card's tag order — NATURE and TIME sit on so many words that
   leading with them turned half the hand the same green. */
const LEAD_ORDER = ["HEA","MON","DAN","COL","LOU","MIN","TEC","BOD","FOO",
                    "BRI","DAR","WET","ANI","TOO","PLA","MOT","NAT","TIM","ABS"];

function artNode(card){
  const tags = card.t.length ? card.t : ["ABS"];
  let lead = null;
  for(let i=0;i<LEAD_ORDER.length && !lead;i++){
    if(tags.indexOf(LEAD_ORDER[i]) >= 0) lead = LEAD_ORDER[i];
  }
  if(!lead) lead = tags[0];
  const col = TAG_COLOR[lead] || TAG_COLOR.ABS;

  const known = wordKnown(card.w);
  const d = document.createElement("div");
  d.className = "art" + (isLightHex(col) ? " light" : "") + (known ? "" : " unknown");
  d.style.background = known ? col : "var(--inset)";

  const row = document.createElement("div");
  row.className = "icons";
  /* An unknown word still gets a plate - the card has to look like a card -
     but the icons would spell out the overtones the player is meant to guess. */
  (wordKnown(card.w) ? tags.slice(0, 3) : []).forEach(function(t){
    const s = document.createElement("span");
    const hit = G && G.demand && G.demand.tags.indexOf(t) >= 0;
    s.className = "ms" + (hit ? " hit" : "");
    s.textContent = ICONS[t] || "blur_on";
    s.setAttribute("aria-hidden", "true");
    s.title = TAGS[t] ? TAGS[t][0] : "";
    row.appendChild(s);
  });
  d.appendChild(row);
  return d;
}

/* ---------- atmosphere and juice ---------- */

/* Cards already seen in hand, so a re-render does not re-deal them. */
const SEEN = {};

/* Run a throwaway element's animation and take the element away the moment it
   ends. `fill: "forwards"` holds the last frame so nothing can snap back
   while we wait, and the timeout is only a net for browsers that never fire
   onfinish (a backgrounded tab, mainly). */
function animateOut(el, frames, opts){
  let gone = false;
  const drop = function(){
    if(gone) return;
    gone = true;
    try{ el.remove(); }catch(e){}
  };
  const ms = (opts.duration || 400) + (opts.delay || 0);
  try{
    const a = el.animate(frames, Object.assign({ fill: "forwards" }, opts));
    a.onfinish = drop;
    a.oncancel = drop;
  }catch(e){
    /* no WAAPI: do not leave the element sitting there */
    setTimeout(drop, 0);
    return;
  }
  setTimeout(drop, ms + 260);
}

const REDUCED = (function(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(e){ return false; }
})();

/* Paper off the bottom of the screen. Deliberately not sparks: sparks mean
   "that hit", confetti means "that is over and you won". */
function confetti(n){
  if(REDUCED) return;
  n = n || 46;
  const cols = ["var(--gold)","var(--chips)","var(--mult)","var(--green)","var(--lens)"];
  for(let i=0;i<n;i++){
    const el = document.createElement("i");
    el.className = "confetto";
    el.style.background = cols[i % cols.length];
    el.style.left = (5 + Math.random()*90) + "vw";
    document.body.appendChild(el);
    const rise = 250 + Math.random()*400;
    const drift = (Math.random()-.5)*280;
    animateOut(el, [
      { transform:"translate(0,0) rotate(0deg)", opacity:1 },
      { transform:"translate("+(drift*.6).toFixed(0)+"px,"+(-rise).toFixed(0)+"px) rotate("
        +(Math.random()*640-320).toFixed(0)+"deg)", opacity:1, offset:.5 },
      { transform:"translate("+(drift*1.5).toFixed(0)+"px,140px) rotate("
        +(Math.random()*900-450).toFixed(0)+"deg)", opacity:0 }
    ], { duration: 1150 + Math.random()*750, easing:"cubic-bezier(.2,.7,.4,1)" });
  }
}

/* A shower of sparks from the middle of the stage. */
function burst(host, n){
  if(REDUCED || !host) return;
  n = n || 18;
  for(let i=0;i<n;i++){
    const el = document.createElement("i");
    el.className = "spark";
    const r = Math.random();

    else if(r < 0.66) el.style.background = "var(--mult)";

    const dist = 60 + Math.random()*170;
    animateOut(el, [
      { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
      { transform: "translate(-50%,-50%) translate(" + (Math.cos(ang)*dist).toFixed(0)
        + "px," + (Math.sin(ang)*dist + 70).toFixed(0) + "px) scale(0)", opacity: 0 }
    ], { duration: 700 + Math.random()*520, easing: "cubic-bezier(.2,.7,.3,1)" });

/* Points leave the card that earned them and land on the counter. Without
   this the tally simply changes number, and a player has to take on trust
   that the two are related. */
function chipFly(fromEl, toId, cls, ms){
  if(REDUCED || !fromEl) return;
  const to = document.getElementById(toId);
  if(!to) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  if(!a.width || !b.width) return;
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2;
  const dx = (b.left + b.width / 2) - x0, dy = (b.top + b.height / 2) - y0;
  const n = document.createElement("i");
  n.className = "flyer " + (cls || "c");
  n.style.left = x0 + "px"; n.style.top = y0 + "px";
  document.body.appendChild(n);
  const dur = Math.max(160, Math.min(280, ms || 250));
  /* Arc up and over rather than travelling in a straight line — a straight
     line between two boxes reads as a UI transition, an arc reads as a thing
     being thrown. */
  animateOut(n, [
    { transform: "translate(-50%,-50%) scale(.45) rotate(0deg)", opacity: 0 },
    { transform: "translate(-50%,-50%) translate(" + (dx * .28).toFixed(0) + "px,"
      + (dy * .28 - 40).toFixed(0) + "px) scale(1.35) rotate(180deg)", opacity: 1, offset: .4 },
    { transform: "translate(-50%,-50%) translate(" + dx.toFixed(0) + "px," + dy.toFixed(0)
      + "px) scale(.3) rotate(400deg)", opacity: 0 }
  ], { duration: dur, easing: "cubic-bezier(.34,.02,.24,1)" });
  setTimeout(function(){
    to.classList.remove("landed"); void to.offsetWidth; to.classList.add("landed");
  }, dur - 30);
}

/* A square ring thrown out from the middle of the stage. */
function shock(host){
  if(REDUCED || !host) return;
  const s = document.createElement("i");
  s.className = "shock";
  host.appendChild(s);
  animateOut(s, [
    { transform: "translate(-50%,-50%) scale(.35)", opacity: 1 },
    { transform: "translate(-50%,-50%) scale(9)", opacity: 0 }
  ], { duration: 520, easing: "cubic-bezier(.15,.75,.3,1)" });
}

/* One flat frame of colour across the whole screen. */
function flash(bad){
  if(REDUCED) return;
  const f = document.createElement("div");
  f.className = "flash" + (bad ? " bad" : "");
  document.body.appendChild(f);
  setTimeout(function(){ try{ f.remove(); }catch(e){} }, 360);

/* The big one: a word slammed across the middle of the screen. */
function stamp(text, bad, ms){
  const el = document.getElementById("stamp");
  if(!el) return;
  document.getElementById("stampText").textContent = text;
  el.classList.toggle("bad", !!bad);
  el.classList.remove("going");
  el.hidden = false;
  clearTimeout(stamp._t);
  clearTimeout(stamp._f);
  /* Let the board come back before the words do, so the screen is not simply
     switched on again underneath them. */
  const life = ms || 1000;
  stamp._f = setTimeout(function(){ el.classList.add("going"); }, Math.max(0, life - 300));
  stamp._t = setTimeout(function(){ el.hidden = true; }, life);

/* Screen shake, scaled to the hit. */
function quake(level){
  if(REDUCED) return;
  const app = document.getElementById("app");
  if(!app) return;
  app.classList.remove("shake", "big", "huge"); void app.offsetWidth;
  app.classList.add("shake");
  if(level >= 2) app.classList.add("big");
  if(level >= 3) app.classList.add("huge");
  clearTimeout(quake._t);
  quake._t = setTimeout(function(){ app.classList.remove("shake", "big", "huge"); }, 600);
}

/* ---------- counters that land instead of sliding ----------
   The first version tweened linearly from the old number to the new one over
   110ms, which reads as a number quietly changing — you see the result, never
   the event. This settles like a mechanical counter instead: the digits
   scramble, then lock into place left to right, and the field takes a hit on
   the way. The scramble costs nothing (it is the same rAF loop) and it is the
   difference between a readout and a payout. */
function rollFrame(endStr, k){
  /* k is 0..1. Digits lock left to right, all of them by 78%. */
  const lock = Math.floor(endStr.length * Math.min(1, k / 0.78));
  let out = "";
  for(let i = 0; i < endStr.length; i++){
    const ch = endStr[i];
    if(i < lock || ch < "0" || ch > "9") out += ch;
    else out += String((Math.random() * 10) | 0);
  }
  return out;
}

const COUNT = {};
function countTo(el, to, key){
  const from = COUNT[key] === undefined ? to : COUNT[key];
  COUNT[key] = to;
  const end = String(to);
  if(REDUCED || from === to){ el.textContent = end; return; }

  /* Long enough to read as a roll, short enough to be finished before the next
     scoring beat lands. The beat is budgeted now and can run to 38ms inside a
     big hand, so this rides the same setting rather than a constant it would
     otherwise outlast - and when it does overlap, the previous frame is
     cancelled below, which reads as a counter blurring under a fast hand. */
  const dur = Math.round(125 * animScale());
  const t0 = performance.now();
  cancelAnimationFrame(el._roll);
  el.classList.remove("roll"); void el.offsetWidth; el.classList.add("roll");

  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    if(k < 1){
      const v = from + (to - from) * (1 - Math.pow(1 - k, 4));
      let s = String(Math.round(v * 10) / 10);
      while(s.length < end.length) s = " " + s;
      el.textContent = rollFrame(s.length === end.length ? s : end, k);
      el._roll = requestAnimationFrame(step);
    } else {
      el.textContent = end;
      el.classList.remove("roll");
    }
  })(t0);
}

/* The big one. The total is the payoff of the whole hand, so it counts up from
   zero with the same settle rather than simply appearing. */
function rollTotal(el, to){
  const end = "+" + to.toLocaleString();
  if(REDUCED){ el.textContent = end; return; }
  const dur = Math.round(Math.min(620, 260 + Math.log10(Math.max(10, to)) * 120) * animScale());
  const t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    if(k < 1){
      const v = Math.round(to * (1 - Math.pow(1 - k, 3)));
      let s = "+" + v.toLocaleString();
      while(s.length < end.length) s = s.replace("+", "+0");
      el.textContent = rollFrame(s.length === end.length ? s : end, k);
      requestAnimationFrame(step);
    } else {
      el.textContent = end;
      el.classList.add("landed-total");
    }
  })(t0);
}

/* ---------- rendering ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function cardEl(c, staticCard){
  const el = document.createElement("div");
  el.className = "card" + (staticCard ? " static" : "") + (c.interpreted ? " interpreted" : "");
  el.setAttribute("role", staticCard ? "img" : "button");
  el.dataset.id = c.id;
  el.setAttribute("aria-label", wordKnown(c.w)
    ? c.w + ", " + c.t.map(function(t){ return TAGS[t][0]; }).join(", ")
    : c.w + ", overtones not yet known");
  if(!staticCard) el.tabIndex = 0;

  const art = artNode(c);

  const base = document.createElement("div");
  base.className = "base"; base.textContent = c.base;

  /* The letter-count badge stood here. It existed for COLUMN, STAIR and PAIR
     - three figures defined on the length of a word - and those went when the
     verb became JOIN. With spelling out of scoring it highlighted a match
     that pays nothing, on the one surface a player reads before deciding. */

  const w = document.createElement("div");
  w.className = "w";
  /* The word in its own element so that reading it back gives the word and
     not the word with its value stuck to the end, and the value AFTER it. A
     float placed ahead of the text narrows the first line, and a word is one
     unbroken token — DEADLINE came out as "DEADLIN / E". Placed after, the
     word keeps the whole line and the number is the thing that moves: it
     shares the line when there is room and drops below when there is not. */
  const wt = document.createElement("span");
  wt.className = "wt"; wt.textContent = c.w;
  w.appendChild(wt);
  el.appendChild(base);

  const tags = document.createElement("div");
  tags.className = "tags";
  /* Sorted on a COPY: c.t is game state and the Lenses read it. Matching tags
     go first so that on a phone, where the row is capped at two lines, what
     falls out of sight is never a tag that scores. */
  const shown = !wordKnown(c.w) ? [] : c.t.slice().sort(function(a, b){
    const m = G && G.demand ? G.demand.tags : [];
    return (m.indexOf(b) >= 0) - (m.indexOf(a) >= 0);
  });
  if(!wordKnown(c.w)){
    const q = document.createElement("span");
    q.className = "tg unknown";
    q.textContent = "NOT YET PLAYED";
    tags.appendChild(q);
  }
  shown.forEach(function(t){
    const s = document.createElement("span");
    const match = G && G.demand && G.demand.tags.indexOf(t) >= 0;
    s.className = "tg" + (match ? " match" : "");
    s.textContent = TAGS[t][0];
    tags.appendChild(s);
  });

  const inner = document.createElement("div");
  inner.className = "card-inner";
  inner.appendChild(art); inner.appendChild(w); inner.appendChild(tags);
  el.appendChild(inner);

  /* A card that can score at all should read as live before anything is
     read. This sorts the hand into useful / not useful at a glance without
     touching the actual decision, which is WHICH three and in what order. */
  if(!staticCard && G && G.demand && wordKnown(c.w)){
    const live = c.t.some(function(t){ return G.demand.tags.indexOf(t) >= 0; });
    if(live) el.classList.add("live");
  }

  if(!staticCard){
    const pos = G.selected.indexOf(c.id);
    if(pos >= 0){
      const p = document.createElement("div");
      p.className = "pos";
      p.textContent = pos + 1;
      el.appendChild(p);
    }
    if(pos >= 0) el.classList.add("sel");
    /* The lift, the gold badge and the number are the whole of "this one is
       picked, and it is third" — and none of it reaches anyone who is not
       looking at the screen. A figure is made of ORDER, so the position is
       not decoration here; it is the state. */
    el.setAttribute("aria-pressed", pos >= 0 ? "true" : "false");
    if(pos >= 0){
      /* The unselected label already honours blind mode; this one did not, so
         picking a card up and putting it down again read out every overtone
         the mode exists to hide. */
      el.setAttribute("aria-label",
        (wordKnown(c.w)
          ? c.w + ", " + c.t.map(function(t){ return TAGS[t][0]; }).join(", ")
          : c.w + ", overtones not yet known")
        + ". Picked, word " + (pos + 1) + " of " + G.selected.length + ".");
    }
    const toggle = function(){ toggleSel(c.id); };
    el.onclick = toggle;
    el.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
  }
  return el;
}

function toggleSel(id){
  if(G.animating) return;
  const i = G.selected.indexOf(id);
  if(i >= 0){ G.selected.splice(i,1); SFX.drop(); buzz(6); }
  else{
    if(G.selected.length >= maxPlay()){
      /* Named after whatever is doing the capping when something is, and after
         the game itself when nothing is. It used to hardcode "Three at a time"
         and fall through to "undefined allows 5" the moment MAX_PLAY moved. */
      const WORDS = ["", "one", "two", "three", "four", "five"];
      toast(maxPlay() === MAX_PLAY
              ? "A line is " + (WORDS[maxPlay()] || maxPlay()) + " words at most. Drop one first."
              : capper() + " allows " + maxPlay() + ". Drop one first.");
      SFX.deny(); buzz([8,45,8]); return;
    }
    G.selected.push(id); SFX.pick(G.selected.length); buzz(11);
  }
  if(G.coachStep === "pick" && G.selected.length) G.coachStep = "play";
