<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtone</title>
<meta name="description" content="A word roguelite where meaning is the physics. Play words into an escalating scoring engine and warp the rules with Lenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&display=swap">
<style>
/* ============================================================
   OVERTONE

   Four rules, held everywhere. Breaking them is what made the last
   pass read as generated:
     1. Flat fills. No gradients on any surface.
     2. Hard shadows only — 0 blur. Every panel sits on a solid lip.
     3. One typeface, one family of sizes.
     4. Colour is information: blue = chips, red = mult, gold = money.
        Nothing else gets to be loud.
   ============================================================ */
:root{
  color-scheme: dark;

  /* A PICO-8-derived arcade set: indigo room, wine table, hot accents.
     The flat/hard-shadow/one-font rules still hold — only the hues moved. */
  --bg:        #000000;   /* the room */
  --felt:      #6E1E4B;   /* the table cards are played on */
  --felt-d:    #4A1233;
  --panel:     #2B2B57;
  --panel-2:   #3E3E73;
  --inset:     #101024;
  --edge:      #191934;   /* the lip — must read against black */

  --chips:     #29ADFF;
  --chips-d:   #1668AD;
  --mult:      #FF004D;
  --mult-d:    #A80033;
  --gold:      #FFEC27;
  --gold-d:    #B39C00;
  --blind:     #FFA300;
  --blind-d:   #B36F00;
  --green:     #00E436;
  --green-d:   #009424;
  --lens:     #FF77A8;
  --lens-d:   #B34A75;

  --card:      #FFF1E8;
  --card-edge: #C8B8AE;
  --card-ink:  #14141F;
  --card-dim:  #6B6478;

  --text:      #FFF1E8;
  --text-dim:  #C2C3C7;
  --text-faint:#83769C;

  --f: "Silkscreen", "Courier New", ui-monospace, monospace;
  --drop: 2px 2px 0 rgba(0,0,0,.55);
  --drop-sm: 1px 1px 0 rgba(0,0,0,.55);
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
  font-size: 14px;
  line-height: 1.65;
  min-height: 100vh;
}
button{ font-family: inherit; color: inherit; }
:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

/* every raised surface is the same object: flat fill, solid lip */
.slab{
  background: var(--panel);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--edge);
}

#app{
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 14px;
  padding-block: 12px 18px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.wordmark{
  margin:0; font-size: 26px; font-weight: 700; letter-spacing: .05em;
  color: var(--card);
  text-shadow: 3px 3px 0 var(--mult);
}
.wordmark span{ color: var(--gold); }
.mast-actions{ display:flex; gap:8px; align-items:center; }
.chip-btn{
  background: var(--panel); border:none; border-radius: 7px; cursor:pointer;
  box-shadow: 0 3px 0 var(--edge);
  padding: 7px 13px; font-size: 13px; font-weight:600; color: var(--text-dim);
  text-shadow: var(--drop-sm);
}
.chip-btn:hover{ background: var(--panel-2); color:#FFF; }
.chip-btn:active{ transform: translateY(3px); box-shadow:none; }

/* ---------- table ---------- */
.table{ display:grid; grid-template-columns: 232px 1fr; gap: 12px; align-items:stretch; flex:1; }
.sidebar{ display:flex; flex-direction:column; gap: 10px; }

.blind{ padding: 11px; text-align:center; }
.blind-badge{
  background: var(--blind);
  border-radius: 7px; padding: 10px 8px;
  font-size: 15px; font-weight:700; letter-spacing:.02em; line-height:1.2;
  color:#3D2200; text-shadow: none;
  box-shadow: 0 3px 0 var(--blind-d);
  text-wrap: balance;
  animation: plaqueSlam .34s cubic-bezier(.2,1.5,.4,1);
}
@keyframes plaqueSlam{
  0%{ transform: scale(1.35); opacity:0; }
  60%{ transform: scale(.97); opacity:1; }
  100%{ transform: none; }
}
.blind-wants{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:11px; }
.blind-wants .w{
  background: var(--gold); color:#0B0B18; border-radius: 4px;
  padding: 3px 8px; font-size: 11px; font-weight:700; letter-spacing:.03em;
  box-shadow: 0 2px 0 var(--gold-d);
}
.blind-req{ margin-top: 13px; }
.blind-req .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.blind-req .v{
  font-size: 28px; font-weight:700; color: var(--mult);
  text-shadow: var(--drop); font-variant-numeric: tabular-nums; line-height:1.1;
}
.progress{
  margin-top: 9px; height: 8px; border-radius: 4px;
  background: var(--inset); overflow: hidden;
}
.progress > i{
  display:block; height:100%; width:0%;
  background: var(--green);
  transition: width .35s cubic-bezier(.2,.9,.3,1);
}

.roundscore{ padding: 9px 12px; text-align:center; }
.roundscore .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.roundscore .v{
  font-size: 25px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop); line-height:1.15;
}

/* chips X mult — the two numbers the whole game is about */
.tally{
  display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:6px;
  background: var(--inset); border-radius: 8px; padding: 9px 8px;
  box-shadow: 0 4px 0 var(--edge);
}
.tally .chips, .tally .multv{
  border-radius: 6px; padding: 9px 4px; text-align:center;
  font-size: 23px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop);
  overflow: hidden; text-overflow: ellipsis;
}
.tally .chips{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.tally .multv{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.tally .x{ font-size: 15px; font-weight:700; color: var(--text-faint); }
.tally.pulse .chips{ animation: pop .22s cubic-bezier(.2,1.6,.4,1); }
.tally.pulsem .multv{ animation: popBig .26s cubic-bezier(.2,1.8,.4,1); }
@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes popBig{ 0%{transform:scale(1)} 40%{transform:scale(1.3)} 100%{transform:scale(1)} }

.meters{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter{ padding: 8px 6px; text-align:center; }
.meter .k{ font-size: 11.5px; color: var(--text-dim); }
.meter .v{ font-size: 22px; font-weight:700; text-shadow: var(--drop); line-height:1.15; }
.meter.plays .v{ color: var(--chips); }
.meter.disc .v{ color: var(--mult); }

.money{
  padding: 9px; text-align:center;
  font-size: 23px; font-weight:700; color: var(--gold);
  text-shadow: var(--drop);
}
.runinfo{
  display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
  font-size: 11px; color: var(--text-faint); padding: 0 3px;
}

/* ---------- board ---------- */
.board{ display:flex; flex-direction:column; gap: 12px; min-width: 0; }

.lensbar{ padding: 9px 10px; }
.lensbar-head{
  display:flex; justify-content:space-between; align-items:center;
  font-size: 12px; letter-spacing:.1em; color: var(--text-dim); margin-bottom: 7px;
}
.lensbar-head b{ color: var(--lens); font-weight:700; font-size: 14px; }
.rail{ display:flex; gap:8px; flex-wrap:wrap; min-height: 54px; align-items:stretch; }
.lens{
  position:relative; border-radius: 7px; padding: 7px 9px;
  min-width: 118px; max-width: 168px; cursor: help;
  background: var(--lens);
  box-shadow: 0 3px 0 var(--lens-d);
}
.lens .n{
  font-size: 12px; font-weight:700; color:#3D0F27; text-shadow: none;
  white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
}
.lens .d{ font-size: 9.5px; line-height:1.5; color:#5C1A3A; margin-top:4px; }
.lens.fired{ animation: lensFire .5s cubic-bezier(.2,1.3,.3,1); }
@keyframes lensFire{
  0%{ transform: translateY(0) scale(1) rotate(0); }
  30%{ transform: translateY(-10px) scale(1.1) rotate(-3deg); }
  60%{ transform: translateY(0) scale(1.03) rotate(2deg); }
  100%{ transform: none; }
}
.rail-empty{ font-size: 12px; color: var(--text-faint); align-self:center; padding: 4px 2px; }

/* the green table */
.stage{
  flex:1; min-height: 186px; position:relative;
  background: var(--felt);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--felt-d), inset 0 0 0 3px rgba(0,0,0,.14);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 14px; padding: 16px; overflow:hidden;
}
.stage-cards{ display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.stage-hint{
  font-size: 13px; font-weight:600; letter-spacing:.03em; color: #F2D8E6;
  text-align:center; max-width: 44ch; text-shadow: var(--drop-sm);
}
.stage-hint .hand-name{
  display:inline-block; font-size: 15px; font-weight:700;
  background: var(--inset); color:#FFF;
  border-radius: 6px; padding: 6px 16px;
  box-shadow: 0 3px 0 var(--edge);
  margin-bottom: 8px; animation: nameIn .26s cubic-bezier(.2,1.5,.4,1);
}
@keyframes nameIn{ 0%{transform:scale(.72);opacity:0} 100%{transform:none;opacity:1} }
.stage-total{
  font-size: 46px; font-weight:700; color: var(--gold);
  text-shadow: 4px 4px 0 var(--edge);
  font-variant-numeric: tabular-nums;
  animation: slam .34s cubic-bezier(.2,1.5,.4,1);
}
@keyframes slam{ 0%{transform:scale(2.2);opacity:0} 60%{transform:scale(.93);opacity:1} 100%{transform:none} }
.shake{ animation: shake .32s ease-in-out; }
@keyframes shake{
  0%,100%{transform:translate(0,0)} 15%{transform:translate(-7px,3px)}
  35%{transform:translate(7px,-3px)} 55%{transform:translate(-5px,-2px)}
  75%{transform:translate(5px,2px)} 90%{transform:translate(-2px,1px)}
}
/* flat flash when the Demand falls, not a glow */
.stage.clear::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background: var(--green); animation: wash .55s steps(4) forwards;
}
@keyframes wash{ 0%{opacity:0} 30%{opacity:.55} 100%{opacity:0} }

/* pixel sparks: square, no glow */
.spark{
  position:absolute; left:50%; top:50%; width:7px; height:7px;
  background: var(--gold); pointer-events:none; z-index: 7;
}

/* ---------- cards ---------- */
.card{
  touch-action: manipulation;
  position:relative; width: 104px; min-height: 172px;
  background: var(--card); color: var(--card-ink);
  border-radius: 7px; padding: 7px;
  cursor:pointer; user-select:none;
  box-shadow: 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
  transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg));
  transition: transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .12s ease;
}
/* the idle breath sits on an inner layer so it never fights hover or select,
   both of which drive transform on the card itself */
.card-inner{ display:flex; flex-direction:column; gap: 5px; height: 100%; }
.hand .card .card-inner{
  animation: breathe 3.4s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -0.21s);
}
@keyframes breathe{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-3px); }
}
.card:hover{
  transform: translateY(calc(var(--dy, 0px) - 14px)) rotate(0deg) scale(1.06);
  z-index: 5;
}
.card.sel{
  transform: translateY(calc(var(--dy, 0px) - 26px)) rotate(var(--rot, 0deg)) scale(1.04);
  box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--card-edge), 0 10px 18px rgba(0,0,0,.5);
  z-index: 4;
}
.card.sel:hover{ transform: translateY(calc(var(--dy, 0px) - 32px)) rotate(0deg) scale(1.08); }
.card.static, .card.static:hover{ cursor:default; transform:none; z-index:auto; }
.card.deal{ animation: dealIn .32s cubic-bezier(.2,.95,.3,1) backwards; animation-delay: calc(var(--i,0) * 48ms); }
@keyframes dealIn{
  0%{ opacity:0; transform: translate(-70px, 44px) rotate(-15deg) scale(.84); }
  100%{ opacity:1; transform: translateY(var(--dy,0px)) rotate(var(--rot,0deg)); }
}
.card .art{
  border-radius: 5px; height: 52px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
}
.card .art .icons{ display:flex; align-items:center; gap: 5px; }
.ms{
  font-family: "Material Symbols Rounded";
  font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap;
  word-wrap: normal; direction: ltr; display: inline-block;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  -webkit-font-smoothing: antialiased;
  font-size: 21px; color: #FFF; visibility: hidden;
  text-shadow: var(--drop-sm);
}
.ms-ok .ms{ visibility: visible; }
.card .art .ms.hit{
  color:#0B0B18; background: var(--gold); border-radius: 50%;
  padding: 2px; text-shadow: none;
}
/* dark ink on the bright plates, and invert the match ring so it still reads */
.card .art.light .ms{ color:#0B0B18; text-shadow: none; }
.card .art.light .ms.hit{ background:#1B1B3A; color: var(--gold); }
.legend{ display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 16px; }
.legend .leg{
  display:inline-flex; align-items:center; gap:5px;
  background: var(--inset); border-radius: 6px; padding: 4px 9px;
  font-size: 11px; font-weight:600; color: var(--text-dim);
}
.legend .ms{ font-size: 17px; color: var(--text-dim); text-shadow:none; }
.card .w{
  font-size: 13px; font-weight:700; line-height:1.05; letter-spacing:-.01em;
  text-transform: uppercase; word-break: break-word; hyphens:auto;
  flex: 1;
}
.card .base{
  position:absolute; top:8px; right:8px; z-index:2;
  font-size: 11px; font-weight:700; color:#FFF;
  background: rgba(0,0,0,.5); border-radius: 4px; padding: 0 5px;
  font-variant-numeric: tabular-nums;
}
.card .tags{ display:flex; flex-wrap:wrap; gap:3px; }
.card .tg{
  font-size: 9px; font-weight:600; letter-spacing:.02em;
  padding: 2px 5px; border-radius: 3px;
  background: #DCD4E0; color: #453F54;
}
.card .tg.match{ background: var(--gold); color:#0B0B18; font-weight:700; }
.card.interpreted{
  box-shadow: 0 0 0 3px var(--lens), 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
}
.card.interpreted::after{
  content:"\2666"; position:absolute; top:5px; left:6px; font-size:10px; color: var(--lens-d);
}
.card.scoring{ animation: scorePop .4s cubic-bezier(.2,1.5,.35,1); z-index: 6; }
@keyframes scorePop{
  0%{ transform: translateY(0) scale(1); }
  35%{ transform: translateY(-26px) rotate(-4deg) scale(1.12); }
  65%{ transform: translateY(-6px) rotate(2deg) scale(1.03); }
  100%{ transform: translateY(0) rotate(0) scale(1); }
}

.float{
  position:absolute; left:50%; top:-8px; transform:translateX(-50%);
  font-size: 14px; font-weight:700; white-space:nowrap; pointer-events:none;
  padding: 3px 9px; border-radius: 5px; z-index: 8;
  text-shadow: var(--drop-sm);
  animation: floatUp .85s ease-out forwards;
}
.float.c{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.float.m{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.float.r{ background: var(--gold); color:#0B0B18; box-shadow: 0 3px 0 var(--gold-d); }
@keyframes floatUp{
  0%{ opacity:0; transform: translate(-50%,6px) scale(.78); }
  16%{ opacity:1; transform: translate(-50%,-18px) scale(1.1); }
  72%{ opacity:1; transform: translate(-50%,-36px) scale(1); }
  100%{ opacity:0; transform: translate(-50%,-54px) scale(.92); }
}

/* the round's rule, stated dead centre where the eye already is */
.demand-call{ display:flex; flex-direction:column; align-items:center; gap: 12px; }
.dc-icons{ display:flex; gap: 16px; }
.dc-icons .ms{ font-size: 50px; color: var(--gold); text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.dc-text{ font-size: 13px; color:#F2D8E6; text-align:center; max-width: 40ch; }
.dc-text b{ color: var(--gold); }

/* which card is first, second, third — the rule the game kept stating */
.pos{
  position:absolute; top:-9px; left:-7px; z-index:9;
  width:23px; height:23px; border-radius:50%;
  background: var(--gold); color:#0B0B18;
  font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* a card that can score at all, readable before anything is read */
.card.live::before{
  content:""; position:absolute; left:7px; right:7px; top:3px; height:3px;
  background: var(--gold); border-radius: 2px;
}

.stakes{ color: var(--text-dim); }
.stakes b{ color: var(--gold); }
.fit{
  align-self:flex-start; font-size:11px; font-weight:700;
  background: var(--gold); color:#0B0B18; border-radius:4px; padding:2px 7px;
}

/* ---------- hand + controls ---------- */
.handwrap{ display:flex; flex-direction:column; gap: 22px; }
.hand{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height: 182px;
  align-items:flex-end; padding-top: 30px; padding-bottom: 34px; }
.controls{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
.btn{
  touch-action: manipulation;
  border:none; border-radius: 8px; cursor:pointer;
  padding: 13px 26px; font-size: 13px; font-weight:700; letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--panel-2); color:#FFF;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop);
  transition: background .12s ease, transform .06s ease, box-shadow .12s ease;
}
.btn:hover:not(:disabled){ filter: brightness(1.12); }
.btn:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn.primary{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 4px 0 var(--chips-d); }
.btn.primary:active:not(:disabled){ box-shadow: none; }
.btn.danger{ background: var(--mult); box-shadow: 0 4px 0 var(--mult-d); }
.btn.danger:active:not(:disabled){ box-shadow: none; }
.btn.interp{ background: var(--lens); color:#3D0F27; text-shadow:none; box-shadow: 0 4px 0 var(--lens-d); }
.btn.interp:active:not(:disabled){ box-shadow: none; }

/* ---------- overlays ---------- */
.veil{
  position: fixed; inset:0; z-index: 40;
  background: rgba(11,11,28,.92);
  display:flex; align-items:center; justify-content:center;
  padding: 18px; overflow-y:auto;
}
.veil[hidden]{ display:none !important; }
.panel{
  background: var(--panel); border-radius: 9px; padding: 22px;
  max-width: 640px; width:100%;
  box-shadow: 0 5px 0 var(--edge);
  max-height: calc(100vh - 36px); overflow-y:auto;
  animation: panelIn .26s cubic-bezier(.2,1.4,.4,1);
}
@keyframes panelIn{ 0%{transform:scale(.93) translateY(12px); opacity:0} 100%{transform:none; opacity:1} }
.panel h2{
  margin:0 0 4px; font-size: 23px; font-weight:700;
  text-shadow: var(--drop); text-wrap: balance;
}
.panel .sub{ font-size: 13px; color: var(--text-faint); margin-bottom: 15px; letter-spacing:.05em; }
.panel p{ color: var(--text-dim); margin: 0 0 12px; max-width: 56ch; font-size: 13px; line-height:1.8; }
.panel p b, .panel li b{ color:#FFF; font-weight:700; }
.panel p.gold{ color: var(--gold); }

.offers{ display:grid; grid-template-columns: repeat(auto-fit, minmax(172px,1fr)); gap:10px; margin: 14px 0; }
.offer{
  background: var(--lens); border:none; border-radius: 8px; padding: 12px;
  display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  box-shadow: 0 4px 0 var(--lens-d);
  transition: transform .07s ease, filter .12s ease;
}
.offer:hover:not(:disabled){ filter: brightness(1.12); }
.offer:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.offer:disabled{ opacity:.4; cursor:not-allowed; }
.offer .on{ font-size: 13px; font-weight:700; color:#3D0F27; text-shadow: none; }
.offer .od{ font-size: 10px; color:#5C1A3A; line-height:1.6; flex:1; }
.offer .oc{ font-size: 14px; font-weight:700; color: #3D0F27; text-shadow: none; }

.rowend{ display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:10px; }
.purse{ font-size: 17px; font-weight:700; color: var(--gold); text-shadow: var(--drop); }

.share{
  font-size: 13px; line-height:1.7; background: var(--inset); border-radius: 8px;
  padding: 12px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word;
  margin: 12px 0;
}
.stat-row{ display:grid; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:14px 0; }
.stat{ background: var(--inset); border-radius:8px; padding:10px 12px; }
.stat .k{ font-size:11.5px; color:var(--text-faint); }
.stat .v{ font-size:22px; font-weight:700; text-shadow: var(--drop); font-variant-numeric:tabular-nums; line-height:1.2; }
.stat.gold .v{ color: var(--gold); }

.unlock{
  background: var(--lens); border-radius:8px; padding:12px 14px; margin:14px 0;
  box-shadow: 0 4px 0 var(--lens-d);
}
.unlock .k{ font-size:11.5px; color:#5C1A3A; letter-spacing:.06em; }
.unlock .v{ font-size:15px; font-weight:700; color:#3D0F27; margin-top:3px; text-shadow: none; }
.unlock .d{ font-size:12.5px; color:#5C1A3A; margin-top:3px; }

#interpInput{
  width:100%; padding: 13px 14px; font-family: var(--f);
  font-size: 22px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  background: var(--card); color: var(--card-ink);
  border: none; border-radius: 8px;
}
#interpInput::placeholder{ color: var(--card-dim); font-weight:600; text-transform:none; font-size:18px; }
.appraisal{ display:flex; gap:14px; align-items:center; margin:14px 0; min-height: 150px; }
.appraisal .say{ font-size: 13px; color: var(--text-dim); line-height:1.55; }
.appraisal .say .src{ display:block; font-size:11px; color: var(--text-faint); margin-top:8px; letter-spacing:.04em; }
.helplist{ margin:0 0 14px; padding-left:18px; color: var(--text-dim); font-size:13px; line-height:1.8; }
.helplist li{ margin-bottom:7px; }

.teach{ display:flex; flex-direction:column; gap:13px; margin: 4px 0 16px; }
.teach-row{ display:flex; gap:12px; align-items:flex-start; }
.teach-n{
  flex:none; width:28px; height:28px; border-radius:6px;
  background: var(--chips); color:#06233D; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 3px 0 var(--chips-d); text-shadow: var(--drop-sm);
}
.teach-row p{ margin:0; font-size:13px; line-height:1.8; }
.gold{ color: var(--gold); }
.worked{
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  background: var(--inset); border-radius:8px; padding: 14px; margin-bottom: 14px;
}
.worked-sum{ font-size:13.5px; line-height:1.7; color: var(--text-dim); min-width: 210px; flex:1; }
.worked-sum b{ color:#FFF; }
.worked-tot{ display:block; margin-top:6px; font-size:18px; font-weight:700; color: var(--gold); }

.kbd{
  display:inline-block; font-size:11.5px; font-weight:700; padding:2px 7px;
  border-radius:4px; background: var(--inset); color:#FFF;
  box-shadow: 0 2px 0 var(--edge);
}
.coach{
  align-self:center; background: var(--gold); color:#0B0B18;
  border-radius: 8px; padding: 10px 18px; max-width: 52ch;
  text-align:center; font-size: 12px; font-weight:700; line-height:1.4;
  box-shadow: 0 4px 0 var(--gold-d);
  animation: coachIn .24s ease-out;
}
.coach[hidden]{ display:none !important; }
@keyframes coachIn{ 0%{opacity:0; transform:translateY(-7px)} 100%{opacity:1; transform:none} }
.hint-pulse{ animation: hintPulse 1.4s steps(2) infinite; }
@keyframes hintPulse{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.35); }
}
.toast{
  position: fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background: var(--panel); color:#FFF; font-size:14px; font-weight:600;
  padding: 11px 20px; border-radius:8px; z-index:60;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop-sm);
}
.toast[hidden]{ display:none !important; }

/* ---------- desktop: use the room, and stop the felt eating it ----------
   #app is min-height:100vh with .table and .stage both flex:1, so on a tall
   monitor the stage absorbed every spare pixel — a 500px empty slab that
   pushed the hand away from the board and made all the type look small.
   Let the content be its natural height and centre the whole thing. */
@media (min-width: 1240px){
  #app{ max-width: 1320px; gap: 14px; justify-content: center; }
  .table{ flex: 0 0 auto; grid-template-columns: 268px 1fr; gap: 14px; }
  .stage{ flex: 0 0 auto; min-height: 240px; }

  /* bigger cards: the thing players actually read */
  .card{ width: 122px; min-height: 194px; padding: 8px; }
  .card .art{ height: 64px; }
  .card .art .icons{ gap: 6px; }
  .card .art .ms{ font-size: 25px; }
  .card .w{ font-size: 15px; }
  .card .tg{ font-size: 9.5px; }
  .card .base{ font-size: 12px; }
  .hand{ min-height: 0; gap: 10px; padding-top: 28px; padding-bottom: 30px; }
  .pos{ width: 26px; height: 26px; font-size: 14px; top: -10px; left: -8px; }

  /* the round's rule, at the size it deserves */
  .dc-icons .ms{ font-size: 54px; }
  .dc-icons{ gap: 22px; }
  .dc-text{ font-size: 14px; max-width: 46ch; }
  .demand-call{ gap: 13px; }
  .stage-hint{ font-size: 14px; }
  .stage-hint .hand-name{ font-size: 16px; padding: 6px 20px; }

  /* the sidebar has the width to be read at a glance */
  .blind-badge{ font-size: 17px; padding: 12px 9px; }
  .blind-wants .w{ font-size: 12px; padding: 3px 9px; }
  .blind-req .v{ font-size: 30px; }
  .blind-req .k, .roundscore .k, .meter .k{ font-size: 13px; }
  .roundscore .v{ font-size: 27px; }
  .tally .chips, .tally .multv{ font-size: 25px; padding: 10px 5px; }
  .meter .v{ font-size: 24px; }
  .money{ font-size: 25px; }

  .lens{ min-width: 134px; max-width: 186px; padding: 8px 10px; }
  .lens .n{ font-size: 13px; }
  .lens .d{ font-size: 12px; }
  .lensbar-head{ font-size: 13px; }

  .btn{ font-size: 14px; padding: 14px 28px; }
  .coach{ font-size: 13px; padding: 12px 22px; }
}

/* ---------- narrow: sidebar becomes a HUD strip ----------
   Above this the sidebar sits beside the board, which only works once the
   board is wide enough for all seven cards in one row (776px of hand plus
   the 232px sidebar and gaps). Below it, the HUD goes horizontal and the
   board gets the full width. */
@media (max-width: 1080px){
  .table{ grid-template-columns: 1fr; }
  .sidebar{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 9px; align-items:start; }
  .meters{ display: contents; }
  .blind{ grid-column: 1 / -1; order:1; }
  .tally{ grid-column: 1 / -1; order:2; }
  .roundscore{ order:3; }
  .meter.plays{ order:4; }
  .meter.disc{ order:5; }
  .money{ order:6; }
  .runinfo{ grid-column: 1 / -1; order:7; }
  .stage{ min-height: 150px; }
}

/* ---------- phone: one screen, thumb-sized targets ---------- */
@media (max-width: 620px){
  #app{ min-height: 100dvh; padding-inline: 9px; padding-block: 7px 8px; gap: 7px; }
  .masthead{ gap: 8px; }
  .wordmark{ font-size: 21px; text-shadow: 2px 2px 0 var(--edge); }
  .chip-btn{ padding: 7px 10px; font-size: 12px; }

  .sidebar{ gap: 7px; }
  .blind{
    padding: 8px 10px; text-align:left;
    display:grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items:center;
  }
  .blind-badge{ font-size: 14px; padding: 7px 9px; grid-column: 1; }
  .blind-wants{ justify-content:flex-start; margin-top: 0; grid-column: 1; }
  .blind-req{ margin-top: 0; text-align:right; grid-column: 2; grid-row: 1 / span 2; }
  .blind-req .k{ font-size: 10px; }
  .blind-req .v{ font-size: 21px; }
  .progress{ grid-column: 1 / -1; margin-top: 1px; height: 7px; }

  .tally{ padding: 7px 6px; }
  .tally .chips, .tally .multv{ font-size: 19px; padding: 6px 3px; }
  .roundscore{ padding: 6px 4px; }
  .roundscore .k, .meter .k{ font-size: 10px; }
  .roundscore .v, .meter .v{ font-size: 17px; }
  .meter{ padding: 6px 3px; }
  .money{ padding: 6px 4px; font-size: 17px; }
  .runinfo{ font-size: 10px; }

  .lensbar{ padding: 7px 8px; }
  .lensbar-head{ font-size: 11px; margin-bottom: 5px; }
  .lensbar-head b{ font-size: 12px; }
  .rail{ flex-wrap: nowrap; overflow-x: auto; min-height: 46px; padding-bottom: 2px; }
  .lens{ flex: 0 0 auto; min-width: 106px; }
  .rail-empty{ white-space: normal; }

  .stage{ min-height: 76px; padding: 9px; gap: 7px; }
  .dc-icons .ms{ font-size: 34px; }
  .dc-icons{ gap: 11px; }
  .dc-text{ font-size: 12.5px; }
  .demand-call{ gap: 7px; }
  .pos{ width:19px; height:19px; font-size:11px; top:-7px; left:-5px; }
  .stage-hint{ font-size: 12.5px; }
  .stage-hint .hand-name{ font-size: 13px; padding: 4px 10px; }
  .stage-total{ font-size: 36px; }
  .coach{ font-size: 12px; padding: 7px 11px; line-height: 1.35; }

  .handwrap{ gap: 9px; }
  .hand{ gap: 5px; min-height: 0; padding-top: 7px; padding-bottom: 7px; }
  .card{ width: 68px; min-height: 114px; padding: 5px 4px; border-radius: 6px; }
  .card .art{ height: 34px; border-radius: 4px; }
  .card .art .icons{ gap: 3px; }
  .card .art .ms{ font-size: 15px; }
  .card .w{ font-size: 11.5px; }
  .card .base{ font-size: 9.5px; padding: 0 4px; top: 5px; right: 5px; }
  .card .tg{ font-size: 7.5px; padding: 1px 3px; }
  .card:hover{ transform: none; }
  .card.sel{ transform: translateY(-10px) scale(1.03); }
  .card.sel:hover{ transform: translateY(-10px) scale(1.03); }
  .hand .card .card-inner{ animation: none; }

  /* Play/Discard/Interpret must never sit below the fold. Phone heights vary
     far more than widths (a Pixel 5 is 117px shorter than an iPhone 14), so
     pin the row to the bottom instead of trying to out-guess the tallest
     device that still fits. */
  .controls{
    gap: 7px;
    position: sticky; bottom: 0; z-index: 30;
    margin-inline: -9px; padding: 7px 9px calc(7px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    box-shadow: 0 -2px 0 var(--edge);
  }
  .btn{ flex: 1 1 0; min-height: 48px; padding: 12px 6px; font-size: 11px; letter-spacing: 0; }

  .panel{ padding: 16px; }
  .panel h2{ font-size: 21px; }
  .panel p, .helplist{ font-size: 13px; }
  .worked{ padding: 11px; gap: 11px; }
  .appraisal{ min-height: 0; flex-wrap: wrap; }
  #interpInput{ font-size: 18px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important;
     transition-duration: .01ms !important; }
}

  { n:"THE THAW",               tags:["COL","WET"] },
  { n:"THE MENAGERIE",          tags:["ANI","MOT"] },

  { n:"THE OPERATING THEATRE",  tags:["BOD","DAN"] },
  { n:"THE BANQUET",            tags:["FOO","LOU"] },
  { n:"THE COUNTING HOUSE",     tags:["MON","MIN"] },
  { n:"THE OBSERVATORY",        tags:["BRI","MIN"] },
  { n:"THE MIDNIGHT SHIFT",     tags:["DAR","TIM"] },
  { n:"THE PARADE",             tags:["LOU","MOT"] },
  { n:"THE WORKSHOP",           tags:["TOO","MOT"] },
  { n:"THE FLOOD",              tags:["WET","MOT"] },

/* Tuned against a simulation of a lens-less greedy player (see README).
   Rounds 1-2 are generous so the first session always lands some wins;
   round 3 is the first real decision; the late curve outruns any deck
   that isn't multiplying, which is what makes the Lens engine the game. */
const TARGETS = [200, 340, 520, 800, 1250, 2000, 3300, 5200];
const ROUNDS = TARGETS.length;
const HAND_SIZE = 7, MAX_PLAY = 3, LENS_SLOTS = 5;

/* ---------- deterministic RNG (mulberry32) ---------- */
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng = mulberry32(1);
function ri(n){ return Math.floor(rng()*n); }
function pick(arr){ return arr[ri(arr.length)]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=ri(i+1); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }

/* ---------- storage (may be blocked; never let it break the game) ---------- */
const store = {
  get:function(k,d){ try{ const v=localStorage.getItem("overtone:"+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("overtone:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- audio: synthesised, no asset files ---------- */
let actx = null;
function tone(freq, dur, type, gain){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.09, actx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.14));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur||0.14) + 0.02);
  }catch(e){}
}

/* ---------- game state ---------- */
let G = null;

function makeCard(entry, interpreted){
  return {
    id: Math.random().toString(36).slice(2,9),
    w: entry.w,
    t: entry.t.slice(),
    base: 5 + 3*entry.w.length,
    interpreted: !!interpreted
  };
}

function newRun(seedStr){
  const daily = todayKey();
  const seed = seedStr || daily;
  rng = mulberry32(hashStr(seed));

  const demandOrder = shuffle(DEMANDS.slice()).slice(0, ROUNDS);

  /* Build the deck knowing what this run will ask for. Some overtones are
     genuinely rare in the lexicon (FOOD sits on 21 of 249 words), so a purely
     random 26-card deck can hand you a Demand you cannot possibly meet. Seed
     a floor of 3 words per demanded overtone first, then fill at random. */
  /* Build the deck knowing what this run will ask for.

     The floor has to be per DEMAND, not per overtone. A Demand is answered by
     ANY of its tags, and words carry 3.2 overtones on average — so three PLANT
     words that all happened to be NATURE as well satisfied a per-overtone
     floor twice over while leaving THE GREENHOUSE with three playable cards.
     Guarantee answers to the Demand itself, scarcest Demand first, so the
     hardest one to supply gets first claim on the 26 slots. */
  const DECK_SIZE = 26, FLOOR = 5;
  const bag = shuffle(LEXICON.slice());
  const chosen = [], taken = {};

  function answers(entry, d){
    return entry.t.some(function(t){ return d.tags.indexOf(t) >= 0; });
  }
  function answering(d){
    return chosen.filter(function(e){ return answers(e, d); }).length;
  }

  const supply = {};
  demandOrder.forEach(function(d){
    supply[d.n] = LEXICON.filter(function(e){ return answers(e, d); }).length;
  });
  demandOrder.slice()
    .sort(function(a, b){ return supply[a.n] - supply[b.n]; })
    .forEach(function(d){
      for(let i = 0; i < bag.length && answering(d) < FLOOR && chosen.length < DECK_SIZE; i++){
        if(taken[bag[i].w] || !answers(bag[i], d)) continue;
        taken[bag[i].w] = 1; chosen.push(bag[i]);
      }
    });
  for(let i = 0; i < bag.length && chosen.length < DECK_SIZE; i++){
    if(taken[bag[i].w]) continue;
    taken[bag[i].w] = 1; chosen.push(bag[i]);
  }

  const deck = chosen.map(function(e){ return makeCard(e,false); });

  G = {
    seed: seed,
    isDaily: seed === daily,
    round: 0,
    deck: shuffle(deck),
    discard: [],
    hand: [],
    lenses: [],
    bank: 4,
    selected: [],
    plays: 4, discards: 3,
    roundScore: 0,
    total: 0,
    demandOrder: demandOrder,
    best: { word:"", mult:0, score:0 },
    coachStep: null,
    interpreterUsed: false,
    interpretedWord: null,
    animating: false,
    over: false,
    offers: null,
    shopSeen: []
  };

  /* Memory: a lens carried in from a previous run. The visible reason run 2
     is not run 1. */
  const memory = store.get("memory", null);
  if(memory){
    const l = LENSES.find(function(x){ return x.id===memory; });
    if(l) G.lenses.push(l);
  }

  for(const k in SEEN) delete SEEN[k];
  G.coachStep = coachDone() ? null : "pick";
  startRound();
}

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function startRound(){
  G.demand = { n: G.demandOrder[G.round].n, tags: G.demandOrder[G.round].tags.slice() };
  G.target = TARGETS[G.round];
  G.roundScore = 0;
  G.plays = 4; G.discards = 3;
  G.selected = [];
  G.discard = G.discard.concat(G.hand);
  G.hand = [];
  draw(HAND_SIZE);
  render();
}

function draw(n){
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      if(G.discard.length===0) break;
      G.deck = shuffle(G.discard); G.discard = [];
    }
    G.hand.push(G.deck.pop());
  }
}

/* ---------- scoring engine ---------- */
function resolve(cards){
  const events = [];
  let chips = 0, mult = 1;
  const ctx = { demand: G.demand, discards: G.discards, resoUsed: false };

  for(let i=0;i<cards.length;i++){
    const c = cards[i];
    chips += c.base;
    events.push({ k:"card", i:i, cls:"c", txt:"+"+c.base, chips:chips, mult:mult });

    const hits = c.t.filter(function(t){ return G.demand.tags.includes(t); });
    for(let h=0;h<hits.length;h++){
      chips += 25;
      events.push({ k:"card", i:i, cls:"r", txt:"RESONANCE +25", chips:chips, mult:mult });
    }

    for(let li=0; li<G.lenses.length; li++){
      const L = G.lenses[li];
      if(!L.onCard) continue;
      const r = L.onCard(c, i, cards, ctx);
      if(!r) continue;
      const parts = [];
      if(r.chips){ chips += r.chips; parts.push((r.chips>0?"+":"")+r.chips); }
      if(r.mult){ mult += r.mult; parts.push("+"+r.mult+" mult"); }
      if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
      events.push({ k:"lens", i:i, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                    txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
    }
  }

  for(let li=0; li<G.lenses.length; li++){
    const L = G.lenses[li];
    if(!L.onPlay) continue;
    const r = L.onPlay(cards, ctx);
    if(!r) continue;
    const parts = [];
    if(r.chips){ chips += r.chips; parts.push("+"+r.chips); }
    if(r.mult){ mult += r.mult; parts.push("+"+r.mult+" mult"); }
    if(r.xmult){ mult *= r.xmult; parts.push("×"+r.xmult+" mult"); }
    events.push({ k:"lens", i:-1, lens:li, cls:(r.xmult||r.mult)?"m":"c",
                  txt: L.n+" "+(r.label?r.label+" ":"")+parts.join(" "), chips:chips, mult:mult });
  }

  chips = Math.max(0, Math.round(chips));
  mult = Math.max(0.1, mult);
  return { events: events, chips: chips, mult: mult, total: Math.round(chips*mult) };
}

/* ---------- play ---------- */
let skipAnim = false;
function sleep(ms){ return new Promise(function(r){ if(skipAnim) r(); else setTimeout(r, ms); }); }

async function play(){
  if(G.animating || G.selected.length===0 || G.plays<=0) return;
  G.animating = true; skipAnim = false;
  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);

  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.plays--;
  renderHand(); renderControls();

  const stageCards = document.getElementById("stageCards");
  stageCards.innerHTML = "";
  cards.forEach(function(c){ stageCards.appendChild(cardEl(c, true)); });
  document.getElementById("stageHint").textContent = "";
  setTally(0, 1);

  const gap = res.events.length > 12 ? 130 : 210;
  for(let e=0; e<res.events.length; e++){
    const ev = res.events[e];
    const host = ev.i >= 0 ? stageCards.children[ev.i] : stageCards;
    if(ev.i >= 0 && host){
      host.classList.add("scoring");
      setTimeout(function(){ host.classList.remove("scoring"); }, 320);
    }
    floatLabel(host || stageCards, ev.txt, ev.cls);
    if(ev.k === "lens") flashLens(ev.lens);
    setTally(ev.chips, ev.mult);
    tone(300 + Math.min(e,18)*42, 0.1, ev.cls==="m" ? "sawtooth" : "triangle", 0.06);
    await sleep(gap);
  }

  await sleep(240);
  G.roundScore += res.total;
  G.total += res.total;
  if(res.mult > G.best.mult || (res.mult === G.best.mult && res.total > G.best.score)){
    G.best = { word: cards.map(function(c){return c.w;}).join(" · "), mult: Math.round(res.mult*10)/10, score: res.total };
  }

  const totalEl = document.createElement("div");
  totalEl.className = "stage-total";
  totalEl.textContent = "+" + res.total.toLocaleString();
  stageCards.parentNode.insertBefore(totalEl, document.getElementById("stageHint"));
  tone(660, .18, "triangle", .1); setTimeout(function(){ tone(880,.3,"triangle",.09); }, 90);
  const stageEl = document.getElementById("stage");
  if(res.total >= G.target * 0.35){
    stageEl.classList.add("shake");
    burst(stageEl, res.total >= G.target ? 30 : 18);
  }
  setTimeout(function(){ stageEl.classList.remove("shake"); }, 360);
  if(G.roundScore + res.total >= G.target){
    stageEl.classList.add("clear");
    setTimeout(function(){ stageEl.classList.remove("clear"); }, 760);
  }

  if(G.coachStep === "play") G.coachStep = "score";
  renderDemand();
  await sleep(760);
  try{ totalEl.remove(); }catch(err){}
  setTally(0, 1);

  G.discard = G.discard.concat(cards);
  G.animating = false;

  if(G.roundScore >= G.target){ winRound(); return; }
  if(G.plays <= 0){ endRun(false); return; }

  draw(HAND_SIZE - G.hand.length);
  document.getElementById("stageHint").textContent = IDLE_HINT;
  render();
}

function setTally(c, m){
  const ce = document.getElementById("chipsV"), me = document.getElementById("multV"), t = document.getElementById("tally");
  const mRounded = Math.round(m*10)/10;
  if(ce.textContent !== String(c)){ t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse"); }
  if(me.textContent !== String(mRounded)){ t.classList.remove("pulsem"); void t.offsetWidth; t.classList.add("pulsem"); }
  countTo(ce, c, "chips");
  countTo(me, mRounded, "mult");
}
function floatLabel(host, txt, cls){
  if(!host) return;
  const f = document.createElement("div");
  f.className = "float " + cls;
  f.textContent = txt;
  if(getComputedStyle(host).position === "static") host.style.position = "relative";
  host.appendChild(f);
  setTimeout(function(){ try{ f.remove(); }catch(e){} }, 900);
}
function flashLens(i){
  const el = document.getElementById("rail").children[i];
  if(!el) return;
  el.classList.remove("fired"); void el.offsetWidth; el.classList.add("fired");
}

function discardSel(){
  if(G.animating || G.selected.length===0 || G.discards<=0) return;
  const cards = G.hand.filter(function(c){ return G.selected.indexOf(c.id)>=0; });
  G.discard = G.discard.concat(cards);
  G.hand = G.hand.filter(function(c){ return G.selected.indexOf(c.id)===-1; });
  G.selected = [];
  G.discards--;
  draw(HAND_SIZE - G.hand.length);
  tone(220, .09, "square", .05);
  render();
}

/* ---------- round win + shop ---------- */
function winRound(){
  const reward = 4 + G.plays + G.discards;
  G.bank += reward;
  G.round++;
  if(G.round >= ROUNDS){ endRun(true); return; }
  openShop(reward);
}

/* Which overtone a Lens keys off. Only the ones that trigger on a single
   overtone are listed — the rest have no honest "fits your deck" answer. */
const LENS_TAG = {
  pyro:"HEA", zoo:"ANI", doom:"DAN", meta:"ABS", carn:"ANI", hydro:"WET",
  chron:"TIM", night:"DAR", prosp:"MON", phren:"MIN", sesq:null, brut:null
};
function deckCount(tag){
  return G.deck.concat(G.discard, G.hand).filter(function(c){
    return c.t.indexOf(tag) >= 0;
  }).length;
}

function rollOffers(){
  const owned = G.lenses.map(function(l){ return l.id; });
  const avail = LENSES.filter(function(l){ return owned.indexOf(l.id)===-1; });
  shuffle(avail);
  const offers = avail.slice(0,2).map(function(l){ return { kind:"lens", lens:l, cost:l.cost }; });
  offers.push({ kind:"words", cost:3 });
  return offers;
}

function openShop(reward){
  if(!G.offers) G.offers = rollOffers();
  const nextDemand = G.demandOrder[G.round];
  const html = ''
    + '<h2>The Bookseller</h2>'
    + '<div class="sub">Round ' + G.round + ' cleared · earned $' + reward + '</div>'
    + (coachDone() ? '' : '<p class="gold"><b>Lenses are the engine.</b> Buy one — from here the targets climb faster than any deck can add.</p>')
    + '<p>Next is <b>' + nextDemand.n + '</b>, which pays for '
    + nextDemand.tags.map(function(t){ return '<b>'+TAGS[t][0]+'</b>'; }).join(" and ")
    + '. Target <b>' + TARGETS[G.round].toLocaleString() + '</b>.</p>'
    /* The exponential is the whole reason to shop, and it is invisible from
       inside a single round. Say it out loud, in numbers. */
    + '<p class="stakes">Round ' + ROUNDS + ' asks for <b>'
    + TARGETS[ROUNDS-1].toLocaleString() + '</b> &mdash; <b>'
    + Math.round(TARGETS[ROUNDS-1] / TARGETS[G.round]) + '\u00d7</b> this one.<br>'

    + '</div>';
  showPanel(html);

  const box = document.getElementById("offers");

      const fit = (lt && n >= 5)
        ? '<div class="fit">Fits your deck &mdash; ' + n + ' ' + TAGS[lt][0] + ' words</div>'

                  + fit
                  + '<div class="oc">' + (o.bought ? "acquired" : "$" + o.cost) + '</div>';
    } else {
      b.innerHTML = '<div class="on">TWO NEW WORDS</div><div class="od">Add two fresh words from the lexicon to your deck, permanently.</div>'
                  + '<div class="oc">' + (o.bought ? "acquired" : "$" + o.cost) + '</div>';
    }
    b.onclick = function(){ buy(idx, reward); };
    box.appendChild(b);
  });

  document.getElementById("rerollBtn").disabled = G.bank < 1;
  document.getElementById("rerollBtn").onclick = function(){
    if(G.bank < 1) return;
    G.bank -= 1; G.offers = rollOffers(); tone(320,.08,"square",.05); openShop(reward);
  };
  document.getElementById("leaveShop").onclick = function(){
    G.offers = null; coachFinish(); hidePanel(); startRound();
  };
}

function buy(idx, reward){
  const o = G.offers[idx];
  if(o.bought || G.bank < o.cost) return;
  if(o.kind === "lens"){
    if(G.lenses.length >= LENS_SLOTS) return;
    G.lenses.push(o.lens);
    G.shopSeen.push(o.lens.id);
  } else {
    const owned = G.deck.concat(G.discard, G.hand).map(function(c){ return c.w; });
    const fresh = LEXICON.filter(function(e){ return owned.indexOf(e.w)===-1; });
    shuffle(fresh);
    G.deck.push(makeCard(fresh[0] || pick(LEXICON), false));
    G.deck.push(makeCard(fresh[1] || pick(LEXICON), false));
    shuffle(G.deck);
  }
  G.bank -= o.cost;
  o.bought = true;
  tone(520,.1,"triangle",.07); setTimeout(function(){ tone(780,.16,"triangle",.06); }, 80);
  openShop(reward);
}

/* The house appraiser: used when live appraisal is unavailable or declined.
   Deliberately simple and readable — morphology plus a small sense-map. */
const SENSE = [
  [/fire|burn|flame|blaze|scorch|ember|solar|lava|heat|boil|steam|volcan|thermo|forge/, "HEA"],
  [/ice|frost|snow|chill|cold|arctic|winter|glaci|freeze|cryo|polar/, "COL"],
  [/water|rain|sea|ocean|river|wave|flood|tide|liquid|wet|aqua|hydro|marine|lake|mist/, "WET"],
  [/run|fly|rush|jump|spin|flow|drift|race|swift|dash|surge|orbit|travel|migrat|velo|motor/, "MOT"],
  [/kill|death|die|poison|toxic|war|blade|knife|gun|bomb|danger|threat|venom|crash|wound|risk|fear/, "DAN"],
  [/loud|noise|scream|shout|thunder|roar|bang|siren|drum|song|music|echo|sonic|voice|bell/, "LOU"],
  [/light|bright|glow|shine|star|sun|lamp|flash|gleam|neon|dawn|gold|laser|beam/, "BRI"],
  [/dark|night|shadow|black|gloom|void|abyss|crypt|grave|murk|dusk/, "DAR"],
  [/dog|cat|bird|fish|wolf|bear|horse|beast|animal|creature|insect|snake|whale|lion|shark|worm|bug|hound|fox|owl|rat/, "ANI"],
  [/tree|flower|leaf|plant|grass|root|seed|forest|moss|vine|herb|bloom|fern|weed/, "PLA"],
  [/mountain|earth|stone|rock|storm|sky|wind|cloud|desert|valley|nature|soil|canyon|island|cave/, "NAT"],
  [/hand|eye|heart|bone|blood|skin|brain|body|lung|flesh|nerve|muscle|tooth|limb|finger/, "BOD"],
  [/eat|food|bread|meat|fruit|sweet|taste|cook|meal|soup|spice|drink|sugar|salt|feast/, "FOO"],
  [/tool|hammer|blade|wheel|lever|machine|device|key|rope|nail|saw|drill|engine/, "TOO"],
  [/comput|digital|data|robot|cyber|electr|circuit|code|network|silicon|pixel|server|algorith|neural|quantum/, "TEC"],
  [/money|gold|coin|cash|price|debt|bank|trade|wealth|cost|market|wage|tax|profit/, "MON"],
  [/think|mind|dream|memory|idea|thought|know|belief|feel|emotion|soul|logic|reason|fear|hope|doubt/, "MIN"],
  [/time|year|day|hour|old|ancient|future|past|clock|age|era|history|moment|decade|eternal/, "TIM"]
];
function houseAppraise(word){
  const w = word.toLowerCase();
  const tags = [];
  for(let i=0;i<SENSE.length;i++){
    if(SENSE[i][0].test(w) && tags.indexOf(SENSE[i][1])===-1) tags.push(SENSE[i][1]);
  }
  if(/(ness|ity|ism|tion|sion|ance|ence|ship|hood|ing|acy)$/.test(w)){
    if(tags.indexOf("ABS")===-1) tags.push("ABS");
    if(tags.indexOf("MIN")===-1 && tags.length<3) tags.push("MIN");
  }
  if(tags.length === 0){
    const r = mulberry32(hashStr(w));
    const pool = TAG_KEYS.filter(function(t){ return t!=="ABS"; });
    const n = 2 + Math.floor(r()*2);
    while(tags.length < n){
      const t = pool[Math.floor(r()*pool.length)];
      if(tags.indexOf(t)===-1) tags.push(t);
    }
  }
  return { tags: tags.slice(0,4), note: "No entry on file. Appraised from its shape and its company." };
}

async function runAppraisal(){
  const input = document.getElementById("interpInput");
  const go = document.getElementById("interpGo");
  const out = document.getElementById("appraisal");
  const raw = (input.value || "").trim().replace(/[^A-Za-z' -]/g, "");
  if(raw.length < 2){ out.innerHTML = '<div class="say">Two letters or more, please.</div>'; return; }
  const word = raw.toUpperCase().slice(0,20);

  go.disabled = true; input.disabled = true;
  out.innerHTML = '<div class="say">Consulting…</div>';

  let tags = null, note = "", src = "";
  if(sampleFn){
    try{
      const prompt =
        'You are the appraiser in a word game. Assign semantic overtones to a word.\n' +
        'Valid overtones: ' + TAG_KEYS.map(function(k){ return TAGS[k][0]; }).join(", ") + '.\n' +
        'ABSTRACT is only for words with no physical referent.\n' +
        'Choose 2 to 4 that genuinely fit. Also write one dry, appraiser-ish sentence about the word (max 18 words).\n' +
        'Reply with ONLY JSON: {"tags":["..."],"note":"..."}\n' +
        'Word: ' + word;
      const data = await sampleFn.json(prompt, { modelTier:"quick", cache:true });
      if(data && Array.isArray(data.tags)){
        const mapped = data.tags
          .map(function(t){ return TAG_BY_NAME[String(t).toUpperCase().trim()]; })
          .filter(function(t){ return !!t; });
        const uniq = [];
        mapped.forEach(function(t){ if(uniq.indexOf(t)===-1) uniq.push(t); });
        if(uniq.length){
          tags = uniq.slice(0,4);
          note = String(data.note || "").slice(0,140);
          src = "Appraised live by Claude";
        }
      }
    }catch(e){ /* not_granted, rate_limited, offline — fall through to the house */ }
  }
  if(!tags){
    const h = houseAppraise(word);
    tags = h.tags; note = note || h.note;
    src = "House appraisal · no live valuer available";
  }

  const card = makeCard({ w: word, t: tags }, true);
  G.interpreterUsed = true;
  G.interpretedWord = { w: word, t: tags };
  G.deck.push(card);
  shuffle(G.deck);

  out.innerHTML = '';
  out.appendChild(cardEl(card, true));
  const say = document.createElement("div");
  say.className = "say";
  say.innerHTML = escapeHtml(note) + '<span class="src">' + escapeHtml(src) + '</span>';
  out.appendChild(say);

  tone(440,.12,"triangle",.08);
  setTimeout(function(){ tone(660,.12,"triangle",.07); }, 100);
  setTimeout(function(){ tone(880,.26,"triangle",.07); }, 210);

  go.textContent = "Into the deck →";
  go.disabled = false;
  go.onclick = function(){ hidePanel(); render(); toast(word + " is in your deck."); };
}

/* ---------- run end ---------- */
function endRun(won){
  G.over = true;
  const runs = store.get("runs", 0) + 1;
  store.set("runs", runs);
  const bestEver = store.get("best", 0);
  const isRecord = G.total > bestEver;
  if(isRecord) store.set("best", G.total);

  /* Memory unlock: carry one lens you actually used into the next run. */
  let unlocked = null;
  const prev = store.get("memory", null);
  const candidates = G.lenses.map(function(l){ return l.id; });
  if(candidates.length){
    const choice = candidates[hashStr(G.seed+runs) % candidates.length];
    if(choice !== prev){
      store.set("memory", choice);
      unlocked = LENSES.find(function(l){ return l.id===choice; });
    }
  }

  const share = shareText(won);
  const html = ''
    + '<h2>' + (won ? "The desk is cleared." : "The run ends at " + G.demand.n + ".") + '</h2>'
    + '<div class="sub">' + (G.isDaily ? "Daily " + G.seed : "Seed " + G.seed) + ' · run #' + runs + '</div>'
    + '<div class="stat-row">'
    +   '<div class="stat gold"><div class="k">Total</div><div class="v">' + G.total.toLocaleString() + '</div></div>'
    +   '<div class="stat"><div class="k">Reached</div><div class="v">' + Math.min(G.round+1, ROUNDS) + ' / ' + ROUNDS + '</div></div>'
    +   '<div class="stat"><div class="k">Best mult</div><div class="v">×' + (G.best.mult||1) + '</div></div>'
    + '</div>'
    + (isRecord ? '<p style="color:var(--gold)"><b>A personal best.</b></p>' : '')
    + (unlocked ? '<div class="unlock"><div class="k">Memory — carried into your next run</div><div class="v">'
        + unlocked.n + '</div><div class="d">' + unlocked.d + '</div></div>' : '')
    + '<div class="share" id="shareBox">' + escapeHtml(share) + '</div>'
    + '<div class="rowend">'
    +   '<button class="btn" id="copyShare" type="button">Copy result</button>'
    +   '<button class="btn" id="againSeed" type="button">Same seed again</button>'
    +   '<button class="btn primary" id="againNew" type="button">New run →</button>'
    + '</div>';
  showPanel(html);

  document.getElementById("copyShare").onclick = function(){
    try{
      navigator.clipboard.writeText(share);
      toast("Copied.");
    }catch(e){ toast("Select the text above to copy."); }
  };
  document.getElementById("againSeed").onclick = function(){ hidePanel(); newRun(G.seed); };
  document.getElementById("againNew").onclick = function(){ hidePanel(); newRun("free-" + Math.random().toString(36).slice(2,8)); };

  tone(won?520:180, .3, won?"triangle":"sawtooth", .09);
  if(won) setTimeout(function(){ tone(784,.5,"triangle",.09); }, 180);
}

function shareText(won){
  const lines = [];
  lines.push("OVERTONE — " + (G.isDaily ? "Daily " + G.seed : "seed " + G.seed));
  lines.push((won ? "Cleared all " + ROUNDS + " Demands" : "Fell at " + G.demand.n + " (" + (G.round+1) + "/" + ROUNDS + ")")
             + "  ·  " + G.total.toLocaleString() + " pts");
  if(G.best.word) lines.push("Best play: " + G.best.word + "  ×" + G.best.mult + "  (" + G.best.score.toLocaleString() + ")");
  if(G.interpretedWord){
    lines.push("My word: " + G.interpretedWord.w + " — "
      + G.interpretedWord.t.map(function(t){ return TAGS[t][0]; }).join("·"));
  }

}

/* ---------- card faces: overtone icons ----------
   Each card shows the icons for its own overtones on a plate tinted by the
   first of them. Nineteen icons instead of 249 pictures: perfectly consistent,
   nothing to load per card, and it teaches the tag system rather than
   competing with it — a player learns the flame means HEAT in one round.
   Icons are Google Material Symbols (the one icon set the artifact CSP will
   serve, since it comes from fonts.googleapis.com).                         */

const ICONS = {
  ANI:"pets",       PLA:"psychiatry",  NAT:"landscape",  BOD:"ecg_heart",
  FOO:"restaurant", TOO:"handyman",    TEC:"memory",     MON:"paid",
  HEA:"local_fire_department",         COL:"ac_unit",    WET:"water_drop",
  MOT:"speed",      DAN:"warning",     LOU:"volume_up",  BRI:"light_mode",
  DAR:"dark_mode",  MIN:"psychology",  TIM:"schedule",   ABS:"blur_on"
};

/* One flat colour per overtone, drawn from the same arcade set. */
const TAG_COLOR = {
  ANI:"#AB5236", PLA:"#00E436", NAT:"#008751", BOD:"#C2506E",
  FOO:"#E07A3C", TOO:"#7C7469", TEC:"#29ADFF", MON:"#E8C020",
  HEA:"#FF004D", COL:"#6FD8F5", WET:"#1D6FB8", MOT:"#FFA300",
  DAN:"#7E2553", LOU:"#FF77A8", BRI:"#FFEC27", DAR:"#262B44",
  MIN:"#83769C", TIM:"#8B93A8", ABS:"#5F574F"
};

/* Half these plates are bright, and white icons vanish on them. */
function isLightHex(hex){
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150;
};

/* The icon font either arrives or it doesn't. Until it's confirmed the glyphs
   stay invisible rather than showing their ligature text, and the tinted plate
   carries the card on its own. */
function initIcons(){
  const root = document.documentElement;
  try{
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){
        if(document.fonts.check('20px "Material Symbols Rounded"')) root.classList.add("ms-ok");
      });
      /* Don't let a slow font hide the icons for ever. */
      setTimeout(function(){ root.classList.add("ms-ok"); }, 2500);
    } else {
      root.classList.add("ms-ok");
    }
  }catch(e){ root.classList.add("ms-ok"); }
}

/* Which overtone tints the plate. Ordered by how distinctive the colour is,
   not by the card's tag order — NATURE and TIME sit on so many words that
   leading with them turned half the hand the same green. */
const LEAD_ORDER = ["HEA","MON","DAN","COL","LOU","MIN","TEC","BOD","FOO",
                    "BRI","DAR","WET","ANI","TOO","PLA","MOT","NAT","TIM","ABS"];

function artNode(card){
  const tags = card.t.length ? card.t : ["ABS"];
  let lead = null;
  for(let i=0;i<LEAD_ORDER.length && !lead;i++){
    if(tags.indexOf(LEAD_ORDER[i]) >= 0) lead = LEAD_ORDER[i];
  }
  if(!lead) lead = tags[0];
  const col = TAG_COLOR[lead] || TAG_COLOR.ABS;

  const d = document.createElement("div");
  d.className = "art" + (isLightHex(col) ? " light" : "");
  d.style.background = col;

  const row = document.createElement("div");
  row.className = "icons";
  tags.slice(0, 3).forEach(function(t){
    const s = document.createElement("span");
    const hit = G && G.demand && G.demand.tags.indexOf(t) >= 0;
    s.className = "ms" + (hit ? " hit" : "");
    s.textContent = ICONS[t] || "blur_on";
    s.setAttribute("aria-hidden", "true");
    s.title = TAGS[t] ? TAGS[t][0] : "";
    row.appendChild(s);
  });
  d.appendChild(row);
  return d;
}

/* A standalone icon, for the tag legend in the help card. */
function iconSpan(tag){
  return '<span class="ms" aria-hidden="true">' + (ICONS[tag] || "blur_on") + '</span>';
}

/* ---------- atmosphere and juice ---------- */

/* Cards already seen in hand, so a re-render does not re-deal them. */
const SEEN = {};

const REDUCED = (function(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(e){ return false; }
})();

/* A shower of sparks from the middle of the stage. */
function burst(host, n){
  if(REDUCED || !host) return;
  n = n || 18;
  for(let i=0;i<n;i++){
    const el = document.createElement("i");
    el.className = "spark";
    const r = Math.random();
    if(r < 0.33) el.style.background = "var(--chips)";
    else if(r < 0.66) el.style.background = "var(--mult)";
    host.appendChild(el);
    const ang = Math.random()*Math.PI*2;
    const dist = 60 + Math.random()*170;
    try{
      el.animate([
        { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
        { transform: "translate(-50%,-50%) translate(" + (Math.cos(ang)*dist).toFixed(0)
          + "px," + (Math.sin(ang)*dist + 70).toFixed(0) + "px) scale(0)", opacity: 0 }
      ], { duration: 700 + Math.random()*520, easing: "cubic-bezier(.2,.7,.3,1)" });
    }catch(e){}
    setTimeout(function(){ try{ el.remove(); }catch(e){} }, 1300);
  }
}

/* Tween a counter instead of snapping it. Kept well under the gap between
   scoring events so the numbers never lag the sound. */
const COUNT = {};
function countTo(el, to, key){
  const from = COUNT[key] === undefined ? to : COUNT[key];
  COUNT[key] = to;
  if(REDUCED || from === to){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 110;
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    const v = from + (to - from) * (1 - Math.pow(1 - k, 3));
    el.textContent = (Math.abs(to - Math.round(v)) < 0.05) ? to : Math.round(v);
    if(k < 1) requestAnimationFrame(step);
    else el.textContent = to;
  })(t0);
}

/* ---------- rendering ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function cardEl(c, staticCard){
  const el = document.createElement("div");
  el.className = "card" + (staticCard ? " static" : "") + (c.interpreted ? " interpreted" : "");
  el.setAttribute("role", staticCard ? "img" : "button");
  el.setAttribute("aria-label", c.w + ", " + c.t.map(function(t){ return TAGS[t][0]; }).join(", "));
  if(!staticCard) el.tabIndex = 0;

  const art = artNode(c);

  const base = document.createElement("div");
  base.className = "base"; base.textContent = c.base;

  const w = document.createElement("div");
  w.className = "w"; w.textContent = c.w;

  const tags = document.createElement("div");
  tags.className = "tags";
  c.t.forEach(function(t){
    const s = document.createElement("span");
    const match = G && G.demand && G.demand.tags.indexOf(t) >= 0;
    s.className = "tg" + (match ? " match" : "");
    s.textContent = TAGS[t][0];
    tags.appendChild(s);
  });

  const inner = document.createElement("div");
  inner.className = "card-inner";
  inner.appendChild(art); inner.appendChild(w); inner.appendChild(tags);
  el.appendChild(base); el.appendChild(inner);

  /* A card that can score at all should read as live before anything is
     read. This sorts the hand into useful / not useful at a glance without
     touching the actual decision, which is WHICH three and in what order. */
  if(!staticCard && G && G.demand){
    const live = c.t.some(function(t){ return G.demand.tags.indexOf(t) >= 0; });
    if(live) el.classList.add("live");
  }

  if(!staticCard){
    const pos = G.selected.indexOf(c.id);
    if(pos >= 0){
      const p = document.createElement("div");
      p.className = "pos";
      p.textContent = pos + 1;
      el.appendChild(p);
    }
    if(pos >= 0) el.classList.add("sel");
    const toggle = function(){ toggleSel(c.id); };
    el.onclick = toggle;
    el.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
  }
  return el;
}

function toggleSel(id){
  if(G.animating) return;
  const i = G.selected.indexOf(id);
  if(i >= 0){ G.selected.splice(i,1); tone(240,.06,"sine",.04); }
  else{
    if(G.selected.length >= MAX_PLAY){ toast("Three words at a time."); return; }
    G.selected.push(id); tone(420 + G.selected.length*90, .07, "sine", .05);
  }
  if(G.coachStep === "pick" && G.selected.length) G.coachStep = "play";
  else if(G.coachStep === "play" && !G.selected.length) G.coachStep = "pick";
  renderHand(); renderControls(); renderPreview();
  /* coachSet lives in render(), which this path deliberately skips — without
     this the coach never leaves step one and the Play prompt never appears. */
  coachSet(G.coachStep);
}

/* ---------- first-run coaching ----------
   A modal explains the game to someone who hasn't seen it yet, which is the
   worst possible moment. This instead says one short thing at a time, on the
   board, while they're doing the thing. It runs once, during round 1.      */
/* The stage itself now states the +25 rule, so this carries the one players
   actually miss: order is a decision. */
const IDLE_HINT = "Tap up to 3 words — they score left to right.";
const COACH = {
  pick:  "Gold tags match the Demand. Tap two or three words that have one.",
  play:  "Now press PLAY — the stage shows what you'd score before you commit.",
  score: "That's Chips × Mult. Gold tags add chips; Lenses multiply them."
};
function coachDone(){ return store.get("coached", false); }
function coachFinish(){ store.set("coached", true); if(G) G.coachStep = null; coachSet(null); }
function coachSet(step){
  const el = document.getElementById("coach");
  const btn = document.getElementById("playBtn");
  if(!el) return;
  if(btn) btn.classList.remove("hint-pulse");
  if(!step || coachDone() || !COACH[step]){ el.hidden = true; return; }
  el.textContent = COACH[step];
  el.hidden = false;
  if(step === "play" && btn) btn.classList.add("hint-pulse");
}

/* Named like a poker hand, so the player learns to aim for a shape rather
   than squint at tags. */
const RESO_NAMES = ["NO RESONANCE","RESONANCE","DOUBLE RESONANCE","TRIPLE RESONANCE",
                    "QUADRUPLE RESONANCE","OVERTONE CASCADE"];
function resonanceName(n){ return RESO_NAMES[Math.min(n, RESO_NAMES.length - 1)]; }

function renderPreview(){
  const hint = document.getElementById("stageHint");
  const sc = document.getElementById("stageCards");

  if(G.selected.length === 0){
    sc.innerHTML = "";
    const call = document.createElement("div");
    call.className = "demand-call";
    const icons = document.createElement("div");
    icons.className = "dc-icons";
    G.demand.tags.forEach(function(t){
      const s = document.createElement("span");
      s.className = "ms";
      s.setAttribute("aria-hidden", "true");
      s.textContent = ICONS[t] || "blur_on";
      icons.appendChild(s);
    });
    const txt = document.createElement("div");
    txt.className = "dc-text";
    txt.innerHTML = G.demand.tags.map(function(t){ return "<b>" + TAGS[t][0] + "</b>"; }).join(" and ")
      + ' &mdash; <b>+25 chips</b> for each one you play';
    call.appendChild(icons);
    call.appendChild(txt);
    sc.appendChild(call);
    setTally(0, 1);
    hint.textContent = IDLE_HINT;
    return;
  }

  const cards = G.selected.map(function(id){ return G.hand.find(function(c){ return c.id===id; }); });
  const res = resolve(cards);
  sc.innerHTML = "";
  cards.forEach(function(c, i){
    const el = cardEl(c, true);
    const p = document.createElement("div");
    p.className = "pos";
    p.textContent = i + 1;
    el.appendChild(p);
    sc.appendChild(el);
  });
  setTally(res.chips, res.mult);

  const hits = cards.reduce(function(s, c){
    return s + c.t.filter(function(t){ return G.demand.tags.indexOf(t) >= 0; }).length;
  }, 0);
  hint.innerHTML = '<span class="hand-name">' + resonanceName(hits) + '</span><br>Would score '
    + res.total.toLocaleString() + '  ·  resolves left to right, so the order matters';
}

function renderDemand(){
  document.getElementById("roundLabel").textContent = "Round " + (G.round+1) + " of " + ROUNDS;
  document.getElementById("demandName").textContent = G.demand.n;
  const w = document.getElementById("demandWants");
  w.innerHTML = "";
  const lead = document.createElement("span");
  lead.style.cssText = "font-size:11px;letter-spacing:.08em;color:var(--text-faint);align-self:center;margin-right:1px";
  lead.textContent = "PAYS FOR";
  w.appendChild(lead);
  G.demand.tags.forEach(function(t){
    const s = document.createElement("span");
    s.className = "w"; s.textContent = TAGS[t][0];
    w.appendChild(s);
  });
  document.getElementById("roundScore").textContent = G.roundScore.toLocaleString();
  document.getElementById("roundTarget").textContent = G.target.toLocaleString();
  const pct = Math.min(100, (G.roundScore / G.target) * 100);
  const pr = document.getElementById("progress");
  pr.querySelector("i").style.width = pct + "%";
  pr.classList.toggle("met", G.roundScore >= G.target);
}

function renderRail(){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  document.getElementById("lensCount").textContent = G.lenses.length + "/" + LENS_SLOTS;
  if(G.lenses.length === 0){
    const e = document.createElement("div");
    e.className = "rail-empty";
    e.textContent = "NO LENSES — clear this Demand and the Bookseller will sell you one.";
    rail.appendChild(e);
    return;
  }
  G.lenses.forEach(function(l){
    const d = document.createElement("div");
    d.className = "lens";
    d.title = l.d;
    d.innerHTML = '<div class="n">' + escapeHtml(l.n) + '</div><div class="d">' + escapeHtml(l.d) + '</div>';
    rail.appendChild(d);
  });
}

function renderHand(){
  const h = document.getElementById("hand");
  h.innerHTML = "";
  /* Fan the hand: cards tilt away from centre and dip at the edges, so the
     hand reads as held cards rather than a row of buttons. */
  const n = G.hand.length, mid = (n - 1) / 2;
  /* A fan needs width. On a phone the hand wraps to two rows, where tilted
     cards just collide — so lay them flat there. */
  const fan = window.innerWidth > 620;
  let dealt = 0;
  G.hand.forEach(function(c, i){
    const el = cardEl(c, false);
    const off = i - mid;
    el.style.setProperty("--rot", fan ? (off * 2.2).toFixed(2) + "deg" : "0deg");
    el.style.setProperty("--dy", fan ? (Math.pow(Math.abs(off), 1.7) * 2.6).toFixed(1) + "px" : "0px");
    el.style.setProperty("--i", i);
    /* Only newly drawn cards deal in. renderHand runs on every click, and
       re-dealing the whole hand each time would be unbearable. */
    if(!SEEN[c.id]){
      SEEN[c.id] = 1;
      el.classList.add("deal");
      el.style.setProperty("--i", dealt++);
    }
    h.appendChild(el);
  });
}

function renderControls(){
  document.getElementById("playsLeft").textContent = G.plays;
  document.getElementById("discardsLeft").textContent = G.discards;
  const pips = document.getElementById("playPips");
  pips.innerHTML = "";
  for(let i=0;i<4;i++){
    const s = document.createElement("span");
    s.className = "pip" + (i < G.plays ? "" : " off");
    pips.appendChild(s);
  }
  document.getElementById("playBtn").disabled = G.animating || G.selected.length===0 || G.plays<=0;
  document.getElementById("discardBtn").disabled = G.animating || G.selected.length===0 || G.discards<=0;
  document.getElementById("interpBtn").disabled = G.animating || G.interpreterUsed;
  document.getElementById("interpBtn").textContent = G.interpreterUsed ? "◆ Interpreted" : "◆ Interpret";
  document.getElementById("bankLabel").textContent = "$" + G.bank;
  document.getElementById("seedLabel").textContent = (G.isDaily ? "DAILY " : "SEED ") + G.seed.toUpperCase();
}

function render(){
  renderDemand(); renderRail(); renderHand(); renderControls(); renderPreview();
  coachSet(G.coachStep);
}

/* ---------- panels ---------- */
function showPanel(html){
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").hidden = false;
}
function hidePanel(){ document.getElementById("veil").hidden = true; }

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 1900);
}

function showHelp(){
  /* A worked example beats a rule list: the same card the player is about to
     see, with the arithmetic spelled out on it. */
  const ex = { w:"FURNACE", t:["HEA","TOO","DAN"], base: 5 + 3*7, interpreted:false };
  const exTags = ex.t.map(function(t){
    return '<span class="tg' + (t === "HEA" ? " match" : "") + '">' + TAGS[t][0] + '</span>';
  }).join("");
  const withLens = ex.base + 25 + 45;
  const exCol = TAG_COLOR[ex.t[0]];
  const exLight = isLightHex(exCol) ? " light" : "";
  const exArt = '<div class="art' + exLight + '" style="background:' + exCol + '">'
    + '<div class="icons">' + ex.t.slice(0,3).map(function(t){
        return '<span class="ms' + (t === "HEA" ? " hit" : "") + '" aria-hidden="true">' + ICONS[t] + '</span>';
      }).join("") + '</div></div>';
  const legend = TAG_KEYS.map(function(t){
    return '<span class="leg">' + iconSpan(t) + TAGS[t][0] + '</span>';
  }).join("");

  showPanel(''
    + '<h2>How Overtone works</h2>'
    + '<div class="sub">Three things, then you are fine</div>'

    + '<div class="teach">'
    +   '<div class="teach-row"><div class="teach-n">1</div>'
    +     '<p><b>Match the Demand.</b> Each round pays for certain overtones — the small tags '
    +     'along the bottom of every word. Tags that match light up <b class="gold">gold</b>, '
    +     'and each gold tag pays <b>+25 chips</b>.</p></div>'
    +   '<div class="teach-row"><div class="teach-n">2</div>'
    +     '<p><b>You score Chips × Mult.</b> Play up to three words. They resolve '
    +     '<b>left to right</b>, so the order you tap them in is part of the puzzle.</p></div>'
    +   '<div class="teach-row"><div class="teach-n">3</div>'
    +     '<p><b>Lenses rewrite the rules.</b> Clear a round and the Bookseller sells you one. '
    +     'They are the engine — later targets grow faster than any deck can add.</p></div>'
    + '</div>'

    + '<div class="worked">'
    +   '<div class="card static">'
    +     '<div class="base">' + ex.base + '</div><div class="card-inner">'
    +     exArt
    +     '<div class="w">' + ex.w + '</div>'
    +     '<div class="tags">' + exTags + '</div></div>'
    +   '</div>'
    +   '<div class="worked-sum">'
    +     'Say the Demand pays for <b>HEAT</b>.<br>'
    +     'FURNACE is worth <b>' + ex.base + '</b> by itself, and its gold HEAT tag adds <b>+25</b>.<br>'
    +     'Equip <b>PYROMANIAC</b> (+45 on every HEAT word) and it is '
    +     '<b>' + withLens + ' chips</b>.'
    +     '<span class="worked-tot">' + withLens + ' × 1 = ' + withLens + '</span>'
    +   '</div>'
    + '</div>'

    + '<div class="sub" style="margin:0 0 7px">The nineteen overtones</div>'
    + '<div class="legend">' + legend + '</div>'
    + '<p style="font-size:13px"><span class="kbd">1</span>–<span class="kbd">7</span> pick &middot; '
    + '<span class="kbd">Enter</span> play &middot; <span class="kbd">D</span> discard &middot; '
    + '<span class="kbd">Space</span> hurry the scoring &middot; <span class="kbd">Esc</span> close</p>'
    + '<div class="rowend"><span></span>'
    + '<button class="btn primary" id="closeHelp" type="button">Play</button></div>');
  document.getElementById("closeHelp").onclick = hidePanel;
}

/* ---------- input ---------- */
document.getElementById("playBtn").onclick = play;
document.getElementById("discardBtn").onclick = discardSel;
document.getElementById("interpBtn").onclick = openInterpreter;
document.getElementById("helpBtn").onclick = showHelp;
document.getElementById("newRunBtn").onclick = function(){
  hidePanel(); newRun("free-" + Math.random().toString(36).slice(2,8));
};
document.getElementById("stage").onclick = function(){ if(G && G.animating) skipAnim = true; };

/* Re-lay the hand when the screen changes shape (rotation, resize). */
let resizeT = null;
window.addEventListener("resize", function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){ if(G && !G.animating) renderHand(); }, 160);
});

document.addEventListener("keydown", function(e){
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(e.key === "Escape"){ hidePanel(); return; }
  if(!document.getElementById("veil").hidden) return;
  if(e.key === " "){ if(G && G.animating){ e.preventDefault(); skipAnim = true; } return; }
  if(G && G.animating) return;
  if(e.key >= "1" && e.key <= "7"){
    const c = G.hand[parseInt(e.key,10) - 1];
    if(c) toggleSel(c.id);
  } else if(e.key === "Enter"){ play(); }
  else if(e.key === "d" || e.key === "D"){ discardSel(); }
});

/* ---------- boot ---------- */
function start(restored){
  initIcons();
  newRun(null);
  if(!store.get("seenHelp", false)){
    store.set("seenHelp", true);
    showHelp();
  }
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return {}; });
    window.claude.hot.ready ? window.claude.hot.ready(start) : start({});
  } else { start({}); }
}catch(e){ start({}); }
</script>
