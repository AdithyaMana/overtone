<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overtone</title>
<meta name="description" content="A word roguelite where meaning is the physics. Play words into an escalating scoring engine and warp the rules with Lenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Russo+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0&display=swap">
<style>
/* ============================================================
   OVERTONE

   Four rules, held everywhere. Breaking them is what made the last
   pass read as generated:
     1. Flat fills. No gradients on any surface.
     2. Hard shadows only — 0 blur. Every panel sits on a solid lip.
     3. One typeface, one family of sizes.
     4. Colour is information: blue = chips, red = mult, gold = money.
        Nothing else gets to be loud.
   ============================================================ */
:root{
  color-scheme: dark;

  --bg:        #0E161C;   /* the room */
  --felt:      #1C2B35;   /* the table cards are played on */
  --felt-d:    #131E26;
  --panel:     #2C4150;
  --panel-2:   #3A5568;
  --inset:     #16222A;
  --edge:      #0A1116;   /* the lip under everything */

  /* the signature trio */
  --chips:     #0093FF;
  --chips-d:   #005FA8;
  --mult:      #FE5F55;
  --mult-d:    #B8352C;
  --gold:      #EFA31D;
  --gold-d:    #A76E08;
  --blind:     #C8443A;
  --blind-d:   #7E2620;

  --green:     #4BC292;
  --green-d:   #26795A;
  --lens:      #9B7BE0;
  --lens-d:    #5B3FA3;

  --card:      #F6F1E4;
  --card-edge: #BFB49A;
  --card-ink:  #1B1915;
  --card-dim:  #7B7361;

  --text:      #FFFFFF;
  --text-dim:  #A9BCC9;
  --text-faint:#70889A;

  /* The text face. Every number and every piece of large type is set in the
     display face, so this one only has to do the small print — and its job is
     to be narrow and legible. Three pixel faces were tried here first: two
     rendered 5 and 8 alike, and the third was so wide that English wrapped
     mid-phrase. Oxanium is a game-UI face with real weights. */
  --f: "Oxanium", "Segoe UI", system-ui, sans-serif;
  /* The display face. "ArcadeLocal" only resolves once a real arcade TTF has
     been embedded by tools/embed-font.js; Russo One stands in until then, so
     the page never waits on a file it does not have. */
  --f-display: "ArcadeLocal", "Russo One", Impact, var(--f);
  --drop: 2px 2px 0 rgba(0,0,0,.55);
  --drop-sm: 1px 1px 0 rgba(0,0,0,.55);
}

/* --- arcade-font-start --- */
/* --- arcade-font-end --- */

*{ box-sizing: border-box; font-synthesis: none; }
/* the text face has real weights; the display face has one and ignores this */
b, strong{ font-weight: 700; color: #FFF; }
html,body{ margin:0; padding:0; }
/* sparks and floats leave the stage now; they must never widen the document */
body{ overflow-x: clip; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
button{ font-family: inherit; color: inherit; }
:focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

.wordmark, .panel h2, .blind-badge, .blind-req .v, .roundscore .v,
.tally .chips, .tally .multv, .meter .v, .money, .stage-total, .card .w,
.card .base, .btn, .stage-hint .hand-name, .lensbar-head, .teach-n,
.offer .on, .offer .oc, .lens .n, .unlock .v, .purse, .worked-tot, .pos,
.blind-wants .w, .card .tg.match, .coach{
  font-family: var(--f-display);
}
/* Russo One runs wider than the text face, so the tightest strings get a
   little air taken back out of their tracking. */
.btn, .blind-badge, .stage-hint .hand-name{ letter-spacing: .02em; }

/* ---------- the opening tutorial ----------
   A spotlight over the real board rather than a modal read before the game
   has been seen. The overlay does not take pointer events — the player has to
   be able to tap the very cards it is pointing at. */
.tut{ position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.tut[hidden]{ display: none !important; }
.tut-hole{
  position: absolute; border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(6,12,16,.78);
  transition: left .26s cubic-bezier(.2,.9,.3,1), top .26s cubic-bezier(.2,.9,.3,1),
              width .26s cubic-bezier(.2,.9,.3,1), height .26s cubic-bezier(.2,.9,.3,1);
}
.tut-box{
  position: absolute; width: min(430px, calc(100vw - 20px));
  background: var(--panel); border-radius: 10px; padding: 16px 18px;
  box-shadow: 0 6px 0 var(--edge);
  pointer-events: auto;
}
.tut-step{
  font-size: 11px; letter-spacing: .12em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 7px;
  font-family: var(--f-display);
}
.tut-text{ font-size: 15px; line-height: 1.65; color: var(--text); }
.tut-text b{ color: var(--gold); }
.tut-text .do{
  display: block; margin-top: 10px; color: #FFF; font-weight: 700;
  background: var(--inset); border-radius: 6px; padding: 8px 11px;
  font-size: 14px;
}
.tut-dots{ display: flex; gap: 5px; flex: 1; justify-content: center; }
.tut-dots i{ width: 7px; height: 7px; border-radius: 50%; background: var(--inset); }
.tut-dots i.on{ background: var(--gold); }
.tut-dots i.done{ background: var(--gold-d); }
.tut-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; }

/* On a phone a floating card fights the thing it is pointing at for the same
   250 square pixels. Dock it instead — full width, top or bottom, whichever
   is further from the spotlight. */
@media (max-width: 700px){
  .tut-box{
    left: 8px !important; right: 8px !important; width: auto !important;
    top: auto !important;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
    transform: none !important;
    padding: 14px 15px;
  }
  .tut-box.dock-top{ top: 8px !important; bottom: auto !important; }
  .tut-text{ font-size: 14px; line-height: 1.55; }
  .tut-text .do{ font-size: 13.5px; padding: 7px 10px; margin-top: 8px; }
  .tut-next{ padding: 11px 18px; }
  .tut-skip{ padding: 11px 4px; }
}
.tut-skip{
  background: none; border: none; cursor: pointer; padding: 6px 2px;
  font-family: inherit; font-size: 12px; color: var(--text-faint);
  text-decoration: underline; text-underline-offset: 3px;
}
.tut-skip:hover{ color: var(--text-dim); }
.tut-next{ padding: 9px 20px; font-size: 13px; }
.tut-next[hidden]{ display: none !important; }

/* every raised surface is the same object: flat fill, solid lip */
.slab{
  background: var(--panel);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--edge);
}

#app{
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 14px;
  padding-block: 12px 18px;
  display: flex; flex-direction: column; gap: 12px;
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.wordmark{
  margin:0; font-size: 30px; font-weight: 700; letter-spacing: .05em;
  color: var(--card);
  text-shadow: 3px 3px 0 var(--mult);
}
.wordmark span{ color: var(--gold); }
.mast-actions{ display:flex; gap:8px; align-items:center; }
.chip-btn{
  background: var(--panel); border:none; border-radius: 7px; cursor:pointer;
  box-shadow: 0 3px 0 var(--edge);
  padding: 7px 13px; font-size: 13px; font-weight:600; color: var(--text-dim);
  text-shadow: var(--drop-sm);
}
.chip-btn:active{ transform: translateY(3px); box-shadow:none; }
.chip-btn.icon{ min-width: 38px; font-size: 15px; line-height: 1; padding: 7px 10px; }
.chip-btn.off{ color: var(--text-faint); opacity: .65; text-decoration: line-through; }
.chip-btn .short{ display: none; }

/* ---------- table ---------- */
.table{ display:grid; grid-template-columns: 232px 1fr; gap: 12px; align-items:stretch; flex:1; }
.sidebar{ display:flex; flex-direction:column; gap: 10px; }

.blind{ padding: 11px; text-align:center; }
.blind-badge{
  background: var(--blind);
  border-radius: 7px; padding: 10px 8px;
  font-size: 17px; font-weight:700; letter-spacing:.02em; line-height:1.15;
  color:#FFF; text-shadow: var(--drop);
  box-shadow: 0 3px 0 var(--blind-d);
  text-wrap: balance;
  animation: plaqueSlam .34s cubic-bezier(.2,1.5,.4,1);
}
@keyframes plaqueSlam{
  0%{ transform: scale(1.35); opacity:0; }
  60%{ transform: scale(.97); opacity:1; }
  100%{ transform: none; }
}
.blind-wants{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:11px; }
.blind-wants .w{
  background: var(--gold); color:#12181C; border-radius: 4px;
  padding: 3px 8px; font-size: 11px; font-weight:700; letter-spacing:.03em;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* An Ordeal is the round changing a rule rather than a number, so it gets the
   warning colour and sits directly under what the round wants — the two things
   a player has to hold in their head at once. */
.ordeal{
  margin-top: 10px; text-align: left;
  background: var(--blind); border-radius: 7px; padding: 7px 9px;
  box-shadow: 0 3px 0 var(--blind-d);
  animation: plaqueSlam .34s cubic-bezier(.2,1.5,.4,1) .12s backwards;
}
.ordeal[hidden]{ display: none !important; }
.ordeal .on{
  font-family: var(--f-display); font-size: 11.5px; color: #FFF;
  text-shadow: var(--drop-sm); letter-spacing: .03em;
}
.ordeal .od{ font-size: 11.5px; line-height: 1.4; color: #FFE2DE; margin-top: 3px; }

.blind-req{ margin-top: 13px; }
.blind-req .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.blind-req .v{
  font-size: 30px; font-weight:700; color: var(--mult);
  text-shadow: var(--drop); font-variant-numeric: tabular-nums; line-height:1.1;
}
.progress{
  margin-top: 9px; height: 8px; border-radius: 4px;
  background: var(--inset); overflow: hidden;
}
.progress > i{
  display:block; height:100%; width:0%;
  background: var(--green);
  transition: width .35s cubic-bezier(.2,.9,.3,1);
}

.roundscore{ padding: 9px 12px; text-align:center; }
.roundscore .k{ font-size: 12px; color: var(--text-dim); letter-spacing:.04em; }
.roundscore .v{
  font-size: 27px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop); line-height:1.15;
}

/* points x multiplier — the two numbers the whole game is about.
   They used to sit unlabelled, which asked a new player to infer from colour
   alone what the blue number and the red number were. */
.tally{
  display:grid; grid-template-columns: 1fr auto 1fr; align-items:end; gap:6px;
  background: var(--inset); border-radius: 8px; padding: 9px 8px;
  box-shadow: 0 4px 0 var(--edge);
}
.tally .chips, .tally .multv{
  border-radius: 6px; padding: 9px 4px; text-align:center;
  font-size: 25px; font-weight:700; font-variant-numeric: tabular-nums;
  text-shadow: var(--drop);
  overflow: hidden; text-overflow: ellipsis;
}
.tally .chips{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.tally .multv{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.tally .x{ font-size: 15px; font-weight:700; color: var(--text-faint); text-align:center; padding-bottom: 11px; }
.tcell{ min-width: 0; }
.tk{
  font-size: 9.5px; letter-spacing: .11em; color: var(--text-faint);
  text-align:center; margin-bottom: 4px; line-height:1;
}
/* a counter that is settling takes a hit, so the eye goes to the one that moved */
.tally .chips.roll, .tally .multv.roll{ animation: rollHit .19s cubic-bezier(.2,1.8,.4,1); }
@keyframes rollHit{
  0%{ transform: scale(1); }
  40%{ transform: scale(1.16) translateY(-2px); }
  100%{ transform: scale(1); }
}

.meters{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter{ padding: 8px 6px; text-align:center; }
.meter .k{ font-size: 11.5px; color: var(--text-dim); }
.meter .v{ font-size: 24px; font-weight:700; text-shadow: var(--drop); line-height:1.15; }
.meter.plays .v{ color: var(--chips); }
.meter.disc .v{ color: var(--mult); }

.money{
  padding: 9px; text-align:center;
  font-size: 25px; font-weight:700; color: var(--gold);
  text-shadow: var(--drop);
}
.runinfo{
  display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
  font-size: 11px; color: var(--text-faint); padding: 0 3px;
}

/* ---------- board ---------- */
.board{ display:flex; flex-direction:column; gap: 12px; min-width: 0; }

.lensbar{ padding: 9px 10px; }
.lensbar-head{
  display:flex; justify-content:space-between; align-items:center;
  font-size: 12px; letter-spacing:.1em; color: var(--text-dim); margin-bottom: 7px;
}
.lensbar-head b{ color: var(--lens); font-weight:700; font-size: 14px; }
.rail{ display:flex; gap:8px; flex-wrap:wrap; min-height: 54px; align-items:stretch; }
.lens{
  position:relative; border-radius: 7px; padding: 7px 9px;
  min-width: 118px; max-width: 168px; cursor: pointer;
  background: var(--lens);
  box-shadow: 0 3px 0 var(--lens-d);
  border: none; font-family: inherit; text-align: left;
  transition: max-width .18s cubic-bezier(.2,.9,.3,1);
}
.lens:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--lens-d); }
.lens .n{
  font-size: 12px; font-weight:700; color:#FFF; text-shadow: var(--drop-sm);
  white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
  padding-right: 13px;
}
.lens .d{ font-size: 11px; line-height:1.4; color:#2A1C46; margin-top:3px; }
.lens .lv{
  font-family: var(--f-display); font-size: 11px; margin-top: 5px;
  color: #2A1C46; background: var(--gold); border-radius: 4px;
  padding: 2px 6px; display: inline-block;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* a Lens that costs you something says so in its colour */
.lens.flaw{ background: var(--blind); box-shadow: 0 3px 0 var(--blind-d); }
.lens.flaw .d{ color: #FFE2DE; }
.lens.flaw .lv{ background: var(--card); box-shadow: 0 2px 0 var(--card-edge); }
/* a corner mark, so it reads as something you can open */
.lens::before{
  content: "+"; position: absolute; top: 5px; right: 7px;
  font-family: var(--f-display); font-size: 11px; line-height: 1;
  color: #FFF; opacity: .75;
}
.lens.open::before{ content: "\2212"; }   /* minus */
.lens.open{ max-width: none; }
.lens.open .d{
  -webkit-line-clamp: unset; display: block; overflow: visible;
}
.lens.fired{ animation: lensFire .5s cubic-bezier(.2,1.3,.3,1); }
.lens.fired::after{
  content:""; position:absolute; inset:0; border-radius:7px; z-index:1;
  background: var(--gold); animation: lensWash .5s steps(3) forwards;
  pointer-events:none;
}
@keyframes lensWash{ 0%{opacity:.75} 100%{opacity:0} }
@keyframes lensFire{
  0%{ transform: translateY(0) scale(1) rotate(0); }
  30%{ transform: translateY(-10px) scale(1.1) rotate(-3deg); }
  60%{ transform: translateY(0) scale(1.03) rotate(2deg); }
  100%{ transform: none; }
}
.rail-empty{ font-size: 12px; color: var(--text-faint); align-self:center; padding: 4px 2px; }

/* the green table */
.stage{
  flex:1; min-height: 212px; position:relative;
  background: var(--felt);
  border-radius: 8px;
  box-shadow: 0 4px 0 var(--felt-d), inset 0 0 0 3px rgba(0,0,0,.14);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 14px; padding: 16px;
  /* Floats rise above the cards they came from and the total is 52px tall;
     clipping them here is what cut the scoring popup in half. */
  overflow: visible;
}
.stage-cards{ display:flex; gap:10px; align-items:flex-end; justify-content:center; flex-wrap:wrap; }
.stage-hint{
  font-size: 15px; font-weight:600; letter-spacing:.03em; color: #C9D7E0;
  text-align:center; max-width: 56ch; text-shadow: var(--drop-sm);
}
.stage-hint b{ color: var(--gold); }
.stage-hint .ord{ display:inline-block; margin-top:5px; font-size:13px; color: var(--lens); }
.stage-hint .hand-name{
  display:inline-block; font-size: 17px; font-weight:700;
  background: var(--inset); color:#FFF;
  border-radius: 6px; padding: 6px 16px;
  box-shadow: 0 3px 0 var(--edge);
  margin-bottom: 8px; animation: nameIn .26s cubic-bezier(.2,1.5,.4,1);
}
@keyframes nameIn{ 0%{transform:scale(.72);opacity:0} 100%{transform:none;opacity:1} }
.stage-total{
  font-size: 52px; font-weight:700; color: var(--gold);
  text-shadow: 4px 4px 0 var(--edge);
  /* tabular figures, or a rolling counter jitters its own width every frame */
  font-variant-numeric: tabular-nums;
  animation: slam .34s cubic-bezier(.2,1.5,.4,1);
}
.stage-total.landed-total{ animation: totalLock .26s cubic-bezier(.2,1.9,.35,1); }
@keyframes totalLock{
  0%{ transform: scale(1.22); }
  55%{ transform: scale(.97); }
  100%{ transform: scale(1); }
}
@keyframes slam{ 0%{transform:scale(2.2);opacity:0} 60%{transform:scale(.93);opacity:1} 100%{transform:none} }
.shake{ animation: shake .32s ease-in-out; --amp: 1; }
.shake.big{ --amp: 2; animation-duration: .42s; }
.shake.huge{ --amp: 3.1; animation-duration: .54s; }
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(calc(-7px * var(--amp)), calc(3px * var(--amp)))}
  35%{transform:translate(calc(7px * var(--amp)), calc(-3px * var(--amp)))}
  55%{transform:translate(calc(-5px * var(--amp)), calc(-2px * var(--amp)))}
  75%{transform:translate(calc(5px * var(--amp)), calc(2px * var(--amp)))}
  90%{transform:translate(calc(-2px * var(--amp)), calc(1px * var(--amp)))}
}
/* flat flash when the Demand falls, not a glow */
.stage.clear::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  border-radius: 8px;   /* the stage no longer clips, so the wash clips itself */
  background: var(--green); animation: wash .55s steps(4) forwards;
}
@keyframes wash{ 0%{opacity:0} 30%{opacity:.55} 100%{opacity:0} }

/* pixel sparks: square, no glow */
.spark{
  position:absolute; left:50%; top:50%; width:7px; height:7px;
  background: var(--gold); pointer-events:none; z-index: 7;
}
.confetto{
  position: fixed; bottom: -18px; width: 9px; height: 14px;
  z-index: 56; pointer-events: none;
}

/* A square ring thrown out from the total. Flat, hard-edged, no blur — the
   same rule the rest of the sheet keeps. */
.shock{
  position:absolute; left:50%; top:50%; width:26px; height:26px;
  border: 5px solid var(--gold); transform: translate(-50%,-50%);
  pointer-events:none; z-index: 6;
}

/* Points that leave the card they came from and land on the counter. This is
   the one piece of motion that explains the arithmetic: a number does not
   simply appear in the tally, it arrives from the word that earned it. */
.flyer{
  position: fixed; width: 16px; height: 16px; z-index: 55;
  pointer-events: none; background: var(--chips);
  box-shadow: 0 0 0 2px var(--edge), 0 3px 0 var(--chips-d);
}
.flyer.m{ background: var(--mult); box-shadow: 0 2px 0 var(--mult-d); }
.flyer.r{ background: var(--gold); box-shadow: 0 2px 0 var(--gold-d); }
.landed{ animation: landed .18s cubic-bezier(.2,1.8,.4,1); }
@keyframes landed{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }

/* the round-clear stamp: slams in, holds, goes */
.stamp{
  position: fixed; inset: 0; z-index: 58; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.stamp[hidden]{ display: none !important; }
.stamp span{
  font-family: var(--f-display);
  font-size: clamp(30px, 9vw, 62px); letter-spacing: .04em; color: var(--card);
  background: var(--green); border-radius: 10px; padding: 14px 30px;
  box-shadow: 0 7px 0 var(--green-d);
  text-shadow: var(--drop); text-align: center;
  animation: stampIn .62s cubic-bezier(.15,1.7,.35,1) forwards;
}
.stamp.bad span{ background: var(--blind); box-shadow: 0 7px 0 var(--blind-d); }
@keyframes stampIn{
  0%{ transform: scale(3.2) rotate(-12deg); opacity: 0; }
  38%{ transform: scale(.92) rotate(-3deg); opacity: 1; }
  55%{ transform: scale(1.04) rotate(-3deg); }
  100%{ transform: scale(1) rotate(-3deg); opacity: 1; }
}

/* one flat frame of colour over everything — a hit, not a glow */
.flash{
  position: fixed; inset: 0; z-index: 57; pointer-events: none;
  background: var(--green); animation: flashOut .34s steps(3) forwards;
}
.flash.bad{ background: var(--blind); }
@keyframes flashOut{ 0%{opacity:.6} 100%{opacity:0} }

/* ---------- cards ---------- */
.card{
  touch-action: manipulation;
  /* One height for every card, measured against the worst case the lexicon can
     produce (SANDSTORM, four long overtones, 200px) rather than guessed. Left
     to size themselves cards came out ragged: a word takes one to three lines
     and its tags one row to five, so a hand was seven different rectangles. */
  position:relative; width: 104px; height: 202px;
  background: var(--card); color: var(--card-ink);
  border-radius: 7px; padding: 7px;
  cursor:pointer; user-select:none;
  box-shadow: 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
  transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg));
  transition: transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .12s ease;
}
/* the idle breath sits on an inner layer so it never fights hover or select,
   both of which drive transform on the card itself */
.card-inner{ display:flex; flex-direction:column; gap: 5px; height: 100%; }
.hand .card .card-inner{
  animation: breathe 3.4s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -0.21s);
}
@keyframes breathe{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-3px); }
}
@media (hover: hover) and (pointer: fine){
  .card:hover{
    transform: translateY(calc(var(--dy, 0px) - 14px)) rotate(0deg) scale(1.06);
    z-index: 5;
  }
  .card.sel:hover{ transform: translateY(calc(var(--dy, 0px) - 32px)) rotate(0deg) scale(1.08); }
  .card.static:hover{ transform: none; z-index: auto; }
  .btn:hover:not(:disabled){ filter: brightness(1.12); }
  .offer:hover:not(:disabled){ filter: brightness(1.12); }
  .chip-btn:hover{ background: var(--panel-2); color:#FFF; }
}
/* touch gets a press state instead — immediate, and it never sticks */
.card:active{ filter: brightness(.94); }
.card.sel{
  transform: translateY(calc(var(--dy, 0px) - 26px)) rotate(var(--rot, 0deg)) scale(1.04);
  box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--card-edge), 0 10px 18px rgba(0,0,0,.5);
  z-index: 4;
}
.card.static{ cursor:default; transform:none; z-index:auto; }
.card.deal{ animation: dealIn .32s cubic-bezier(.2,.95,.3,1) backwards; animation-delay: calc(var(--i,0) * 48ms); }
@keyframes dealIn{
  0%{ opacity:0; transform: translate(-70px, 44px) rotate(-15deg) scale(.84); }
  100%{ opacity:1; transform: translateY(var(--dy,0px)) rotate(var(--rot,0deg)); }
}
.card .art{
  position: relative;
  border-radius: 5px; height: 56px;
  /* One row, two siblings. The badge used to be absolutely positioned over this
     box while the icons were centred in it, so nothing in the layout prevented
     a third icon from running underneath the number — and on a 30px phone
     plate, it did, three separate times.

     .icons takes the slack, which pins the value to the right edge where a
     card's value belongs and centres the icons in what is left. Centring the
     whole row instead left the number floating mid-plate, reading as a fourth
     icon rather than as a value. */
  display:flex; align-items:center;
  gap: 4px; padding: 0 5px;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
}
.card .art .icons{
  display:flex; align-items:center; justify-content:center;
  flex: 1 1 auto; min-width: 0; gap: 5px;
}
.ms{
  font-family: "Material Symbols Rounded";
  font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap;
  word-wrap: normal; direction: ltr; display: inline-block;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  -webkit-font-smoothing: antialiased;
  font-size: 21px; color: #FFF; visibility: hidden;
  text-shadow: var(--drop-sm);
}
.ms-ok .ms{ visibility: visible; }
.card .art .ms.hit{
  color:#12181C; background: var(--gold); border-radius: 50%;
  padding: 2px; text-shadow: none;
}
/* dark ink on the bright plates, and invert the match ring so it still reads */
.card .art.light .ms{ color:#12181C; text-shadow: none; }
.card .art.light .ms.hit{ background:#1B1B3A; color: var(--gold); }
.legend{ display:flex; flex-wrap:wrap; gap: 6px; margin-bottom: 16px; }
.legend .leg{
  display:inline-flex; align-items:center; gap:5px;
  background: var(--inset); border-radius: 6px; padding: 4px 9px;
  font-size: 11px; font-weight:600; color: var(--text-dim);
}
.legend .ms{ font-size: 17px; color: var(--text-dim); text-shadow:none; }
.card .w{
  font-size: 15px; font-weight:700; line-height:1.05; letter-spacing:-.01em;
  text-transform: uppercase; word-break: break-word; hyphens:auto;
  /* No flex:1. Stretching the word to fill the card's slack made its box the
     slack rather than the text, so a three-letter word measured as three lines
     — and the assertion that catches mid-word breaks measures exactly that.
     .tags carries margin-top:auto instead, which does the same job honestly. */
  min-width: 0;
}
.card .base{
  flex: none; align-self: flex-start; margin-top: 3px;
  font-size: 11px; font-weight:700; color:#FFF;
  background: rgba(0,0,0,.55); border-radius: 4px; padding: 0 4px;
  font-variant-numeric: tabular-nums; line-height: 1.45;
}
.card .tags{ display:flex; flex-wrap:wrap; gap:3px; margin-top: auto; }
.card .tg{
  font-size: 10px; font-weight:600; letter-spacing:.02em;
  padding: 2px 5px; border-radius: 3px;
  background: #DCD4E0; color: #453F54;
}
.card .tg.match{ background: var(--gold); color:#12181C; font-weight:700; }
.card.interpreted{
  box-shadow: 0 0 0 3px var(--lens), 0 4px 0 var(--card-edge), 0 7px 13px rgba(0,0,0,.4);
}
.card.interpreted::after{
  content:"\2666"; position:absolute; top:5px; left:6px; font-size:10px; color: var(--lens-d);
}
.card.picked .card-inner{ animation: pickPop .26s cubic-bezier(.2,1.9,.35,1); }
@keyframes pickPop{
  0%{ transform: translateY(0) scale(1); }
  40%{ transform: translateY(-5px) scale(1.07); }
  100%{ transform: translateY(0) scale(1); }
}
.card.scoring{ animation: scorePop .4s cubic-bezier(.2,1.5,.35,1); z-index: 6; }
@keyframes scorePop{
  0%{ transform: translateY(0) scale(1); }
  35%{ transform: translateY(-26px) rotate(-4deg) scale(1.12); }
  65%{ transform: translateY(-6px) rotate(2deg) scale(1.03); }
  100%{ transform: translateY(0) rotate(0) scale(1); }
}

.float{
  position:absolute; left:50%; top:-8px; transform:translateX(-50%);
  font-size: 14px; font-weight:700; white-space:nowrap; pointer-events:none;
  padding: 3px 9px; border-radius: 5px; z-index: 8;
  text-shadow: var(--drop-sm);
  animation: floatUp .85s ease-out forwards;
}
.float.c{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 3px 0 var(--chips-d); }
.float.m{ background: var(--mult); color:#FFF; box-shadow: 0 3px 0 var(--mult-d); }
.float.r{ background: var(--gold); color:#12181C; box-shadow: 0 3px 0 var(--gold-d); }
@keyframes floatUp{
  0%{ opacity:0; transform: translate(-50%,6px) scale(.78); }
  16%{ opacity:1; transform: translate(-50%,-18px) scale(1.1); }
  72%{ opacity:1; transform: translate(-50%,-36px) scale(1); }
  100%{ opacity:0; transform: translate(-50%,-54px) scale(.92); }
}

/* the round's rule, stated dead centre where the eye already is */
.demand-call{ display:flex; flex-direction:column; align-items:center; gap: 12px; }
.dc-icons{ display:flex; gap: 16px; }
.dc-icons .ms{ font-size: 50px; color: var(--gold); text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
.dc-text{ font-size: 16px; color:#C9D7E0; text-align:center; max-width: 54ch; }
.dc-text b{ color: var(--gold); }

/* which card is first, second, third — the rule the game kept stating */
.pos{
  position:absolute; top:-9px; left:-7px; z-index:9;
  width:23px; height:23px; border-radius:50%;
  background: var(--gold); color:#12181C;
  font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 0 var(--gold-d);
}
/* a card that can score at all, readable before anything is read */
.card.live::before{
  content:""; position:absolute; left:7px; right:7px; top:3px; height:3px;
  background: var(--gold); border-radius: 2px;
}

.stakes{ color: var(--text-dim); }
.stakes b{ color: var(--gold); }
.fit{
  align-self:flex-start; font-size:11px; font-weight:700;
  background: var(--gold); color:#12181C; border-radius:4px; padding:2px 7px;
}
.offer.flawed{ background: var(--blind); box-shadow: 0 4px 0 var(--blind-d); }
.offer.flawed .od{ color: #FFE2DE; }
/* the arithmetic a player should not have to do in their head */
.reality{
  background: var(--inset); border-radius: 8px; padding: 11px 13px; margin: 0 0 14px;
  box-shadow: 0 3px 0 var(--edge);
}
.reality.short{ background: var(--blind); box-shadow: 0 4px 0 var(--blind-d); }
.reality .rk{
  font-family: var(--f-display); font-size: 11px; letter-spacing:.06em;
  color: var(--green);
}
.reality.short .rk{ color: #FFF; text-shadow: var(--drop-sm); }
.reality .rv{ font-size: 13px; line-height:1.55; color: var(--text-dim); margin-top: 4px; }
.reality .rv b{ color: #FFF; }
.reality.short .rv{ color: #FFE2DE; }

.ordeal-warn{
  background: var(--blind); border-radius: 8px; padding: 11px 13px; margin: 0 0 14px;
  box-shadow: 0 4px 0 var(--blind-d);
}
.ordeal-warn .on{
  font-family: var(--f-display); font-size: 12px; color:#FFF; text-shadow: var(--drop-sm);
}
.ordeal-warn .od{ font-size: 13px; line-height:1.5; color:#FFE2DE; margin-top: 4px; }

.panel p.shape{ color: var(--text-dim); font-size: 13.5px; }
.panel p.shape b{ color: var(--gold); }

.cost-warn{
  align-self:flex-start; font-family: var(--f-display); font-size:10px;
  background: var(--card); color: var(--blind-d); border-radius:4px; padding:2px 7px;
}

/* while a hand is resolving, the board takes the room */
#app.resolving .hand{ opacity: .26; transform: scale(.97); pointer-events: none; }
.hand{
  transition: opacity .2s ease, transform .22s ease,
              max-height .24s ease, padding .24s ease;
}
#app.resolving .stage{ min-height: 280px; }
.stage{ transition: min-height .24s cubic-bezier(.2,.9,.3,1); }

/* ---------- hand + controls ---------- */
.handwrap{ display:flex; flex-direction:column; gap: 22px; }
.hand{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height: 182px;
  align-items:flex-end; padding-top: 30px; padding-bottom: 34px; }
.controls{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; }
.btn{
  touch-action: manipulation;
  border:none; border-radius: 8px; cursor:pointer;
  padding: 13px 26px; font-size: 15px; font-weight:700; letter-spacing: .06em;
  text-transform: uppercase;
  background: var(--panel-2); color:#FFF;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop);
  transition: background .12s ease, transform .06s ease, box-shadow .12s ease;
}
.btn:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn.primary{ background: var(--chips); color:#06233D; text-shadow:none; box-shadow: 0 4px 0 var(--chips-d); }
.btn.primary:active:not(:disabled){ box-shadow: none; }
.btn.danger{ background: var(--mult); box-shadow: 0 4px 0 var(--mult-d); }
.btn.danger:active:not(:disabled){ box-shadow: none; }
.btn.interp{ background: var(--lens); color:#FFF; text-shadow: var(--drop); box-shadow: 0 4px 0 var(--lens-d); }
.btn.interp:active:not(:disabled){ box-shadow: none; }

/* ---------- overlays ---------- */
.veil{
  position: fixed; inset:0; z-index: 40;
  background: rgba(11,11,28,.92);
  display:flex; align-items:center; justify-content:center;
  padding: 18px; overflow-y:auto;
}
.veil[hidden]{ display:none !important; }
.panel{
  background: var(--panel); border-radius: 9px; padding: 22px;
  max-width: 640px; width:100%;
  box-shadow: 0 5px 0 var(--edge);
  max-height: calc(100vh - 36px); overflow-y:auto;
  animation: panelIn .26s cubic-bezier(.2,1.4,.4,1);
}
@keyframes panelIn{ 0%{transform:scale(.93) translateY(12px); opacity:0} 100%{transform:none; opacity:1} }
.panel h2{
  margin:0 0 4px; font-size: 26px; font-weight:700;
  text-shadow: var(--drop); text-wrap: balance;
}
.panel .sub{ font-size: 13px; color: var(--text-faint); margin-bottom: 15px; letter-spacing:.05em; }
.panel p{ color: var(--text-dim); margin: 0 0 12px; max-width: 60ch; font-size: 14px; line-height:1.65; }
.panel p b, .panel li b{ color:#FFF; font-weight:700; }
.panel p.gold{ color: var(--gold); }

.offers{ display:grid; grid-template-columns: repeat(auto-fit, minmax(172px,1fr)); gap:10px; margin: 14px 0; }
.offer{
  background: var(--lens); border:none; border-radius: 8px; padding: 12px;
  display:flex; flex-direction:column; gap:7px; text-align:left; cursor:pointer;
  box-shadow: 0 4px 0 var(--lens-d);
  transition: transform .07s ease, filter .12s ease;
}
.offer:active:not(:disabled){ transform: translateY(4px); box-shadow: none; }
.offer:disabled{ opacity:.4; cursor:not-allowed; }
.offer .on{ font-size: 13px; font-weight:700; color:#FFF; text-shadow: var(--drop-sm); }
.offer .od{ font-size: 12px; color:#2A1C46; line-height:1.45; flex:1; }
.offer .oc{ font-size: 14px; font-weight:700; color: var(--gold); text-shadow: var(--drop-sm); }

.owned{ display:flex; flex-direction:column; gap:8px; margin-bottom:6px; }
.own{
  display:flex; align-items:center; gap:12px;
  background: var(--lens); border-radius:8px; padding:10px 12px;
  box-shadow: 0 3px 0 var(--lens-d);
}
.own.flaw{ background: var(--blind); box-shadow: 0 3px 0 var(--blind-d); }
.own .ow{ flex:1; min-width:0; }
.own .on{ font-family: var(--f-display); font-size:12px; color:#FFF; text-shadow: var(--drop-sm); }
.own .od{ font-size:12px; line-height:1.4; color:#2A1C46; margin-top:3px; }
.own.flaw .od{ color:#FFE2DE; }
.own .grown{
  font-family: var(--f-display); font-size:10.5px; margin-top:5px;
  display:inline-block; background: var(--gold); color:#12181C;
  border-radius:4px; padding:2px 7px; box-shadow: 0 2px 0 var(--gold-d);
}
.sellbtn{
  flex:none; padding:10px 14px; font-size:12px; min-height:42px;
  background: var(--panel-2); box-shadow: 0 4px 0 var(--edge);
}
@media (max-width: 620px){
  .own{ flex-wrap:wrap; gap:8px; padding:9px 10px; }
  .own .od{ font-size:11.5px; }
  .sellbtn, .sellbtn{ width:100%; }
  .own .sellbtn{ flex:1 1 100%; }
}

.rowend{ display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:10px; }
.purse{ font-size: 17px; font-weight:700; color: var(--gold); text-shadow: var(--drop); }

.share{
  font-size: 13px; line-height:1.7; background: var(--inset); border-radius: 8px;
  padding: 12px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word;
  margin: 12px 0;
}
.stat-row{ display:grid; grid-template-columns: repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:14px 0; }
.stat{ background: var(--inset); border-radius:8px; padding:10px 12px; }
.stat .k{ font-size:11.5px; color:var(--text-faint); }
.stat .v{ font-size:22px; font-weight:700; text-shadow: var(--drop); font-variant-numeric:tabular-nums; line-height:1.2; }
.stat.gold .v{ color: var(--gold); }

.unlock{
  background: var(--lens); border-radius:8px; padding:12px 14px; margin:14px 0;
  box-shadow: 0 4px 0 var(--lens-d);
}
.unlock .k{ font-size:11.5px; color:#D8CCF5; letter-spacing:.06em; }
.unlock .v{ font-size:15px; font-weight:700; color:#FFF; margin-top:3px; text-shadow: var(--drop-sm); }
.unlock .d{ font-size:12.5px; color:#E3DAF8; margin-top:3px; }

#interpInput{
  width:100%; padding: 13px 14px; font-family: var(--f-display);
  font-size: 22px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  background: var(--card); color: var(--card-ink);
  border: none; border-radius: 8px;
}
#interpInput::placeholder{ color: var(--card-dim); font-weight:600; text-transform:none; font-size:18px; }
.appraisal{ display:flex; gap:14px; align-items:center; margin:14px 0; min-height: 150px; }
.appraisal .say{ font-size: 13px; color: var(--text-dim); line-height:1.55; }
.appraisal .say .src{ display:block; font-size:11px; color: var(--text-faint); margin-top:8px; letter-spacing:.04em; }
.helplist{ margin:0 0 14px; padding-left:18px; color: var(--text-dim); font-size:14px; line-height:1.65; }
.helplist li{ margin-bottom:7px; }

.teach{ display:flex; flex-direction:column; gap:13px; margin: 4px 0 16px; }
.teach-row{ display:flex; gap:12px; align-items:flex-start; }
.teach-n{
  flex:none; width:28px; height:28px; border-radius:6px;
  background: var(--chips); color:#06233D; font-weight:700; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 3px 0 var(--chips-d); text-shadow: var(--drop-sm);
}
.teach-row p{ margin:0; font-size:14px; line-height:1.6; }
.gold{ color: var(--gold); }
.worked{
  display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  background: var(--inset); border-radius:8px; padding: 14px; margin-bottom: 14px;
}
.worked-sum{ font-size:13.5px; line-height:1.7; color: var(--text-dim); min-width: 210px; flex:1; }
.worked-sum b{ color:#FFF; }
.worked-tot{ display:block; margin-top:6px; font-size:18px; font-weight:700; color: var(--gold); }

.setrow{
  display:flex; align-items:center; justify-content:space-between; gap: 14px;
  background: var(--inset); border-radius: 8px; padding: 12px 14px; margin-bottom: 9px;
}
.setrow .sl{ font-size: 14px; font-weight: 600; }
.setrow .sd{ font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.switch{
  flex: none; border: none; cursor: pointer; border-radius: 7px;
  min-width: 74px; min-height: 40px; padding: 0 14px;
  font-family: var(--f-display); font-size: 13px; letter-spacing: .04em;
  background: var(--panel-2); color: var(--text-dim);
  box-shadow: 0 3px 0 var(--edge); text-shadow: var(--drop-sm);
}
.switch[aria-pressed="true"]{ background: var(--green); color:#08241A; text-shadow:none; box-shadow: 0 3px 0 var(--green-d); }
.switch:active{ transform: translateY(3px); box-shadow: none; }

.kbd{
  display:inline-block; font-size:11.5px; font-weight:700; padding:2px 7px;
  border-radius:4px; background: var(--inset); color:#FFF;
  box-shadow: 0 2px 0 var(--edge);
}
.coach{
  align-self:center; background: var(--gold); color:#12181C;
  border-radius: 8px; padding: 10px 18px; max-width: 52ch;
  text-align:center; font-size: 14px; font-weight:700; line-height:1.4;
  box-shadow: 0 4px 0 var(--gold-d);
  animation: coachIn .24s ease-out;
}
.coach[hidden]{ display:none !important; }
@keyframes coachIn{ 0%{opacity:0; transform:translateY(-7px)} 100%{opacity:1; transform:none} }
.hint-pulse{ animation: hintPulse 1.4s steps(2) infinite; }
@keyframes hintPulse{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.35); }
}
.toast{
  position: fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background: var(--panel); color:#FFF; font-size:14px; font-weight:600;
  padding: 11px 20px; border-radius:8px; z-index:60;
  box-shadow: 0 4px 0 var(--edge);
  text-shadow: var(--drop-sm);
}
.toast[hidden]{ display:none !important; }

/* ---------- desktop: use the room, and stop the felt eating it ----------
   #app is min-height:100vh with .table and .stage both flex:1, so on a tall
   monitor the stage absorbed every spare pixel — a 500px empty slab that
   pushed the hand away from the board and made all the type look small.
   Let the content be its natural height and centre the whole thing. */
@media (min-width: 1240px){
  #app{ max-width: 1320px; gap: 14px; justify-content: center; }
  .table{ flex: 0 0 auto; grid-template-columns: 268px 1fr; gap: 14px; }
  .stage{ flex: 0 0 auto; min-height: 240px; }

  /* bigger cards: the thing players actually read */
  .card{ width: 122px; height: 196px; padding: 8px; }
  .card .art{ height: 68px; gap: 6px; }
  .card .art .icons{ gap: 6px; }
  .card .art .ms{ font-size: 25px; }
  .card .w{ font-size: 17px; }
  .card .tg{ font-size: 11px; }
  .card .base{ font-size: 12px; }
  .hand{ min-height: 0; gap: 10px; padding-top: 28px; padding-bottom: 30px; }
  .pos{ width: 26px; height: 26px; font-size: 14px; top: -10px; left: -8px; }

  /* the round's rule, at the size it deserves */
  .dc-icons .ms{ font-size: 54px; }
  .dc-icons{ gap: 22px; }
  .dc-text{ font-size: 18px; max-width: 56ch; }
  .demand-call{ gap: 13px; }
  .stage-hint{ font-size: 16px; }
  .stage-hint .hand-name{ font-size: 19px; padding: 6px 20px; }

  /* the sidebar has the width to be read at a glance */
  .blind-badge{ font-size: 19px; padding: 12px 9px; }
  .blind-wants .w{ font-size: 12px; padding: 3px 9px; }
  .blind-req .v{ font-size: 34px; }
  .blind-req .k, .roundscore .k, .meter .k{ font-size: 13px; }
  .roundscore .v{ font-size: 30px; }
  .tally .chips, .tally .multv{ font-size: 28px; padding: 10px 5px; }
  .meter .v{ font-size: 27px; }
  .money{ font-size: 28px; }

  .lens{ min-width: 134px; max-width: 186px; padding: 8px 10px; }
  .lens .n{ font-size: 13px; }
  .lens .d{ font-size: 12px; }
  .lensbar-head{ font-size: 13px; }

  .btn{ font-size: 16px; padding: 13px 28px; }
  .coach{ font-size: 15px; padding: 11px 22px; }
}

/* ---------- narrow: sidebar becomes a HUD strip ----------
   Above this the sidebar sits beside the board, which only works once the
   board is wide enough for all seven cards in one row (776px of hand plus
   the 232px sidebar and gaps). Below it, the HUD goes horizontal and the
   board gets the full width. */
@media (max-width: 1080px){
  .table{ grid-template-columns: 1fr; }
  .sidebar{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 9px; align-items:start; }
  .meters{ display: contents; }
  .blind{ grid-column: 1 / -1; order:1; }
  .tally{ grid-column: 1 / -1; order:2; }
  .roundscore{ order:3; }
  .meter.plays{ order:4; }
  .meter.disc{ order:5; }
  .money{ order:6; }
  .runinfo{ grid-column: 1 / -1; order:7; }
  .stage{ min-height: 196px; }
}

/* ---------- phone, portrait: one screen, thumb-sized targets ----------
   Written against 375x640 — smaller than any phone the game is likely to meet
   — and every band except the stage and the hand is given a fixed budget, so
   the two that carry the game are the two that get the slack.

     header 32 · round 58 · score 56 · meters 34 · lenses 44
     stage  flex, 118 floor · hand 2 rows · controls 56 pinned

   The controls are pinned rather than measured: phone heights vary far more
   than widths (a Pixel 5 is 117px shorter than an iPhone 14), and pinning is
   the only version that cannot put PLAY below the fold on a device I have
   not seen. */
@media (max-width: 620px){
  html{ -webkit-text-size-adjust: 100%; }
  body{ overscroll-behavior-y: contain; }
  #app{
    min-height: 100dvh; padding-inline: 9px; padding-block: 6px 0; gap: 6px;
  }
  .masthead{ gap: 8px; }
  .wordmark{ font-size: 19px; text-shadow: 2px 2px 0 var(--mult); }
  .chip-btn{ padding: 8px 11px; font-size: 12px; min-height: 34px; }
  .chip-btn .long{ display: none; }
  .chip-btn .short{ display: inline; font-size: 15px; line-height: 1; }
  .mast-actions{ gap: 6px; }

  .table{ gap: 6px; }
  .sidebar{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  /* run info first, as one quiet line of context */
  .runinfo{ grid-column: 1 / -1; order: 0; font-size: 10px; padding: 0 2px; }

  /* what the round wants, and what it costs */
  .blind{
    grid-column: 1 / -1; order: 1;
    padding: 7px 9px; text-align:left;
    display:grid; grid-template-columns: 1fr auto; gap: 4px 9px; align-items:center;
  }
  .blind-badge{ font-size: 13px; padding: 6px 8px; grid-column: 1; }
  .blind-wants{ justify-content:flex-start; margin-top: 0; grid-column: 1; gap: 4px; }
  .blind-wants .w{ font-size: 10px; padding: 2px 6px; }
  .blind-req{ margin-top: 0; text-align:right; grid-column: 2; grid-row: 1 / span 2; }
  .ordeal{ grid-column: 1 / -1; margin-top: 2px; padding: 5px 8px; }
  .ordeal .on{ font-size: 10px; }
  .ordeal .od{ font-size: 10.5px; line-height: 1.3; margin-top: 2px; }
  .blind-req .k{ font-size: 9.5px; line-height: 1.3; }
  .blind-req .v{ font-size: 21px; }
  .progress{ grid-column: 1 / -1; margin-top: 0; height: 6px; }

  .tally{ grid-column: 1 / -1; order: 2; padding: 5px 6px 6px; }
  .tally .chips, .tally .multv{ font-size: 20px; padding: 5px 3px; }
  .tk{ font-size: 8.5px; margin-bottom: 2px; }
  .tally .x{ padding-bottom: 7px; }

  /* score · plays · discards · purse, one thin strip */
  .roundscore{ order: 3; }
  .meter.plays{ order: 4; }
  .meter.disc{ order: 5; }
  .money{ order: 6; }
  .roundscore, .meter, .money{ padding: 4px 3px; text-align:center; }
  .roundscore .k, .meter .k{ font-size: 9px; letter-spacing: .03em; }
  .roundscore .v, .meter .v, .money{ font-size: 16px; line-height: 1.25; }
  .money{ padding-top: 13px; }

  .lensbar{ padding: 5px 8px 6px; }
  .lensbar-head{ font-size: 10px; margin-bottom: 3px; }
  .lensbar-head b{ font-size: 11px; }
  .rail{
    flex-wrap: nowrap; overflow-x: auto; min-height: 42px; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  /* An opened Lens stays on the one row the portrait budget allows for it.
     Letting the rail wrap instead grew it by 53px, which is enough to push the
     hand's second row back behind the pinned controls. It stops just short of
     full width so the next Lens peeks in and the rail still reads as one you
     can swipe. */
  .rail::-webkit-scrollbar{ display: none; }
  .lens{ flex: 0 0 auto; min-width: 122px; max-width: 150px; padding: 6px 8px; }
  .lens.open{ min-width: 86%; max-width: none; }
  .lens .n{ font-size: 11px; }
  .lens .d{
    font-size: 10px; line-height: 1.3;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .rail-empty{ white-space: normal; font-size: 11px; line-height: 1.35; }

  /* The stage used to redraw the picked words at full size while the hand
     was still showing the very same cards, selected, numbered and raised —
     240px of portrait spent saying something twice, which is what pushed the
     hand's second row under the pinned controls. The order badges are already
     on the cards in hand, so the preview here is the number alone. During
     resolution the hand folds away and the cards come back, big. */
  #app:not(.resolving) #stageCards .card{ display: none; }
  #app:not(.resolving) #stageCards{ gap: 0; }

  /* the board: the one band allowed to grow */
  .stage{ min-height: 118px; padding: 10px 9px; gap: 7px; }
  #app.resolving .stage{ min-height: 42vh; }
  #app.resolving .hand{
    max-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; opacity: 0;
  }
  .dc-icons .ms{ font-size: 32px; }
  .dc-icons{ gap: 12px; }
  .dc-text{ font-size: 12.5px; line-height: 1.45; }
  .demand-call{ gap: 7px; }
  .pos{ width:19px; height:19px; font-size:11px; top:-7px; left:-5px; }
  .stage-hint{ font-size: 12.5px; }
  .stage-hint .ord{ font-size: 11.5px; margin-top: 3px; }
  .stage-hint .hand-name{ font-size: 13px; padding: 4px 11px; margin-bottom: 6px; }
  .stage-total{ font-size: 42px; text-shadow: 3px 3px 0 var(--edge); }
  .coach{ font-size: 11.5px; padding: 7px 11px; line-height: 1.3; max-width: none; }

  /* the hand: all seven readable at once, in two rows, no scrolling */
  .handwrap{ gap: 7px; }
  .hand{
    gap: 5px; min-height: 0; padding: 4px 0 2px;
    align-items: flex-start;
  }
  /* One fixed height for every card in the hand. Left to size themselves, a
     card was as tall as its own word (one line or two) plus its own tags (one
     row or four), so seven cards meant seven different rectangles. The word
     takes the slack, which puts every tag row on the same baseline. */
  .card{ width: 80px; height: 104px; min-height: 0; padding: 5px 4px; border-radius: 6px; }
  .card-inner{ gap: 3px; height: 100%; }
  .card .art{ height: 36px; flex: none; border-radius: 4px; padding: 0 4px; gap: 4px; }
  .card .art .icons{ gap: 3px; }
  .card .art .ms{ font-size: 14px; }
  .card .w{ font-size: 11.5px; }
  .card .base{ font-size: 9px; padding: 0 3px; line-height: 1.4; }
  /* Two rows, always. Matching tags are sorted to the front in cardEl, so what
     a fourth long tag pushes out of sight is never one that scores — and the
     plate above still carries every overtone as an icon. */
  .card .tags{ flex: none; height: 23px; overflow: hidden; align-content: flex-start; gap: 2px; }
  .card .tg{ font-size: 7px; padding: 1px 3px; letter-spacing: 0; line-height: 1.45; }
  .card.sel{ transform: translateY(-9px) scale(1.03); }
  .hand .card .card-inner{ animation: none; }

  /* PLAY must never be below the fold, on any phone, ever */
  .controls{
    gap: 7px;
    position: sticky; bottom: 0; z-index: 30;
    margin-inline: -9px; padding: 8px 9px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    box-shadow: 0 -2px 0 var(--edge);
  }
  .btn{ flex: 1 1 0; min-height: 50px; padding: 12px 6px; font-size: 13px; letter-spacing: .02em; }

  .panel{ padding: 15px; max-height: calc(100dvh - 28px); }
  .veil{ padding: 14px; }
  .panel h2{ font-size: 20px; }
  .panel p, .helplist{ font-size: 13px; }
  .worked{ padding: 11px; gap: 11px; }
  .appraisal{ min-height: 0; flex-wrap: wrap; }
  #interpInput{ font-size: 18px; }
  .offers{ grid-template-columns: 1fr; gap: 8px; }
  .rowend{ gap: 8px; }
  .rowend .btn{ flex: 1 1 140px; }
}

/* ---------- short phones ----------
   667px tall and under (iPhone SE, and anything with a big browser chrome).
   Everything loses a few pixels rather than one band losing all of them. */
@media (max-width: 620px) and (max-height: 790px){
  #app{ gap: 4px; padding-block: 5px 0; }
  .table{ gap: 5px; }
  .sidebar{ gap: 5px; }
  .board{ gap: 5px; }
  .masthead{ gap: 6px; }
  .wordmark{ font-size: 15px; }
  .chip-btn{ min-height: 30px; padding: 5px 9px; font-size: 11px; }
  .chip-btn .short{ font-size: 13px; }
  .runinfo{ font-size: 9px; }

  .blind{ padding: 6px 8px; gap: 3px 8px; }
  .blind-badge{ font-size: 12px; padding: 5px 7px; }
  .blind-wants .w{ font-size: 9px; padding: 2px 5px; }
  .blind-req .k{ font-size: 9px; }
  .blind-req .v{ font-size: 18px; }
  .progress{ height: 5px; }

  .tally{ padding: 4px 5px 5px; }
  .tally .chips, .tally .multv{ font-size: 18px; padding: 4px 3px; }
  .tk{ font-size: 8px; margin-bottom: 1px; }
  .tally .x{ padding-bottom: 6px; font-size: 13px; }

  .roundscore, .meter, .money{ padding: 3px 3px; }
  .roundscore .k, .meter .k{ font-size: 8.5px; }
  .roundscore .v, .meter .v, .money{ font-size: 14px; }
  .money{ padding-top: 10px; }

  .lensbar{ padding: 4px 7px 5px; }
  .lensbar-head{ font-size: 9px; margin-bottom: 2px; }
  .rail{ min-height: 34px; }
  .lens{ min-width: 112px; padding: 5px 7px; }
  .lens.open{ min-width: 86%; }
  .lens .n{ font-size: 10px; }
  .lens .d{ font-size: 9px; -webkit-line-clamp: 2; }
  .rail-empty{ font-size: 10px; }

  /* The board's prose repeats the plaque above it, so here it is the short
     version of itself rather than a paragraph. */
  .stage{ min-height: 68px; padding: 6px 7px; gap: 4px; }
  .dc-icons .ms{ font-size: 25px; }
  .dc-icons{ gap: 9px; }
  .dc-text{ font-size: 11px; line-height: 1.35; }
  .demand-call{ gap: 4px; }
  .stage-hint{ font-size: 11px; line-height: 1.35; }
  .stage-hint .hand-name{ font-size: 11.5px; padding: 3px 9px; margin-bottom: 4px; }
  .stage-total{ font-size: 34px; }
  .coach{ font-size: 10.5px; padding: 5px 9px; line-height: 1.28; }

  /* the hand stays readable; everything around a word gives up its padding */
  .handwrap{ gap: 5px; }
  .hand{ padding: 2px 0 0; gap: 4px; }
  .card{ width: 74px; height: 94px; min-height: 0; padding: 4px 3px; }
  .card-inner{ gap: 3px; height: 100%; }
  .card .art{ height: 30px; flex: none; padding: 0 3px; gap: 3px; }
  .card .art .ms{ font-size: 11px; }
  .card .art .icons{ gap: 2px; }
  .card .w{ font-size: 10px; }
  .card .base{ font-size: 8px; padding: 0 2px; line-height: 1.35; }
  .card .tags{ flex: none; height: 20px; overflow: hidden; align-content: flex-start; gap: 2px; }
  .card .tg{ font-size: 6.5px; padding: 0 3px; letter-spacing: 0; line-height: 1.4; }
  .card.sel{ transform: translateY(-7px) scale(1.03); }

  .btn{ min-height: 44px; font-size: 11.5px; padding: 10px 5px; }
  .controls{ padding: 6px 9px calc(6px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- phone, landscape ----------
   Short and wide. The sidebar can go back beside the board, and everything
   vertical has to shrink or PLAY drops off a 380px-tall viewport. */
@media (max-width: 900px) and (max-height: 480px) and (orientation: landscape){
  #app{ padding-block: 5px 0; gap: 5px; }
  .masthead{ display: none; }
  .table{ grid-template-columns: 190px 1fr; gap: 7px; }
  .sidebar{ grid-template-columns: repeat(2, 1fr); }
  .blind, .tally, .runinfo{ grid-column: 1 / -1; }
  .stage{ min-height: 84px; }
  #app.resolving .stage{ min-height: 150px; }
  .lensbar{ padding: 5px 7px; }
  .rail{ min-height: 38px; }
  .card{ width: 72px; min-height: 106px; }
  .card .art{ height: 34px; }
  .btn{ min-height: 42px; padding: 9px 6px; }
  .controls{ padding-block: 6px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important;
     transition-duration: .01ms !important; }
}

<script>
"use strict";
/* ============================================================
   OVERTONE
   A word roguelite where meaning is the physics.

   The lexicon below is the game's physics engine: every word carries
   semantic tags, and every scoring rule reads those tags. The corpus and
   its ontology were authored with Claude at build time, which is why the
   game runs at 0ms with no network and still knows that an AVALANCHE is
   cold, moving, loud and dangerous all at once.
   ============================================================ */

/* ---------- tag ontology ---------- */
const TAGS = {
  ANI:["ANIMAL","life"], PLA:["PLANT","life"], NAT:["NATURE","life"],
  BOD:["BODY","body"],  FOO:["FOOD","body"],
  TOO:["TOOL","made"],  TEC:["TECH","made"], MON:["MONEY","made"],

  BRI:["BRIGHT","force"],
  MIN:["MIND","abstract"], TIM:["TIME","abstract"], ABS:["ABSTRACT","abstract"]

const TAG_BY_NAME = {}; for (const k of TAG_KEYS) TAG_BY_NAME[TAGS[k][0]] = k;

/* ---------- the lexicon: word + overtones ----------
   ~270 entries. Format: "WORD TAG,TAG,TAG"                      */

/* ---------- Lenses: rules that warp meaning ----------
   Each returns {chips, mult, xmult, grow, label} or null. `grow` is banked by
   play() and read back on later hands through ctx.lv(id) — never inside the
   hand that earned it, so the board's preview is always the truth.

   Three findings from tools/balance.js rebuilt this table:

   1. FLAT CHIPS DIE. Targets climb 65x across a run; a Lens paying +45 a word
      is decisive in round 2 and irrelevant by round 6. PROSPECTOR won 41% of
      runs against a 64% baseline — it was a trap. Those Lenses GROW now. They
      start weaker than they used to and end far stronger, which turns a
      round-2 purchase into a round-8 engine and gives a player a number to
      watch climb.

   2. UNCONDITIONAL xMULT BREAKS EVERYTHING. ENTROPY won 100% of runs and
      carried to round 7.7 on its own, because "each word shorter than the
      last" is not a condition, it is a sorting instruction. Multiplicative
      Lenses now want something the player must actually build toward, and the
      free ones (GLUTTON paid x2.5 for playing three words, which everyone
      does anyway) cost something in exchange.

   3. THE SLOT CAP WAS NOT A COST. With five slots and no downside, the right
      play was always "buy the biggest number". The flawed Lenses at the bottom
      have the biggest numbers in the game and every one of them takes
      something back: a play, a discard, a card in hand, your income, or the
      target itself.                                                        */

/* ---------- Ordeals ----------
   Three rounds of every run change a rule rather than a number. Each one
   invalidates a different habit: THE VICE breaks "always take three", THE FOG
   breaks a deck built on long words, THE MIRROR breaks a deck built on breadth,
   THE HALF-LIGHT breaks an engine that leans on the multiplier.

   Hooks mirror the Lens ones: `round` reshapes plays/discards, `hand` shrinks
   the deal, `maxPlay` caps a selection, `card`/`play` fold into scoring.   */
